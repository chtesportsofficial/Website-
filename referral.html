<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHTEO — Referral</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy-1:#1b2140;
    --navy-2:#2a3266;
    --navy-3:#333c7a;
    --white:#ffffff;
    --ink:#1b2140;
    --muted:#7a7f9a;
    --line:#e2e3ee;
    --accent:#3557ff;
    --accent-dark:#2846e0;
    --error:#e5484d;
    --success:#1c7c4d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 0%, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(160deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    color:var(--ink);
  }

  /* ---------- Gate views (login / checking / denied) ---------- */
  .gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-card{
    width:100%;
    max-width:380px;
    background:var(--white);
    border-radius:24px;
    padding:36px 30px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45);
    text-align:center;
  }
  .gate-card h1{
    font-size:18px;
    font-weight:800;
    margin:0 0 8px;
  }
  .gate-card p{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.6;
    margin:0 0 22px;
  }
  .field{ text-align:left; margin-bottom:14px; }
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 13px;
    font-size:14px;
    font-family:inherit;
    outline:none;
  }
  .field input:focus{ border-color:var(--accent); }
  .gate-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .gate-btn:hover{ background:var(--accent-dark); }
  .gate-btn:disabled{ background:#d3d6ea; color:#9a9dbb; cursor:not-allowed; }
  .gate-err{
    font-size:12.5px;
    color:var(--error);
    margin-top:12px;
    display:none;
  }
  .gate-err.show{ display:block; }
  .spinner{
    width:32px; height:32px;
    border:3px solid rgba(255,255,255,0.25);
    border-top-color:#fff;
    border-radius:50%;
    margin:0 auto 16px;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .gate-text{ color:rgba(255,255,255,0.75); font-size:14px; }

  /* ---------- Dashboard ---------- */
  .app{ display:none; }
  .app.active{ display:block; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    background:rgba(255,255,255,0.04);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; }
  .topbar .brand img{ width:30px; height:30px; border-radius:7px; }
  .topbar .brand span{ color:#fff; font-weight:800; font-size:15.5px; }
  .topbar .brand small{ color:rgba(255,255,255,0.5); font-size:11.5px; font-weight:600; margin-left:6px; }
  .back-btn{
    width:38px; height:38px; border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .back-btn:hover{ background:rgba(255,255,255,0.15); }
  .signout-btn{
    background:rgba(255,255,255,0.08);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .signout-btn:hover{ background:rgba(255,255,255,0.15); }

  .content{
    max-width:760px;
    margin:0 auto;
    padding:24px 16px 70px;
  }

  .panel{
    background:var(--white);
    border-radius:18px;
    padding:20px 16px 14px;
    box-shadow:0 12px 30px -20px rgba(0,0,0,.35);
  }

  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }

  .panel-head h2{
    font-size:20px;
    font-weight:800;
    margin:0;
    color:var(--ink);
  }

  table{ width:100%; border-collapse:separate; border-spacing:0 8px; font-size:13px; }
  th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.35px;
    color:var(--muted);
    padding:0 12px 4px;
    white-space:nowrap;
  }
  td{
    padding:12px;
    vertical-align:middle;
    background:#fff;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  td:first-child{
    border-left:1px solid var(--line);
    border-radius:12px 0 0 12px;
    width:64px;
  }
  td:last-child{
    border-right:1px solid var(--line);
    border-radius:0 12px 12px 0;
    text-align:right;
    width:90px;
  }
  tr{ cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
  tbody tr:hover{ transform:translateY(-1px); }
  tbody tr:active{ transform:scale(.99); }

  .rank-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px; height:28px;
    border-radius:50%;
    background:#eef1ff;
    font-size:12px;
    font-weight:800;
    color:var(--accent);
  }

  .code-cell{
    font-size:14px;
    font-weight:800;
    color:var(--ink);
  }
  .user-email{
    display:block;
    margin-top:3px;
    font-size:11px;
    font-weight:500;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:260px;
  }
  .used-cell{
    font-size:14px;
    font-weight:800;
    color:var(--ink);
  }
  .row-arrow{
    display:inline-flex;
    margin-left:7px;
    color:#9aa0b8;
    font-size:15px;
  }

  @media (max-width:640px){
    .topbar{ padding:14px 16px; }
    .topbar .brand{ gap:8px; }
    .topbar .brand img{ width:28px; height:28px; }
    .topbar .brand span{ font-size:15px; }
    .topbar .brand small{ font-size:10px; }
    .back-btn{ width:40px; height:40px; }
    .signout-btn{ padding:9px 13px; }

    .content{ padding:18px 12px 80px; }
    .panel{ border-radius:16px; padding:18px 10px 10px; }

    .panel-head h2{ font-size:19px; }
    .ref-subtitle{ font-size:12px; margin-bottom:12px; }

    table{ border-spacing:0 7px; }
    th{ padding:0 10px 3px; font-size:10px; }
    td{ padding:10px; }
    td:first-child{ width:54px; }
    td:last-child{ width:82px; }
    .rank-badge{ width:27px; height:27px; }
  }

  .empty-note{
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    padding:30px 10px;
  }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:11px 18px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:10;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <!-- CHECKING SESSION -->
  <div class="gate" id="gate-checking">
    <div>
      <div class="spinner"></div>
      <div class="gate-text">Checking access...</div>
    </div>
  </div>

  <!-- LOGIN FORM (shown if no session at all) -->
  <div class="gate" id="gate-login" style="display:none;">
    <div class="gate-card">
      <h1>Admin sign in</h1>
      <p>This panel is restricted. Sign in with the admin account to continue.</p>
      <div class="field">
        <label for="al-email">Email</label>
        <input type="email" id="al-email" placeholder="admin@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="al-password">Password</label>
        <input type="password" id="al-password" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="gate-btn" onclick="handleAdminLogin()">Sign in</button>
      <div class="gate-err" id="al-err">Incorrect email or password.</div>
    </div>
  </div>

  <!-- ACCESS DENIED (logged in, but not the admin email) -->
  <div class="gate" id="gate-denied" style="display:none;">
    <div class="gate-card">
      <h1>Access denied</h1>
      <p>The account you're signed in with (<strong id="denied-email"></strong>) doesn't have admin access to this panel.</p>
      <button class="gate-btn" onclick="signOutAndReload()">Sign out</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="app" id="app">
    <div class="topbar">
      <div class="brand">
        <button class="back-btn" onclick="window.location.href='admin-panel.html'" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <img src="https://cdn.jsdelivr.net/gh/chtesportsofficial/Chteo_img@main/CHTEO%20(1).png" alt="CHTEO logo">
        <span>CHTEO</span>
        <small>REFERRAL</small>
      </div>
      <button class="signout-btn" onclick="signOutAndReload()">Sign out</button>
    </div>

    <div class="content">
      <div class="panel">
        <div class="panel-head">
          <h2>Top referrers</h2>
        </div>
        <div class="table-wrap">
          <table id="leaderboard-table">
            <thead><tr><th>#</th><th>User</th><th>Times used</th></tr></thead>
            <tbody id="leaderboard-body"></tbody>
          </table>
        </div>
        <div class="empty-note" id="leaderboard-empty" style="display:none;">No referral data yet.</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://myfficbwcbgbxbdqjexv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';

// Who gets into this page is driven by the profiles.is_admin flag
// (see admin_policy.sql) — this check just decides whether to SHOW
// the dashboard UI; the RLS policy on the profiles table is what
// actually enforces data access server-side.

let supabaseClient;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e){
  document.getElementById('gate-checking').innerHTML =
    '<div class="gate-text">Supabase init error: ' + e.message + '</div>';
}

let allUsers = [];

function showGate(name){
  document.getElementById('gate-checking').style.display = name === 'checking' ? 'flex' : 'none';
  document.getElementById('gate-login').style.display = name === 'login' ? 'flex' : 'none';
  document.getElementById('gate-denied').style.display = name === 'denied' ? 'flex' : 'none';
  document.getElementById('app').classList.toggle('active', name === 'app');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

async function handleAdminLogin(){
  const email = document.getElementById('al-email').value.trim();
  const password = document.getElementById('al-password').value;
  const errEl = document.getElementById('al-err');
  errEl.classList.remove('show');

  if(!email || !password){
    errEl.textContent = 'Enter both email and password.';
    errEl.classList.add('show');
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(error){
    errEl.textContent = error.message;
    errEl.classList.add('show');
    return;
  }
  await checkAccess();
}

async function signOutAndReload(){
  await supabaseClient.auth.signOut();
  window.location.reload();
}

async function checkAccess(){
  showGate('checking');
  const { data: { session } } = await supabaseClient.auth.getSession();

  if(!session){
    showGate('login');
    return;
  }

  const { data: profile, error: profileErr } = await supabaseClient
    .from('profiles')
    .select('is_admin')
    .eq('id', session.user.id)
    .single();

  if(profileErr || !profile || !profile.is_admin){
    document.getElementById('denied-email').textContent = session.user.email;
    showGate('denied');
    return;
  }

  showGate('app');
  loadDashboard();
}

// ---------- Dashboard data ----------

async function loadDashboard(){
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    showToast('Could not load users: ' + error.message);
    return;
  }

  allUsers = data || [];
  renderLeaderboard();
}

function renderLeaderboard(){
  const counts = {};
  allUsers.forEach(u => {
    const ref = u.referral;
    if(!ref) return;
    counts[ref] = (counts[ref] || 0) + 1;
  });

  const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const body = document.getElementById('leaderboard-body');
  const empty = document.getElementById('leaderboard-empty');

  if(ranked.length === 0){
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  body.innerHTML = ranked.map(([code, count], i) => {
    const normalized = String(code).replace(/^#/, '').trim();
    const target = allUsers.find(u =>
      u.user_number !== null &&
      u.user_number !== undefined &&
      String(u.user_number).trim() === normalized
    );
    const uidText = '#' + normalized;
    const emailText = target && target.email ? target.email : 'Email not available';

    return `
      <tr onclick="openUserDetail('${encodeURIComponent(code)}')" title="Open user details">
        <td data-label="#"><span class="rank-badge">${i + 1}</span></td>
        <td data-label="User" class="code-cell">
          ${escapeHtml(uidText)}
          <span class="user-email">${escapeHtml(emailText)}</span>
        </td>
        <td data-label="Times used" class="used-cell">${count}<span class="row-arrow">›</span></td>
      </tr>
    `;
  }).join('');
}

function openUserDetail(code){
  // The leaderboard code is the user's referral/serial code (for example #2).
  // Find that exact profile from the already-loaded profiles, then open the
  // existing user-detail page with its UID — the parameter expected there.
  const normalized = decodeURIComponent(code).replace(/^#/, '').trim();

  const target = allUsers.find(u => {
    const number = u.user_number;
    return number !== null && number !== undefined &&
           String(number).trim() === normalized;
  });

  if(!target || !target.id){
    showToast('User profile not found.');
    return;
  }

  window.location.href = 'user-detail.html?uid=' + encodeURIComponent(target.id);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[m]));
}

checkAccess();
</script>

</body>
</html>
