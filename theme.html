<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<style>
  :root{
    --bg:#0b0f19;
    --card:#141a29;
    --card-2:#171f33;
    --border:#232c42;
    --text:#ffffff;
    --muted:#8a93a6;
    --purple:#8b5cf6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:20px 0 60px;
  }
  .phone{
    width:100%;
    max-width:460px;
    padding:0 16px;
  }

  .header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:10px 4px 24px;
  }
  .back-btn{
    width:48px;height:48px;
    border:1px solid var(--border);
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);
    background:transparent;
    cursor:pointer;
    font-size:20px;
    flex-shrink:0;
  }
  .header h1{
    font-size:22px;
    font-weight:800;
    letter-spacing:.5px;
    margin:0;
    text-transform:uppercase;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:8px 16px 4px;
  }
  .card-title{
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    padding:10px 2px 4px;
  }

  .theme-option{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 2px;
    cursor:pointer;
  }
  .theme-option + .theme-option{
    border-top:1px solid var(--border);
  }
  .option-icon{
    width:42px;height:42px;
    border-radius:12px;
    background:var(--card-2);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .option-text{
    flex:1;
    min-width:0;
  }
  .option-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:2px;
  }
  .option-sub{
    color:var(--muted);
    font-size:12.5px;
  }

  .radio{
    width:22px;height:22px;
    border-radius:50%;
    border:2px solid #3a4360;
    flex-shrink:0;
    position:relative;
    transition:.15s ease;
  }
  .theme-option.active .radio{
    border-color:var(--purple);
  }
  .theme-option.active .radio::after{
    content:"";
    position:absolute;
    top:50%;left:50%;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--purple);
    transform:translate(-50%,-50%);
  }
</style>
<style>
:root{
  --bg: var(--g-bg);
  --card: var(--g-surface);
  --card-2: var(--g-surface-2);
  --border: var(--g-border);
  --text: var(--g-text);
  --muted: var(--g-muted);
}
</style>

</head>
<body>
<div class="phone">

  <div class="header">
    <button class="back-btn" onclick="history.back()">&#8592;</button>
    <h1 data-i18n="theme.title">Theme</h1>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="theme.chooseTheme">Choose Theme</div>

    <div class="theme-option" data-theme="system" onclick="selectTheme('system')">
      <div class="option-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12a8 8 0 1 1 3 6.2" stroke="#c9cfdb" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M4 15v-3h3" stroke="#c9cfdb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="option-text">
        <div class="option-title" data-i18n="theme.system">System Default</div>
        <div class="option-sub" data-i18n="theme.systemSub">Follow system setting</div>
      </div>
      <div class="radio"></div>
    </div>

    <div class="theme-option" data-theme="light" onclick="selectTheme('light')">
      <div class="option-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4" stroke="#c9cfdb" stroke-width="1.6"/>
          <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="#c9cfdb" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="option-text">
        <div class="option-title" data-i18n="theme.light">Light Mode</div>
        <div class="option-sub" data-i18n="theme.lightSub">Light theme</div>
      </div>
      <div class="radio"></div>
    </div>

    <div class="theme-option active" data-theme="dark" onclick="selectTheme('dark')">
      <div class="option-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" stroke="#c9cfdb" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="option-text">
        <div class="option-title" data-i18n="theme.dark">Dark Mode</div>
        <div class="option-sub" data-i18n="theme.darkSub">Dark theme</div>
      </div>
      <div class="radio"></div>
    </div>

  </div>

</div>

<script>
function selectTheme(theme){
  document.querySelectorAll('.theme-option').forEach(el => {
    el.classList.toggle('active', el.dataset.theme === theme);
  });
  window.selectedTheme = theme;
  // Persist + apply immediately across the whole site (localStorage-backed)
  if(window.CHTEO && window.CHTEO.setThemePref){
    window.CHTEO.setThemePref(theme);
  }
}

// Reflect whatever theme preference is already active (persists across pages/refresh)
document.addEventListener('DOMContentLoaded', function(){
  if(window.CHTEO && window.CHTEO.getThemePref){
    selectTheme(window.CHTEO.getThemePref());
  }
});
</script>

</body>
</html>
