<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit your Profile</title>
<style>
:root{--bg:#0b0d10;--card:#15181d;--field:#181c21;--border:#2a3037;--text:#f4f5f7;--muted:#9ba2ad;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:20px 0 50px}.phone{width:100%;max-width:420px;padding:0 18px}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:26px}.back-btn{width:82px;height:82px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.back-btn svg{width:38px;height:38px}.topbar h1{margin:0;font-size:29px;font-weight:850}
.photo-card{height:385px;background:linear-gradient(145deg,#171b20,#111419);border:1px solid var(--border);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:32px}
.avatar-wrap{width:190px;height:190px;border-radius:50%;position:relative}.avatar-wrap:before{content:"";position:absolute;inset:-22px;border:1px solid #242a31;border-radius:50%}.avatar-wrap:after{content:"";position:absolute;inset:-8px;border:1px solid #343a42;border-radius:50%}
.avatar{width:190px;height:190px;border-radius:50%;overflow:hidden;background:#20252b;border:1px solid #3a414a;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}.avatar svg{width:112px;height:112px;color:#b9bcc1}#avatarImg{display:none;width:100%;height:100%;object-fit:cover}
.camera-btn{position:absolute;z-index:3;right:-8px;bottom:-8px;width:66px;height:66px;border-radius:50%;border:2px solid #252b32;background:#11151a;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.camera-btn svg{width:31px;height:31px}
.field-group{margin-bottom:26px}.label-row{display:flex;align-items:center;gap:10px;margin:0 0 11px 4px}.label-bar{width:7px;height:27px;border-radius:5px;background:var(--green);flex-shrink:0}.label{color:#aeb5c0;font-size:17px;font-weight:700;letter-spacing:.03em}.limit{color:#858c96;font-size:13px}
.input-wrap{min-height:73px;border:1px solid var(--border);border-radius:17px;background:var(--field);display:flex;align-items:center;gap:18px;padding:0 18px}.input-wrap:focus-within{border-color:rgba(34,197,94,.65)}.input-icon{width:34px;height:34px;color:#b8bdc5;flex-shrink:0;display:flex;align-items:center;justify-content:center}.input-icon svg{width:32px;height:32px}
input,select{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px}input::placeholder{color:#8f949c}select{appearance:none;color:#8f949c}select.has-value{color:var(--text)}.chevron{color:#b8bdc5;flex-shrink:0}
.slogan-wrap{position:relative}.slogan-input{padding-right:70px}.counter{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#8f949c;font-size:14px;pointer-events:none}.slogan-error{display:none;margin:8px 4px 0;color:var(--red);font-size:13px;font-weight:700}.slogan-wrap.over-limit .input-wrap{border-color:var(--red)}.slogan-wrap.over-limit .counter,.slogan-wrap.over-limit .slogan-error{color:var(--red)}.slogan-wrap.over-limit .slogan-error{display:block}
.save-btn{width:100%;min-height:74px;border:1px solid #159447;border-radius:17px;background:linear-gradient(180deg,#2bc75f,#1eae50);color:#fff;font-size:18px;font-weight:850;letter-spacing:.04em;cursor:pointer}.save-btn:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:380px){.back-btn{width:60px;height:60px}.topbar h1{font-size:25px}.photo-card{height:330px}.avatar,.avatar-wrap{width:160px;height:160px}}
</style>
</head>
<body>
<div class="phone">
<div class="topbar"><button class="back-btn" type="button" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h1>Edit your Profile</h1></div>
<form id="profileForm" novalidate>

<div class="photo-card"><div class="avatar-wrap"><div class="avatar">
<svg id="avatarPlaceholder" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
<img id="avatarImg" alt="Profile picture">
</div>
<button class="camera-btn" type="button" id="cameraBtn" aria-label="Change profile picture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
<input id="avatarInput" type="file" accept="image/*" hidden>
</div></div>

<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label">WHATSAPP NUMBER :</span></div><div class="input-wrap"><span class="input-icon">☏</span><input id="whatsapp" type="tel" placeholder="Enter your WhatsApp number"></div></div>
<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label">EMAIL :</span></div><div class="input-wrap"><span class="input-icon">✉</span><input id="email" type="email" placeholder="Enter your email"></div></div>
<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label">TEAM NAME :</span></div><div class="input-wrap"><span class="input-icon">♧</span><input id="teamName" type="text" placeholder="Enter your team name"></div></div>

<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label">TEAM SLOGAN :</span><span class="limit">max 50 characters</span></div>
<div class="slogan-wrap" id="sloganWrap"><div class="input-wrap slogan-input"><span class="input-icon">⚑</span><input id="slogan" type="text" placeholder="Enter your team slogan"><span class="counter" id="counter">0/50</span></div><div class="slogan-error">Slogan is over 50 characters.</div></div></div>

<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label">COUNTY :</span></div><div class="input-wrap"><span class="input-icon">◎</span><select id="country"><option value="">Select your country</option><option>Bangladesh</option><option>India</option><option>Pakistan</option><option>Nepal</option><option>Sri Lanka</option><option>United Arab Emirates</option><option>Saudi Arabia</option><option>United Kingdom</option><option>United States</option><option>Other</option></select><span class="chevron">⌄</span></div></div>

<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label">LOCATION :</span></div><div class="input-wrap"><span class="input-icon">⌖</span><input id="location" type="text" placeholder="Enter your location"></div></div>

<button class="save-btn" id="saveBtn" type="submit">SAVE CHANGES</button>
</form>
</div>

<script>
const cameraBtn=document.getElementById('cameraBtn'),avatarInput=document.getElementById('avatarInput'),avatarImg=document.getElementById('avatarImg'),avatarPlaceholder=document.getElementById('avatarPlaceholder');
cameraBtn.onclick=()=>avatarInput.click();
avatarInput.onchange=()=>{const f=avatarInput.files&&avatarInput.files[0];if(!f)return;if(!f.type.startsWith('image/')){avatarInput.value='';return}const r=new FileReader();r.onload=e=>{avatarImg.src=e.target.result;avatarImg.style.display='block';avatarPlaceholder.style.display='none';localStorage.setItem('profile_picture',e.target.result)};r.readAsDataURL(f)};
const saved=localStorage.getItem('profile_picture');if(saved){avatarImg.src=saved;avatarImg.style.display='block';avatarPlaceholder.style.display='none'}

const slogan=document.getElementById('slogan'),counter=document.getElementById('counter'),wrap=document.getElementById('sloganWrap'),save=document.getElementById('saveBtn');
function sloganStatus(){const n=slogan.value.length;counter.textContent=n+'/50';const over=n>50;wrap.classList.toggle('over-limit',over);save.disabled=over}
slogan.addEventListener('input',sloganStatus);sloganStatus();

document.getElementById('country').addEventListener('change',function(){this.classList.toggle('has-value',!!this.value)});
document.getElementById('profileForm').addEventListener('submit',e=>{e.preventDefault();if(slogan.value.length>50){slogan.focus();return}alert('Profile changes saved successfully.')});
</script>
</body>
</html>
