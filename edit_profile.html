<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit your Profile</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<style>
:root{--bg:#0b0d10;--card:#15181d;--field:#181c21;--border:#2a3037;--text:#f4f5f7;--muted:#9ba2ad;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:20px 0 50px}.phone{width:100%;max-width:420px;padding:0 18px}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:26px}.back-btn{width:82px;height:82px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.back-btn svg{width:38px;height:38px}.topbar h1{margin:0;font-size:29px;font-weight:850}
.photo-card{height:385px;background:var(--field);border:1px solid var(--border);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:32px}
.avatar-wrap{width:190px;height:190px;border-radius:50%;position:relative}.avatar-wrap:before{content:"";position:absolute;inset:-22px;border:1px solid var(--border);border-radius:50%}.avatar-wrap:after{content:"";position:absolute;inset:-8px;border:1px solid var(--border);border-radius:50%}
.avatar{width:190px;height:190px;border-radius:50%;overflow:hidden;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}.avatar svg{width:112px;height:112px;color:var(--muted)}#avatarImg{display:none;width:100%;height:100%;object-fit:cover}
.camera-btn{position:absolute;z-index:3;right:-8px;bottom:-8px;width:66px;height:66px;border-radius:50%;border:2px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}.camera-btn svg{width:31px;height:31px}
.field-group{margin-bottom:26px}.label-row{display:flex;align-items:center;gap:10px;margin:0 0 11px 4px}.label-bar{width:7px;height:27px;border-radius:5px;background:var(--green);flex-shrink:0}.label{color:#aeb5c0;font-size:17px;font-weight:700;letter-spacing:.03em}.limit{color:#858c96;font-size:13px}
.input-wrap{min-height:73px;border:1px solid var(--border);border-radius:17px;background:var(--field);display:flex;align-items:center;gap:18px;padding:0 18px}.input-wrap:focus-within{border-color:rgba(34,197,94,.65)}.input-icon{width:34px;height:34px;color:#b8bdc5;flex-shrink:0;display:flex;align-items:center;justify-content:center}.input-icon svg{width:32px;height:32px}
input,select{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px}input::placeholder{color:#8f949c}select{appearance:none;color:#8f949c}select.has-value{color:var(--text)}.chevron{color:#b8bdc5;flex-shrink:0}
.slogan-wrap{position:relative}.slogan-input{padding-right:70px}.counter{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#8f949c;font-size:14px;pointer-events:none}.slogan-error{display:none;margin:8px 4px 0;color:var(--red);font-size:13px;font-weight:700}.slogan-wrap.over-limit .input-wrap{border-color:var(--red)}.slogan-wrap.over-limit .counter,.slogan-wrap.over-limit .slogan-error{color:var(--red)}.slogan-wrap.over-limit .slogan-error{display:block}
.save-btn{width:100%;min-height:74px;border:1px solid #159447;border-radius:17px;background:linear-gradient(180deg,#2bc75f,#1eae50);color:#fff;font-size:18px;font-weight:850;letter-spacing:.04em;cursor:pointer}.save-btn:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:380px){.back-btn{width:60px;height:60px}.topbar h1{font-size:25px}.photo-card{height:330px}.avatar,.avatar-wrap{width:160px;height:160px}}

/* Photo picker bottom sheet */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99999;align-items:flex-end;justify-content:center}
.sheet-overlay.open{display:flex}
.sheet{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-bottom:none;border-radius:22px 22px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom, 0px) + 90px);animation:sheetUp .18s ease-out;max-height:82vh;overflow-y:auto}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:44px;height:4px;border-radius:3px;background:var(--border);margin:6px auto 16px}
.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-header h2{margin:0;font-size:19px;font-weight:800}
.sheet-icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet-icon-btn.danger{color:var(--red)}
.sheet-icon-btn.danger:disabled{opacity:.35;cursor:not-allowed}
.sheet-icon-btn svg{width:23px;height:23px}
.sheet-option{display:flex;align-items:center;gap:18px;padding:15px 4px;cursor:pointer;border-radius:12px}
.sheet-option:active{background:var(--field)}
.sheet-option .opt-icon{width:34px;height:34px;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sheet-option .opt-icon svg{width:27px;height:27px}
.sheet-option span{font-size:16.5px;font-weight:600}
.sheet-note{font-size:12.5px;color:var(--muted);padding:0 4px 4px;line-height:1.5}
</style>
<style>
:root{
  --bg: var(--g-bg);
  --card: var(--g-surface);
  --field: var(--g-surface);
  --border: var(--g-border);
  --text: var(--g-text);
  --muted: var(--g-muted);
}
</style>

</head>
<body>
<div class="phone">
<div class="topbar"><button class="back-btn" type="button" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button><h1 data-i18n="editprofile.title">Edit your Profile</h1></div>
<form id="profileForm" novalidate>

<div class="photo-card"><div class="avatar-wrap"><div class="avatar">
<svg id="avatarPlaceholder" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
<img id="avatarImg" alt="Profile picture">
</div>
<button class="camera-btn" type="button" id="cameraBtn" aria-label="Change profile picture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
<input id="galleryInput" type="file" accept="image/*" hidden>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
</div></div>

<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label" data-i18n="editprofile.whatsapp">WHATSAPP NUMBER :</span></div><div class="input-wrap"><span class="input-icon">☏</span><input id="whatsapp" type="tel" placeholder="Enter your WhatsApp number" data-i18n-placeholder="editprofile.whatsappPh"></div></div>
<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label" data-i18n="editprofile.email">EMAIL :</span></div><div class="input-wrap"><span class="input-icon">✉</span><input id="email" type="email" placeholder="Enter your email" data-i18n-placeholder="editprofile.emailPh"></div></div>
<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label" data-i18n="editprofile.teamName">TEAM NAME :</span></div><div class="input-wrap"><span class="input-icon">♧</span><input id="teamName" type="text" placeholder="Enter your team name" data-i18n-placeholder="editprofile.teamNamePh"></div></div>

<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label" data-i18n="editprofile.slogan">TEAM SLOGAN :</span><span class="limit" data-i18n="editprofile.sloganMax">max 50 characters</span></div>
<div class="slogan-wrap" id="sloganWrap"><div class="input-wrap slogan-input"><span class="input-icon">⚑</span><input id="slogan" type="text" placeholder="Enter your team slogan" data-i18n-placeholder="editprofile.sloganPh"><span class="counter" id="counter">0/50</span></div><div class="slogan-error" data-i18n="editprofile.sloganError">Slogan is over 50 characters.</div></div></div>

<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label" data-i18n="editprofile.country">COUNTY :</span></div><div class="input-wrap"><span class="input-icon">◎</span><select id="country"><option value="" data-i18n="editprofile.countrySelect">Select your country</option><option>Bangladesh</option><option>India</option><option>Pakistan</option><option>Nepal</option><option>Sri Lanka</option><option>United Arab Emirates</option><option>Saudi Arabia</option><option>United Kingdom</option><option>United States</option><option>Other</option></select><span class="chevron">⌄</span></div></div>

<div class="field-group"><div class="label-row"><span class="label-bar"></span><span class="label" data-i18n="editprofile.location">LOCATION :</span></div><div class="input-wrap"><span class="input-icon">⌖</span><input id="location" type="text" placeholder="Enter your location" data-i18n-placeholder="editprofile.locationPh"></div></div>

<button class="save-btn" id="saveBtn" type="submit" data-i18n="editprofile.save">SAVE CHANGES</button>
</form>
</div>

<div class="sheet-overlay" id="pickerOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button class="sheet-icon-btn" type="button" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      <h2 data-i18n="editprofile.pictureTitle">Profile picture</h2>
      <button class="sheet-icon-btn danger" type="button" id="sheetDelete" aria-label="Remove photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
    </div>

    <div class="sheet-option" id="optCamera">
      <span class="opt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <span data-i18n="editprofile.camera">Camera</span>
    </div>
    <div class="sheet-option" id="optGallery">
      <span class="opt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></span>
      <span data-i18n="editprofile.gallery">Gallery</span>
    </div>
    <div class="sheet-note" id="cameraNote" data-i18n="editprofile.cameraNote" style="display:none">Camera access needs your permission — your browser will ask before it opens.</div>
  </div>
</div>

<script>
const cameraBtn=document.getElementById('cameraBtn');
const galleryInput=document.getElementById('galleryInput');
const cameraInput=document.getElementById('cameraInput');
const avatarImg=document.getElementById('avatarImg');
const avatarPlaceholder=document.getElementById('avatarPlaceholder');

const pickerOverlay=document.getElementById('pickerOverlay');
const sheetClose=document.getElementById('sheetClose');
const sheetDelete=document.getElementById('sheetDelete');
const optCamera=document.getElementById('optCamera');
const optGallery=document.getElementById('optGallery');
const cameraNote=document.getElementById('cameraNote');

const fields={
  whatsapp:document.getElementById('whatsapp'),
  email:document.getElementById('email'),
  teamName:document.getElementById('teamName'),
  slogan:document.getElementById('slogan'),
  country:document.getElementById('country'),
  location:document.getElementById('location')
};

const counter=document.getElementById('counter');
const sloganWrap=document.getElementById('sloganWrap');
const saveBtn=document.getElementById('saveBtn');

function getProfile(){
  try { return JSON.parse(localStorage.getItem('user_profile') || '{}'); }
  catch(e){ return {}; }
}
function setProfile(data){
  localStorage.setItem('user_profile', JSON.stringify(data));
}

/* Load previously saved profile data */
const savedProfile=getProfile();
Object.keys(fields).forEach(key=>{
  if(savedProfile[key] != null) fields[key].value=savedProfile[key];
});
if(fields.country.value) fields.country.classList.add('has-value');

function updateSloganStatus(){
  const n=fields.slogan.value.length;
  counter.textContent=n+'/50';
  const over=n>50;
  sloganWrap.classList.toggle('over-limit',over);
  saveBtn.disabled=over;
}
fields.slogan.addEventListener('input',updateSloganStatus);
updateSloganStatus();

/* Profile picture: changes only touch the on-page preview + a pending
   flag. Nothing is written to localStorage until SAVE CHANGES is tapped. */
let pendingPicture=null;   // data URL of a newly-picked-but-not-yet-saved photo
let pendingRemoved=false;  // true if the user chose to remove the photo

function showPicture(src){
  avatarImg.src=src;
  avatarImg.style.display='block';
  avatarPlaceholder.style.display='none';
}
function showPlaceholder(){
  avatarImg.removeAttribute('src');
  avatarImg.style.display='none';
  avatarPlaceholder.style.display='';
}

const savedPicture=localStorage.getItem('profile_picture');
if(savedPicture) showPicture(savedPicture);

function updateDeleteAvailability(){
  const hasPicture = !!avatarImg.getAttribute('src');
  sheetDelete.disabled = !hasPicture;
}

/* Open / close the picker sheet */
cameraBtn.addEventListener('click',()=>{
  updateDeleteAvailability();
  pickerOverlay.classList.add('open');
});
function closeSheet(){ pickerOverlay.classList.remove('open'); }
sheetClose.addEventListener('click',closeSheet);
pickerOverlay.addEventListener('click',e=>{ if(e.target===pickerOverlay) closeSheet(); });

/* Gallery pick */
optGallery.addEventListener('click',()=>{ galleryInput.click(); });
galleryInput.addEventListener('change',()=>{
  const file=galleryInput.files && galleryInput.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ galleryInput.value=''; return; }
  const reader=new FileReader();
  reader.onload=e=>{
    pendingPicture=e.target.result;
    pendingRemoved=false;
    showPicture(pendingPicture);
    closeSheet();
  };
  reader.readAsDataURL(file);
});

/* Camera capture — the browser/OS shows its own permission prompt
   the first time cameraInput is opened; nothing extra to code here. */
optCamera.addEventListener('click',()=>{ cameraInput.click(); });
cameraInput.addEventListener('change',()=>{
  const file=cameraInput.files && cameraInput.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ cameraInput.value=''; return; }
  const reader=new FileReader();
  reader.onload=e=>{
    pendingPicture=e.target.result;
    pendingRemoved=false;
    showPicture(pendingPicture);
    closeSheet();
  };
  reader.readAsDataURL(file);
});

/* Remove photo (trash icon in the sheet header) */
sheetDelete.addEventListener('click',()=>{
  if(sheetDelete.disabled) return;
  pendingPicture=null;
  pendingRemoved=true;
  showPlaceholder();
  closeSheet();
});

fields.country.addEventListener('change',function(){
  this.classList.toggle('has-value',!!this.value);
});

/* Save EVERYTHING, then return to profile */
document.getElementById('profileForm').addEventListener('submit',e=>{
  e.preventDefault();

  if(fields.slogan.value.length>50){
    fields.slogan.focus();
    updateSloganStatus();
    return;
  }

  const data={};
  Object.keys(fields).forEach(key=>data[key]=fields[key].value.trim());
  setProfile(data);

  if(pendingPicture){
    localStorage.setItem('profile_picture',pendingPicture);
  } else if(pendingRemoved){
    localStorage.removeItem('profile_picture');
  }

  window.location.href='profile.html';
});
</script>
</body>
</html>
