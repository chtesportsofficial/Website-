<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — CHT ESP ORG</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<style>
:root{
  --bg:#0a0d13;--bg-alt:#0d1119;--surface:#131826;--surface-2:#171d2d;
  --line:#232b3d;--fire:#ff5a2e;--fire-2:#ff8a3d;--green:#22e08a;
  --cyan:#21e6c1;--text:#eef1f7;--text-dim:#8b93a9;--text-dimmer:#5b6379;
  --danger:#ff3d5a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Bengali",sans-serif}
button{font-family:inherit;cursor:pointer}
.app{
 width:100%;min-height:100vh;margin:auto;background:
 radial-gradient(120% 60% at 15% 0%,rgba(255,90,46,.10),transparent 55%),
 radial-gradient(90% 50% at 100% 10%,rgba(33,230,193,.07),transparent 55%),var(--bg);
 padding-bottom:100px;overflow:hidden;position:relative
}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text)}
.topbar .title{font-weight:800;font-size:15px}

.section{padding:20px 16px 4px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.section-title{font-weight:800;font-size:14px;letter-spacing:.03em;display:flex;align-items:center;gap:9px}
.section-title .bar{width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--fire),var(--green))}

.filter-tabs{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto}
.filter-tab{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);font-size:11px;font-weight:700;white-space:nowrap}
.filter-tab.active{background:linear-gradient(135deg,var(--fire),var(--fire-2));color:#241705;border-color:transparent}

.lb-card{margin:0 16px;background:linear-gradient(135deg,rgba(33,230,193,.08),rgba(19,24,38,.4));border:1px solid rgba(33,230,193,.25);border-radius:16px;padding:14px}
.lb-list{padding-right:2px}
.lb-row{display:flex;align-items:center;gap:11px;padding:10px 2px}
.lb-row+.lb-row{border-top:1px solid var(--line)}
.lb-rank{width:24px;text-align:center;font-weight:900;font-size:13px;color:var(--text-dim)}
.lb-rank.gold{color:#ffd35a}.lb-rank.silver{color:#cfd6e6}.lb-rank.bronze{color:#e0a06a}
.lb-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#26344a,#111722);border:1px solid var(--line);flex-shrink:0}
.lb-name{flex:1;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.lb-name .s{font-size:9px;font-weight:600;color:var(--text-dim)}
.lb-amt{font-size:12px;font-weight:900;color:var(--green);white-space:nowrap}
.lb-sub{font-size:9px;color:var(--text-dim);font-weight:600;white-space:nowrap}
.empty{padding:26px 4px;text-align:center;color:var(--text-dim);font-size:12px}

.bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:var(--surface);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40}
.navitem{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);font-size:9px;flex:1}
.navitem svg{width:22px;height:22px}
.navitem.active{color:var(--fire-2)}
.support-fab{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--fire),var(--fire-2));display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:-18px;border:3px solid var(--bg)}
.lbl{line-height:1}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
  <div class="icon-btn" onclick="window.location.href='index.html'">←</div>
  <div class="title">Leaderboard</div>
</div>

<div class="filter-tabs" id="filterTabs">
  <div class="filter-tab" data-range="today">Today</div>
  <div class="filter-tab" data-range="week">This Week</div>
  <div class="filter-tab active" data-range="month">This Month</div>
  <div class="filter-tab" data-range="all">All Time</div>
</div>

<div class="section" style="padding-top:0">
  <div class="lb-card">
    <div class="lb-list" id="lbList"><div class="empty">Loading...</div></div>
  </div>
</div>

<div class="bottomnav">
  <div class="navitem" onclick="window.location.href='index.html'" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3 10.5V21h6.2v-6.4h5.6V21H21V10.5L12 3.2Z"/></svg><div class="lbl">Home</div></div>
  <div class="navitem" onclick="window.location.href='refer-earn.html'" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9.5" cy="8" r="3.4"/><path d="M3 20c0-3.9 2.9-6.6 6.5-6.6S16 16.1 16 20"/><path d="M18.5 8v5M16 10.5h5"/></svg><div class="lbl">Refer & Earn</div></div>
  <div class="navitem support-item" onclick="window.location.href='support.html'" style="cursor:pointer"><div class="support-fab">🎧</div><div class="lbl">Support</div></div>
  <div class="navitem" onclick="window.location.href='wallet.html'" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v2"/><path d="M4 8v9a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-7a2 2 0 0 0-2-2H6a2 2 0 0 1-2-2Z"/></svg><div class="lbl">Wallet</div></div>
  <div class="navitem" onclick="goToProfile()" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="9.6" r="3"/><path d="M6 18.2c1.1-2.5 3.2-3.8 6-3.8s4.9 1.3 6 3.8"/></svg><div class="lbl">Profile</div></div>
</div>
</div>

<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const SUPABASE_KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function medalClass(i){return i===0?'gold':i===1?'silver':i===2?'bronze':'';}
function rangeStart(range){
  const now=new Date();
  if(range==='today')return new Date(now.getFullYear(),now.getMonth(),now.getDate()).toISOString().slice(0,10);
  if(range==='week'){const d=new Date(now);d.setDate(d.getDate()-d.getDay());return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10);}
  if(range==='month')return new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);
  return null; // all time
}

function start(){
  if(!window.supabase?.createClient){setTimeout(start,250);return}
  const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const listEl=document.getElementById('lbList');
  const tabs=[...document.querySelectorAll('.filter-tab')];

  async function load(range){
    listEl.innerHTML='<div class="empty">Loading...</div>';
    let q=sb.from('leaderboard_rows').select('team_name,owner_team_name,prize_won,points');
    const from=rangeStart(range);
    if(from)q=q.gte('lobby_date',from);
    const {data,error}=await q;
    if(error){listEl.innerHTML='<div class="empty">Could not load leaderboard.</div>';console.error(error);return}
    const totals=new Map();
    (data||[]).forEach(r=>{
      // Group by the buyer's saved PROFILE team name (owner_team_name), not
      // the free-typed squad name on that particular slot entry (team_name).
      // Falls back to team_name only for old rows that predate owner_team_name.
      const key=r.owner_team_name||r.team_name;
      const cur=totals.get(key)||{team_name:key,points:0,prize:0};
      cur.points+=r.points||0; cur.prize+=Number(r.prize_won)||0;
      totals.set(key,cur);
    });
    const ranked=[...totals.values()].sort((a,b)=>b.points-a.points);
    if(!ranked.length){listEl.innerHTML='<div class="empty">No results yet for this period.</div>';return}
    listEl.innerHTML=ranked.map((r,i)=>`
      <div class="lb-row">
        <div class="lb-rank ${medalClass(i)}">${i+1}</div>
        <div class="lb-avatar"></div>
        <div class="lb-name">${esc(r.team_name)}<span class="s">৳${r.prize} won</span></div>
        <div class="lb-amt">${r.points} PTS</div>
      </div>`).join('');
  }

  tabs.forEach(t=>t.addEventListener('click',()=>{
    tabs.forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    load(t.dataset.range);
  }));

  load('month');
}
start();
</script>
</body>
</html>
