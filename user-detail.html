<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHTEO — User Details</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#101626;--navy2:#1d2750;--bg:#eef0fb;--white:#fff;--ink:#202535;--muted:#7b8190;--line:#dfe3ea;--accent:#3557ff;--green:#1c7c4d;--red:#e5484d;--gold:#b47800}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}
.topbar{background:var(--navy);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.back{width:38px;height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:20px;cursor:pointer}
.brand{font-weight:800;font-size:16px;flex:1}
.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}
.profile-card,.info-card{background:#fff;border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 18px 40px -25px #0005}
.profile-head{display:flex;align-items:center;gap:15px}
.avatar{width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:23px;margin:0 0 5px} h2{font-size:16px;margin:0 0 14px} .muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;margin-top:8px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:800}
.user{background:#e6f4ed;color:var(--green)} .admin{background:#e9edff;color:var(--accent)} .owner{background:#fff2d7;color:var(--gold)} .blocked{background:#fde7e8;color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{padding:13px;border:1px solid var(--line);border-radius:13px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;margin-bottom:5px}
.value{font-size:14px;font-weight:700;word-break:break-word}
.loading,.error{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:600px){.grid{grid-template-columns:1fr}.profile-head{align-items:flex-start}}
</style>
</head>
<body>
<header class="topbar">
<button class="back" onclick="history.back()" aria-label="Back">←</button>
<div class="brand">CHTEO · User Details</div>
</header>
<main class="wrap"><div id="view" class="loading">Loading user details...</div></main>
<script>
const SUPABASE_URL = 'https://myfficbwcbgbxbdqjexv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

function esc(v){return String(v ?? '—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmt(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleString('en-BD',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function initials(name){if(!name)return '?';return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function role(u){if(u.is_banned)return ['Blocked','blocked'];if(u.is_owner)return ['Owner','owner'];if(u.is_admin)return ['Admin','admin'];return ['User','user'];}

async function load(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){location.href='admin-panel.html';return;}
  const {data:me}=await supabaseClient.from('profiles').select('is_admin,is_owner').eq('id',session.user.id).single();
  if(!me || (!me.is_admin && !me.is_owner)){location.href='profile.html';return;}
  const uid=new URLSearchParams(location.search).get('uid');
  if(!uid){document.getElementById('view').innerHTML='<div class="error">User ID not found.</div>';return;}
  const {data:u,error}=await supabaseClient.from('profiles').select('*').eq('id',uid).single();
  if(error || !u){document.getElementById('view').innerHTML='<div class="error">Could not load this user.<br>'+esc(error?.message||'User not found')+'</div>';return;}
  const [rname,rclass]=role(u);
  const avatar=u.avatar_url ? '<img src="'+esc(u.avatar_url)+'" alt="">' : esc(initials(u.full_name||u.email));
  const fields=[
    ['User ID',u.user_number!=null?'#'+u.user_number:'—'],
    ['Full name',u.full_name],['Email',u.email],['WhatsApp',u.whatsapp],
    ['Referral code',u.referral],['Joined',fmt(u.created_at)],['Updated',fmt(u.updated_at)],
    ['Account status',rname==='Blocked'?'Blocked':'Active'],['Admin access',u.is_admin?'Yes':'No'],
    ['Owner access',u.is_owner?'Yes':'No'],['Banned',u.is_banned?'Yes':'No']
  ];
  document.getElementById('view').innerHTML=`
    <section class="profile-card"><div class="profile-head">
      <div class="avatar">${avatar}</div><div>
        <h1>${esc(u.full_name||'----')}</h1><div class="muted">${esc(u.email||'—')}</div>
        <span class="badge ${rclass}">${esc(rname)}</span>
      </div>
    </div></section>
    <section class="info-card"><h2>Full user details</h2><div class="grid">
      ${fields.map(([l,v])=>`<div class="item"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div></div>`).join('')}
    </div></section>`;
}
load();
</script>
</body>
</html>
