<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHTEO — User Details</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy-1:#1b2140;
    --navy-2:#2a3266;
    --navy-3:#333c7a;
    --white:#ffffff;
    --ink:#1b2140;
    --muted:#7a7f9a;
    --line:#e2e3ee;
    --accent:#3557ff;
    --accent-dark:#2846e0;
    --error:#e5484d;
    --success:#1c7c4d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 0%, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(160deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    color:var(--ink);
  }
  .gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-card{
    width:100%;
    max-width:380px;
    background:var(--white);
    border-radius:24px;
    padding:36px 30px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45);
    text-align:center;
  }
  .gate-card h1{ font-size:18px; font-weight:800; margin:0 0 8px; }
  .gate-card p{ font-size:13.5px; color:var(--muted); line-height:1.6; margin:0 0 22px; }
  .gate-btn{
    width:100%; padding:13px; border:none; border-radius:10px;
    background:var(--accent); color:#fff; font-size:14.5px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .gate-btn:hover{ background:var(--accent-dark); }
  .spinner{
    width:32px; height:32px;
    border:3px solid rgba(255,255,255,0.25);
    border-top-color:#fff;
    border-radius:50%;
    margin:0 auto 16px;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .gate-text{ color:rgba(255,255,255,0.75); font-size:14px; }

  .app{ display:none; }
  .app.active{ display:block; }

  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:18px 24px;
    background:rgba(255,255,255,0.04);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .back-btn{
    width:38px; height:38px; border-radius:10px;
    background:rgba(255,255,255,0.08);
    border:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .back-btn:hover{ background:rgba(255,255,255,0.15); }
  .topbar h1{ color:#fff; font-size:16px; font-weight:800; margin:0; }

  .content{ max-width:480px; margin:0 auto; padding:22px 18px 54px; }

  /* Single combined profile card */
  .profile-card{
    background:var(--white);
    border-radius:22px;
    padding:20px 18px 8px;
    box-shadow:0 20px 44px -22px rgba(0,0,0,0.35);
    margin-bottom:16px;
    position:relative;
  }
  .country-pill{
    display:flex; align-items:center; gap:7px;
    margin-top:7px;
    font-size:10.5px; font-weight:800;
    letter-spacing:0.35px; text-transform:uppercase;
    color:var(--ink);
    flex-wrap:wrap;
  }
  .country-pill .meta-sep{ color:#c9ceda; margin:0 2px; }
  .country-pill .location-meta{ color:#667085; display:inline-flex; align-items:center; gap:5px; }
  .country-pill .location-icon{ color:#22b96f; display:inline-flex; }
  .country-pill span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .flag-dot{
    width:13px; height:13px; border-radius:50%; flex-shrink:0;
    background:#046a38; position:relative; overflow:hidden;
  }
  .flag-dot::after{
    content:""; position:absolute; width:6px; height:6px; border-radius:50%;
    background:#c8102e; top:50%; left:46%; transform:translate(-50%,-50%);
  }

  .card-head{
    display:flex; align-items:center; gap:14px;
    padding-right:0;
  }
  .avatar-lg{
    width:64px; height:64px;
    border-radius:50%;
    background:var(--navy-2);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:22px;
    overflow:hidden; flex-shrink:0;
  }
  .avatar-lg img{ width:100%; height:100%; object-fit:cover; }
  .head-text{ min-width:0; }
  .card-head .name{
    font-size:17px; font-weight:800; line-height:1.25;
    overflow-wrap:anywhere;
  }
  .card-head .email{
    font-size:12.5px; color:var(--muted); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .status-row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .badge{
    padding:4px 11px; border-radius:20px;
    font-size:11px; font-weight:800;
  }
  .badge-admin{ background:rgba(53,87,255,0.12); color:var(--accent); }
  .badge-user{ background:rgba(28,124,77,0.12); color:var(--success); }
  .badge-blocked{ background:rgba(229,72,77,0.12); color:var(--error); }
  .role-corner{
    display:flex; align-items:center; gap:5px;
    width:max-content; margin:10px 0 0 auto;
    padding:5px 10px; border-radius:20px;
    background:rgba(53,87,255,0.12); color:#3557ff;
    border:1px solid rgba(53,87,255,0.18);
    font-size:10px; font-weight:900;
  }
  .role-dot{width:7px;height:7px;border-radius:50%;background:#3557ff;}

  .slogan-box{
    background:#f4f5fb;
    border-radius:12px;
    padding:11px 14px;
    margin-top:16px;
    font-size:13px; color:var(--muted);
    overflow-wrap:anywhere;
  }

  .section-label{
    font-size:10.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--muted);
    margin:18px 2px 2px;
  }

  .info-list{ margin-top:4px; }
  .info-row{
    display:flex; align-items:center; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  .info-row:last-child{ border-bottom:none; }
  .icon-chip{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    background:rgba(28,124,77,0.1); color:var(--success);
    display:flex; align-items:center; justify-content:center;
  }
  .info-text{ flex:1; min-width:0; }
  .info-label{
    font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.3px; color:var(--muted);
  }
  .info-value{
    font-size:14px; font-weight:700; margin-top:1px;
    overflow-wrap:anywhere;
  }
  .copy-btn{
    width:34px; height:34px; border-radius:9px; flex-shrink:0;
    background:var(--line); border:none; color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .copy-btn:hover{ background:#d7d9ea; }

  .actions-row{ display:flex; gap:10px; margin-top:18px; }
  .action-btn{
    flex:1; padding:13px; border-radius:12px; border:1px solid var(--line);
    background:var(--white); font-size:13.5px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .action-btn.make-admin{ color:var(--accent); border-color:rgba(53,87,255,0.35); }
  .action-btn.block{ color:var(--error); border-color:rgba(229,72,77,0.35); }
  .action-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:10;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="gate" id="gate-checking">
    <div><div class="spinner"></div><div class="gate-text">Checking access...</div></div>
  </div>

  <div class="gate" id="gate-denied" style="display:none;">
    <div class="gate-card">
      <h1>Access denied</h1>
      <p>You don't have admin access to view this page.</p>
      <button class="gate-btn" onclick="window.location.href='admin-panel.html'">Back to admin panel</button>
    </div>
  </div>

  <div class="gate" id="gate-notfound" style="display:none;">
    <div class="gate-card">
      <h1>User not found</h1>
      <p>This user doesn't exist or couldn't be loaded.</p>
      <button class="gate-btn" onclick="window.location.href='admin-panel.html'">Back to admin panel</button>
    </div>
  </div>

  <div class="app" id="app">
    <div class="topbar">
      <button class="back-btn" onclick="window.location.href='admin-panel.html'" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h1>User details</h1>
    </div>

    <div class="content">
      <div class="profile-card">
        <div class="card-head">
          <div class="avatar-lg" id="avatarLg"></div>
          <div class="head-text">
            <div class="name" id="nameEl">----</div>
            <div class="country-pill" id="countryPill">
              <span class="flag-dot"></span><span id="countryPillText">BANGLADESH</span>
              <span class="meta-sep">•</span>
              <span class="location-meta"><span class="location-icon">⌖</span><span id="locationText">----</span></span>
            </div>
            <div class="email" id="emailEl" style="display:none">—</div>
            <div class="status-row" id="statusRow" style="display:none"></div>
          </div>
        </div>

        <div class="slogan-box" id="sloganBox" style="display:none;"></div>

        <div class="info-list" id="detailsList"></div>
        <div class="role-corner" id="roleCorner"><span class="role-dot"></span><span id="roleText">USER</span></div>
      </div>

      <div id="otherSection" class="profile-card other-card" style="display:none;">
        <div class="section-label">Other details</div>
        <div class="info-list" id="otherList"></div>
      </div>

      <div class="actions-row">
        <button class="action-btn make-admin" id="adminToggleBtn">Make Admin</button>
        <button class="action-btn block" id="banToggleBtn">Block User</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://myfficbwcbgbxbdqjexv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';

const params = new URLSearchParams(window.location.search);
const targetUid = params.get('uid');

let supabaseClient;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e){
  document.getElementById('gate-checking').innerHTML =
    '<div class="gate-text">Supabase init error: ' + e.message + '</div>';
}

let targetProfile = null;

function showGate(name){
  document.getElementById('gate-checking').style.display = name === 'checking' ? 'flex' : 'none';
  document.getElementById('gate-denied').style.display = name === 'denied' ? 'flex' : 'none';
  document.getElementById('gate-notfound').style.display = name === 'notfound' ? 'flex' : 'none';
  document.getElementById('app').classList.toggle('active', name === 'app');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[m]));
}

function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

// Fields already covered elsewhere on the page (avatar/name/badges,
// the country pill, the slogan box) — never listed in either row list.
const ALWAYS_HIDDEN = new Set(['id', 'full_name', 'avatar_url', 'is_admin', 'is_banned', 'bio', 'country', 'slogan']);

// Everything below follows the requested serial:
// UID, WhatsApp, Email, Location -> main info list (photo/team name/
// slogan/country are already shown above in the card head/slogan box)
// Referral code, Joined, Last updated, User Serial -> "Other details"
const PROFILE_FIELDS = [
  ['user_number', 'UID', v => v != null ? ('#' + v) : null],
  ['whatsapp', 'WhatsApp'],
  ['email', 'Email'],
  ['location', 'Location'],
];
const OTHER_FIELDS = [
  ['referral', 'Referral code'],
  ['created_at', 'Joined', v => v ? new Date(v).toLocaleString() : null],
  ['updated_at', 'Last updated', v => v ? new Date(v).toLocaleString() : null],
];

// Small icon per field key, shown in the icon-chip next to each row.
// Falls back to a generic dot icon for anything not listed (referral
// codes, timestamps, and any future/unexpected column).
const ICONS = {
  user_number: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  email: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  whatsapp: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  location: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  referral: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v6c0 5 4 9 9 9s9-4 9-9V7l-9-5Z"/></svg>',
  created_at: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  updated_at: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>',
  default: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
};

async function checkAccess(){
  showGate('checking');

  if(!targetUid){
    showGate('notfound');
    return;
  }

  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){
    window.location.href = 'admin-panel.html';
    return;
  }

  const { data: me, error: meErr } = await supabaseClient
    .from('profiles')
    .select('is_admin')
    .eq('id', session.user.id)
    .single();

  if(meErr || !me || !me.is_admin){
    showGate('denied');
    return;
  }

  await loadTarget();
}

async function loadTarget(){
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', targetUid)
    .single();

  if(error || !data){
    showGate('notfound');
    return;
  }

  targetProfile = data;
  renderTarget();
  showGate('app');
}

function renderTarget(){
  const p = targetProfile;

  document.getElementById('nameEl').textContent = p.full_name ? p.full_name : '----';
  document.getElementById('emailEl').textContent = p.email || '—';

  const avatarLg = document.getElementById('avatarLg');
  avatarLg.innerHTML = p.avatar_url
    ? `<img src="${escapeHtml(p.avatar_url)}" alt="">`
    : escapeHtml(initials(p.full_name || p.email));

  const statusRow = document.getElementById('statusRow');
  if(statusRow) statusRow.innerHTML = '';

  // Same Country + Location presentation used by the user's Profile page.
  // Bangladesh is the default; an empty location is shown as ----.
  document.getElementById('countryPillText').textContent = p.country || 'Bangladesh';
  document.getElementById('locationText').textContent = p.location || '----';

  const roleText = document.getElementById('roleText');
  if(roleText) roleText.textContent = p.is_banned ? 'BLOCKED' : (p.is_admin ? 'ADMIN' : 'USER');

  // Slogan box, under the avatar/name
  const sloganBox = document.getElementById('sloganBox');
  if(p.slogan){
    sloganBox.textContent = p.slogan;
    sloganBox.style.display = 'block';
  } else {
    sloganBox.style.display = 'none';
  }

  function buildRows(fieldList){
    const rows = [];
    fieldList.forEach(([key, label, transform]) => {
      let val = p[key];
      if(val === null || val === undefined || val === '') return;
      if(transform) val = transform(val);
      if(val === null || val === undefined || val === '') return;
      rows.push([key, label, val]);
    });
    return rows;
  }

  const profileRows = buildRows(PROFILE_FIELDS);
  const otherRows = buildRows(OTHER_FIELDS);

  // Any field not explicitly placed above and not always-hidden still
  // shows up, so nothing silently disappears if the table gains a
  // new column later — it lands in "Other details".
  const placedKeys = new Set([...PROFILE_FIELDS, ...OTHER_FIELDS].map(f => f[0]));
  Object.keys(p).forEach(key => {
    if(ALWAYS_HIDDEN.has(key) || placedKeys.has(key) || key === 'user_number') return;
    const val = p[key];
    if(val === null || val === undefined || val === '') return;
    otherRows.push([key, key, val]);
  });

  const rowsHtml = rows => rows.map(([key, label, val], i) => `
    <div class="info-row">
      <div class="icon-chip">${ICONS[key] || ICONS.default}</div>
      <div class="info-text">
        <div class="info-label">${escapeHtml(label)}</div>
        <div class="info-value">${escapeHtml(val)}</div>
      </div>
      ${key === 'user_number' ? `<button class="copy-btn" data-copy="${escapeHtml(val)}" aria-label="Copy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>` : ''}
    </div>
  `).join('');

  document.getElementById('detailsList').innerHTML = rowsHtml(profileRows);
  document.getElementById('otherList').innerHTML = rowsHtml(otherRows);
  document.getElementById('otherSection').style.display = otherRows.length ? 'block' : 'none';

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.copy).then(() => showToast('Copied.')).catch(() => {});
    });
  });

  const adminBtn = document.getElementById('adminToggleBtn');
  adminBtn.textContent = p.is_admin ? 'Remove Admin' : 'Make Admin';
  const banBtn = document.getElementById('banToggleBtn');
  banBtn.textContent = p.is_banned ? 'Unblock User' : 'Block User';
}

async function toggleField(field, currentVal, btnEl){
  btnEl.disabled = true;
  const { error } = await supabaseClient
    .from('profiles')
    .update({ [field]: !currentVal })
    .eq('id', targetUid);

  btnEl.disabled = false;

  if(error){
    showToast('Could not update: ' + error.message);
    return;
  }
  targetProfile[field] = !currentVal;
  renderTarget();
  showToast('Updated.');
}

document.getElementById('adminToggleBtn').addEventListener('click', function(){
  toggleField('is_admin', !!targetProfile.is_admin, this);
});
document.getElementById('banToggleBtn').addEventListener('click', function(){
  toggleField('is_banned', !!targetProfile.is_banned, this);
});

checkAccess();
</script>

</body>
</html>
