<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Create Charge Test</title>
</head>
<body style="font-family: sans-serif; max-width: 500px; margin: 40px auto;">

  <h2>PipraPay Create Charge — Test</h2>

  <form id="testForm">
    <p>
      <label>User ID (wallet_users.id):</label><br>
      <input type="text" name="user_id" value="1" required>
    </p>
    <p>
      <label>Full Name:</label><br>
      <input type="text" name="full_name" value="Test User" required>
    </p>
    <p>
      <label>Email/Mobile:</label><br>
      <input type="text" name="email_mobile" value="test@example.com" required>
    </p>
    <p>
      <label>Amount:</label><br>
      <input type="number" name="amount" value="10" required>
    </p>
    <button type="submit">Test Charge</button>
  </form>

  <h3>Response:</h3>
  <pre id="output" style="background:#eee; padding:10px; white-space: pre-wrap;"></pre>

  <script>
    document.getElementById('testForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const output = document.getElementById('output');
      output.textContent = 'Loading...';

      const formData = new FormData(this);

      try {
        const res = await fetch('https://chteo-api.onrender.com/create-charge.php', {
          method: 'POST',
          body: formData
        });
        const text = await res.text();
        output.textContent = 'HTTP ' + res.status + '\n\n' + text;
      } catch (err) {
        output.textContent = 'Fetch error: ' + err.message;
      }
    });
  </script>

</body>
</html>
