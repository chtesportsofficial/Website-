<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Activity Logs — CHT ESP ORG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b12;--surface:#121827;--line:#293650;--muted:#8b96aa;--green:#25d366;--cyan:#55c7ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080b12,#0b0f18 55%,#080b12);color:#f4f6fb;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 60px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:#101625;color:#fff;text-decoration:none;font-size:25px}.head h1{font-size:22px;margin:0;font-weight:950}.sub{font-size:10px;color:var(--muted);margin-top:3px}.panel{background:linear-gradient(180deg,#141b2b,#101726);border:1px solid #27334c;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 12px 30px #0003}.filters{display:grid;grid-template-columns:1.7fr 1fr 1fr auto;gap:8px}.input,.select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f1522;color:#f4f6fb;outline:none;font:inherit;font-size:11px}.btn{border:1px solid var(--line);background:#111827;color:#e8ebf2;border-radius:12px;padding:10px 15px;font-weight:900;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#06120a}.summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.summary b{font-size:14px}.summary span{font-size:10px;color:var(--muted)}
.log{border:1px solid #283650;border-left:3px solid var(--green);border-radius:17px;padding:16px;margin:10px 0;background:linear-gradient(145deg,#151e30,#101725);box-shadow:0 8px 22px #0002}.narration{display:flex;align-items:flex-start;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #25d36666;flex:none;margin-top:7px}.sentence{font-size:13px;line-height:1.6;font-weight:800;color:#eef2f8}.admin-link{color:var(--cyan);text-decoration:none;font-weight:950}.admin-link:hover{text-decoration:underline}.target-highlight{display:inline-block;color:#ffd166;background:#ffd16612;border:1px solid #ffd16635;border-radius:6px;padding:1px 5px;font-weight:950;box-shadow:inset 0 0 0 1px #ffd16608}.time{margin-top:6px;font-size:10px;color:#7f8ba0}.empty{text-align:center;color:var(--muted);padding:35px 10px;font-size:11px}.loading{opacity:.7}@media(max-width:650px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.filters .btn{grid-column:1/-1}.sentence{font-size:12px}}
</style>
</head>
<body><main class="wrap">
<div class="head"><a class="back" href="tournament-management.html">‹</a><div><h1>Activity Logs</h1><div class="sub">Complete admin activity history</div></div></div>
<section class="panel"><div class="filters"><input id="search" class="input search" placeholder="Search admin, tournament, activity..."><select id="category" class="select"><option value="all">All categories</option><option value="tournament">Tournament</option><option value="homepage">Homepage</option><option value="wallet">Wallet</option><option value="payment">Payment</option><option value="user">User</option><option value="notice">Notice</option><option value="admin">Admin</option><option value="system">System</option></select><select id="period" class="select"><option value="all">All time</option><option value="today">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select><button id="refresh" class="btn primary">Refresh</button></div></section>
<section class="panel"><div class="summary"><b>All Activity</b><span id="count">0 logs</span></div><div id="logs"><div class="empty">Loading logs...</div></div></section>
</main>
<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
let allLogs=[],adminMap={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

function fmt(v){
  const d=new Date(v);
  return Number.isNaN(d.getTime())?'—':
    d.toLocaleString('en-BD',{day:'2-digit',month:'short',year:'numeric',
    hour:'2-digit',minute:'2-digit',hour12:true});
}

function parseDetails(x){
  let d=x?.details;
  if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){d={}}}
  return d&&typeof d==='object'?d:{};
}

function getNarration(x){
  const d=parseDetails(x);
  if(d.narration) return d.narration;

  const n=x.target_name||'item';
  const a=x.action||'';
  const map={
    tournament_created:`created the tournament ${n}.`,
    tournament_enabled:`turned ON the tournament ${n}.`,
    tournament_disabled:`turned OFF the tournament ${n}.`,
    tournament_deleted:`deleted the tournament ${n}.`,
    tournament_archived:`archived the tournament ${n}.`,
    section_created:`created the homepage section ${n}.`,
    section_enabled:`turned ON the homepage section ${n}.`,
    section_disabled:`turned OFF the homepage section ${n}.`,
    section_deleted:`deleted the homepage section ${n}.`
  };
  if(a==='tournaments_reordered'){
    if(d.narration) return d.narration;
    const tn=d.tournament_name||d.target_name||'tournament';
    const from=Number(d.old_position), to=Number(d.new_position);
    if(Number.isFinite(from)&&Number.isFinite(to))
      return `changed the tournament ${tn}'s position: #${from} → #${to}`;
  }
  const d2=parseDetails(x);
  if(a==='tournaments_reordered' && d2.old_position && d2.new_position) return `moved ${n}: #${d2.old_position} → #${d2.new_position}.`;
  if(a==='sections_reordered' && d2.oldPosition && d2.newPosition) return `changed the homepage section ${d2.name||n}'s position: #${d2.oldPosition} → #${d2.newPosition}.`;
  if(a==='tournament_created') return `created the tournament ${n}.`;
  if(a==='section_created') return `created the homepage section ${n}.`;
  return map[a] || a.replaceAll('_',' ');
}

function highlightTargets(text, targets){
  let safe=esc(text);
  if(!Array.isArray(targets)||!targets.length) return safe;

  // Highlight only the exact target strings, preserving the narration text.
  const unique=[...new Set(targets.filter(Boolean).map(String))]
    .sort((a,b)=>b.length-a.length);

  for(const target of unique){
    const e=esc(target);
    if(!e) continue;
    safe=safe.replace(new RegExp(`(${e.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'g'),
      '<span class="target-highlight">$1</span>');
  }
  return safe;
}

function render(){
  const q=$('search').value.trim().toLowerCase();
  const cat=$('category').value;
  const period=$('period').value;
  const now=Date.now();

  const rows=allLogs.filter(x=>{
    if(cat!=='all'&&x.category!==cat) return false;

    if(period==='today'){
      const d=new Date(); d.setHours(0,0,0,0);
      if(new Date(x.created_at)<d) return false;
    }else if(period!=='all' &&
      now-new Date(x.created_at).getTime()>Number(period)*86400000) return false;

    const an=adminMap[x.admin_id]||x.admin_name||'Admin';
    const n=getNarration(x);
    if(q && !([an,x.action,x.category,x.target_name,n].join(' ').toLowerCase().includes(q)))
      return false;

    return true;
  });

  $('count').textContent=rows.length+' log'+(rows.length===1?'':'s');

  $('logs').innerHTML=rows.length ? rows.map(x=>{
    const an=adminMap[x.admin_id]||x.admin_name||'Admin';
    const d=parseDetails(x);
    const n=getNarration(x);
    const targets=d.highlight_targets || [];

    const href=x.admin_id
      ? `user-details.html?id=${encodeURIComponent(x.admin_id)}`
      : '#';

    return `<article class="log">
      <div class="narration">
        <span class="dot"></span>
        <div>
          <div class="sentence">
            <a class="admin-link" href="${href}">${esc(an)}</a>
            ${highlightTargets(n,targets)}
          </div>
          <div class="time">${esc(fmt(x.created_at))}</div>
        </div>
      </div>
    </article>`;
  }).join('') :
  '<div class="empty">No activity found.</div>';
}

async function guard(){
  try{
    const {data:{session},error}=await sb.auth.getSession();
    if(error) throw error;
    if(!session){location.href='chteo_auth.html';return false}

    const {data:p,error:pe}=await sb.from('profiles')
      .select('is_admin').eq('id',session.user.id).single();

    if(pe) throw pe;
    if(!p?.is_admin){
      alert('Admin access required.');
      location.href='index.html';
      return false;
    }
    return true;
  }catch(e){
    console.error('Admin check failed:',e);
    $('logs').innerHTML='<div class="empty">Admin verification failed. Check the browser console for the exact error.</div>';
    return false;
  }
}

async function load(){
  $('logs').innerHTML='<div class="empty">Loading logs...</div>';
  $('logs').classList.add('loading');

  try{
    // This is the only required data query for the logs.
    // Admin profile lookup is intentionally NOT required to render logs.
    const {data,error}=await sb.from('activity_logs')
      .select('*')
      .order('created_at',{ascending:false})
      .limit(1000);

    if(error) throw error;

    allLogs=data||[];

    // Best-effort admin names. Failure here must never prevent logs rendering.
    adminMap={};
    const ids=[...new Set(allLogs.map(x=>x.admin_id).filter(Boolean))];

    if(ids.length){
      try{
        const {data:profiles,error:pe}=await sb.from('profiles')
          .select('id,full_name,email').in('id',ids);

        if(!pe){
          (profiles||[]).forEach(p=>{
            adminMap[p.id]=p.full_name||p.email||'Admin';
          });
        }
      }catch(e){
        console.warn('Admin names could not be loaded:',e);
      }
    }

    render();
  }catch(e){
    console.error('ACTIVITY LOGS ERROR:',e);
    $('logs').innerHTML=
      '<div class="empty">Activity logs could not be loaded.<br><small>'+
      esc(e?.message||String(e))+
      '</small></div>';
  }finally{
    $('logs').classList.remove('loading');
  }
}

$('refresh').onclick=load;
$('search').oninput=render;
$('category').onchange=render;
$('period').onchange=render;

(async()=>{
  if(await guard()) await load();
})();
</script></body></html>
