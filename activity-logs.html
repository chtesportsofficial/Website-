<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Activity Logs — CHT ESP ORG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b12;--surface:#121827;--surface2:#171f31;--line:#293650;--muted:#8b96aa;--green:#25d366;--red:#ff5d6c;--gold:#f6c453;--cyan:#43d9ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080b12,#0b0f18 55%,#080b12);color:#f4f6fb;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 50px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#101625;color:#fff;text-decoration:none;font-size:22px}.head h1{font-size:21px;margin:0;font-weight:900}.sub{font-size:10px;color:var(--muted);margin-top:3px}.panel{background:linear-gradient(180deg,#141b2b,#111827);border:1px solid #27334c;border-radius:19px;padding:14px;margin-bottom:12px;box-shadow:0 12px 30px #0003}.filters{display:grid;grid-template-columns:1.7fr 1fr 1fr auto;gap:8px}.input,.select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#0f1522;color:#f4f6fb;outline:none;font:inherit;font-size:11px}.btn{border:1px solid var(--line);background:#111827;color:#e8ebf2;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#06120a}.chips{display:flex;gap:7px;overflow:auto;margin-top:10px;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#101625;color:#9da8bb;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;cursor:pointer}.chip.active{background:#193325;color:#5ee98b;border-color:#2b7549}.summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.summary b{font-size:13px}.summary span{font-size:10px;color:var(--muted)}.log{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:start;padding:13px 5px;border-top:1px solid #202b40}.log:first-child{border-top:0}.time{font-size:10px;color:#7f8ba0;font-weight:800;padding-top:3px}.dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;margin-right:7px;box-shadow:0 0 12px #25d36666}.dot.fail{background:var(--red);box-shadow:0 0 12px #ff5d6c66}.title{font-size:12px;font-weight:900}.meta{font-size:10px;color:#8e99ad;margin-top:4px;line-height:1.5}.details{margin-top:7px;padding:8px 10px;background:#0d1420;border:1px solid #202b40;border-radius:9px;font-size:10px;color:#b8c0ce;white-space:pre-wrap;word-break:break-word}.badge{font-size:8px;font-weight:900;padding:5px 7px;border-radius:999px;background:#1b2d24;color:#63e994}.badge.fail{background:#351d25;color:#ff7785}.empty{text-align:center;color:var(--muted);padding:35px 10px;font-size:11px}.loading{opacity:.7}@media(max-width:650px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.log{grid-template-columns:48px 1fr}.log .badge{grid-column:2;justify-self:start}.head h1{font-size:19px}}
</style>
</head>
<body><main class="wrap">
<div class="head"><a class="back" href="tournament-management.html">‹</a><div><h1>Activity Logs</h1><div class="sub">Complete admin activity history</div></div></div>
<section class="panel"><div class="filters"><input id="search" class="input search" placeholder="Search admin, action, tournament, details..."><select id="category" class="select"><option value="all">All categories</option><option value="tournament">Tournament</option><option value="homepage">Homepage</option><option value="wallet">Wallet</option><option value="payment">Payment</option><option value="user">User</option><option value="notice">Notice</option><option value="admin">Admin</option><option value="system">System</option></select><select id="period" class="select"><option value="all">All time</option><option value="today">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select><button id="refresh" class="btn primary">Refresh</button></div><div class="chips"><button class="chip active" data-status="all">All</button><button class="chip" data-status="success">Success</button><button class="chip" data-status="failed">Failed</button></div></section>
<section class="panel"><div class="summary"><b>All Activity</b><span id="count">0 logs</span></div><div id="logs"><div class="empty">Loading logs...</div></div></section>
</main>
<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';const sb=window.supabase.createClient(SUPABASE_URL,KEY);let allLogs=[],status='all';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function guard(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return false}const {data:p,error}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).single();if(error||!p?.is_admin){alert('Admin access required.');location.href='index.html';return false}return true}
function fmt(v){const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('en-BD',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})}
function render(){let q=$('search').value.trim().toLowerCase(),cat=$('category').value,period=$('period').value,now=Date.now();let rows=allLogs.filter(x=>{if(status!=='all'&&(x.status||'success')!==status)return false;if(cat!=='all'&&x.category!==cat)return false;if(period==='today'){let d=new Date();d.setHours(0,0,0,0);if(new Date(x.created_at)<d)return false}else if(period!=='all'&&now-new Date(x.created_at).getTime()>Number(period)*86400000)return false;if(q){let s=[x.admin_name,x.action,x.category,x.target_type,x.target_id,x.target_name,x.details,JSON.stringify(x.before_data),JSON.stringify(x.after_data)].join(' ').toLowerCase();if(!s.includes(q))return false}return true});$('count').textContent=rows.length+' log'+(rows.length===1?'':'s');$('logs').innerHTML=rows.length?rows.map(x=>`<div class="log"><div class="time">${esc(new Date(x.created_at).toLocaleTimeString('en-BD',{hour:'2-digit',minute:'2-digit',hour12:true}))}</div><div><div class="title"><span class="dot ${x.status==='failed'?'fail':''}"></span>${esc(x.action||'Activity')}</div><div class="meta">${esc(x.admin_name||'Admin')} · ${esc(x.category||'system')}${x.target_name?' · '+esc(x.target_name):''}</div>${x.details?`<div class="details">${esc(x.details)}</div>`:''}</div><span class="badge ${x.status==='failed'?'fail':''}">${esc(x.status||'success').toUpperCase()}</span></div>`).join(''):'<div class="empty">No activity found.</div>'}
async function load(){ $('logs').classList.add('loading');const {data,error}=await sb.from('activity_logs').select('*').order('created_at',{ascending:false}).limit(1000);if(error){$('logs').innerHTML='<div class="empty">Could not load logs. Run activity-logs.sql in Supabase SQL Editor first.</div>';console.error(error);return}allLogs=data||[];render();$('logs').classList.remove('loading')}
$('refresh').onclick=load;$('search').oninput=render;$('category').onchange=render;$('period').onchange=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');status=b.dataset.status;render()});(async()=>{if(await guard())load()})();
</script></body></html>
