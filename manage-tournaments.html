<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHT ESP ORG — Manage All Tour</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:var(--g-bg,#0a0d13); --surface:var(--g-surface,#131826); --surface-2:var(--g-surface-2,#171d2d);
  --line:var(--g-border,#232b3d); --text:var(--g-text,#eef1f7); --dim:var(--g-muted,#8b93a9);
  --green:#22e08a; --red:#ff5a6e; --purple:#7c3aed; --cyan:#21e6c1; --gold:#e9c96a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Bengali",sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
.app{width:100%;max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:200px}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--text);flex-shrink:0}
.icon-btn svg{width:20px;height:20px}
.topbar h1{font-size:19px;font-weight:750}

.gate{padding:90px 24px;text-align:center;color:var(--dim);font-size:14px;line-height:1.6}
.gate a,.gate button.lnk{color:var(--green);font-weight:800;text-decoration:none;background:none;border:none;font-size:14px}

.months{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mchip{flex-shrink:0;padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:800}
.mchip.on{background:var(--green);border-color:var(--green);color:#052e1c}

.thead{margin:0 16px 12px;border-radius:14px;overflow:hidden}
.tupd{background:#2f66d0;color:#fff;font-size:11.5px;font-weight:700;text-align:center;padding:5px}
.ttl{display:flex;align-items:center;gap:8px;background:#ff9800;color:#1a1200;padding:12px 8px 12px 14px}
.ttl b{flex:1;font-size:17px;font-weight:900;letter-spacing:.3px;overflow-wrap:anywhere}
.ttl button{width:38px;height:38px;border-radius:11px;border:none;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;color:#1a1200}.ttl button svg{width:19px;height:19px}
.teams{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.teams::-webkit-scrollbar{display:none}
.tchip{flex-shrink:0;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:800}
.tchip.on{background:#ff9800;border-color:#ff9800;color:#1a1200}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 8px}
.scard{background:linear-gradient(145deg,#1d4fbf,#173f9a);border-radius:16px;padding:12px 14px;color:#fff;border:1px solid rgba(255,255,255,.12)}
.scard .l{font-size:11px;font-weight:800;letter-spacing:.5px;opacity:.85}
.scard .v{font-size:26px;font-weight:900;margin-top:4px}
.scard .v.neg{color:#ffb3bd}.scard .v.pos{color:#9bf5c8}
.scard .h{font-size:10.5px;opacity:.7;margin-top:2px}

.day{margin:16px 16px 0}
.dayhead{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#6d28d9,#7c3aed);border-radius:12px;padding:8px 8px 8px 14px;color:#fff}
.dayhead b{flex:1;font-size:14px;font-weight:900}
.dayhead small{opacity:.75;font-weight:700;font-size:11px;margin-left:6px}
.dayhead button{width:32px;height:32px;border-radius:10px;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:20px;line-height:1}
.entry{display:flex;gap:10px;align-items:stretch;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;cursor:pointer;text-align:left;width:100%}
.entry:active{background:var(--surface-2)}
.e-time{flex-shrink:0;width:54px;text-align:center;background:rgba(33,230,193,.14);color:var(--cyan);border-radius:10px;padding:8px 2px;font-size:12px;font-weight:900;align-self:flex-start}
.e-main{flex:1;min-width:0}
.e-name{font-size:14px;font-weight:800;overflow-wrap:anywhere}
.e-sub{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:11px}
.tag{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--dim);font-weight:800;white-space:nowrap}
.tag.fee{background:rgba(255,90,110,.14);color:var(--red)}
.tag.fee.unpaid{background:transparent;border:1px dashed var(--red)}
.tag.prize{background:rgba(34,224,138,.14);color:var(--green)}
.tag.prize.unrec{background:transparent;border:1px dashed var(--green)}
.tag.q{background:rgba(34,224,138,.18);color:var(--green)}
.tag.dq{background:rgba(255,90,110,.18);color:var(--red)}
.tag.sold{background:var(--red);color:#fff}
.e-cm{font-size:11.5px;color:var(--dim);margin-top:6px;overflow-wrap:anywhere}
.e-banner{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);align-self:flex-start;background:#0c1320}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:6px;padding-bottom:6px}
table.sh{border-collapse:collapse;min-width:900px;width:100%;font-size:12.5px}
.sh td{border:1px solid #2a3350;padding:9px 8px;text-align:center;white-space:nowrap;background:#05070c}
.sh tr.dh td{padding:0;background:#7c3aed;border-color:#7c3aed}
.dhin{position:sticky;left:0;display:flex;align-items:center;gap:8px;width:min(100vw,560px);padding:7px 10px;color:#fff}
.dhin b{flex:1;font-size:14px;font-weight:900;text-align:left}.dhin small{opacity:.75;font-size:11px;margin-left:5px}
.dhin button{width:30px;height:30px;border-radius:9px;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:20px;line-height:1}
.sh tr.hd td{background:#00e5e5;color:#00292b;font-weight:800;font-size:11.5px;padding:7px 8px}
.sh tr:not(.dh) td:first-child{position:sticky;left:0;z-index:2}
.sh tr.er{cursor:pointer}.sh tr.er:active td{filter:brightness(1.25)}
.sh td.c-n{text-align:left;min-width:210px;white-space:normal;font-weight:700}
.sh td.c-c{text-align:left;min-width:150px;white-space:normal;color:var(--dim)}
.sh td.g{background:#12c458;color:#04210f;font-weight:800}
.sh td.r{background:#e0243c;color:#fff;font-weight:800}
.sh td.pz{color:var(--green);font-weight:800}.sh td.pz.y{color:#2b2200}
.sh td img{width:38px;height:38px;border-radius:7px;object-fit:cover;display:block;margin:0 auto}
.empty{text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7;padding:46px 26px}

.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(100px + env(safe-area-inset-bottom));z-index:45;width:58px;height:58px;border-radius:50%;border:none;background:var(--green);color:#052e1c;font-size:32px;font-weight:700;box-shadow:0 8px 22px rgba(34,224,138,.4)}

/* bottom sheet */
.ov{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:none}
.ov.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;font-weight:850;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;font-weight:800;color:var(--dim);margin-bottom:5px;letter-spacing:.2px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--text);font-size:14px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#3a4a70}
.fld textarea{resize:vertical;min-height:60px}
.fld .bad{border-color:var(--red)}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-top:7px;font-weight:700}
.chk input{width:18px;height:18px;accent-color:var(--green)}
.bn{display:flex;align-items:center;gap:10px}
.bn img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:none}
.bn .btns{display:flex;flex-direction:column;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:800}
.sbtn.red{color:var(--red)}
.acts{display:flex;gap:8px;margin-top:6px}
.acts button{flex:1;border-radius:12px;padding:13px;font-size:14px;font-weight:850;border:1px solid var(--line);background:var(--bg)}
.acts .save{background:var(--green);border-color:var(--green);color:#052e1c}
.acts .del{color:var(--red);flex:0 0 auto;padding:13px 16px}
.acts button:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(12px);background:#000c;color:#fff;border:1px solid #fff3;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sum{grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 10px}
.sum .scard{padding:8px 7px;border-radius:12px;min-width:0}
.sum .scard .l{font-size:8.5px;letter-spacing:.3px}
.sum .scard .v{font-size:16px;margin:3px 0 0;overflow:hidden;text-overflow:ellipsis}
.sum .scard .h{display:none}
.sh td{min-width:58px}.sh td.pl-p{color:var(--green);font-weight:800}.sh td.pl-n{color:#ff6b6b;font-weight:800}
.sh .ph{color:#5b6788;font-weight:600}
.pcs{display:flex;flex-wrap:wrap;gap:8px}
.pc{padding:11px 15px;border-radius:11px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-size:13.5px;font-weight:800}
.pc.on{background:#ff9800;border-color:#ff9800;color:#1a1200}
.cap{font-size:11.5px;font-weight:800;color:var(--dim);margin:14px 0 6px}
.pcu{display:flex;gap:8px;align-items:flex-start}
.pcu input,.pcu textarea{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--text);font-size:14px;outline:none}
.pok{border:none;border-radius:11px;padding:12px 20px;background:var(--green);color:#052e1c;font-weight:900;font-size:14px}
.pmore{width:100%;margin-top:14px;padding:11px;border-radius:11px;background:transparent;border:1px dashed var(--line);color:var(--dim);font-weight:700;font-size:13px}
.sheet{max-height:94%}
.dsel{display:flex;gap:8px}.dsel select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 8px;color:var(--text);font-size:14px}.dsel select:nth-child(2){flex:1.7}
.sh td.b{background:#2f66d0;color:#fff;font-weight:800}.sh td.o{background:#ff9800;color:#1a1200;font-weight:800}
.sh td.tr{color:#ff6b6b;min-width:46px}.sh td.tr svg{width:18px;height:18px;display:block;margin:0 auto}
#bgImg{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;background:#000;margin-bottom:12px}
#bgSub{color:var(--dim);font-size:13px;font-weight:700;margin:-6px 0 14px}
.pdel{width:100%;margin-top:10px;padding:11px;border-radius:11px;background:transparent;border:1px solid #5b2430;color:#ff6b6b;font-weight:800;font-size:13px}
.tupd{font-size:10px;padding:3px}
.ttl{padding:7px 6px 7px 12px}.ttl b{font-size:13px;letter-spacing:.2px}
.ttl button{width:30px;height:30px;border-radius:9px}.ttl button svg{width:15px;height:15px}
.thead{margin-bottom:10px;border-radius:12px}
.bplus{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:#12c458;color:#052e1c;font-size:14px;font-weight:900;line-height:18px;text-align:center}
.fnr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fnr small{display:block;color:var(--dim);font-size:11px}.fnr span{color:var(--dim);margin-left:6px}
.fnr .pos{color:var(--green)}.fnr .neg{color:#ff6b6b}
.fnr button{background:none;border:none;color:#ff6b6b;font-size:16px;padding:6px 10px}
.warn{background:#2a1218;border:1px solid #5b2430;border-radius:12px;padding:12px;font-size:13.5px;line-height:1.55;margin-bottom:12px}
.sh tr.hd td.hn{white-space:normal;min-width:210px}
.pc.on{box-shadow:0 0 0 2px rgba(255,152,0,.35)}
.pok:disabled{opacity:.45}
.sh td{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sh td.sel{outline:3px solid #ff9800;outline-offset:-3px;filter:brightness(1.3)}
#cpBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));width:min(94vw,540px);z-index:9000;display:none;align-items:center;gap:8px;background:#1b2440;border:1px solid #3a4a70;border-radius:16px;padding:10px 10px 10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#cpBar.show{display:flex}
#cpInfo{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--text);line-height:1.35}
#cpInfo small{display:block;color:var(--dim);font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cpBar button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 14px;font-weight:850;font-size:13px}
#cpBar button:disabled{opacity:.4}
#cpBar{gap:6px}#cpBar button{padding:10px 11px}#cpBar #cpClear{color:#e0243c;border-color:rgba(224,36,60,.45)}
#cpBar #cpPaste:not(:disabled){background:var(--green);border-color:var(--green);color:#052e1c}
.dsel select{padding:7px 6px;font-size:13px;border-radius:9px}
.sh tr.hd td.hn{white-space:nowrap;min-width:250px}
.sh td.c-n{text-align:center}
.sh td.y{background:#ffd400;color:#2b2200;font-weight:800}
.sh td.clash{background:repeating-linear-gradient(45deg,#e0243c,#e0243c 7px,#8f1226 7px,#8f1226 14px);color:#fff;font-weight:900}
.clb{background:#e0243c;color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:900}
.ban-add{display:inline-flex;width:34px;height:34px;border-radius:10px;border:1px dashed #3a4a70;align-items:center;justify-content:center;color:var(--dim);font-size:18px}
.sh tr.rsel td{outline:2px solid #ff9800;outline-offset:-2px;filter:brightness(1.25)}
#rwBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));width:min(94vw,540px);z-index:9000;display:none;align-items:center;gap:8px;background:#1b2440;border:1px solid #3a4a70;border-radius:16px;padding:10px 10px 10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#rwBar.show{display:flex}
#rwInfo{flex:1;min-width:0;font-size:12.5px;font-weight:700;line-height:1.35}#rwInfo small{display:block;color:var(--dim);font-weight:600;font-size:11px}
#rwBar button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 13px;font-weight:850;font-size:13px}
#rwBar button:disabled{opacity:.5}
.dhin{padding:4px 10px}.dhin b{font-size:12.5px}.dhin small{font-size:10px}
.dhin button{width:26px;height:26px;font-size:17px;border-radius:8px}
.sh tr.hd td{padding:4px 6px;font-size:10.5px}
.clb{font-size:10.5px;padding:2px 8px}
.sh td.clash{background:#05070c;color:#ff5470;font-weight:900}
.sh tr.rsel td:first-child{touch-action:none;cursor:grab}
.sh tr.dragging td{opacity:.3}
#dgGhost{position:fixed;left:12px;right:12px;z-index:9500;pointer-events:none;background:#ff9800;color:#1a1200;border-radius:12px;padding:9px 14px;font-weight:850;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dgLine{position:fixed;left:0;right:0;height:4px;background:#ff9800;z-index:9400;pointer-events:none;border-radius:2px;box-shadow:0 0 10px #ff9800}
/* theme-aware (works in light and dark) */
.sh td{background:var(--bg);color:var(--text);border-color:var(--line)}
.sh td.clash{background:var(--bg);color:#e0243c}
.sh .ph{color:var(--dim);opacity:.8}
.sh td.c-c{color:var(--dim)}
.sh td.pz{color:#0e9f5a}.sh td.pz.y{color:#2b2200}
.sh td.sel,.sh tr.rsel td{outline:3px solid #ff9800;outline-offset:-3px;filter:none;background-image:linear-gradient(rgba(255,152,0,.22),rgba(255,152,0,.22))}
.sh td.g,.sh td.r,.sh td.y,.sh td.b,.sh td.o{background-image:none}
.sh td.sel.g,.sh td.sel.r,.sh td.sel.y{background-image:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28))}
#cpBar,#rwBar{background:var(--surface);border-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.warn{background:rgba(224,36,60,.1);border-color:rgba(224,36,60,.45);color:var(--text)}
.ban-add{border-color:var(--line)}
.fnr .pos{color:#0e9f5a}.fnr .neg{color:#e0243c}
.pdel{border-color:rgba(224,36,60,.5);color:#e0243c}
.pc.on,.tchip.on{color:#1a1200}
.sh td{padding:4px 8px}
.sh tr.hd td{padding:3px 6px}
.sh td img{width:28px;height:28px;border-radius:6px}
.ban-add{width:24px;height:24px;font-size:15px;border-radius:7px}
.sh td.tr svg{width:16px;height:16px}
.dhin{padding:3px 10px}
.tw{touch-action:pan-x pan-y}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.calh b{font-size:14px}
.calh button{width:32px;height:28px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;font-weight:800}
.calw,.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calw span{font-size:10.5px;color:var(--dim);font-weight:800;padding-bottom:2px}
.cd{height:28px;border-radius:8px;border:none;background:transparent;color:var(--text);font-size:12.5px;font-weight:700}
.cd.on{background:#ff9800;color:#1a1200;font-weight:900}.cd.td{box-shadow:inset 0 0 0 1px #ff9800}
.pq{padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:800}
.pq.on{background:#2f66d0;border-color:#2f66d0;color:#fff}
.fsm{display:block;font-size:9.5px;font-weight:600;opacity:.75}

.shr select{background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:7px;font-weight:800;font-size:12px}.shr button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--red)}
.tuc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6}.tuc.dim{color:var(--dim)}
.tuv{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:11px;background:#e0243c;color:#fff;font-weight:850;font-size:13px;text-decoration:none}
body.ro #fab,body.ro #bgChange,body.ro #bgRemove,body.ro .ban-add,body.ro .bplus{display:none!important}

<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const BUCKET='schedule-banners';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let sb=null; try{ sb=window.supabaseClient||window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v)||0;
const fmt=n=>Math.round(n).toLocaleString('en-US');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2800);}

let funds=[]; const curF=()=>funds.filter(f=>f.team_id===tid);
let uid=null, entries=[], teams=[], tid=null, ym=null;
const cur=()=>entries.filter(e=>e.team_id===tid);           // ym = 'YYYY-MM' currently shown
let editing=null;                            // entry being edited (null = new)
let banUrl='', banFile=null, banOld='';      // banner state inside the sheet
const todayStr=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();

const monthOf=d=>String(d).slice(0,7);
function monthLabel(k){const [y,m]=k.split('-');return MONTHS[+m-1].slice(0,3).toUpperCase()+' '+y.slice(2);}
function dayLabel(d){const [y,m,dd]=d.split('-').map(Number);const w=WD[new Date(y,m-1,dd).getDay()];return {t:dd+' '+MONTHS[m-1]+', '+String(y).slice(2),w};}
function timeLabel(t){if(!t)return '—';const [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';const hh=h%12||12;return hh+(m?':'+String(m).padStart(2,'0'):'')+' '+ap;}
function safeImg(u){return typeof u==='string'&&u.startsWith(SUPABASE_URL+'/storage/')?u:'';}

// ---------- render ----------
function cmpTime(a,b){ const pa=a.pos,pb=b.pos; if(pa!=null&&pb!=null&&+pa!==+pb)return +pa-+pb; if(pa!=null&&pb==null)return -1; if(pa==null&&pb!=null)return 1; const tk=t=>t?tkey(t):'99:99'; return tk(a.entry_time).localeCompare(tk(b.entry_time))||String(a.created_at).localeCompare(String(b.created_at)); }
function tkey(t){ if(!t)return ''; const h=+t.slice(0,2); return String(h<6?h+24:h).padStart(2,'0')+t.slice(2,5); }
function monthKeys(){
  const s=new Set(cur().map(e=>monthOf(e.entry_date))); s.add(todayStr.slice(0,7));
  return [...s].sort().reverse();
}
function render(){
  const _o=document.querySelector('.tw'), _sx=_o?_o.scrollLeft:0;
  const T=teams.find(t=>t.id===tid)||{name:''};
  $('teams').innerHTML=teams.map(t=>`<button type="button" class="tchip ${t.id===tid?'on':''}" data-t="${t.id}">${!LINKONLY&&t.user_id!==uid?'👥 ':''}${esc(t.name)}</button>`).join('')+(LINKONLY?'':'<button type="button" class="tchip" id="tAdd">＋ Team</button>');
  $('tName').textContent=T.name?(T.name+' SCHEDULE').toUpperCase():'NO TEAM — TAP ＋ TEAM';
  const lu=cur().map(e=>e.updated_at||e.created_at||'').sort().pop();
  $('tUpd').textContent='last updated : '+(lu?new Date(lu).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—');
  applyRole(); if(!rowSel)rowExtra.clear();
  const keys=monthKeys(); if(!ym||(ym!=='all'&&!keys.includes(ym))) ym=todayStr.slice(0,7);
  $('months').innerHTML=`<button type="button" class="mchip ${ym==='all'?'on':''}" data-m="all">ALL</button>`+keys.map(k=>`<button type="button" class="mchip ${k===ym?'on':''}" data-m="${k}">${monthLabel(k)}</button>`).join('');
  const list=cur().filter(e=>ym==='all'||monthOf(e.entry_date)===ym).sort((a,b)=>a.entry_date.localeCompare(b.entry_date)||cmpTime(a,b));
  const cost=cur().reduce((s,e)=>s+num(e.fee)+num(e.fee_charge),0), paid=cur().reduce((s,e)=>s+(e.fee_paid?num(e.fee)+num(e.fee_charge):0),0);
  const prize=cur().reduce((s,e)=>s+num(e.prize),0), rec=cur().reduce((s,e)=>s+(e.prize_received?num(e.prize):0),0);

async function createEntries(times){
  if(!times.length)return;
  const date=cal.sel||pk.date;
  const ts=times.slice().sort((a,b)=>tkey(a).localeCompare(tkey(b)));
  const day=cur().filter(x=>x.entry_date===date).sort(cmpTime);
  const base=ts.map(t=>({user_id:uid,team_id:tid,entry_date:date,entry_time:t,name:'',fee:0,fee_paid:true,result:'',prize:0,prize_received:true}));
  const posUpd=[];
  if(day.some(x=>x.pos!=null||x.fee_group||x.prize_group)){
    const list=day.map(x=>({e:x}));
    const gx=it=>it.e||it.row;
    base.forEach(row=>{ let at=list.length; for(let i=0;i<list.length;i++){ if(tkey(list[i].e?list[i].e.entry_time:list[i].row.entry_time).localeCompare(tkey(row.entry_time))>0){at=i;break;} }
      // never drop a new row inside a merged (fee/prize) group - put it right after the group
      while(at>0&&at<list.length){ const a=gx(list[at-1]), b=gx(list[at]); if((a.fee_group&&a.fee_group===b.fee_group)||(a.prize_group&&a.prize_group===b.prize_group))at++; else break; }
      list.splice(at,0,{row}); });
    list.forEach((it,k)=>{ const pos=(k+1)*10; if(it.row)it.row.pos=pos; else if(it.e.pos==null||+it.e.pos!==pos)posUpd.push({id:it.e.id,pos}); });
  }
  const ok=await btnRun($('pkGo'),'Adding…','Added ✓',async()=>{
    const r=await sb.from('user_schedule_entries').insert(base).select(); if(r.error)throw r.error;
    const res=await Promise.all(posUpd.map(u=>upd(u.id,{pos:u.pos})));
    const bad=res.find(x=>x.error); if(bad)throw bad.error;
    entries.push(...r.data); res.forEach(x=>{entries=entries.map(y=>y.id===x.data.id?x.data:y);});
    if(ym!=='all')ym=monthOf(date); return true;
  });
  if(ok){closePick();render();}
}

function runOf(e){
  if(!e.fee_group)return [e];
  const day=cur().filter(x=>x.entry_date===e.entry_date).sort(cmpTime); let a=day.findIndex(x=>x.id===e.id),b=a;
  while(a>0&&day[a-1].fee_group===e.fee_group)a--; while(b<day.length-1&&day[b+1].fee_group===e.fee_group)b++;
  return day.slice(a,b+1);
}
function runOfP(e){
  if(!e.prize_group)return [e];
  const day=cur().filter(x=>x.entry_date===e.entry_date).sort(cmpTime); let a=day.findIndex(x=>x.id===e.id),b=a;
  while(a>0&&day[a-1].prize_group===e.prize_group)a--; while(b<day.length-1&&day[b+1].prize_group===e.prize_group)b++;
  return day.slice(a,b+1);
}

const HEXRE=/^#[0-9a-f]{6}$/i;
function cst(e,f){ const c=e&&e.cell_colors&&e.cell_colors[f]; if(!c||!HEXRE.test(c))return ''; const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16); const dark=(0.299*r+0.587*g+0.114*b)<150; return ` style="background:${c}!important;color:${dark?'#fff':'#111'}!important"`; }
const COLORS=['#ffd400','#ff9f1a','#ff5c5c','#3ddc84'];
function hsl2hex(h,sl,l){ sl/=100;l/=100; const k=n=>(n+h/30)%12, a=sl*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join(''); }
const ALLC=(()=>{ const o=['#ffffff','#c9ced8','#8b93a7','#4b5263','#222733','#000000','#7a4a24','#ffd6a5']; [0,25,45,60,90,140,170,200,225,260,290,325].forEach(h=>[82,68,55,42].forEach(l=>o.push(hsl2hex(h,95,l)))); return o.slice(0,56); })();

let CUSTOMC=(()=>{ try{ const a=JSON.parse(localStorage.getItem('mt_custom_colors')||'[]'); return Array.isArray(a)?a.filter(c=>HEXRE.test(c)).slice(0,9):[]; }catch(e){ return []; } })();

function addCustomC(hex){ if(!hex||!HEXRE.test(hex))return; hex=hex.toLowerCase(); if(COLORS.some(c=>c.toLowerCase()===hex))return; CUSTOMC=[hex,...CUSTOMC.filter(c=>c!==hex)].slice(0,9); saveCustomC(); }

// a merged cell stands for all the rows it covers
function expandCells(cs){
  const items=[], seen=new Set();
  cs.forEach(c=>{
    let rows=[c.e];
    if(c.f==='fee'&&c.e.fee_group)rows=runOf(c.e); else if(c.f==='prize'&&c.e.prize_group)rows=runOfP(c.e);
    rows.forEach(r=>{ const k=skey(r.id,c.f); if(!seen.has(k)){seen.add(k);items.push({row:r,f:c.f});} });
  });
  return items;
}
function patchFor(it){
  const r=it.row, o={...cellVal(r,it.f).p};
  if(it.f==='fee'){ o.fee_charge=num(r.fee_charge); o.__g=r.fee_group||null; }
  if(it.f==='prize'){ o.__g=r.prize_group||null; }
  return o;
}
$('cpCopy').addEventListener('click',()=>{
  const cs=selCells(); if(!cs.length)return;
  const items=expandCells(cs);
  if(items.length===1){ const c=cellVal(items[0].row,items[0].f); clip={simple:true,f:items[0].f,patch:c.p,label:c.l}; }
  else{
    const dates=new Set(items.map(it=>it.row.entry_date)); if(dates.size>1){toast('Copy cells from one day at a time.');return;}
    const day=cur().filter(x=>x.entry_date===items[0].row.entry_date).sort(cmpTime);
    const idx=items.map(it=>day.findIndex(x=>x.id===it.row.id)), min=Math.min(...idx);
    clip={simple:false,items:items.map((it,k)=>({dr:idx[k]-min,f:it.f,patch:patchFor(it)}))};
    const nr=Math.max(...idx)-min+1, nf=new Set(items.map(it=>it.f)).size;
    clip.label=nr+' row'+(nr>1?'s':'')+' × '+nf+' column'+(nf>1?'s':'');
  }
  sel=new Set(); updateBar(); render(); toast('Copied ✓ — now select where to paste');
});
$('cpPaste').addEventListener('click',async()=>{
  const cs=selCells(); if(!clip||!cs.length)return;
  const patches={};   // rowId -> patch
  const add=(id,p)=>{ patches[id]=Object.assign(patches[id]||{},p); };
  if(clip.simple){
    expandCells(cs.filter(c=>c.f===clip.f)).forEach(it=>{
      const p={...clip.patch};
      if(clip.f==='type'&&/^scrim$/i.test(p.type||'')&&(it.row.maps==null||it.row.maps===''))p.maps=3;
      add(it.row.id,p);
    });
    if(!Object.keys(patches).length)return;
  }else{
    // block: starts at the top-most selected row
    const rowsSel=cs.map(c=>c.e).sort((a,b)=>a.entry_date.localeCompare(b.entry_date)||cmpTime(a,b)), first=rowsSel[0];
    const day=cur().filter(x=>x.entry_date===first.entry_date).sort(cmpTime), start=day.findIndex(x=>x.id===first.id);
    const gmap={};
    for(const it of clip.items){
      const tr=day[start+it.dr]; if(!tr){toast('Not enough rows below. Add rows first or pick a higher row.');return;}
      const p={...it.patch}, g=p.__g; delete p.__g;
      if(it.f==='fee'){ if(g){gmap['f'+g]=gmap['f'+g]||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+g); p.fee_group=gmap['f'+g];} else if(tr.fee_group){p.fee_group=null;} else delete p.fee_charge; if(!g&&tr.fee_group)p.fee_charge=0; }
      if(it.f==='prize'){ if(g){gmap['p'+g]=gmap['p'+g]||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+g); p.prize_group=gmap['p'+g];} else if(tr.prize_group){p.prize_group=null;} }
      if(it.f==='type'&&/^scrim$/i.test(p.type||'')&&(tr.maps==null||tr.maps===''))p.maps=3;
      add(tr.id,p);
    }
  }
  const ids=Object.keys(patches);
  const ok=await btnRun($('cpPaste'),'Pasting…','Pasted ✓',async()=>{
    const olds=ids.map(id=>{ const x=entries.find(y=>y.id===id); return (patches[id].banner_url!==undefined&&x&&x.banner_url&&x.banner_url!==patches[id].banner_url)?x.banner_url:null; }).filter(Boolean);
    const res=await Promise.all(ids.map(id=>upd(id,patches[id])));
    res.forEach(r=>{entries=entries.map(x=>x.id===r.data.id?r.data:x);}); olds.forEach(u=>dropBanner(u)); return true;
  });
  if(ok)exitSel();
});

$('cpClear').addEventListener('click',async()=>{

  const patches={}, add=(id,p)=>{ patches[id]=Object.assign(patches[id]||{},p); };
  expandCells(cs).forEach(it=>{
    const r=it.row, f=it.f;

    const olds=ids.map(id=>{ const x=entries.find(y=>y.id===id); return (patches[id].banner_url===null&&x&&x.banner_url)?x.banner_url:null; }).filter(Boolean);
    const res=await Promise.all(ids.map(id=>upd(id,patches[id])));
    res.forEach(r=>{entries=entries.map(x=>x.id===r.data.id?r.data:x);}); olds.forEach(u=>dropBanner(u)); return true;

});

// shrink big phone photos before uploading (keeps storage + loading small)
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const max=900, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error('Image error')),'image/jpeg',0.82);
    };
    img.onerror=()=>rej(new Error('Could not read that image'));
    img.src=u;
  });
}

function renderFunds(){
  const l=curF().slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  $('fnList').innerHTML=l.length?l.map(f=>`<div class="fnr"><div><b class="${num(f.amount)>=0?'pos':'neg'}">${num(f.amount)>0?'+':''}${fmt(num(f.amount))}</b><span>${esc(f.note||'')}</span><small>${new Date(f.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</small></div><button type="button" data-fd="${f.id}" aria-label="Remove">✕</button></div>`).join(''):'<div style="color:var(--dim);font-size:13px">Nothing added yet.</div>';
}
$('sBalCard').addEventListener('click',()=>{ if(RO)return; if(!tid){openT('new');return;} $('fnAmt').value='';$('fnNote').value='';renderFunds();$('ovF').classList.add('show'); });
$('fnClose').addEventListener('click',()=>$('ovF').classList.remove('show'));
$('ovF').addEventListener('click',e=>{if(e.target.id==='ovF')$('ovF').classList.remove('show');});
async function addFund(sign){
  const a=Math.max(0,num($('fnAmt').value)); if(!a){toast('Write an amount.');return;}
  await btnRun($(sign>0?'fnAdd':'fnSub'),sign>0?'Adding…':'Deducting…',sign>0?'Added ✓':'Done ✓',async()=>{
    const r=await sb.from('user_schedule_funds').insert({user_id:uid,team_id:tid,amount:sign*a,note:$('fnNote').value.trim().slice(0,60)||null}).select().single();
    if(r.error)throw r.error;
    funds.push(r.data); $('fnAmt').value='';$('fnNote').value=''; renderFunds(); render(); return true;
  });
}
$('fnAdd').addEventListener('click',()=>addFund(1));
$('fnSub').addEventListener('click',()=>addFund(-1));
$('fnList').addEventListener('click',async e=>{
  const b=e.target.closest('[data-fd]'); if(!b)return;
  const f0=funds.find(f=>f.id===b.dataset.fd);
  if(!await askConfirm(f0?((num(f0.amount)>0?'+':'')+fmt(num(f0.amount))+(f0.note?' · '+f0.note:'')):'','Remove from history?','Remove'))return;
  const r=await sb.from('user_schedule_funds').delete().eq('id',b.dataset.fd); if(r.error){toast('Failed: '+r.error.message);return;}
  funds=funds.filter(f=>f.id!==b.dataset.fd); renderFunds(); render();
});

// nice in-page confirm box (replaces the browser's own "…says" box)
let _cf=null;
function askConfirm(msg,title,yes){
  return new Promise(res=>{
    $('cfTitle').textContent=title||'Are you sure?'; $('cfMsg').textContent=msg; $('cfYes').textContent=yes||'Delete';
    $('ovCf').classList.add('show'); _cf=res;
  });
}
function _cfDone(v){ $('ovCf').classList.remove('show'); const r=_cf; _cf=null; if(r)r(v); }
$('cfYes').addEventListener('click',()=>_cfDone(true)); $('cfNo').addEventListener('click',()=>_cfDone(false));
$('ovCf').addEventListener('click',e=>{ if(e.target.id==='ovCf')_cfDone(false); });
// lock the page behind any open popup
(function(){
  const upd=()=>{ const on=!!document.querySelector('.ov.show'); document.body.classList.toggle('lock',on); document.documentElement.classList.toggle('lock',on); };
  new MutationObserver(upd).observe(document.body,{subtree:true,attributes:true,attributeFilter:['class']}); upd();
  document.addEventListener('touchmove',e=>{ if(document.body.classList.contains('lock')&&!e.target.closest('.sheet,#ddMenu'))e.preventDefault(); },{passive:false});
})();
// cursor goes to the END of the value when you tap an input
(function(){
  const toEnd=el=>{ if(!el||!/^(INPUT|TEXTAREA)$/.test(el.tagName)||el.readOnly||/checkbox|radio|file|time|date/.test(el.type))return; setTimeout(()=>{ try{ const v=el.value; el.value=''; el.value=v; if(el.setSelectionRange&&el.type!=='number')el.setSelectionRange(v.length,v.length); }catch(e){} },0); };
  document.addEventListener('focusin',e=>toEnd(e.target));
  document.addEventListener('click',e=>{ if(e.target===document.activeElement)toEnd(e.target); });
})();
// ---------- sharing + roles ----------
let RO=false, LINKONLY=false, myRoles={}, isAdm=false, tut=null, shareRows=[];
function roleOfTeam(t){ if(LINKONLY)return 'view'; if(!t||t.user_id===uid)return 'owner'; return myRoles[t.id]||'view'; }
function applyRole(){
  const t=teams.find(x=>x.id===tid), role=roleOfTeam(t); RO=role==='view';
  document.body.classList.toggle('ro',RO);
  $('tEdit').style.display=role==='owner'?'':'none'; $('tShare').style.display=role==='owner'?'':'none';
  if(role!=='owner'&&t)$('tUpd').innerHTML=esc($('tUpd').textContent)+'<span class="rotag">'+(role==='edit'?'Editor':'View only')+'</span>';
}
const setupMsg=er=>/function|relation|schema cache|does not exist|column|policy/i.test(String(er&&er.message))?'Run schedule_extras.sql in Supabase first.':'Failed: '+(er&&er.message||er);
const shareLink=()=>location.origin+location.pathname+'?t='+tid;
function renderShares(){
  const t=teams.find(x=>x.id===tid); if(!t)return;
  $('shLink').value=shareLink(); $('shLinkOff').style.display=t.link_view?'none':''; $('shLinkOn').style.display=t.link_view?'':'none';
  $('shList').innerHTML=shareRows.length?shareRows.map(r=>`<div class="shr"><div><b>${esc(r.full_name||'User')}</b><span>UID #${esc(r.user_number||'?')}</span></div><button type="button" class="ddb" data-rs="${r.user_id}" data-val="${r.role}">${r.role==='edit'?'Editor':'Viewer'}</button><button type="button" data-sd="${r.user_id}" aria-label="Remove">✕</button></div>`).join(''):'<div style="color:var(--dim);font-size:13px;padding:6px 0">No one added yet.</div>';
}
async function loadShares(){ const r=await sb.rpc('sched_share_list',{p_team:tid}); if(r.error){toast(setupMsg(r.error));shareRows=[];}else shareRows=r.data||[]; renderShares(); }
$('tShare').addEventListener('click',()=>{ if(!tid)return; $('shUid').value=''; $('ovS').classList.add('show'); renderShares(); loadShares(); });
document.querySelectorAll('.shtab').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('.shtab').forEach(x=>x.classList.toggle('on',x===b)); $('shPaneLink').style.display=b.dataset.st==='link'?'':'none'; $('shPaneUid').style.display=b.dataset.st==='uid'?'':'none'; }));
$('shClose').addEventListener('click',()=>$('ovS').classList.remove('show'));
$('ovS').addEventListener('click',e=>{if(e.target.id==='ovS')$('ovS').classList.remove('show');});
async function setLink(on){
  const t=teams.find(x=>x.id===tid); const r=await sb.from('user_schedule_teams').update({link_view:on}).eq('id',tid);
  if(r.error){ toast(setupMsg(r.error)); return false; } t.link_view=on; renderShares(); return true;
}
$('shGet').addEventListener('click',async()=>{ if(await setLink(true)){ try{ await navigator.clipboard.writeText(shareLink()); toast('Link copied ✓'); }catch(e){} } });
$('shOff').addEventListener('click',()=>setLink(false));
$('shCopy').addEventListener('click',async()=>{
  const v=shareLink(); try{ await navigator.clipboard.writeText(v); toast('Link copied ✓'); }catch(e){ $('shLink').select(); try{document.execCommand('copy');toast('Link copied ✓');}catch(_){toast('Copy the link manually');} }
});
$('shAdd').addEventListener('click',async()=>{
  const n=$('shUid').value.trim(); if(!n){toast('Write a UID.');return;}
  await btnRun($('shAdd'),'Adding…','Added ✓',async()=>{
    const f=await sb.rpc('sched_find_user',{p_uid:n}); if(f.error)throw f.error;
    const u=(f.data||[])[0]; if(!u){toast('No user with that UID.');return false;}
    if(u.id===uid){toast('That is your own UID.');return false;}
    const r=await sb.from('user_schedule_shares').upsert({team_id:tid,user_id:u.id,role:$('shRole').dataset.val},{onConflict:'team_id,user_id'}); if(r.error)throw r.error;
    $('shUid').value=''; await loadShares(); return true;
  });
});
const ROLES=[['view','Viewer'],['edit','Editor']];
function closeDD(){ const m=$('ddMenu'); if(m)m.remove(); document.querySelectorAll('.ddb.open').forEach(x=>x.classList.remove('open')); }
function openDD(btn,opts,cur,onPick){
  closeDD(); const m=document.createElement('div'); m.className='ddm'; m.id='ddMenu';
  m.innerHTML=opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===cur?'on':''}">${l}<span>${v===cur?'✓':''}</span></button>`).join('');
  document.body.appendChild(m);
  const r=btn.getBoundingClientRect(), w=Math.max(r.width,150); m.style.width=w+'px';
  const mh=m.offsetHeight; let top=r.bottom+6; if(top+mh>innerHeight-10)top=Math.max(10,r.top-mh-6);
  m.style.top=top+'px'; m.style.left=Math.min(Math.max(8,r.right-w),innerWidth-w-8)+'px';
  m.addEventListener('click',e=>{ const b=e.target.closest('button[data-v]'); if(!b)return; closeDD(); onPick(b.dataset.v); });
  btn.classList.add('open');
}
document.addEventListener('click',e=>{ if(!e.target.closest('#ddMenu')&&!e.target.closest('.ddb'))closeDD(); },true);
window.addEventListener('resize',closeDD);
$('shRole').addEventListener('click',e=>{ const b=e.currentTarget; if(b.classList.contains('open')){closeDD();return;} openDD(b,ROLES,b.dataset.val,v=>{ b.dataset.val=v; b.textContent=v==='edit'?'Editor':'Viewer'; }); });
$('shList').addEventListener('click',async e=>{
  const d=e.target.closest('[data-rs]');
  if(d){
    if(d.classList.contains('open')){closeDD();return;}
    openDD(d,ROLES,d.dataset.val,async v=>{
      if(v===d.dataset.val)return;
      const r=await sb.from('user_schedule_shares').update({role:v}).eq('team_id',tid).eq('user_id',d.dataset.rs);
      if(r.error){toast(setupMsg(r.error));return;}
      const row=shareRows.find(x=>x.user_id===d.dataset.rs); if(row)row.role=v; d.dataset.val=v; d.textContent=v==='edit'?'Editor':'Viewer'; toast('Saved ✓');
    });
    return;
  }
  const b=e.target.closest('[data-sd]'); if(!b)return;
  const r=await sb.from('user_schedule_shares').delete().eq('team_id',tid).eq('user_id',b.dataset.sd);
  if(r.error){toast(setupMsg(r.error));return;} await loadShares();
});

// ---------- tutorial (💡) ----------
function renderTut(edit){
  const c=(tut&&tut.content)||'', v=(tut&&tut.video_url)||'';
  if(edit){
    $('tuBody').innerHTML=`<div class="fld"><label>Tutorial text</label><textarea id="tuTxt" rows="10" maxlength="5000">${esc(c)}</textarea></div><div class="fld"><label>Video link (optional, https)</label><input id="tuVid" value="${esc(v)}" placeholder="https://youtube.com/…"></div>`;
    $('tuActs').innerHTML='<button type="button" id="tuCancel">Cancel</button><button type="button" class="save" id="tuSave">Save</button>';
  }else{
    $('tuBody').innerHTML=(c?`<div class="tuc">${esc(c)}</div>`:'<div class="tuc dim">Tutorial coming soon.</div>')+(/^https:\/\//i.test(v)?`<a class="tuv" href="${esc(v)}" target="_blank" rel="noopener noreferrer">▶ Watch video</a>`:'');
    $('tuActs').innerHTML=(isAdm?'<button type="button" id="tuEdit">✎ Edit tutorial</button>':'')+'<button type="button" id="tuClose">Close</button>';
  }
}
$('tipBtn').addEventListener('click',async()=>{
  $('ovU').classList.add('show'); renderTut(false);
  try{ const r=await sb.from('schedule_tutorial').select('*').eq('id',1).maybeSingle(); tut=r.error?null:r.data; renderTut(false); }catch(e){}
});
$('ovU').addEventListener('click',async e=>{
  if(e.target.id==='ovU'||e.target.id==='tuClose'){ $('ovU').classList.remove('show'); return; }
  if(e.target.id==='tuEdit'){ renderTut(true); return; }
  if(e.target.id==='tuCancel'){ renderTut(false); return; }
  if(e.target.id==='tuSave'){
    const row={id:1,content:$('tuTxt').value.slice(0,5000),video_url:$('tuVid').value.trim()||null,updated_at:new Date().toISOString()};
    if(row.video_url&&!/^https:\/\//i.test(row.video_url)){toast('Video link must start with https://');return;}
    await btnRun($('tuSave'),'Saving…','Saved ✓',async()=>{
      const r=await sb.from('schedule_tutorial').upsert(row); if(r.error)throw r.error;
      tut=row; renderTut(false); return true;
    });
  }
});

// ---------- start ----------
function gate(html){ $('gate').style.display='block'; $('main').style.display='none'; $('fab').style.display='none'; $('gate').innerHTML=html; }
(async function init(){
  if(!sb){ gate('Could not connect. Please try again.'); return; }
  try{
    const qT=new URLSearchParams(location.search).get('t');
    const {data:{session}}=await sb.auth.getSession();
    if(session)uid=session.user.id;
    let viaLink=false;
    if(session){
      const r=await sb.from('user_schedule_entries').select('*').order('entry_date',{ascending:true}).limit(3000);
      if(r.error){
        const m=String(r.error.message||'');
        gate(/relation .*user_schedule_entries|schema cache/i.test(m)?'This feature is being set up.<br>Please check back soon.':'Could not load your schedule.<br><small>'+esc(m)+'</small>');
        return;
      }
      entries=r.data||[];
      const tr=await sb.from('user_schedule_teams').select('*').order('created_at',{ascending:true});
      if(tr.error){ gate('This feature is being set up.<br>Please check back soon.'); return; }
      teams=(tr.data||[]).sort((a,b)=>(b.user_id===uid)-(a.user_id===uid));
      const fr=await sb.from('user_schedule_funds').select('*').order('created_at',{ascending:true}); funds=fr.error?[]:(fr.data||[]);
      try{ const sr=await sb.from('user_schedule_shares').select('team_id,role').eq('user_id',uid); (sr.data||[]).forEach(x=>{myRoles[x.team_id]=x.role;}); }catch(e){}
      try{ const pr=await sb.from('profiles').select('is_admin,is_owner').eq('id',uid).maybeSingle(); isAdm=!!(pr.data&&(pr.data.is_admin||pr.data.is_owner)); }catch(e){}
      if(qT&&!teams.find(t=>t.id===qT))viaLink=true;
    }
    if(!session&&!qT){ gate('Please log in to manage your tournament schedule.<br><br><a href="chteo_auth.html">Login / Register</a>'); return; }
    if(!session||viaLink){
      const lr=await sb.rpc('sched_link_view',{p_team:qT});
      if(lr.error||!lr.data){ gate(session?'This schedule is private, or the link is wrong.':'This schedule is private.<br><br>Please <a href="chteo_auth.html">log in</a> if you were given access.'); return; }
      LINKONLY=true; teams=[lr.data.team]; entries=lr.data.entries||[]; funds=lr.data.funds||[]; tid=lr.data.team.id;
    }else{
      tid=(qT&&teams.find(t=>t.id===qT))?qT:(teams.length?teams[0].id:null);
      if(tid&&roleOfTeam(teams.find(t=>t.id===tid))==='owner'&&entries.some(e=>!e.team_id)){ await sb.from('user_schedule_entries').update({team_id:tid}).is('team_id',null); entries.forEach(e=>{if(!e.team_id)e.team_id=tid;}); }
    }
    $('gate').style.display='none'; $('main').style.display='block'; $('fab').style.display='block';
    render();
    window.scrollTo(0,0); if(!tid&&!LINKONLY) openT('new');
  }catch(e){ console.error(e); gate('Something went wrong. Please try again.'); }
})();
</script>
