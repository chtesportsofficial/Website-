<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Language</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0b0d14;
    --card: #141826;
    --card-border: #232838;
    --accent: #7c5cff;
    --text-primary: #f2f3f7;
    --text-secondary: #8b8fa3;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    font-family:'Inter','Hind Siliguri',sans-serif;
    color:var(--text-primary);
  }

  .screen{
    width:100%;
    max-width:380px;
    min-height:100vh;
    background:var(--bg);
    padding:20px 18px 28px;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
  }

  .back-btn{
    width:38px; height:38px;
    border-radius:12px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-primary);
    cursor:pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .back-btn:hover{ background:#1a2032; }
  .back-btn:active{ transform:scale(0.94); }

  .topbar h1{
    font-size:18px;
    font-weight:700;
    letter-spacing:0.3px;
  }

  .subtitle{
    font-size:13px;
    color:var(--text-secondary);
    margin:4px 2px 16px;
    font-weight:500;
  }

  .options{ display:flex; flex-direction:column; gap:12px; }

  .option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:16px 18px;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease, transform .12s ease;
  }
  .option:hover{ border-color:#33395038; background:#171b2b; }
  .option:active{ transform:scale(0.985); }

  .option.selected{
    border-color:var(--accent);
    background:var(--card);
  }

  .option-text .native{
    font-size:15.5px;
    font-weight:600;
    margin-bottom:2px;
  }
  .option-text .english{
    font-size:12.5px;
    color:var(--text-secondary);
    font-weight:500;
  }

  .radio{
    width:20px; height:20px;
    border-radius:50%;
    border:2px solid var(--card-border);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .2s ease;
  }
  .option.selected .radio{
    border-color:var(--accent);
  }
  .radio-dot{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--accent);
    transform:scale(0);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .option.selected .radio-dot{ transform:scale(1); }

  .confirm-btn{
    width:100%;
    margin-top:26px;
    padding:15px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition: filter .2s ease, transform .12s ease;
    font-family:inherit;
  }
  .confirm-btn:hover{ filter:brightness(1.08); }
  .confirm-btn:active{ transform:scale(0.98); }
</style>
<style>
:root{
  --bg: var(--g-bg);
  --card: var(--g-surface);
  --card-border: var(--g-border);
  --text-primary: var(--g-text);
  --text-secondary: var(--g-muted);
}
</style>

</head>
<body>

<div class="screen">
  <div class="topbar">
    <div class="back-btn" onclick="history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </div>
    <h1 data-i18n="lang.title">LANGUAGE</h1>
  </div>

  <p class="subtitle" data-i18n="lang.subtitle">Select Language</p>

  <div class="options" id="optionsList">
    <div class="option selected" data-lang="en">
      <div class="option-text">
        <div class="native">English</div>
        <div class="english">English</div>
      </div>
      <div class="radio"><div class="radio-dot"></div></div>
    </div>

    <div class="option" data-lang="bn">
      <div class="option-text">
        <div class="native">বাংলা</div>
        <div class="english">Bengali</div>
      </div>
      <div class="radio"><div class="radio-dot"></div></div>
    </div>
  </div>

</div>

<script>
  const options = document.querySelectorAll('.option');

  function markSelected(lang){
    options.forEach(o => o.classList.toggle('selected', o.getAttribute('data-lang') === lang));
  }

  options.forEach(opt => {
    opt.addEventListener('click', () => {
      const lang = opt.getAttribute('data-lang');
      markSelected(lang);
      // Persist + apply immediately across the whole site (localStorage-backed)
      if(window.CHTEO && window.CHTEO.setLangPref){
        window.CHTEO.setLangPref(lang);
      }
    });
  });

  // Reflect whatever language is already active (persists across pages/refresh)
  document.addEventListener('DOMContentLoaded', function(){
    if(window.CHTEO && window.CHTEO.getLangPref){
      markSelected(window.CHTEO.getLangPref());
    }
  });

  // Fix: force a fresh load if this page itself is restored from bfcache
  // on Back navigation, so the selected-language radio stays accurate.
  window.addEventListener('pageshow', function(event){
    if (event.persisted) {
      location.reload();
    }
  });
</script>

</body>
</html>
