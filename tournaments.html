<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tournaments</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0b0d14;
    --card: #141826;
    --card-border: #232838;
    --accent: #7c5cff;
    --text-primary: #f2f3f7;
    --text-secondary: #8b8fa3;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    font-family:'Inter','Hind Siliguri',sans-serif;
    color:var(--text-primary);
  }

  .screen{
    width:100%;
    max-width:380px;
    min-height:100vh;
    background:var(--bg);
    padding:20px 18px 28px;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
  }
  .topbar h1{flex:1}

  .slot-refresh{flex-shrink:0;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);background:rgba(124,92,255,.1);border:1px solid rgba(124,92,255,.3);cursor:pointer;padding:0}
  .slot-refresh svg{width:13px;height:13px;transition:transform .2s ease}
  .slot-refresh.spinning svg{animation:refresh-spin .7s linear infinite}
  .slot-refresh:disabled{opacity:.55;cursor:default}
  @keyframes refresh-spin{to{transform:rotate(360deg)}}
  .t-cred-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .t-cred-row .t-cred-grid{margin-bottom:0;flex:1;min-width:0}
  .t-pending-note-row{display:flex;align-items:center;justify-content:space-between;gap:8px}

  .back-btn{
    width:44px; height:44px;
    border-radius:12px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-primary);
    cursor:pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .back-btn:hover{ background:#1a2032; }
  .back-btn:active{ transform:scale(0.94); }
  .back-btn svg{ width:20px; height:20px; }

  .topbar h1{
    font-size:19px;
    font-weight:750;
    letter-spacing:0.3px;
  }

  .empty-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
  }

  .empty-icon{
    width:74px; height:74px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    color:var(--text-secondary);
  }
  .empty-icon svg{ width:34px; height:34px; }

  .empty-title{
    font-size:16.5px;
    font-weight:700;
    margin-bottom:8px;
  }
  .empty-sub{
    font-size:13px;
    color:var(--text-secondary);
    line-height:1.6;
    max-width:260px;
    margin-bottom:26px;
  }

  .browse-btn{
    padding:13px 26px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition: filter .2s ease, transform .12s ease;
  }
  .browse-btn:hover{ filter:brightness(1.08); }
  .browse-btn:active{ transform:scale(0.97); }

  .loading-wrap{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:13px;padding:60px 20px;}

  .filter-bar{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
  .filter-bar::-webkit-scrollbar{display:none;}
  .filter-chip{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .15s ease,color .15s ease;}
  .filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .filter-date-wrap{flex-shrink:0;position:relative;width:36px;height:34px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;}
  .filter-date-wrap.active{background:var(--accent);border-color:var(--accent);}
  .filter-date-icon{width:16px;height:16px;color:var(--text-secondary);pointer-events:none;}
  .filter-date-wrap.active .filter-date-icon{color:#fff;}
  .filter-date-input{position:absolute;inset:0;width:100%;height:100%;padding:0;margin:0;border:none;background:transparent;opacity:0;cursor:pointer;}
  .filter-date-input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;}

  .filter-empty{text-align:center;color:var(--text-secondary);font-size:13px;padding:50px 20px;}

  .t-list{display:flex;flex-direction:column;gap:14px;}

  .t-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;overflow:hidden;}
  .t-banner{width:100%;aspect-ratio:16/7;object-fit:cover;display:block;background:#0d1320;}
  .t-card-body{padding:14px 15px 15px;}
  .t-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:2px;}
  .t-org{font-size:10.5px;color:var(--text-secondary);margin-bottom:10px;}

  .t-lobby-row{display:flex;align-items:center;justify-content:space-between;background:rgba(124,92,255,.08);border:1px solid var(--card-border);border-radius:11px;padding:9px 12px;margin-bottom:10px;}
  .t-lobby-time{font-size:12.5px;font-weight:700;color:var(--text-primary);}
  .t-lobby-date{font-size:10px;color:var(--text-secondary);margin-top:1px;}
  .t-status{font-size:9.5px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:.02em;white-space:nowrap;}
  .t-status.confirmed{background:rgba(46,204,113,.14);color:#3ddc84;}
  .t-status.pending{background:rgba(255,183,3,.14);color:#ffb703;}
  .t-status.cancelled{background:rgba(231,76,60,.14);color:#ff5c4d;}

  .t-pending-note{font-size:11px;color:var(--text-secondary);background:rgba(255,183,3,.06);border:1px dashed rgba(255,183,3,.35);border-radius:10px;padding:10px 11px;margin-bottom:2px;line-height:1.55;}

  .t-slots{display:flex;flex-direction:column;gap:12px;}
  .t-slot{padding-top:12px;}
  .t-slot:first-child{padding-top:0;}
  .t-slot:not(:first-child){border-top:1px dashed var(--card-border);}

  .t-cred-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .t-cred-box{background:var(--bg);border:1px solid var(--card-border);border-radius:10px;padding:8px 10px;min-width:0;}
  .t-cred-label{font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--text-secondary);text-transform:uppercase;margin-bottom:3px;}
  .t-cred-val{display:flex;align-items:center;gap:6px;justify-content:space-between;}
  .t-cred-val span{font-size:12.5px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-cred-val span.muted{color:var(--text-secondary);font-weight:500;font-size:11px;}
  .t-copy-btn{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:1px solid var(--card-border);background:var(--card);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .t-copy-btn svg{width:12px;height:12px;}
  .t-copy-btn.copied{color:#3ddc84;border-color:#3ddc84;}

  .t-result-btn{display:block;width:100%;padding:11px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;letter-spacing:.02em;}
  .t-result-btn:disabled{background:#232838;color:var(--text-secondary);cursor:not-allowed;}
</style>
<style>
:root{
  --bg: var(--g-bg);
  --card: var(--g-surface);
  --card-border: var(--g-border);
  --text-primary: var(--g-text);
  --text-secondary: var(--g-muted);
}
</style>
</head>
<body>

<div class="screen">
  <div class="topbar">
    <button class="back-btn" type="button" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1 data-i18n="myt.title">My Tournaments</h1>
  </div>

  <div class="filter-bar" id="filterBar" style="display:none">
    <button type="button" class="filter-chip active" data-filter="today" data-i18n="myt.filter.today">Today</button>
    <button type="button" class="filter-chip" data-filter="yesterday" data-i18n="myt.filter.yesterday">Yesterday</button>
    <button type="button" class="filter-chip" data-filter="upcoming" data-i18n="myt.filter.upcoming">Upcoming</button>
    <button type="button" class="filter-chip" data-filter="all" data-i18n="myt.filter.all">All</button>
    <div class="filter-date-wrap" id="filterDateWrap">
      <svg class="filter-date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M16 3v4M8 3v4M3 10h18"/>
      </svg>
      <input type="date" class="filter-date-input" id="filterDateInput">
    </div>
  </div>

  <div class="loading-wrap" id="loadingWrap" data-i18n="myt.loading">Loading your tournaments...</div>

  <div class="empty-wrap" id="emptyWrap" style="display:none">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3h12v2h2a3 3 0 0 1-3 3h-.2A6 6 0 0 1 13 12.9V16h3v2H8v-2h3v-3.1A6 6 0 0 1 7.2 8H7a3 3 0 0 1-3-3h2V3z"/>
      </svg>
    </div>
    <div class="empty-title" id="emptyTitle">You haven't joined any tournament</div>
    <div class="empty-sub" id="emptySub">Tournaments you register for will show up here, along with your slot and match details.</div>
    <button class="browse-btn" id="emptyBtn" onclick="window.location.href='index.html'">Browse Tournaments</button>
  </div>

  <div class="filter-empty" id="refreshErrMsg" style="display:none;color:#ff5c4d"></div>

  <div class="t-list" id="listWrap" style="display:none"></div>

  <div class="filter-empty" id="filterEmptyMsg" style="display:none" data-i18n="myt.filterEmpty">No tournaments match this filter.</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function t(key){
  const lang=(window.CHTEO&&CHTEO.getLangPref&&CHTEO.getLangPref())||'bn';
  const dict=(window.CHTEO&&CHTEO.translations&&CHTEO.translations[lang])||{};
  return dict[key]!=null?dict[key]:key;
}

function showEmpty(title,sub,btnText,btnHref){
  document.getElementById('loadingWrap').style.display='none';
  document.getElementById('listWrap').style.display='none';
  const wrap=document.getElementById('emptyWrap');
  document.getElementById('emptyTitle').textContent=title;
  document.getElementById('emptySub').textContent=sub;
  const btn=document.getElementById('emptyBtn');
  btn.textContent=btnText;
  btn.onclick=()=>window.location.href=btnHref;
  wrap.style.display='flex';
}

function copyCred(btn,val){
  if(!val)return;
  navigator.clipboard?.writeText(val).then(()=>{
    btn.classList.add('copied');
    setTimeout(()=>btn.classList.remove('copied'),1200);
  });
}
window.copyCred=copyCred;

function credBox(label,val){
  const has=val&&String(val).trim();
  return `<div class="t-cred-box">
    <div class="t-cred-label">${esc(label)}</div>
    <div class="t-cred-val">
      <span class="${has?'':'muted'}">${has?esc(val):esc(t('myt.cred.notPublished'))}</span>
      ${has?`<button type="button" class="t-copy-btn" onclick="copyCred(this,'${esc(val).replace(/'/g,"&#39;")}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>`:''}
    </div>
  </div>`;
}

let allRows=[];
let currentFilter='today';
let currentCustomDate=null;

function parseLobbyDate(row){
  const ds=row.tournament_lobbies?.lobby_date;
  if(!ds)return null;
  const d=new Date(ds+'T00:00:00');
  return isNaN(d.getTime())?null:d;
}
function isSameDate(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function passesFilter(row){
  if(currentFilter==='all')return true;
  const d=parseLobbyDate(row);
  if(!d)return false;
  const today=new Date(); today.setHours(0,0,0,0);
  if(currentFilter==='today')return isSameDate(d,today);
  if(currentFilter==='yesterday'){
    const y=new Date(today); y.setDate(y.getDate()-1);
    return isSameDate(d,y);
  }
  if(currentFilter==='upcoming')return d.getTime()>today.getTime();
  if(currentFilter==='date')return currentCustomDate&&isSameDate(d,currentCustomDate);
  return true;
}
function extractHourValue(timeLabel){
  const s=String(timeLabel||'');
  const m=s.match(/(\d{1,2})\s*(AM|PM)/i);
  if(!m)return 9999;
  let h=parseInt(m[1],10);
  const ap=m[2].toUpperCase();
  if(ap==='AM'){ if(h===12)h=0; }
  else{ if(h!==12)h+=12; }
  return h*60;
}

function groupRows(rows){
  const map=new Map();
  const order=[];
  rows.forEach(row=>{
    const lobby=row.tournament_lobbies||{};
    const trn=lobby.tournaments||{};
    const key=(trn.id||trn.title||'unknown')+'::'+(lobby.lobby_date||'');
    if(!map.has(key)){
      map.set(key,{title:trn.title||t('myt.defaultTournament'),lobby_date:lobby.lobby_date||'',slotMap:new Map(),slotOrder:[]});
      order.push(key);
    }
    const g=map.get(key);
    const baseKey=lobby.id||(lobby.time_label+'::'+lobby.room_id+'::'+lobby.room_password);
    // A cancelled join and a fresh rejoin can share the same lobby (id
    // unchanged, just turned Off then On again) — keep cancelled rows in
    // their own card so they don't swallow a newer active join into the
    // same "any row cancelled -> whole slot cancelled" bucket.
    const lobbyKey=row.confirmation_status==='cancelled'?baseKey+'::cancelled':baseKey;
    if(!g.slotMap.has(lobbyKey)){
      g.slotMap.set(lobbyKey,{lobby,rows:[],confirmed:false,cancelled:false});
      g.slotOrder.push(lobbyKey);
    }
    const slot=g.slotMap.get(lobbyKey);
    slot.rows.push(row);
    if(row.confirmation_status==='confirmed')slot.confirmed=true;
    if(row.confirmation_status==='cancelled')slot.cancelled=true;
  });
  const groups=order.map(k=>{
    const g=map.get(k);
    const slots=g.slotOrder.map(lk=>g.slotMap.get(lk));
    slots.sort((a,b)=>extractHourValue(a.lobby.time_label)-extractHourValue(b.lobby.time_label));
    return {title:g.title,lobby_date:g.lobby_date,slots};
  });
  return groups;
}

function applyFilter(){
  const listWrap=document.getElementById('listWrap');
  const emptyMsg=document.getElementById('filterEmptyMsg');
  const filtered=allRows.filter(passesFilter);
  if(!filtered.length){
    listWrap.style.display='none';
    emptyMsg.style.display='block';
    return;
  }
  emptyMsg.style.display='none';
  const groups=groupRows(filtered);
  listWrap.innerHTML=groups.map(renderCard).join('');
  listWrap.style.display='flex';
}
function setActiveChip(el){
  document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
  document.getElementById('filterDateWrap').classList.remove('active');
  el.classList.add('active');
}
document.querySelectorAll('.filter-chip[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    setActiveChip(btn);
    currentFilter=btn.dataset.filter;
    currentCustomDate=null;
    document.getElementById('filterDateInput').value='';
    applyFilter();
  });
});
document.getElementById('filterDateInput').addEventListener('change',function(){
  if(!this.value)return;
  document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
  document.getElementById('filterDateWrap').classList.add('active');
  currentFilter='date';
  currentCustomDate=new Date(this.value+'T00:00:00');
  applyFilter();
});

let resultsLobbyIds=new Set();
function renderSlot(slot){
  const lobby=slot.lobby||{};
  const confirmed=slot.confirmed;
  const cancelled=slot.cancelled||lobby.status==='cancelled';
  const timeLabel=esc(lobby.time_label||t('myt.defaultScrim'))+(lobby.custom_title?' · '+esc(lobby.custom_title):'');
  const teamLabel=esc(slot.rows.map(r=>r.team_name).filter(Boolean).join(', '));
  const hasResult=lobby.id&&resultsLobbyIds.has(lobby.id);

  const refreshBtn = `<button type="button" class="slot-refresh" title="${esc(t('myt.refresh'))}" onclick="loadTournaments(true,this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>`;

  const credsOrResult = cancelled ? `
    <div class="t-pending-note">${esc(t('myt.note.cancelled'))}</div>
  ` : confirmed ? `
    <div class="t-cred-row">
      <div class="t-cred-grid">
        ${credBox(t('myt.cred.roomId'),lobby.room_id)}
        ${credBox(t('myt.cred.password'),lobby.room_password)}
      </div>
      ${(!lobby.room_id||!lobby.room_password)?refreshBtn:''}
    </div>
    <button type="button" class="t-result-btn" ${hasResult?`onclick="location.href='lobby-results.html?id=${encodeURIComponent(lobby.id)}'"`:'disabled'}>${hasResult?esc(t('myt.result.view')):esc(t('myt.result.notPublished'))}</button>
  ` : `
    <div class="t-pending-note t-pending-note-row">
      <span>${esc(t('myt.note.pending'))}</span>
      ${refreshBtn}
    </div>
  `;

  return `<div class="t-slot">
    <div class="t-lobby-row">
      <div><div class="t-lobby-time">${timeLabel}</div><div class="t-lobby-date">${teamLabel}</div></div>
      <div class="t-status ${cancelled?'cancelled':confirmed?'confirmed':'pending'}">${cancelled?esc(t('myt.status.cancelled')):confirmed?esc(t('myt.status.confirmed')):esc(t('myt.status.pending'))}</div>
    </div>
    ${credsOrResult}
  </div>`;
}

function renderCard(group){
  return `<div class="t-card">
    <div class="t-card-body">
      <div class="t-title">${esc(group.title||t('myt.defaultTournament'))}</div>
      <div class="t-org">${esc(group.lobby_date)}</div>
      <div class="t-slots">
        ${group.slots.map(renderSlot).join('')}
      </div>
    </div>
  </div>`;
}

let mySession=null;

async function loadTournaments(isRefresh,btnEl){
  const refreshErrMsg=document.getElementById('refreshErrMsg');
  if(isRefresh && btnEl){
    btnEl.disabled=true;
    btnEl.classList.add('spinning');
    refreshErrMsg.style.display='none';
  }

  try{
    if(!mySession){
      let session=null;
      try{
        const r=await sb.auth.getSession();
        session=r?.data?.session||null;
      }catch(e){}
      if(!session){
        showEmpty(t('myt.empty.loginTitle'),t('myt.empty.loginSub'),t('myt.empty.loginBtn'),'chteo_auth.html');
        return;
      }
      mySession=session;
    }

    const {data,error}=await sb.from('lobby_teams')
      .select('*, tournament_lobbies(*, tournaments(id,title,banner_url))')
      .eq('submitted_by',mySession.user.id)
      .order('joined_at',{ascending:false});

    if(error){
      console.error('lobby_teams load error:',error);
      if(isRefresh){
        // A refresh keeps showing whatever was already on screen — swapping
        // the whole page for a full-screen error on a failed refresh would
        // be more disruptive than just leaving the last-known data visible.
        refreshErrMsg.textContent=(error.message||'রিফ্রেশ ব্যর্থ হয়েছে')+(error.hint?' — '+error.hint:'');
        refreshErrMsg.style.display='block';
      }else{
        showEmpty(t('myt.empty.errorTitle'),(error.message||'Unknown error')+(error.hint?' — '+error.hint:''),t('myt.empty.retryBtn'),'tournaments.html');
      }
      return;
    }

    if(!data||!data.length){
      if(isRefresh){
        allRows=[];
        applyFilter();
      }else{
        showEmpty(t('myt.empty.title'),t('myt.empty.sub'),t('myt.empty.browse'),'index.html');
      }
      return;
    }

    const lobbyIds=[...new Set(data.map(r=>r.tournament_lobbies?.id).filter(Boolean))];
    if(lobbyIds.length){
      const {data:resultsData,error:resultsErr}=await sb.from('lobby_results').select('lobby_id').in('lobby_id',lobbyIds);
      if(!resultsErr) resultsLobbyIds=new Set((resultsData||[]).map(r=>r.lobby_id));
    }

    allRows=data;
    document.getElementById('loadingWrap').style.display='none';
    document.getElementById('filterBar').style.display='flex';
    applyFilter();
  } finally {
    // On success the whole list (incl. this button) just got re-rendered by
    // applyFilter() above, so there's nothing left to un-spin. This only
    // actually matters on the error path, where the old DOM is untouched.
    if(isRefresh && btnEl && document.body.contains(btnEl)){
      btnEl.disabled=false;
      btnEl.classList.remove('spinning');
    }
  }
}

loadTournaments(false);

window.addEventListener('pageshow', function(event){
  if (event.persisted) {
    location.reload();
  }
});
</script>
