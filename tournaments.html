<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tournaments</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0b0d14;
    --card: #141826;
    --card-border: #232838;
    --accent: #7c5cff;
    --text-primary: #f2f3f7;
    --text-secondary: #8b8fa3;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    font-family:'Inter','Hind Siliguri',sans-serif;
    color:var(--text-primary);
  }

  .screen{
    width:100%;
    max-width:380px;
    min-height:100vh;
    background:var(--bg);
    padding:20px 18px 28px;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
  }

  .back-btn{
    width:38px; height:38px;
    border-radius:12px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-primary);
    cursor:pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .back-btn:hover{ background:#1a2032; }
  .back-btn:active{ transform:scale(0.94); }

  .topbar h1{
    font-size:18px;
    font-weight:700;
    letter-spacing:0.3px;
  }

  .empty-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
  }

  .empty-icon{
    width:74px; height:74px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    color:var(--text-secondary);
  }
  .empty-icon svg{ width:34px; height:34px; }

  .empty-title{
    font-size:16.5px;
    font-weight:700;
    margin-bottom:8px;
  }
  .empty-sub{
    font-size:13px;
    color:var(--text-secondary);
    line-height:1.6;
    max-width:260px;
    margin-bottom:26px;
  }

  .browse-btn{
    padding:13px 26px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition: filter .2s ease, transform .12s ease;
  }
  .browse-btn:hover{ filter:brightness(1.08); }
  .browse-btn:active{ transform:scale(0.97); }
</style>
<style>
:root{
  --bg: var(--g-bg);
  --card: var(--g-surface);
  --card-border: var(--g-border);
  --text-primary: var(--g-text);
  --text-secondary: var(--g-muted);
}
</style>
</head>
<body>

<div class="screen">
  <div class="topbar">
    <div class="back-btn" onclick="history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </div>
    <h1>My Tournaments</h1>
  </div>

  <div class="empty-wrap">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3h12v2h2a3 3 0 0 1-3 3h-.2A6 6 0 0 1 13 12.9V16h3v2H8v-2h3v-3.1A6 6 0 0 1 7.2 8H7a3 3 0 0 1-3-3h2V3z"/>
      </svg>
    </div>
    <div class="empty-title">You haven't joined any tournament</div>
    <div class="empty-sub">Tournaments you register for will show up here, along with your slot and match details.</div>
    <button class="browse-btn" onclick="window.location.href='index.html'">Browse Tournaments</button>
  </div>

</div>

<script>
  window.addEventListener('pageshow', function(event){
    if (event.persisted) {
      location.reload();
    }
  });
</script>

</body>
</html>
