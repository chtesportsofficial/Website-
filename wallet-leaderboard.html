<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHTEO — Wallet Leaderboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy-1:#1b2140;
    --navy-2:#2a3266;
    --navy-3:#333c7a;
    --white:#ffffff;
    --ink:#1b2140;
    --muted:#7a7f9a;
    --line:#e2e3ee;
    --accent:#3557ff;
    --accent-dark:#2846e0;
    --error:#e5484d;
    --success:#1c7c4d;
    --gold:#b47800;
    --card:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.14);
    --text:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 0%, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(160deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    color:var(--ink);
  }
  .gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-card{
    width:100%;
    max-width:380px;
    background:var(--white);
    border-radius:24px;
    padding:36px 30px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45);
    text-align:center;
  }
  .gate-card h1{ font-size:18px; font-weight:800; margin:0 0 8px; }
  .gate-card p{ font-size:13.5px; color:var(--muted); line-height:1.6; margin:0 0 22px; }
  .gate-btn{
    width:100%; padding:13px; border:none; border-radius:10px;
    background:var(--accent); color:#fff; font-size:14.5px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .gate-btn:hover{ background:var(--accent-dark); }
  .spinner{
    width:32px; height:32px;
    border:3px solid rgba(255,255,255,0.25);
    border-top-color:#fff;
    border-radius:50%;
    margin:0 auto 16px;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .gate-text{ color:rgba(255,255,255,0.75); font-size:14px; }

  .app{ display:none; }
  .app.active{ display:block; }

  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:18px 24px;
    background:transparent;
    border-bottom:none;
  }
  .back-btn{
    width:44px; height:44px;
    border-radius:12px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .back-btn svg{ width:20px; height:20px }
  .back-btn:hover{ background:rgba(255,255,255,0.15); }
  .header h1, .topbar h1{ color:#fff; font-size:19px; font-weight:750; margin:0; }

  .content{ max-width:480px; margin:0 auto; padding:22px 18px 54px; }

  .summary-card{
    background:var(--white);
    border-radius:18px;
    padding:14px 16px;
    box-shadow:0 14px 30px -20px rgba(0,0,0,.28);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .summary-card .lbl{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
  .summary-card .val{ font-size:15px; font-weight:900; color:var(--ink); margin-top:2px; }

  .lb-list{ display:flex; flex-direction:column; gap:10px; }

  .lb-row{
    background:var(--white);
    border-radius:16px;
    padding:12px 14px;
    box-shadow:0 14px 30px -20px rgba(0,0,0,.28);
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    border:1px solid transparent;
    transition:border-color .15s, transform .1s;
  }
  .lb-row:active{ transform:scale(0.99); }
  .lb-row:hover{ border-color:rgba(53,87,255,0.25); }

  .rank-chip{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:900;
    background:#eef0f7; color:var(--muted);
  }
  .rank-chip.r1{ background:rgba(180,120,0,0.14); color:var(--gold); }
  .rank-chip.r2{ background:rgba(122,127,154,0.16); color:#5a5f77; }
  .rank-chip.r3{ background:rgba(198,120,60,0.16); color:#a5602c; }

  .avatar-sm{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:var(--navy-2); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14.5px;
  }

  .lb-text{ flex:1; min-width:0; }
  .lb-name{
    font-size:14px; font-weight:800; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .lb-email{
    font-size:11.5px; color:var(--muted); margin-top:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .lb-balance{
    text-align:right; flex-shrink:0;
  }
  .lb-balance .amt{ font-size:14.5px; font-weight:900; color:var(--success); }
  .lb-balance .cur{ font-size:10px; font-weight:700; color:var(--muted); }

  .chevron{ color:var(--line); flex-shrink:0; }

  .empty-state{
    text-align:center; padding:60px 20px;
    color:rgba(255,255,255,0.65); font-size:13.5px;
  }

  .list-spinner{
    width:28px; height:28px; margin:50px auto;
    border:3px solid rgba(255,255,255,0.2);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }

  .filter-card{
    background:var(--white);
    border-radius:18px;
    padding:14px 16px 16px;
    box-shadow:0 14px 30px -20px rgba(0,0,0,.28);
    margin-bottom:14px;
  }
  .filter-row{
    display:flex; gap:8px; margin-bottom:8px;
  }
  .filter-row:last-child{ margin-bottom:0; }
  .filter-field{ flex:1; min-width:0; }
  .filter-field label{
    display:block; font-size:10.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:.3px; color:var(--muted); margin-bottom:4px;
  }
  .filter-field input{
    width:100%; padding:9px 10px; border-radius:9px;
    border:1px solid var(--line); font-size:13.5px; font-family:inherit;
    color:var(--ink); background:#fafafe;
  }
  .filter-field input:focus{ outline:none; border-color:var(--accent); }
  .sort-btn{
    display:flex; align-items:center; gap:6px;
    padding:9px 12px; border-radius:9px; border:1px solid var(--line);
    background:#fafafe; color:var(--ink); font-size:12.5px; font-weight:700;
    font-family:inherit; cursor:pointer; white-space:nowrap;
  }
  .sort-btn:hover{ border-color:var(--accent); }
  .filter-meta{
    font-size:11.5px; color:var(--muted); margin-top:10px; text-align:center;
  }

  .load-more-btn{
    display:block; width:100%; margin-top:14px;
    padding:12px; border-radius:12px; border:none;
    background:rgba(255,255,255,0.1); color:#fff;
    font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .load-more-btn:hover{ background:rgba(255,255,255,0.18); }
  .load-more-btn:disabled{ opacity:0.5; cursor:default; }
</style>
</head>
<body>

  <div class="gate" id="gate-checking">
    <div><div class="spinner"></div><div class="gate-text">Checking access...</div></div>
  </div>

  <div class="gate" id="gate-denied" style="display:none;">
    <div class="gate-card">
      <h1>Access denied</h1>
      <p>You don't have admin access to view this page.</p>
      <button class="gate-btn" onclick="window.location.href='admin-panel.html'">Back to admin panel</button>
    </div>
  </div>

  <div class="gate" id="gate-error" style="display:none;">
    <div class="gate-card">
      <h1>Couldn't load leaderboard</h1>
      <p id="errorText">Something went wrong while loading the wallet leaderboard.</p>
      <button class="gate-btn" onclick="window.location.href='admin-panel.html'">Back to admin panel</button>
    </div>
  </div>

  <div class="app" id="app">
    <div class="topbar">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h1>Wallet Leaderboard</h1>
    </div>

    <div class="content">
      <div class="summary-card">
        <div>
          <div class="lbl">Total wallets</div>
          <div class="val" id="totalCount">--</div>
        </div>
        <div style="text-align:right;">
          <div class="lbl">Combined balance</div>
          <div class="val" id="totalBalance">৳0</div>
        </div>
      </div>

      <div class="filter-card">
        <div class="filter-row">
          <div class="filter-field">
            <label for="uidFilter">Search by UID</label>
            <input type="text" id="uidFilter" placeholder="Paste or type a UID...">
          </div>
        </div>
        <div class="filter-row">
          <div class="filter-field">
            <label for="minBalanceFilter">Min balance</label>
            <input type="number" id="minBalanceFilter" placeholder="0" inputmode="decimal">
          </div>
          <div class="filter-field">
            <label for="maxBalanceFilter">Max balance</label>
            <input type="number" id="maxBalanceFilter" placeholder="No limit" inputmode="decimal">
          </div>
          <button class="sort-btn" id="sortToggleBtn" type="button" onclick="toggleSort()">
            <span id="sortToggleLabel">High → Low</span>
          </button>
        </div>
        <div class="filter-meta" id="filterMeta"></div>
      </div>

      <div id="listSpinner" class="list-spinner"></div>
      <div class="lb-list" id="lbList"></div>
      <div class="empty-state" id="emptyState" style="display:none;">No wallet users found.</div>
      <button class="load-more-btn" id="loadMoreBtn" type="button" onclick="loadMore()" style="display:none;">Load more</button>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://myfficbwcbgbxbdqjexv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const API_BASE = 'https://chteo-api.onrender.com';

let supabaseClient;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e){
  document.getElementById('gate-checking').innerHTML =
    '<div class="gate-text">Supabase init error: ' + e.message + '</div>';
}

function showGate(name){
  document.getElementById('gate-checking').style.display = name === 'checking' ? 'flex' : 'none';
  document.getElementById('gate-denied').style.display = name === 'denied' ? 'flex' : 'none';
  document.getElementById('gate-error').style.display = name === 'error' ? 'flex' : 'none';
  document.getElementById('app').classList.toggle('active', name === 'app');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[m]));
}

function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function formatTaka(n){
  const num = Number(n) || 0;
  return '৳' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const PAGE_LIMIT = 50;

let accessTokenCache = null;
let currentPage = 1;
let currentSort = 'desc';
let hasMore = false;
let isFetching = false;
let debounceTimer = null;
let needsReload = false;

async function checkAccessAndLoad(){
  showGate('checking');

  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){
    window.location.href = 'admin-panel.html';
    return;
  }

  const { data: me, error: meErr } = await supabaseClient
    .from('profiles')
    .select('is_admin,is_owner')
    .eq('id', session.user.id)
    .single();

  if(meErr || !me || !(me.is_admin || me.is_owner)){
    showGate('denied');
    return;
  }

  accessTokenCache = session.access_token;
  showGate('app');
  attachFilterListeners();
  await loadLeaderboard({ reset: true });
}

function currentFilters(){
  return {
    uid: document.getElementById('uidFilter').value.trim(),
    min_balance: document.getElementById('minBalanceFilter').value.trim(),
    max_balance: document.getElementById('maxBalanceFilter').value.trim(),
    sort: currentSort
  };
}

function attachFilterListeners(){
  ['uidFilter', 'minBalanceFilter', 'maxBalanceFilter'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => loadLeaderboard({ reset: true }), 400);
    });
  });
}

function toggleSort(){
  currentSort = currentSort === 'desc' ? 'asc' : 'desc';
  document.getElementById('sortToggleLabel').textContent =
    currentSort === 'desc' ? 'High → Low' : 'Low → High';
  loadLeaderboard({ reset: true });
}

function loadMore(){
  if(isFetching || !hasMore) return;
  currentPage += 1;
  loadLeaderboard({ reset: false });
}

async function loadLeaderboard({ reset }){
  if(isFetching){
    // A filter/sort change arrived while a request was already in flight.
    // Don't drop it - remember to reload as soon as the current one finishes.
    needsReload = true;
    return;
  }
  isFetching = true;

  if(reset){
    currentPage = 1;
    document.getElementById('lbList').innerHTML = '';
    document.getElementById('listSpinner').style.display = 'block';
  }

  const loadMoreBtn = document.getElementById('loadMoreBtn');
  loadMoreBtn.disabled = true;
  loadMoreBtn.textContent = 'Loading...';

  try {
    const filters = currentFilters();
    const res = await fetch(API_BASE + '/api/admin-wallet-leaderboard.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        access_token: accessTokenCache,
        uid: filters.uid,
        min_balance: filters.min_balance,
        max_balance: filters.max_balance,
        sort: filters.sort,
        page: currentPage,
        limit: PAGE_LIMIT
      })
    });

    const data = await res.json();

    if(!res.ok || !data.success){
      document.getElementById('errorText').textContent = data.message || 'Server returned an error.';
      showGate('error');
      return;
    }

    renderLeaderboard(data, reset);
  } catch(e){
    document.getElementById('errorText').textContent = 'Network error: ' + e.message;
    showGate('error');
  } finally {
    isFetching = false;
    document.getElementById('listSpinner').style.display = 'none';
    loadMoreBtn.textContent = 'Load more';
    if(needsReload){
      needsReload = false;
      loadLeaderboard({ reset: true });
    }
  }
}

function renderLeaderboard(data, reset){
  // ৳0 balance wallets are excluded from the list itself — not useful to
  // scroll past on either sort direction. Summary totals above still use
  // data.total_wallets/total_balance (unfiltered, server-computed), so
  // those numbers stay accurate regardless of this list-only filter.
  const users = (data.users || []).filter(u => Number(u.balance) > 0);

  // Summary card always reflects the overall (unfiltered) totals.
  document.getElementById('totalCount').textContent = data.total_wallets ?? 0;
  document.getElementById('totalBalance').textContent = formatTaka(data.total_balance || 0);

  const listEl = document.getElementById('lbList');
  const emptyEl = document.getElementById('emptyState');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const metaEl = document.getElementById('filterMeta');

  hasMore = !!data.has_more;

  if(reset && users.length === 0){
    emptyEl.style.display = 'block';
    listEl.innerHTML = '';
    loadMoreBtn.style.display = 'none';
    metaEl.textContent = 'No matching wallets.';
    return;
  }

  emptyEl.style.display = 'none';

  const rowsHtml = users.map(u => {
    const name = u.full_name || u.email || 'Unknown';
    const rankClass = u.rank === 1 ? 'r1' : (u.rank === 2 ? 'r2' : (u.rank === 3 ? 'r3' : ''));
    return `
      <div class="lb-row" onclick="window.location.href='user-detail.html?uid=${encodeURIComponent(u.uid)}'">
        <div class="rank-chip ${rankClass}">${u.rank ?? '-'}</div>
        <div class="avatar-sm">${escapeHtml(initials(name))}</div>
        <div class="lb-text">
          <div class="lb-name">${escapeHtml(name)}</div>
          <div class="lb-email">${escapeHtml(u.email || '')}</div>
        </div>
        <div class="lb-balance">
          <div class="amt">${formatTaka(u.balance)}</div>
        </div>
        <div class="chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>
    `;
  }).join('');

  if(reset){
    listEl.innerHTML = rowsHtml;
  } else {
    listEl.insertAdjacentHTML('beforeend', rowsHtml);
  }

  loadMoreBtn.style.display = hasMore ? 'block' : 'none';
  loadMoreBtn.disabled = false;

  const matching = data.total_matching ?? users.length;
  const shownCount = listEl.querySelectorAll('.lb-row').length;
  metaEl.textContent = `Showing ${shownCount} of ${matching} matching wallet${matching === 1 ? '' : 's'}`;
}

checkAccessAndLoad();
</script>

</body>
</html>
