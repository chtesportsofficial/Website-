<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0b0d14;
    --card: #141826;
    --card-border: #232838;
    --accent: #7c5cff;
    --text-primary: #f2f3f7;
    --text-secondary: #8b8fa3;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    font-family:'Inter','Hind Siliguri',sans-serif;
    color:var(--text-primary);
  }

  .screen{
    width:100%;
    max-width:380px;
    min-height:100vh;
    background:var(--bg);
    padding:20px 18px 28px;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
  }

  .back-btn{
    width:44px; height:44px;
    border-radius:12px;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text-primary);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .back-btn:hover{ background:#1a2032; }
  .back-btn:active{ transform:scale(0.94); }
  .back-btn svg{ width:20px; height:20px; }

  .topbar h1{
    font-size:19px;
    font-weight:750;
    letter-spacing:0.3px;
  }

  .empty-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
  }

  .empty-icon{
    width:74px; height:74px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    color:var(--text-secondary);
  }
  .empty-icon svg{ width:34px; height:34px; }

  .empty-title{
    font-size:16.5px;
    font-weight:700;
    margin-bottom:8px;
  }
  .empty-sub{
    font-size:13px;
    color:var(--text-secondary);
    line-height:1.6;
    max-width:260px;
  }
</style>
<style>
:root{
  --bg: var(--g-bg);
  --card: var(--g-surface);
  --card-border: var(--g-border);
  --text-primary: var(--g-text);
  --text-secondary: var(--g-muted);
}
</style>
</head>
<body>

<div class="screen">
  <div class="topbar">
    <button class="back-btn" type="button" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1>Announcements</h1>
  </div>

  <div class="empty-wrap">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11v2a2 2 0 0 0 2 2h1l2 5h2l-1.5-5H10l8 4V6l-8 4H6a2 2 0 0 0-2 2z"/>
        <path d="M16 8v8"/>
      </svg>
    </div>
    <div class="empty-title">No announcements available</div>
    <div class="empty-sub">There are no updates or notices from the admin right now. New announcements will appear here as soon as they're posted.</div>
  </div>

</div>

<script>
  window.addEventListener('pageshow', function(event){
    if (event.persisted) {
      location.reload();
    }
  });
</script>

</body>
</html>
