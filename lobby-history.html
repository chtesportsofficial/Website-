<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lobby History — CHT ESP ORG</title>
<style>
:root{--bg:#080b12;--surface:#121827;--surface2:#171f31;--line:#26324a;--muted:#8b96aa;--green:#25d366;--green2:#39e77b;--red:#ff5d6c;--gold:#f6c453}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#080b12,#0b0f18 55%,#080b12);color:#f4f6fb;font-family:Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:760px;margin:auto;padding:20px 14px 60px}
.head{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.back{width:34px;height:34px;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:22px;border:1px solid #202a40;border-radius:11px;background:#101625}
.head h1{font-size:18px;margin:0;font-weight:900}
.sub{font-size:10px;color:var(--muted);margin-top:4px}
.filter-bar{display:flex;gap:8px;align-items:flex-end;background:#141b2b;border:1px solid #293650;border-radius:16px;padding:12px;margin-bottom:14px}
.filter-bar>div{flex:1}
label{display:block;color:#8d98ab;font-size:9px;font-weight:900;margin:0 0 5px}
input,select{width:100%;background:#0f1521;border:1px solid #293650;color:#fff;border-radius:11px;padding:10px;font-size:11px}
.clear-btn{border:1px solid #293650;background:#0f1521;color:#e8ebf2;border-radius:11px;padding:10px 13px;font-size:10px;font-weight:900;white-space:nowrap}
.count{color:#7e899d;font-size:10px;font-weight:800;margin:0 2px 10px}
.lobby-item{background:#171f31;border:1px solid #293650;border-radius:16px;padding:12px;margin-top:8px}
.lobby-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lobby-date{font-size:12px;font-weight:900}
.lobby-status{font-size:8px;font-weight:900;padding:4px 8px;border-radius:999px;white-space:nowrap}
.lobby-status.completed{background:#123321;color:#22c55e}
.lobby-meta{font-size:10px;color:#8e98ab;margin-top:6px}
.lobby-actions{margin-top:10px}
.mini{border:1px solid #293650;background:#111827;color:#e8ebf2;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:900}
.mini.green{color:#62eb91}
.empty,.loading{text-align:center;color:var(--muted);font-size:11px;padding:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="back" id="backLink" href="tournament-management.html">‹</a>
    <div><h1 id="pageTitle">Lobby History</h1><div class="sub" id="pageSub">All completed lobbies</div></div>
  </div>

  <div class="filter-bar">
    <div><label>Filter by date</label><input type="date" id="dateFilter"></div>
    <button type="button" class="clear-btn" id="clearFilterBtn">Clear</button>
  </div>

  <div class="count" id="resultCount"></div>
  <div id="historyList"><div class="loading">Loading...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function fmtLobbyDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}

const tid=new URLSearchParams(location.search).get('tid');
let allHistory=[];

async function admin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='chteo_auth.html';return false}
  const {data:p,error}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).single();
  if(error||!p?.is_admin){location.href='index.html';return false}
  return true;
}

function render(){
  const filterDate=$('dateFilter').value;
  const rows=filterDate?allHistory.filter(l=>l.lobby_date===filterDate):allHistory;
  $('resultCount').textContent=rows.length+(rows.length===1?' lobby':' lobbies');
  $('historyList').innerHTML=rows.length?rows.map(l=>`
    <div class="lobby-item">
      <div class="lobby-top">
        <div class="lobby-date">${fmtLobbyDate(l.lobby_date)} — ${esc(l.time_label)}${l.custom_title?` <span style="color:#8b96aa;font-weight:700">(${esc(l.custom_title)})</span>`:''}</div>
        <div class="lobby-status completed">✔ COMPLETED</div>
      </div>
      <div class="lobby-meta">${l.joined_count||0}/${l.total_slots||0} joined · ${Number(l.booked_slots)||0} booked</div>
      <div class="lobby-actions">
        <button class="mini green" onclick="location.href='tournament-management.html?tid=${encodeURIComponent(tid)}&lobby=${encodeURIComponent(l.id)}'">View Results</button>
      </div>
    </div>`).join(''):`<div class="empty">${filterDate?'No completed lobbies on this date.':'No completed lobbies yet.'}</div>`;
}

async function load(){
  if(!tid){$('historyList').innerHTML='<div class="empty">No tournament specified.</div>';return}
  const {data:t}=await sb.from('tournaments').select('title').eq('id',tid).single();
  if(t){$('pageTitle').textContent=t.title+' — History';$('pageSub').textContent='All completed lobbies';}
  $('backLink').href='tournament-management.html?tid='+encodeURIComponent(tid);

  const {data,error}=await sb.from('tournament_lobbies').select('*')
    .eq('tournament_id',tid).eq('status','completed')
    .order('lobby_date',{ascending:false});
  if(error){$('historyList').innerHTML='<div class="empty">Could not load history.</div>';console.error(error);return;}
  allHistory=(data||[]).sort((a,b)=>(b.lobby_date+b.time_label).localeCompare(a.lobby_date+a.time_label));
  render();
}

$('dateFilter').addEventListener('change',render);
$('clearFilterBtn').addEventListener('click',function(){$('dateFilter').value='';render();});

(async()=>{if(await admin())await load()})();
</script>
</body>
</html>
