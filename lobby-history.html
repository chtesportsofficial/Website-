<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lobby History — CHT ESP ORG</title>
<style>
:root{--bg:#080b12;--surface:#121827;--surface2:#171f31;--line:#26324a;--muted:#8b96aa;--green:#25d366;--green2:#39e77b;--red:#ff5d6c;--gold:#f6c453}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#080b12,#0b0f18 55%,#080b12);color:#f4f6fb;font-family:Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:760px;margin:auto;padding:20px 14px 60px}
.head{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.back-btn{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:#f4f6fb;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back-btn svg{width:20px;height:20px}
.head h1{font-size:19px;margin:0;font-weight:750}
.sub{font-size:10px;color:var(--muted);margin-top:4px}
.filter-bar{display:flex;gap:8px;align-items:flex-end;background:#141b2b;border:1px solid #293650;border-radius:16px;padding:12px;margin-bottom:14px}
.filter-bar>div{flex:1}
label{display:block;color:#8d98ab;font-size:9px;font-weight:900;margin:0 0 5px}
input,select{width:100%;background:#0f1521;border:1px solid #293650;color:#fff;border-radius:11px;padding:10px;font-size:11px}
.clear-btn{border:1px solid #293650;background:#0f1521;color:#e8ebf2;border-radius:11px;padding:10px 13px;font-size:10px;font-weight:900;white-space:nowrap}
.count{color:#7e899d;font-size:10px;font-weight:800;margin:0 2px 10px}
.lobby-item{background:#171f31;border:1px solid #293650;border-radius:16px;padding:12px;margin-top:8px}
.lobby-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lobby-date{font-size:12px;font-weight:900}
.lobby-status{font-size:8px;font-weight:900;padding:4px 8px;border-radius:999px;white-space:nowrap}
.lobby-status.completed{background:#123321;color:#22c55e}
.lobby-meta{font-size:10px;color:#8e98ab;margin-top:6px}
.lobby-actions{margin-top:10px}
.mini{border:1px solid #293650;background:#111827;color:#e8ebf2;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:900}
.mini.green{color:#62eb91}
.empty,.loading{text-align:center;color:var(--muted);font-size:11px;padding:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <button class="back-btn" type="button" onclick="location.replace('tournament-management.html?tid='+encodeURIComponent(tid)+'&openLobbies=1')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div><h1 id="pageTitle">Lobby History</h1><div class="sub" id="pageSub">All completed lobbies</div></div>
  </div>

  <div class="filter-bar">
    <div><label>Filter by date</label><input type="date" id="dateFilter"></div>
    <button type="button" class="clear-btn" id="clearFilterBtn">Clear</button>
  </div>

  <button type="button" class="mini green" id="addLobbyToggleBtn" style="margin-bottom:10px">+ Add Lobby</button>
  <div class="filter-bar" id="addLobbyForm" style="display:none;flex-direction:column;align-items:stretch;gap:8px">
    <div><label>Date</label><input type="date" id="newLobbyDate"></div>
    <div id="newLobbyTimes"><div class="lobby-time-row" style="margin-bottom:6px"><label>Time</label><input type="time" step="3600" class="newLobbyTimeInput"></div></div>
    <button type="button" class="clear-btn" id="addTimeRowBtn">+ Add another time</button>
    <button type="button" class="mini green" id="saveNewLobbyBtn">Save Lobby</button>
  </div>

  <div class="count" id="resultCount"></div>
  <div id="historyList"><div class="loading">Loading...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function fmtLobbyDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}

const tid=new URLSearchParams(location.search).get('tid');
let allHistory=[];
let tournamentMeta=null;

// Converts a native <input type="time"> value ("21:00") into the "H:MM AM/PM"
// label format the rest of the app (tournament-management.html) expects.
function timeValueTo12h(v){
  if(!v)return '';
  const [hStr,mStr]=v.split(':');
  let h=parseInt(hStr,10);
  const m=(mStr||'00').padStart(2,'0');
  const ap=h>=12?'PM':'AM';
  let h12=h%12; if(h12===0)h12=12;
  return h12+':'+m+' '+ap;
}
function timeLabelToMinutes(label){
  const m=(label||'').match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m)return 0;
  let h=parseInt(m[1],10); const min=parseInt(m[2],10); const ap=m[3].toUpperCase();
  if(ap==='PM'&&h!==12)h+=12;
  if(ap==='AM'&&h===12)h=0;
  return h*60+min;
}

async function admin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='chteo_auth.html';return false}
  const {data:p,error}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).single();
  if(error||!p?.is_admin){location.href='index.html';return false}
  return true;
}

function render(){
  const filterDate=$('dateFilter').value;
  const rows=filterDate?allHistory.filter(l=>l.lobby_date===filterDate):allHistory;
  $('resultCount').textContent=rows.length+(rows.length===1?' lobby':' lobbies');
  $('historyList').innerHTML=rows.length?rows.map(l=>`
    <div class="lobby-item">
      <div class="lobby-top">
        <div class="lobby-date">${fmtLobbyDate(l.lobby_date)} — ${esc(l.time_label)}${l.custom_title?` <span style="color:#8b96aa;font-weight:700">(${esc(l.custom_title)})</span>`:''}</div>
        <div class="lobby-status completed">✔ COMPLETED</div>
      </div>
      <div class="lobby-meta">${l.joined_count||0}/${l.total_slots||0} joined · ${Number(l.booked_slots)||0} booked</div>
      <div class="lobby-actions">
        <button class="mini green" onclick="location.href='tournament-management.html?tid=${encodeURIComponent(tid)}&lobby=${encodeURIComponent(l.id)}'">View Results</button>
        <button class="mini" onclick="location.href='tournament-management.html?tid=${encodeURIComponent(tid)}&lobby=${encodeURIComponent(l.id)}&team=1'">Add Team</button>
      </div>
    </div>`).join(''):`<div class="empty">${filterDate?'No completed lobbies on this date.':'No completed lobbies yet.'}</div>`;
}

async function load(){
  if(!tid){$('historyList').innerHTML='<div class="empty">No tournament specified.</div>';return}
  const {data:t}=await sb.from('tournaments').select('title,default_slots,total_slots').eq('id',tid).single();
  if(t){tournamentMeta=t;$('pageTitle').textContent=t.title+' — History';$('pageSub').textContent='All completed lobbies';}

  const {data,error}=await sb.from('tournament_lobbies').select('*')
    .eq('tournament_id',tid).eq('status','completed')
    .order('lobby_date',{ascending:false});
  if(error){$('historyList').innerHTML='<div class="empty">Could not load history.</div>';console.error(error);return;}
  allHistory=(data||[]).sort((a,b)=>{
    if(a.lobby_date!==b.lobby_date)return b.lobby_date.localeCompare(a.lobby_date);
    return timeLabelToMinutes(b.time_label)-timeLabelToMinutes(a.time_label);
  });
  render();
}

$('dateFilter').addEventListener('change',render);
$('clearFilterBtn').addEventListener('click',function(){$('dateFilter').value='';render();});

$('addLobbyToggleBtn').addEventListener('click',function(){
  const f=$('addLobbyForm');
  f.style.display=f.style.display==='none'?'flex':'none';
});
$('addTimeRowBtn').addEventListener('click',function(){
  const row=document.createElement('div');
  row.className='lobby-time-row'; row.style.marginBottom='6px';
  row.innerHTML='<input type="time" step="3600" class="newLobbyTimeInput">';
  $('newLobbyTimes').appendChild(row);
});
// Lobbies added from this History page are for matches that already
// happened (played over WhatsApp etc, admin just didn't get to enter them
// in time) — so unlike the normal "Add Lobby" flow in Lobbies, these are
// inserted straight in as 'completed' rather than 'upcoming'.
async function saveNewLobby(){
  if(!tid)return;
  const date=$('newLobbyDate').value; if(!date)return alert('Pick a date.');
  const times=[...document.querySelectorAll('.newLobbyTimeInput')].map(i=>timeValueTo12h(i.value)).filter(Boolean);
  if(!times.length)return alert('Add at least one time.');
  const slots=tournamentMeta?.default_slots||tournamentMeta?.total_slots||0;
  const rows=times.map(t=>({tournament_id:tid,lobby_date:date,time_label:t,total_slots:slots,status:'completed'}));
  const {data,error}=await sb.from('tournament_lobbies').insert(rows).select();
  if(error)return alert(error.message);
  if(!data||data.length===0)return alert('Insert blocked (0 rows) — check the INSERT RLS policy on tournament_lobbies.');
  $('newLobbyDate').value='';
  $('newLobbyTimes').innerHTML='<div class="lobby-time-row" style="margin-bottom:6px"><input type="time" step="3600" class="newLobbyTimeInput"></div>';
  $('addLobbyForm').style.display='none';
  await load();
}
$('saveNewLobbyBtn').addEventListener('click',saveNewLobby);

(async()=>{if(await admin())await load()})();
</script>
</body>
</html>
