<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0b0d14;
    --field: #1a1e2c;
    --field-border: #2a2f42;
    --text-primary: #f2f3f7;
    --text-secondary: #8b8fa3;
    --danger: #e0263a;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    font-family:'Inter',sans-serif;
    color:var(--text-primary);
  }

  .screen{
    width:100%;
    max-width:380px;
    min-height:100vh;
    background:var(--bg);
    padding:20px 18px 28px;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:28px;
  }

  .back-btn{
    width:38px; height:38px;
    border-radius:12px;
    background:var(--field);
    border:1px solid var(--field-border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-primary);
    cursor:pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .back-btn:hover{ background:#232840; }
  .back-btn:active{ transform:scale(0.94); }

  .topbar h1{
    font-size:17px;
    font-weight:700;
    letter-spacing:0.3px;
  }

  .field-group{
    margin-bottom:20px;
  }

  .field-label{
    font-size:13.5px;
    font-weight:600;
    color:var(--text-primary);
    margin-bottom:8px;
  }

  .field-wrap{
    position:relative;
  }

  .field-wrap input{
    width:100%;
    background:var(--field);
    border:1px solid var(--field-border);
    border-radius:12px;
    padding:14px 44px 14px 14px;
    font-size:14px;
    color:var(--text-primary);
    font-family:inherit;
    outline:none;
    transition: border-color .2s ease;
  }
  .field-wrap input::placeholder{
    color:var(--text-secondary);
  }
  .field-wrap input:focus{
    border-color:#4a5170;
  }

  .toggle-eye{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-secondary);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    padding:0;
    width:19px;
    height:19px;
  }
  .toggle-eye:hover{ color:var(--text-primary); }

  .toggle-eye svg{
    position:absolute;
    top:0; left:0;
    transition: opacity .25s ease, transform .25s cubic-bezier(.34,1.4,.64,1);
  }

  .icon-eye{
    opacity:1;
    transform:scale(1) rotate(0deg);
  }
  .icon-eye-off{
    opacity:0;
    transform:scale(0.6) rotate(-25deg);
  }

  .toggle-eye.is-hidden .icon-eye{
    opacity:0;
    transform:scale(0.6) rotate(25deg);
  }
  .toggle-eye.is-hidden .icon-eye-off{
    opacity:1;
    transform:scale(1) rotate(0deg);
  }

  .update-btn{
    width:100%;
    margin-top:12px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:var(--danger);
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition: filter .2s ease, transform .12s ease;
    font-family:inherit;
    letter-spacing:0.2px;
  }
  .update-btn:hover{ filter:brightness(1.08); }
  .update-btn:active{ transform:scale(0.98); }
</style>
</head>
<body>

<div class="screen">
  <div class="topbar">
    <div class="back-btn" onclick="history.back()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </div>
    <h1>CHANGE PASSWORD</h1>
  </div>

  <div class="field-group">
    <div class="field-label">Current Password</div>
    <div class="field-wrap">
      <input type="password" id="currentPassword" placeholder="Enter current password">
      <button class="toggle-eye" onclick="togglePassword('currentPassword', this)">
        <svg class="icon-eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg class="icon-eye-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.66 19.66 0 0 1 4.22-5.77M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a19.86 19.86 0 0 1-2.35 3.42M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="field-group">
    <div class="field-label">New Password</div>
    <div class="field-wrap">
      <input type="password" id="newPassword" placeholder="Enter new password">
      <button class="toggle-eye" onclick="togglePassword('newPassword', this)">
        <svg class="icon-eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg class="icon-eye-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.66 19.66 0 0 1 4.22-5.77M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a19.86 19.86 0 0 1-2.35 3.42M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="field-group">
    <div class="field-label">Confirm New Password</div>
    <div class="field-wrap">
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
      <button class="toggle-eye" onclick="togglePassword('confirmPassword', this)">
        <svg class="icon-eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg class="icon-eye-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.66 19.66 0 0 1 4.22-5.77M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a19.86 19.86 0 0 1-2.35 3.42M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
  </div>

  <button class="update-btn" onclick="updatePassword()">Update Password</button>
</div>

<script>
  function togglePassword(id, btn){
    const input = document.getElementById(id);
    if(input.type === 'password'){
      input.type = 'text';
      btn.classList.add('is-hidden');
    } else {
      input.type = 'password';
      btn.classList.remove('is-hidden');
    }
  }

  function updatePassword(){
    const current = document.getElementById('currentPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if(!current || !newPass || !confirm){
      alert('Please fill in all fields.');
      return;
    }
    if(newPass !== confirm){
      alert('New password and confirmation do not match.');
      return;
    }
    // Send this data to your backend here
    console.log('Password update requested');
  }
</script>

</body>
</html>
