<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg: #0b0d14;
    --card: #141826;
    --card-border: #232838;
    --text-primary: #f2f3f7;
    --text-secondary: #8b8fa3;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    font-family:'Inter','Hind Siliguri',sans-serif;
    color:var(--text-primary);
  }
  .screen{
    width:100%;
    max-width:380px;
    min-height:100vh;
    background:var(--bg);
    padding:20px 18px 28px;
    display:flex;
    flex-direction:column;
  }
  .topbar{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .back-btn{
    width:44px; height:44px;
    border-radius:12px;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text-primary);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: background .2s ease, transform .15s ease;
  }
  .back-btn:hover{ background:#1a2032; }
  .back-btn:active{ transform:scale(0.94); }
  .back-btn svg{ width:20px; height:20px; }
  .topbar h1{ font-size:19px; font-weight:750; letter-spacing:0.3px; }
  .empty-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
  }
  .empty-icon{
    width:74px; height:74px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    color:var(--text-secondary);
  }
  .empty-icon svg{ width:34px; height:34px; }
  .empty-title{ font-size:16.5px; font-weight:700; margin-bottom:8px; }
  .empty-sub{ font-size:13px; color:var(--text-secondary); line-height:1.6; max-width:260px; }

  .g-note{font-size:12px;color:var(--text-secondary);line-height:1.55;margin:-10px 0 18px}
  .g-section{margin-bottom:22px}
  .g-title{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;margin-bottom:12px}
  .g-title .bar{width:4px;height:16px;border-radius:2px;background:linear-gradient(#ff8a3d,#22e08a)}
  .g-card{border-radius:16px;overflow:hidden;border:1px solid var(--card-border);background:var(--card);margin-bottom:14px}
  .g-banner{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#0d1320}
  .g-body{padding:12px}
  .g-name{font-weight:800;font-size:14px;margin-bottom:9px;line-height:1.35}
  .g-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .g-chip{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--card-border);color:var(--text-primary)}
  .g-chip.prize{color:#ffb36b;border-color:rgba(255,138,61,.4)}
  .g-chip.free{color:#22e08a;border-color:rgba(34,224,138,.4)}
  .g-cta{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 0;border-radius:12px;font-weight:800;font-size:13px;text-decoration:none;background:linear-gradient(135deg,#22e08a,#7dffc0);color:#04141f}
  .g-cta:active{transform:scale(.98)}
  .fs-card{position:relative;overflow:hidden;border-radius:18px;margin-bottom:22px;padding:16px;border:1px solid rgba(34,224,138,.45);background:linear-gradient(135deg,rgba(34,224,138,.18),var(--card) 70%)}
  .fs-card::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(34,224,138,.28),transparent 70%);pointer-events:none}
  .fs-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:#22e08a;color:#04141f;margin-bottom:10px}
  .fs-title{font-weight:900;font-size:19px;line-height:1.25;margin-bottom:6px}
  .fs-sub{font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:14px}
  .fs-card .g-banner{border-radius:12px;margin-bottom:12px}
  .fs-soon{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 0;border-radius:12px;font-weight:800;font-size:13px;background:rgba(255,255,255,.06);border:1px dashed var(--card-border);color:var(--text-secondary)}
  .fs-note{font-size:11.5px;color:var(--text-secondary);line-height:1.55;margin:10px 0 0;text-align:center}
  .fs-count{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:#7dffc0;margin-bottom:12px}
  .fs-count i{width:7px;height:7px;border-radius:50%;background:#22e08a;box-shadow:0 0 0 4px rgba(34,224,138,.18)}
  .fs-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px 0;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,#22e08a,#7dffc0);color:#04141f}
  .fs-btn:active{transform:scale(.98)}
  .fs-btn[disabled]{opacity:.55;cursor:default;transform:none}
  .fs-btn.done{background:rgba(34,224,138,.14);color:#7dffc0;border:1px solid rgba(34,224,138,.45)}
  .fs-wa{display:inline-block;margin-top:9px;padding:9px 14px;border-radius:10px;background:#2a1100;color:#ffb36b;text-decoration:none;font-weight:800;font-size:12.5px}
  .fs-win{margin-bottom:12px;padding:12px;border-radius:12px;background:linear-gradient(135deg,#ffb36b,#ff8a3d);color:#2a1100;font-weight:800;font-size:13px;line-height:1.5;text-align:center}
  .ad-panel{margin-bottom:22px;padding:14px;border-radius:18px;border:1px dashed rgba(255,138,61,.55);background:rgba(255,138,61,.06)}
  .ad-ptitle{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;margin-bottom:12px;color:#ffb36b}
  .ad-stat{display:flex;gap:10px;margin-bottom:14px}
  .ad-box{flex:1;border:1px solid var(--card-border);background:var(--card);border-radius:14px;padding:12px}
  .ad-box b{display:block;font-size:22px;font-weight:900;color:#7dffc0}
  .ad-box span{font-size:11px;color:var(--text-secondary)}
  .ad-date{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--card-border);background:var(--card);color:var(--text-primary);font-family:inherit;font-size:14px;margin-bottom:12px}
  .ad-draw{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 0;border:0;border-radius:14px;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#ffb36b,#ff8a3d);color:#2a1100;margin-bottom:14px}
  .ad-draw[disabled]{opacity:.5}
  .ad-winner{border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid rgba(255,138,61,.5);background:linear-gradient(135deg,rgba(255,138,61,.18),var(--card))}
  .ad-winner .lbl{font-size:11px;font-weight:800;color:#ffb36b;margin-bottom:6px}
  .ad-winner .uid{font-size:26px;font-weight:900;letter-spacing:.02em;margin-bottom:2px}
  .ad-winner .nm{font-size:13px;color:var(--text-secondary);margin-bottom:10px}
  .ad-winner .row{display:flex;gap:8px;flex-wrap:wrap}
  .ad-winner a,.ad-winner button{padding:9px 12px;border-radius:10px;border:1px solid var(--card-border);background:rgba(255,255,255,.06);color:var(--text-primary);font-family:inherit;font-weight:700;font-size:12px;text-decoration:none;cursor:pointer}
  .ad-shuffle{font-size:30px;font-weight:900;text-align:center;padding:22px 0;color:#ffb36b;letter-spacing:.04em}
  .ad-h{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13.5px;margin:18px 0 10px}
  .ad-h .bar{width:4px;height:15px;border-radius:2px;background:linear-gradient(#ff8a3d,#22e08a)}
  .ad-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--card-border);background:var(--card);border-radius:12px;margin-bottom:8px;font-size:12.5px}
  .ad-item .u{font-weight:900;color:#7cc2ff;min-width:64px}
  .ad-item .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ad-item .t{font-size:11px;color:var(--text-secondary)}
  .ad-empty{padding:18px;text-align:center;font-size:12.5px;color:var(--text-secondary);border:1px dashed var(--card-border);border-radius:12px}
  .ad-line{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-secondary);margin:0 0 12px;padding:0 2px}
  .ad-line b{color:#7dffc0;font-weight:900;font-size:14px}
  .ad-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--card-border);background:var(--card);color:var(--text-primary);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;margin-top:14px}
  .ad-toggle b{color:#7dffc0}
  .ad-toggle .arr{transition:transform .2s;display:inline-block}
  .ad-toggle.open .arr{transform:rotate(180deg)}
  .ad-search{margin:10px 0 8px}
  .ad-scroll{max-height:230px;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
  .ad-scroll.sm{max-height:170px}
  .ad-scroll .ad-item{margin-bottom:6px;padding:8px 12px}
  .g-skel{height:300px;border-radius:16px;background:linear-gradient(90deg,var(--card),#1b2133,var(--card));background-size:200% 100%;animation:gsk 1.2s infinite linear;margin-bottom:14px}
  @keyframes gsk{to{background-position:-200% 0}}
</style>

}

<div class="screen">

<script>
(function(){
  var SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
  var SUPABASE_KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
  var list=document.getElementById('giveawayList');
  var bn='০১২৩৪৫৬৭৮৯';
  function toBn(n){return String(n).replace(/\d/g,function(d){return bn[d];});}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
  // Sections are set from Tournament Management:
  //  - name contains "Free Slot"  -> shown in the Daily Free Slot card
  //  - name contains "Giveaway"   -> shown as giveaway tournament cards
  function isFree(s){return /free\s*slot|ফ্রি\s*স্লট/i.test((s.name||'')+' '+(s.name_bn||''));}
  function isGiveaway(s){return !isFree(s)&&/giveaway|গিভঅ্যাওয়ে/i.test((s.name||'')+' '+(s.name_bn||''));}
  function money(v){var n=Number(v||0);return '৳'+toBn(Number.isInteger(n)?n:n.toFixed(2));}
  function pub(s){
    return (s.tournaments||[]).filter(function(t){return t.status==='published';})
      .sort(function(a,b){return new Date(a.created_at||0)-new Date(b.created_at||0);});
  }
  var sb=null, fsState=null;
  function freeSlotHTML(){
    return '<div class="fs-card" id="fsCard">'+
      '<div class="fs-title">ডেইলি ফ্রি স্লট</div>'+
      '<div class="fs-sub">প্রতিদিন ফ্রিতে ৩৫ টাকা এন্ট্রি ফি টুর্নামেন্ট খেলার সুযোগ। এখনই অংশ নিন।</div>'+
      '<div id="fsBody"><button class="fs-btn" disabled>লোড হচ্ছে...</button></div></div>';
  }
  function renderFs(){
    var box=document.getElementById('fsBody'); if(!box) return;
    var st=fsState;
    if(!st){ box.innerHTML='<div class="fs-soon">শীঘ্রই চালু হবে</div>'; return; }
    var h='';
    if(st.won_today){
      var dayTxt=(st.won_slot&&st.today&&String(st.won_slot)===String(st.today))?'আজকের':'কালকের';
      var num=st.contact_whatsapp?String(st.contact_whatsapp):'';
      var wl=waLink(num);
      h+='<div class="fs-win">🎉 অভিনন্দন! '+dayTxt+' ফ্রি স্লট আপনি পেয়েছেন।'+
        (num?'<div style="margin-top:6px;font-weight:700">যোগাযোগ করুন (WhatsApp): <b>'+esc(num)+'</b></div>'+
          (wl?'<a class="fs-wa" href="'+esc(wl)+'" target="_blank" rel="noopener">WhatsApp-এ মেসেজ করুন</a>':''):
          '<div style="margin-top:6px;font-weight:700">আমরা শীঘ্রই আপনার সাথে যোগাযোগ করব।</div>')+'</div>';
    }
    h+='<div class="fs-count"><i></i><span>আজ '+toBn(st.total_today||0)+' জন চেক-ইন করেছেন</span></div>';
    if(!st.logged_in){
      h+='<a class="fs-btn" href="chteo_auth.html">লগইন করে চেক-ইন করুন</a>';
    }else if(st.checked_in){
      h+='<button class="fs-btn done" disabled>✓ আজকের চেক-ইন সম্পন্ন</button>';
    }else{
      h+='<button class="fs-btn" id="fsCheckin">চেক-ইন করুন</button>';
    }
    h+='<div class="fs-note">প্রতিদিন চেক-ইন করুন। আজ যারা চেক-ইন করবে, তাদের মধ্য থেকে ১ জন র‍্যান্ডমলি কালকের ফ্রি স্লট পাবে।</div>';
    box.innerHTML=h;
    var b=document.getElementById('fsCheckin');
    if(b) b.addEventListener('click',doCheckin);
  }
  async function loadFs(){
    try{
      var sess=await sb.auth.getSession();
      var logged=!!(sess&&sess.data&&sess.data.session);
      var r=await sb.rpc('free_slot_status');
      if(r.error||!r.data){ console.warn(r.error); fsState=null; }
      else fsState=Object.assign({},r.data,{logged_in:logged});
    }catch(e){ console.warn(e); fsState=null; }
    renderFs();
  }
  // ---------- Admin only: random winner draw (hidden for normal users) ----------
  var adRows=[], adBusy=false;
  function $(id){return document.getElementById(id);}
  function dhakaToday(){
    var d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Dhaka'}));
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function nextDay(iso){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function fmtDay(iso){var p=String(iso).split('-');return toBn(p[2])+'/'+toBn(p[1]);}
  function fmtTime(ts){try{return new Date(ts).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dhaka'});}catch(e){return '';}}
  function waLink(num){var n=String(num||'').replace(/\D/g,''); if(!n) return ''; if(n.length===11&&n[0]==='0') n='88'+n; return n?'https://wa.me/'+n:'';}
  async function initAdmin(){
    try{
      var sess=await sb.auth.getSession();
      if(!sess.data||!sess.data.session) return;
      var pr=await sb.from('profiles').select('is_admin').eq('id',sess.data.session.user.id).single();
      if(pr.error||!pr.data||!pr.data.is_admin) return;
    }catch(e){ return; }
    var slot=$('adminSlot'); if(!slot) return;
    slot.innerHTML='<div class="ad-panel"><div class="ad-ptitle">🔒 অ্যাডমিন · ফ্রি স্লট ড্র</div>'+
      '<label style="font-size:11.5px;color:var(--text-secondary);display:block;margin-bottom:6px">বিজয়ী যে WhatsApp নম্বরে যোগাযোগ করবে</label>'+
      '<div style="display:flex;gap:8px;margin-bottom:14px"><input class="ad-date" style="margin:0;flex:1" type="tel" inputmode="tel" id="adContact" placeholder="01XXXXXXXXX">'+
      '<button class="ad-draw" style="margin:0;width:auto;padding:0 18px;font-size:13px" id="adContactSave" type="button">সেভ</button></div>'+
      '<label style="font-size:11.5px;color:var(--text-secondary);display:block;margin-bottom:6px">কোন দিনের চেক-ইন থেকে বাছবেন?</label>'+
      '<input class="ad-date" type="date" id="adDate">'+
      '<div class="ad-line"><span>চেক-ইন করেছেন: <b id="adTotal">0</b> জন</span><span>ফ্রি স্লটের দিন: <b id="adSlotDay">-</b></span></div>'+
      '<button class="ad-draw" id="adDraw" disabled>🎲 র‍্যান্ডম বিজয়ী বাছুন</button>'+
      '<div id="adWinner"></div>'+
      '<button class="ad-toggle" id="adToggle" type="button"><span>যারা চেক-ইন করেছে (<b id="adCnt">0</b>)</span><span class="arr">⌄</span></button>'+
      '<div id="adListBox" hidden><input class="ad-date ad-search" id="adSearch" type="text" inputmode="numeric" placeholder="UID দিয়ে খুঁজুন"><div id="adList" class="ad-scroll"></div></div>'+
      '<div class="ad-h"><span class="bar"></span>আগের বিজয়ী</div><div id="adPast" class="ad-scroll sm"></div></div>';
    $('adToggle').addEventListener('click',function(){
      var box=$('adListBox'); box.hidden=!box.hidden; this.classList.toggle('open',!box.hidden);
    });
    $('adSearch').addEventListener('input',adRenderList);
    $('adContact').value=(fsState&&fsState.contact_whatsapp)||'';
    $('adContactSave').addEventListener('click',async function(){
      var b=this; b.disabled=true;
      var r=await sb.rpc('free_slot_set_contact',{p_number:$('adContact').value});
      b.disabled=false;
      b.textContent=r.error?'হয়নি':'সেভ হয়েছে ✓';
      if(fsState) fsState.contact_whatsapp=$('adContact').value.trim();
      setTimeout(function(){b.textContent='সেভ';},1500);
    });
    $('adDate').value=dhakaToday();
    $('adDate').addEventListener('change',adLoadDay);
    $('adDraw').addEventListener('click',adDrawWinner);
    adLoadDay();
  }
  async function adLoadDay(){
    var d=$('adDate').value; if(!d) return;
    $('adSlotDay').textContent=fmtDay(nextDay(d));
    $('adWinner').innerHTML='';
    var r=await sb.rpc('free_slot_admin_list',{p_date:d});
    if(r.error){ $('adList').innerHTML='<div class="ad-empty">লোড হয়নি: '+esc(r.error.message)+'<br>free-slot.sql চালিয়েছেন তো?</div>'; return; }
    adRows=r.data||[];
    $('adTotal').textContent=toBn(adRows.length);
    $('adCnt').textContent=toBn(adRows.length);
    adRenderList();
    $('adDraw').disabled=!adRows.length;
    var w=await sb.rpc('free_slot_admin_winners',{p_limit:30});
    if(!w.error){
      var cur=(w.data||[]).find(function(x){return x.checkin_date===d;});
      if(cur) adShowWinner({user_number:cur.user_number,full_name:cur.full_name,whatsapp:cur.whatsapp,slot_date:cur.slot_date},true);
      adRenderPast(w.data||[]);
    }
  }
  function adRenderList(){
    var q=(($('adSearch')||{}).value||'').trim().replace(/^#/,'');
    var list=q?adRows.filter(function(x){return String(x.user_number||'').indexOf(q)!==-1;}):adRows;
    $('adList').innerHTML=list.length?list.map(function(x){
      return '<div class="ad-item"><span class="u">#'+esc(x.user_number||'-')+'</span><span class="n">'+esc(x.full_name||'নাম নেই')+'</span><span class="t">'+esc(fmtTime(x.checked_at))+'</span></div>';
    }).join(''):'<div class="ad-empty">'+(adRows.length?'কিছু পাওয়া যায়নি':'এই দিনে কেউ চেক-ইন করেনি')+'</div>';
  }
  function adRenderPast(list){
    $('adPast').innerHTML=list.length?list.map(function(x){
      return '<div class="ad-item"><span class="u">#'+esc(x.user_number||'-')+'</span><span class="n">'+esc(x.full_name||'')+'</span><span class="t">'+esc(fmtDay(x.checkin_date))+' → '+esc(fmtDay(x.slot_date))+'</span></div>';
    }).join(''):'<div class="ad-empty">এখনো কাউকে বাছা হয়নি</div>';
  }
  function adShowWinner(w,saved){
    $('adWinner').innerHTML='<div class="ad-winner"><div class="lbl">'+(saved?'এই দিনের বিজয়ী':'🎉 বিজয়ী')+' · ফ্রি স্লট '+esc(fmtDay(w.slot_date||nextDay($('adDate').value)))+'</div>'+
      '<div class="uid" style="margin:0">UID #'+esc(w.user_number||'-')+'</div></div>';
  }
  async function adDrawWinner(){
    if(adBusy||!adRows.length) return;
    if($('adWinner').querySelector('.ad-winner') && !confirm('এই দিনের জন্য আগেই বিজয়ী বাছা হয়েছে। নতুন করে বাছলে আগেরজন বাদ যাবে। বাছবেন?')) return;
    adBusy=true; $('adDraw').disabled=true;
    var box=$('adWinner'); box.innerHTML='<div class="ad-winner"><div class="ad-shuffle" id="adShuf">...</div></div>';
    var t=setInterval(function(){var x=adRows[Math.floor(Math.random()*adRows.length)];var e=$('adShuf'); if(e) e.textContent='#'+(x.user_number||'?');},70);
    var r=await sb.rpc('free_slot_draw',{p_date:$('adDate').value});
    await new Promise(function(res){setTimeout(res,1600);});
    clearInterval(t);
    adBusy=false; $('adDraw').disabled=false;
    if(r.error){ box.innerHTML='<div class="ad-empty">বাছা যায়নি: '+esc(r.error.message)+'</div>'; return; }
    adShowWinner(r.data,false);
    var w=await sb.rpc('free_slot_admin_winners',{p_limit:30}); if(!w.error) adRenderPast(w.data||[]);
  }
  async function doCheckin(){
    var b=document.getElementById('fsCheckin'); if(!b) return;
    b.disabled=true; b.textContent='চেক-ইন হচ্ছে...';
    var r=await sb.rpc('free_slot_checkin');
    if(r.error){
      console.warn(r.error);
      b.disabled=false; b.textContent='চেক-ইন করুন';
      alert('চেক-ইন হয়নি, আবার চেষ্টা করুন।');
      return;
    }
    fsState=Object.assign({},r.data,{logged_in:true});
    renderFs();
  }
  function giveawayCard(t){
    var free=Number(t.entry_fee||0)===0;
    return '<article class="g-card">'+
      (t.banner_url?'<img class="g-banner" loading="lazy" decoding="async" src="'+esc(t.banner_url)+'" alt="">':'')+
      '<div class="g-body"><div class="g-name">'+esc(t.title)+'</div><div class="g-meta">'+
        (free?'<span class="g-chip free">ফ্রি এন্ট্রি</span>':'<span class="g-chip">এন্ট্রি '+money(t.entry_fee)+'</span>')+
        (Number(t.prize_pool||0)>0?'<span class="g-chip prize">প্রাইজ '+money(t.prize_pool)+'</span>':'')+
        (Number(t.total_slots||0)>0?'<span class="g-chip">স্লট '+toBn(t.total_slots)+'</span>':'')+
      '</div><a class="g-cta" href="tournament-details.html?id='+encodeURIComponent(t.id)+'"><span>রেজিস্ট্রেশন করুন</span><span>›</span></a></div></article>';
  }
  async function load(){
    if(!window.supabase||!window.supabase.createClient){setTimeout(load,250);return;}
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    // draw the Daily Free Slot card right away, fill its state in parallel
    list.innerHTML=freeSlotHTML()+'<div id="adminSlot"></div><div id="gaWrap"><div class="g-skel"></div></div>';
    loadFs().then(initAdmin);
    var res=await sb.from('tournament_sections')
      .select('id,name,name_bn,display_order,is_active,tournaments(id,title,banner_url,entry_fee,prize_pool,total_slots,status,created_at)')
      .eq('is_active',true).order('display_order',{ascending:true});
    if(res.error) console.warn(res.error);
    var sections=res.error?[]:(res.data||[]);
    var groups=sections.filter(isGiveaway).map(function(s){return {s:s,ts:pub(s)};}).filter(function(g){return g.ts.length;});
    var html;
    if(groups.length){
      html=groups.map(function(g){
        return '<section class="g-section"><div class="g-title"><span class="bar"></span>'+esc(g.s.name_bn||g.s.name)+'</div>'+g.ts.map(giveawayCard).join('')+'</section>';
      }).join('');
    }else{
      html='<div class="g-title"><span class="bar"></span>গিভঅ্যাওয়ে টুর্নামেন্ট</div><div class="fs-soon">নতুন গিভঅ্যাওয়ে শীঘ্রই আসছে</div>';
    }
    var w=document.getElementById('gaWrap'); if(w) w.innerHTML=html;
  }
  load();
  window.addEventListener('pageshow',function(e){if(e.persisted)location.reload();});
})();
</script>
</body>
</html>
