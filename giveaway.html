<script>
(function(){

  var bn='০১২৩৪৫৬৭৮৯';
  function toBn(n){return String(n).replace(/\d/g,function(d){return bn[d];});}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}

  function isFree(s){return /free\s*slot|ফ্রি\s*স্লট/i.test((s.name||'')+' '+(s.name_bn||''));}
  function isGiveaway(s){return !isFree(s)&&/giveaway|গিভঅ্যাওয়ে/i.test((s.name||'')+' '+(s.name_bn||''));}
  function money(v){var n=Number(v||0);return '৳'+toBn(Number.isInteger(n)?n:n.toFixed(2));}
  function pub(s){
    return (s.tournaments||[]).filter(function(t){return t.status==='published';})
      .sort(function(a,b){return new Date(a.created_at||0)-new Date(b.created_at||0);});
  }
  var sb=null, fsState=null;

  }
  function renderFs(){
    var box=document.getElementById('fsBody'); if(!box) return;
    var st=fsState;

      var isToday=(st.won_slot&&st.today&&String(st.won_slot)===String(st.today));

      h+='<div class="fs-win">🎉 অভিনন্দন! '+dayTxt+' ৩৫ টাকা স্ক্রিমের ফ্রি স্লট আপনি পেয়েছেন।'+

      h+='<a class="fs-btn" href="chteo_auth.html">লগইন করে চেক-ইন করুন</a>';

    }else{
      h+='<button class="fs-btn" id="fsCheckin">চেক-ইন করুন</button>';
    }
    h+='<div class="fs-note">প্রতিদিন চেক-ইন করুন। আজ যারা চেক-ইন করেছে, তাদের মধ্য থেকে ১ জন র‍্যান্ডমলি কালকের ৩৫ টাকা স্ক্রিমের ফ্রি স্লট পাবে।</div>';
    box.innerHTML=h;
    var b=document.getElementById('fsCheckin');
    if(b) b.addEventListener('click',doCheckin);
  }
  async function loadFs(){
    try{
      var sess=await sb.auth.getSession();
      var logged=!!(sess&&sess.data&&sess.data.session);

  // ---------- Admin only: random winner draw (hidden for normal users) ----------
  var adRows=[], adBusy=false, isAdminUser=false;

    var d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Dhaka'}));

  function localProfile(){try{return JSON.parse(localStorage.getItem('user_profile')||'{}')||{};}catch(e){return {};}}
  function compressImg(file,maxDim){
    return new Promise(function(res,rej){
      var rd=new FileReader();
      rd.onerror=function(){rej(new Error('read'));};
      rd.onload=function(e){
        var im=new Image();
        im.onerror=function(){rej(new Error('img'));};
        im.onload=function(){
          var w=im.width,h=im.height;
          if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
          var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
          c.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',0.85);
        };
        im.src=e.target.result;
      };
      rd.readAsDataURL(file);
    });
  }

  async function submitReg(st,close){

    if(wa.replace(/\D/g,'').length<10) return fail('সঠিক WhatsApp নম্বর দিন।');

          var all=g.tournaments||[], on=all.filter(function(t){return t.status==='published';});
          if(!all.length) lines.push('"'+esc(g.name)+'" সেকশনে কোনো টুর্নামেন্ট দেখা যাচ্ছে না। টুর্নামেন্ট না থাকলে বানাও; থাকলে Supabase-এর RLS পলিসি আটকাচ্ছে।');
          else if(!on.length) lines.push('"'+esc(g.name)+'" সেকশনে '+toBn(all.length)+'টি টুর্নামেন্ট আছে, কিন্তু একটাও <b>ON</b> নেই। Tournament Management-এ ON সুইচ চালু করো।');
        });
      }
    }
    return '<div class="ad-empty" style="margin-top:12px;text-align:left;line-height:1.7;border-color:rgba(255,138,61,.5)"><b style="color:#ffb36b">🔒 অ্যাডমিন নোট (ইউজার দেখবে না)</b><br>'+lines.join('<br>')+'</div>';
  }
  async function load(){
    if(!window.supabase||!window.supabase.createClient){setTimeout(load,250);return;}
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    list.innerHTML=freeSlotHTML()+'<div id="adminSlot"></div><div id="gaWrap"><div class="g-skel"></div></div>';
    var adReady=loadFs().then(initAdmin);
    var res=await sb.from('tournament_sections')
      .select('id,name,name_bn,display_order,is_active,tournaments(*)')
      .eq('is_active',true).order('display_order',{ascending:true});
    if(res.error) console.warn(res.error);
    gaErr=res.error||null;
    gaSections=res.error?[]:(res.data||[]);
    gaGroups=gaSections.filter(isGiveaway).map(function(s){return {s:s,ts:pub(s)};}).filter(function(g){return g.ts.length;});
    try{ var ss=await sb.auth.getSession(); gaLogged=!!(ss.data&&ss.data.session); }catch(e){}
    try{ var st=await sb.rpc('giveaway_status'); if(!st.error&&st.data) gaState=Object.assign({counts:{},mine:[]},st.data); else if(st.error) console.warn(st.error); }catch(e){}
    try{ await adReady; }catch(e){}
    renderGa();
  }
  load();
  window.addEventListener('pageshow',function(e){if(e.persisted)location.reload();});
})();
</script>
</body>
</html>
