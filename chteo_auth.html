<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHTEO — Sign in</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy-1:#1b2140;
    --navy-2:#2a3266;
    --navy-3:#333c7a;
    --white:#ffffff;
    --ink:#1b2140;
    --muted:#7a7f9a;
    --line:#e2e3ee;
    --accent:#3557ff;
    --accent-dark:#2846e0;
    --error:#e5484d;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 25%, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 40%),
      radial-gradient(circle at 90% 12%, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 45%),
      linear-gradient(160deg, var(--navy-1) 0%, var(--navy-2) 55%, var(--navy-3) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:40px 16px !important;
  }
  body .app-footer.global-footer{ color:rgba(255,255,255,0.65); padding:0 !important; margin:0; }

  .bg-blob{
    position:fixed;
    border-radius:50%;
    background:rgba(255,255,255,0.05);
    filter:blur(2px);
    z-index:0;
  }
  .blob-a{width:420px;height:420px;top:-120px;left:-160px;}
  .blob-b{width:320px;height:320px;bottom:-100px;right:-100px;}

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:var(--white);
    border-radius:28px;
    padding:38px 32px 32px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04);
    animation:rise .5s ease;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:26px;
  }
  .brand img{
    width:38px;
    height:38px;
    object-fit:contain;
    border-radius:8px;
  }
  .brand span{
    font-weight:800;
    font-size:18px;
    letter-spacing:0.5px;
    color:var(--ink);
  }

  .tabs{
    display:flex;
    gap:28px;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .tab{
    background:none;
    border:none;
    padding:0 0 12px;
    font-size:15px;
    font-weight:700;
    color:var(--muted);
    cursor:pointer;
    position:relative;
    font-family:inherit;
  }
  .tab.active{
    color:var(--accent);
  }
  .tab.active::after{
    content:'';
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    background:var(--accent);
    border-radius:2px;
  }

  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:7px;
  }
  .input-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    transition:border-color .15s ease, box-shadow .15s ease;
    background:var(--white);
  }
  .input-wrap:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(53,87,255,0.12);
  }
  .input-wrap.error{
    border-color:var(--error);
  }
  .input-wrap svg{flex-shrink:0; color:var(--muted);}
  .input-wrap input{
    border:none;
    outline:none;
    flex:1;
    font-size:14.5px;
    color:var(--ink);
    font-family:inherit;
    min-width:0;
    background:transparent;
  }
  .input-wrap input::placeholder{color:#b6b9d0;}
  .eye-btn{
    background:none;
    border:none;
    padding:2px;
    cursor:pointer;
    color:var(--muted);
    display:flex;
    flex-shrink:0;
  }
  .eye-btn:hover{color:var(--ink);}

  .error-text{
    font-size:12px;
    color:var(--error);
    margin-top:6px;
    display:none;
  }
  .error-text.show{display:block;}

  .forgot{
    text-align:right;
    margin:-6px 0 20px;
  }
  .forgot a{
    font-size:12.5px;
    color:var(--accent);
    font-weight:600;
    text-decoration:none;
  }
  .forgot a:hover{text-decoration:underline;}

  .submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
    box-shadow:0 10px 20px -8px rgba(53,87,255,0.55);
  }
  .submit-btn:hover{background:var(--accent-dark);}
  .submit-btn:active{transform:scale(0.99);}
  .submit-btn:disabled{
    background:#d3d6ea;
    color:#9a9dbb;
    cursor:not-allowed;
    box-shadow:none;
  }

  .switch-line{
    text-align:center;
    margin-top:22px;
    font-size:13.5px;
    color:var(--muted);
  }
  .switch-line a{
    color:var(--accent);
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
  }
  .switch-line a:hover{text-decoration:underline;}

  .view{display:none;}
  .view.active{display:block; animation:fadeIn .35s ease;}
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:10;
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.5);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
    pointer-events:auto;
  }
  .toast.success{background:#1c7c4d;}
  .toast.blocked{
    background:#7c1c2b;
    max-width:min(92vw,360px);
    text-align:center;
    line-height:1.5;
  }
  .toast.blocked .toast-actions{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:10px;
  }
  .toast.blocked .toast-actions a{
    flex:1;
    background:#fff;
    color:#7c1c2b;
    text-decoration:none;
    font-size:12.5px;
    font-weight:700;
    padding:9px 10px;
    border-radius:8px;
  }
  .toast.blocked .toast-close{
    position:absolute;
    top:6px;right:8px;
    background:none;border:none;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    opacity:.75;
  }
</style>
</head>
<body>

  <div class="bg-blob blob-a"></div>
  <div class="bg-blob blob-b"></div>

  <div class="card">
    <div class="brand">
      <img src="https://raw.githubusercontent.com/chtesportsofficial/Chteo_img/refs/heads/main/CHTEO%20(1).png" alt="CHT ESP ORG logo">
      <span>CHT ESP ORG</span>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-signin" type="button">Sign in</button>
      <button class="tab" id="tab-create" type="button">Create account</button>
    </div>

    <!-- SIGN IN VIEW -->
    <div class="view active" id="view-signin">
      <div class="field">
        <label for="si-email">Email</label>
        <div class="input-wrap" id="si-email-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" stroke="none"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
          <input type="email" id="si-email" placeholder="Enter your email" autocomplete="email">
        </div>
        <div class="error-text" id="si-email-err">Please enter your email.</div>
      </div>

      <div class="field">
        <label for="si-password">Password</label>
        <div class="input-wrap" id="si-password-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 20 3M17 6l3 3M14 9l2 2"/></svg>
          <input type="password" id="si-password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="eye-btn" onclick="togglePw('si-password', this)">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="error-text" id="si-password-err">Please enter your password.</div>

      <div class="forgot">

      </div>

      <button class="submit-btn" onclick="handleSignin()">Sign in</button>

      <div class="switch-line">
        Don't have an account? <a onclick="switchView('create')">Create account</a>
      </div>
    </div>

    <!-- CREATE ACCOUNT VIEW -->
    <div class="view" id="view-create">
      <div class="field">
        <label for="ca-email">Email</label>
        <div class="input-wrap" id="ca-email-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
          <input type="email" id="ca-email" placeholder="Enter your email" autocomplete="email" oninput="validateCreate()">
        </div>
        <div class="error-text" id="ca-email-err">Email is required.</div>
      </div>

      <div class="field">
        <label for="ca-whatsapp">WhatsApp number</label>
        <div class="input-wrap" id="ca-whatsapp-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 3.5A10.9 10.9 0 0 0 12 0C5.9 0 1 4.9 1 11c0 1.9.5 3.7 1.4 5.3L1 23l6.9-1.3A11 11 0 0 0 12 22c6.1 0 11-4.9 11-11 0-2.9-1.1-5.7-3.1-7.7z" stroke="none" fill="none"/><path d="M17.5 14.4c-.3-.1-1.7-.8-2-1-.3-.1-.5-.1-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.5-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 2-1.4.2-.7.2-1.2.1-1.4-.1-.1-.3-.2-.6-.3z"/><path d="M12 22a10 10 0 0 0 8.7-15A10 10 0 1 0 3.4 20.6L2 22l1.4-.4A10 10 0 0 0 12 22z"/></svg>
          <input type="tel" id="ca-whatsapp" placeholder="e.g. +8801XXXXXXXXX" autocomplete="tel" oninput="validateCreate()">
        </div>
        <div class="error-text" id="ca-whatsapp-err">WhatsApp number is required.</div>
      </div>

      <div class="field">
        <label for="ca-password">Password</label>
        <div class="input-wrap" id="ca-password-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 20 3M17 6l3 3M14 9l2 2"/></svg>
          <input type="password" id="ca-password" placeholder="Create new password" autocomplete="new-password" oninput="validateCreate()">
          <button type="button" class="eye-btn" onclick="togglePw('ca-password', this)">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="error-text" id="ca-password-err">Password must be at least 6 characters.</div>
      </div>

      <div class="field">
        <label for="ca-referral">Referral code</label>
        <div class="input-wrap" id="ca-referral-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.8 1.4 6.8L12 17.3 5.9 20.7l1.4-6.8-5.1-4.8 6.9-.8L12 2z"/></svg>
          <input type="text" id="ca-referral" placeholder="e.g. #2" autocomplete="off" value="#2" oninput="onReferralInput()">
        </div>
        <div class="error-text" id="ca-referral-err">Invalid format, example: #2</div>
      </div>

      <button class="submit-btn" id="create-btn" onclick="handleCreate()" disabled>Create account</button>

      <div class="switch-line">
        Already have an account? <a onclick="switchView('signin')">Sign in</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ----- Supabase setup -----
// এই দুইটা মান আপনার Supabase project → Settings → API থেকে বসান
const SUPABASE_URL = 'https://myfficbwcbgbxbdqjexv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';

let supabaseClient;
try {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e){
  showToast('Supabase init error: ' + e.message);
}

async function handleForgotPassword(){
  const email = document.getElementById('si-email').value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  setError('si-email-wrap','si-email-err', !emailOk);

  if(!emailOk){
    showToast('Enter your email above first, then tap "Forgot your password?".');
    return;
  }

  // Sends a 6-digit code to the email (Supabase's Reset Password email
  // template must use {{ .Token }} — see dashboard note). reset-password.html
  // reads chteo_reset_email from sessionStorage and shows the code-entry step.
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email);

  if(error){
    showToast(error.message);
    return;
  }

  sessionStorage.setItem('chteo_reset_email', email);
  showToast('Code sent — check your email.', true);
  setTimeout(() => {
    window.location.href = 'reset-password.html';
  }, 700);
}

function switchView(view){
  document.getElementById('tab-signin').classList.toggle('active', view==='signin');
  document.getElementById('tab-create').classList.toggle('active', view==='create');
  document.getElementById('view-signin').classList.toggle('active', view==='signin');
  document.getElementById('view-create').classList.toggle('active', view==='create');
  document.title = view === 'signin' ? 'CHTEO — Sign in' : 'CHTEO — Create account';
}

var tabSigninEl = document.getElementById('tab-signin');
var tabCreateEl = document.getElementById('tab-create');

tabSigninEl.addEventListener('click', function(){ switchView('signin'); });
tabCreateEl.addEventListener('click', function(){ switchView('create'); });

function togglePw(inputId, btn){
  const input = document.getElementById(inputId);
  const icon = btn.querySelector('.eye-icon');
  if(input.type === 'password'){
    input.type = 'text';
    icon.innerHTML = '<path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-7 0-11-7-11-7a19.6 19.6 0 0 1 4.2-5.1M9.5 5.4A9.9 9.9 0 0 1 12 5c7 0 11 7 11 7a19.6 19.6 0 0 1-2.5 3.4M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M1 1l22 22"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function showToast(msg, success){
  const t = document.getElementById('toast');
  t.classList.remove('blocked');
  t.style.position = '';
  t.textContent = msg;
  t.classList.toggle('success', !!success);
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

// Blocked accounts get their own toast: it doesn't auto-hide (so there's
// time to actually read and tap it) and it has real WhatsApp/email links,
// since "contact support" with no way to contact support isn't useful.
function showBlockedToast(){
  const t = document.getElementById('toast');
  clearTimeout(window._toastTimer);
  t.classList.remove('success');
  t.classList.add('blocked');
  t.style.position = 'fixed';
  t.innerHTML =
    '<button type="button" class="toast-close" onclick="this.parentElement.classList.remove(\'show\')">&#10005;</button>' +
    'Your account has been blocked.<br>Contact support if you think this is a mistake.' +
    '<div class="toast-actions">' +
      '<a href="https://wa.me/8801989242505" target="_blank" rel="noopener">WhatsApp</a>' +
      '<a href="mailto:cht.eSports.official@gmail.com">Email</a>' +
    '</div>';
  t.classList.add('show');
}

function setError(wrapId, errId, show){
  document.getElementById(wrapId).classList.toggle('error', show);
  document.getElementById(errId).classList.toggle('show', show);
}

const WALLET_SYNC_URL = 'https://cht.gamer.gd/api/sync-wallet.php';

async function syncWalletWithSupabase(session){
  if(!session || !session.access_token){
    return { success:false, message:'Supabase access token is missing.' };
  }

  try {
    const response = await fetch(WALLET_SYNC_URL, {
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + session.access_token,
        'Accept': 'application/json'
      },
      cache: 'no-store'
    });

    const text = await response.text();
    console.log('[Wallet Sync] HTTP:', response.status);
    console.log('[Wallet Sync] Response:', text);

    let result;
    try {
      result = JSON.parse(text);
    } catch(e) {
      return {
        success:false,
        message:'Wallet server returned an invalid response.',
        httpStatus:response.status,
        raw:text
      };
    }

    if(!response.ok || !result.success){
      return {
        success:false,
        message: result.message || 'Wallet synchronization failed.',
        httpStatus:response.status,
        data:result
      };
    }

    return { success:true, data:result };

  } catch(error) {
    console.error('[Wallet Sync] Fetch error:', error);
    return {
      success:false,
      message:'Could not connect to wallet server.',
      error:error.message
    };
  }
}

async function handleSignin(){
  const email = document.getElementById('si-email').value.trim();
  const pw = document.getElementById('si-password').value;
  let ok = true;
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  setError('si-email-wrap','si-email-err', !emailOk);
  if(!emailOk) ok = false;
  setError('si-password-wrap','si-password-err', pw.length === 0);
  if(pw.length === 0) ok = false;

  if(!ok){
    showToast('Please fill in all fields correctly.');
    return;
  }

  const submitBtn = document.querySelector('#view-signin .submit-btn');
  submitBtn.disabled = true;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pw });

  submitBtn.disabled = false;

  if(error){
    showToast(error.message);
    return;
  }

  // Supabase login is successful at this point. Sync the same session
  // with the PHP/MySQL wallet system before redirecting. If the wallet
  // server fails, login is NOT cancelled; the user can still enter the
  // website and the exact wallet error is logged for diagnosis.
  const walletResult = await syncWalletWithSupabase(data.session);

  if(!walletResult.success){
    console.error('[Wallet Sync] Failed:', walletResult);
    showToast('Login successful. Wallet sync failed: ' + walletResult.message);
  }

  // Blocked-user check: a correct password shouldn't be enough to get a
  // banned account past this screen. Look up the fresh profiles row
  // (not any locally-cached copy) and immediately sign back out if the
  // admin has flagged this account.
  const { data: gateProfile, error: gateErr } = await supabaseClient
    .from('profiles')
    .select('is_banned')
    .eq('id', data.user.id)
    .single();

  if(gateErr){
    console.error('Could not verify account status:', gateErr.message);
  } else if(gateProfile && gateProfile.is_banned){
    await supabaseClient.auth.signOut();
    showBlockedToast();
    return;
  }

  // Wipe any cached team name / slogan / profile picture from whoever
  // was last signed in on this device/browser before this one.
  localStorage.removeItem('user_profile');
  localStorage.removeItem('profile_picture');
  localStorage.removeItem('user_uid');
  localStorage.setItem('chteo_logged_in', 'true');

  // Pull this user's real row (email, whatsapp, uid...) from Supabase
  // BEFORE redirecting, so profile.html / index.html don't briefly (or
  // permanently, on a fresh browser) show placeholder default values.
  if (window.CHTEO && window.CHTEO.syncProfile) {
    await window.CHTEO.syncProfile();
  }

  if(walletResult.success){
    showToast('Signed in successfully. Wallet connected.', true);
  } else {
    // Keep the login successful. The detailed wallet response is visible
    // in the browser console and the user is still redirected normally.
  }

  setTimeout(() => {
    // replace(), not href: this sign-in screen shouldn't linger as a
    // dead entry in history — otherwise one Back press from the home
    // page would land the user right back on the login form instead
    // of wherever they actually came from.
    window.location.replace('index.html');
  }, 700);
}

// Tracks the result of the async "does this UID actually exist in
// Supabase" check, separate from the plain #<digits> format check.
// 'ok' = empty field, or a code that was confirmed to exist
// 'checking' = a lookup is in flight (or pending, about to start)
// 'invalid' = format is fine but no matching profile row was found
let refUidState = 'ok';
// The exact referral string (e.g. '#2') that refUidState currently
// describes. Used to detect "the field changed since we last verified
// it" so a stale 'ok' can never be reused for a different value.
let refUidCheckedValue = null;
let refCheckSeq = 0;
let refDebounceTimer = null;
const REF_FORMAT_ERR_TEXT = 'Invalid format, example: #2';
const REF_UID_ERR_TEXT = 'Invalid UID — this referral code does not exist.';
const REF_UID_CHECK_FAIL_TEXT = 'Could not verify referral code, please try again.';

function validateCreate(){
  const email = document.getElementById('ca-email').value.trim();
  const wa = document.getElementById('ca-whatsapp').value.trim();
  const pw = document.getElementById('ca-password').value;
  const ref = document.getElementById('ca-referral').value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const waOk = wa.length >= 8;
  const pwOk = pw.length >= 6;
  // Referral is optional — an empty field silently falls back to the
  // site's default code (#2) at signup, so it's only "invalid" if the
  // person typed something that doesn't match the #<digits> format.
  const refFormatOk = ref === '' || /^#\d+$/.test(ref);

  if(!refFormatOk){
    // Format error takes priority over the UID-existence message —
    // reset that state and cancel any in-flight/pending lookup so a
    // stale "UID doesn't exist" text can't linger once the user fixes
    // the format.
    clearTimeout(refDebounceTimer);
    refCheckSeq++;
    refUidState = 'ok';
    refUidCheckedValue = null;
    document.getElementById('ca-referral-err').textContent = REF_FORMAT_ERR_TEXT;
  }

  // The button is gated on FORMAT only — a nonexistent uid is no longer
  // a hard block. handleCreate() below silently swaps it for the
  // default #2 code instead of stopping the signup. The "Invalid UID"
  // text/red border still shows (via checkReferralUid) purely as a
  // heads-up to the person typing it.
  document.getElementById('create-btn').disabled = !(emailOk && waOk && pwOk && refFormatOk);
  return {emailOk, waOk, pwOk, refFormatOk};
}

function onReferralInput(){
  const ref = document.getElementById('ca-referral').value.trim();
  clearTimeout(refDebounceTimer);
  refCheckSeq++; // invalidates any lookup already in flight for the old value

  if(ref === '' || !/^#\d+$/.test(ref)){
    validateCreate(); // shows/clears the format error as needed
    return;
  }

  // Mark this value as unverified THE INSTANT it's typed/pasted — not
  // only once the 400ms debounce timer fires. Without this, pasting a
  // code and clicking "Create account" within that window would submit
  // while refUidState still held the *previous* value's 'ok' result,
  // letting a nonexistent uid slip through.
  refUidState = 'checking';
  refUidCheckedValue = null;
  validateCreate();
  refDebounceTimer = setTimeout(checkReferralUid, 400);
}

// Looks the referral code's digits up via the referral_uid_exists()
// Supabase RPC function (see referral_check_function.sql) — this
// avoids depending on the profiles table's RLS policies, since this
// check runs on the signup form before the visitor is logged in.
async function checkReferralUid(){
  const ref = document.getElementById('ca-referral').value.trim();

  if(ref === ''){
    refUidState = 'ok';
    refUidCheckedValue = ref;
    setError('ca-referral-wrap','ca-referral-err', false);
    validateCreate();
    return;
  }
  if(!/^#\d+$/.test(ref)){
    return; // format invalid — validateCreate() already handles this case
  }

  const digits = ref.slice(1);
  const mySeq = ++refCheckSeq;
  refUidState = 'checking';
  refUidCheckedValue = null;
  validateCreate();

  const { data, error } = await supabaseClient
    .rpc('referral_uid_exists', { check_uid: digits });

  if(mySeq !== refCheckSeq) return; // field changed again while this was in flight

  refUidCheckedValue = ref;
  if(error){
    console.error('Referral UID check failed:', error.message);
    refUidState = 'invalid';
    document.getElementById('ca-referral-err').textContent = REF_UID_CHECK_FAIL_TEXT;
    setError('ca-referral-wrap','ca-referral-err', true);
  } else if(!data){
    refUidState = 'invalid';
    document.getElementById('ca-referral-err').textContent = REF_UID_ERR_TEXT;
    setError('ca-referral-wrap','ca-referral-err', true);
  } else {
    refUidState = 'ok';
    setError('ca-referral-wrap','ca-referral-err', false);
  }

  validateCreate();
}

async function handleCreate(){
  const {emailOk, waOk, pwOk, refFormatOk} = validateCreate();
  setError('ca-email-wrap','ca-email-err', !emailOk);
  setError('ca-whatsapp-wrap','ca-whatsapp-err', !waOk);
  setError('ca-password-wrap','ca-password-err', !pwOk);
  setError('ca-referral-wrap','ca-referral-err', !refFormatOk);

  if(!(emailOk && waOk && pwOk && refFormatOk)){
    showToast('Please fill in all required fields to create an account.');
    return;
  }

  // Make sure we know whether the typed uid actually exists before
  // deciding what referral value to submit — force a fresh check
  // unless it's already been verified against exactly what's in the
  // field right now (see refUidCheckedValue above).
  const currentRef = document.getElementById('ca-referral').value.trim();
  if(!(currentRef === '' || (currentRef === refUidCheckedValue && refUidState !== 'checking'))){
    clearTimeout(refDebounceTimer);
    await checkReferralUid();
  }

  const email = document.getElementById('ca-email').value.trim();
  const pw = document.getElementById('ca-password').value;
  const whatsapp = document.getElementById('ca-whatsapp').value.trim();
  // Empty field, or a uid that doesn't actually exist → silently fall
  // back to the site's default code (#2) instead of blocking signup.
  const typedRef = document.getElementById('ca-referral').value.trim();
  const referral = (typedRef === '' || refUidState === 'invalid') ? '#2' : typedRef;

  const createBtn = document.getElementById('create-btn');
  createBtn.disabled = true;

  // Wipe any team name / slogan / profile picture left over in this
  // browser's localStorage from a PREVIOUS account (localStorage is
  // per-device, not per-account, so without this a brand new signup
  // would inherit whatever the last person on this device had set).
  localStorage.removeItem('user_profile');
  localStorage.removeItem('profile_picture');
  localStorage.removeItem('user_uid');

  // whatsapp o referral eta user_metadata hisebe save hocche —
  // pore Supabase dashboard e Authentication > Users e giye dekha jabe
  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password: pw,
    options: { data: { whatsapp, referral } }
  });

  createBtn.disabled = false;

  if(error){
    showToast(error.message);
    return;
  }

  localStorage.setItem('chteo_logged_in', 'true');
  localStorage.setItem('chteo_referral', referral);

  if(data.session){
    // Give the Supabase trigger (which inserts the profiles row on new
    // auth.users signup) a brief moment, then pull the real row down so
    // profile.html shows the actual email/UID instead of placeholders.
    if (window.CHTEO && window.CHTEO.syncProfile) {
      await new Promise(r => setTimeout(r, 400));
      await window.CHTEO.syncProfile();
    }

    // If Supabase returned a session immediately, create the matching
    // wallet_users row as part of the same signup flow.
    const walletResult = await syncWalletWithSupabase(data.session);
    if(!walletResult.success){
      console.error('[Wallet Sync] Signup wallet sync failed:', walletResult);
    }

    showToast('Account created successfully. Redirecting...', true);
    setTimeout(() => {
      // replace(), not href — see the note in handleSignin() above.
      window.location.replace('index.html');
    }, 700);
  } else {
    // email confirmation on thakle session immediately thakbe na
    showToast('Account created! Please check your email to confirm.', true);
  }
}
document.addEventListener('DOMContentLoaded', function(){
  // Landed here because global.js's ban watcher (or the login gate
  // above) just signed a blocked account out — let them know why.
  if(new URLSearchParams(window.location.search).get('blocked') === '1'){
    showBlockedToast();
  }

  // A referral link (from refer-earn.html) looks like
  // ...chteo_auth.html?ref=<uid> — land straight on Create Account with
  // the code pre-filled, instead of making the invited friend find the
  // tab and type the code in themselves.
  const ref = new URLSearchParams(window.location.search).get('ref');
  if(ref){
    const digits = ref.replace(/\D/g, '');
    if(digits){
      document.getElementById('ca-referral').value = '#' + digits;
      switchView('create');
    }
  }
  validateCreate();
  // Check whether the default (#2) or ?ref=-supplied code is a real uid.
  checkReferralUid();
});
</script>
