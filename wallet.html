<script>
function getProfile(){
  try { return JSON.parse(localStorage.getItem('user_profile') || '{}'); }
  catch(e){ return {}; }
}
function renderUid(){
  const uidChip=document.getElementById('uidChip');
  if(!uidChip) return;
  const profile=getProfile();
  const uid = profile.uid || localStorage.getItem('user_uid');
  uidChip.textContent = 'UID: ' + (uid ? ('#' + uid) : '—');
}
renderUid();
// Same reasoning as profile.html: global.js's Supabase sync can resolve
// after this page has already rendered from cached/placeholder data.
document.addEventListener('chteo:profile-synced', renderUid);

function showPanel(which){
  const panelAdd = document.getElementById('panelAdd');
  const panelWithdraw = document.getElementById('panelWithdraw');
  const tabAdd = document.getElementById('tabAdd');
  const tabWithdraw = document.getElementById('tabWithdraw');

  if(which === 'add'){
    panelAdd.classList.add('active');
    panelWithdraw.classList.remove('active');
    tabAdd.classList.add('active-add');
    tabWithdraw.classList.remove('active-withdraw');
  } else {
    panelWithdraw.classList.add('active');
    panelAdd.classList.remove('active');
    tabWithdraw.classList.add('active-withdraw');
    tabAdd.classList.remove('active-add');
  }
}

function updateNumberLabel(){
  const method = document.getElementById('paymentMethod').value;
  const input = document.getElementById('numberInput');
  input.value = '';
  input.placeholder = method ? ('Enter your ' + method + ' number') : 'Enter your number';
}

// Tracks the uid we last fetched balance for, so a repeat call with the
// same uid (e.g. from the profile-synced event firing after the cached
// load already succeeded) doesn't re-fetch unnecessarily.
let _walletLastFetchedUid = null;
const WALLET_CACHE_KEY = 'cached_balance';
const WALLET_CACHE_UID_KEY = 'cached_balance_uid';

// Bangladeshi/Indian digit grouping: last 3 digits together, then every
// 2 digits after that — e.g. 10000000 -> "1,00,00,000" (1 crore).
function formatBDT(amount){
  const num = Number(amount);
  if (isNaN(num)) return String(amount);
  const isNegative = num < 0;
  const parts = Math.abs(num).toString().split('.');
  let intPart = parts[0];
  const decPart = parts[1];

  let formatted;
  if (intPart.length <= 3) {
    formatted = intPart;
  } else {
    const lastThree = intPart.slice(-3);
    const rest = intPart.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    formatted = rest + ',' + lastThree;
  }
  if (decPart) formatted += '.' + decPart;
  return (isNegative ? '-' : '') + formatted;
}

// wallet_deposit_requests.created_at is stored in the server's UTC time;
// convert explicitly to Asia/Dhaka for display.
function formatDhakaTime(mysqlDatetime){
  if (!mysqlDatetime) return '';
  const isoUtc = mysqlDatetime.replace(' ', 'T') + 'Z';
  const d = new Date(isoUtc);
  if (isNaN(d.getTime())) return mysqlDatetime;
  return d.toLocaleString('en-GB', {
    timeZone: 'Asia/Dhaka',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
    hour12: false
  }).replace(',', '');
}

/* ============ Get Supabase access_token (for endpoints that verify it) ============
   SECURITY NOTE: never send the raw `supabase_uid` to the backend as proof
   of identity — anyone can edit localStorage and claim to be any uid. The
   backend now verifies the real Supabase access_token instead, so this
   page must send that token, not the uid.
   Tries, in order:
     1. A Supabase client already exposed by global.js (window.supabaseClient
        or window.supabase, if it has .auth.getSession()).
     2. The Supabase JS SDK's own default localStorage session key
        (sb-<project-ref>-auth-token), which the SDK writes automatically
        when persistSession is on (the default).
   Returns a Promise<string|null>. */
async function getSupabaseAccessToken(){
  try {
    const client = window.supabaseClient || window.supabase;
    if (client && client.auth && typeof client.auth.getSession === 'function'){
      const { data } = await client.auth.getSession();
      if (data && data.session && data.session.access_token){
        return data.session.access_token;
      }
    }
  } catch (e){
    console.warn('getSupabaseAccessToken: SDK getSession failed', e);
  }

  // Fallback: read the SDK's own persisted session directly.
  try {
    const key = Object.keys(localStorage).find(function(k){
      return k.indexOf('-auth-token') !== -1 && k.indexOf('sb-') === 0;
    });
    if (key){
      const raw = JSON.parse(localStorage.getItem(key));
      const token = (raw && raw.access_token) || (raw && raw.currentSession && raw.currentSession.access_token);
      if (token) return token;
    }
  } catch (e){
    console.warn('getSupabaseAccessToken: localStorage fallback failed', e);
  }

  return null;
}

// Render's free-tier backend goes to sleep after inactivity — the first
// request after that can take 30-50s to wake it up. Without a timeout,
// a plain fetch() can also just hang indefinitely on a flaky connection.
// AbortController gives us a hard cutoff so we always reach either
// success or the retry/fallback path below, never stay stuck.
function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
}

// Render's free-tier backend sleeps after inactivity and can take
// 30-50s+ to wake up on the first request. Fire a lightweight,
// fire-and-forget "warm-up" ping to the same host the moment this
// script runs, so the wake-up starts immediately in the background —
// by the time loadWalletBalance()'s real fetch goes out, the backend
// has already had a head start waking up instead of starting cold.
fetch('https://chteo-api.onrender.com/api/get-balance.php?uid=warmup', { mode: 'no-cors' }).catch(function(){});

const WALLET_BALANCE_TIMEOUT_MS = 20000;
const WALLET_BALANCE_MAX_ATTEMPTS = 3;

function loadWalletBalance(attempt){
  attempt = attempt || 1;
  const profile = getProfile();
  const uid = localStorage.getItem('supabase_uid') || profile.supabase_uid;
  const balanceEl = document.getElementById('balanceAmount');
  const withdrawableEl = document.getElementById('withdrawableBalance');
  const nonWithdrawableEl = document.getElementById('nonWithdrawableBalance');
  if(!uid || !balanceEl) return;

  const cachedUid = localStorage.getItem(WALLET_CACHE_UID_KEY);
  const cached = localStorage.getItem(WALLET_CACHE_KEY);
  if(attempt === 1){
    if(cached !== null && cachedUid === uid){
      balanceEl.textContent = '৳' + formatBDT(cached);
    } else {
      balanceEl.textContent = '...';
    }
  }

  if(uid === _walletLastFetchedUid) return;

  fetchWithTimeout('https://chteo-api.onrender.com/api/get-balance.php?uid=' + encodeURIComponent(uid), WALLET_BALANCE_TIMEOUT_MS)
    .then(res => res.json())
    .then(data => {
      _walletLastFetchedUid = uid;
      if(data.success){
        const total = Number(data.balance || 0);
        const withdrawable = Number(data.withdrawable_balance || 0);
        const nonWithdrawable = Number(data.non_withdrawable_balance || 0);

        balanceEl.textContent = '৳' + formatBDT(total);
        if(withdrawableEl) withdrawableEl.textContent = '৳' + formatBDT(withdrawable);
        if(nonWithdrawableEl) nonWithdrawableEl.textContent = '৳' + formatBDT(nonWithdrawable);

        localStorage.setItem(WALLET_CACHE_KEY, total);
        localStorage.setItem(WALLET_CACHE_UID_KEY, uid);
      } else {
        balanceEl.textContent = '৳0';
        if(withdrawableEl) withdrawableEl.textContent = '৳0';
        if(nonWithdrawableEl) nonWithdrawableEl.textContent = '৳0';
        localStorage.removeItem(WALLET_CACHE_KEY);
        localStorage.removeItem(WALLET_CACHE_UID_KEY);
      }
    })
    .catch(err => {
      console.warn('Wallet balance load failed (attempt ' + attempt + '):', err);
      // Retry a couple more times (server may just be waking up) before
      // giving up — never leave the UI frozen on "..." like before.
      if(attempt < WALLET_BALANCE_MAX_ATTEMPTS){
        setTimeout(() => loadWalletBalance(attempt + 1), 4000);
      } else if(cached !== null && cachedUid === uid){
        balanceEl.textContent = '৳' + formatBDT(cached);
      } else {
        // TEMP DEBUG: show the real error under "Tap to retry" so we can
        // see the actual failure reason from a screenshot, no DevTools
        // needed. Remove this debug line once the root cause is fixed.
        const debugMsg = (err && (err.name + ': ' + err.message)) || String(err);
        balanceEl.innerHTML = '<span style="cursor:pointer;text-decoration:underline;" onclick="_walletLastFetchedUid=null;loadWalletBalance();">Tap to retry</span>' +
          '<div style="font-size:11px;color:#ef4444;margin-top:6px;font-weight:400;text-decoration:none;">' + debugMsg.replace(/</g,'&lt;') + '</div>';
      }
    });
}
loadWalletBalance();
document.addEventListener('chteo:profile-synced', function(){ _walletLastFetchedUid = null; loadWalletBalance(); });

// Mobile browsers can restore this page from the back-forward cache
// (bfcache) — e.g. user taps away to another page, then hits Back —
// without re-running any of the script above. If the balance was still
// mid-fetch (or stuck showing "...") at the moment they navigated away,
// bfcache restore would otherwise freeze it there forever, since nothing
// re-triggers loadWalletBalance(). Force a fresh fetch on every bfcache
// restore so the balance is never left stale/stuck.
window.addEventListener('pageshow', function(evt){
  if (evt.persisted) {
    _walletLastFetchedUid = null;
    loadWalletBalance();
  }
});

/* ============ Recent Transactions (deposit request history) ============ */
function escapeHtmlWallet(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Icons + labels for each transaction category. 'category' comes from the
// backend (get-wallet-history.php), which normalizes deposit/withdraw/prize
// (and falls back to 'other' for anything unrecognized).
const HISTORY_CATEGORY_META = {
  deposit:  { icon: '&#8600;', label: 'Deposit' },
  withdraw: { icon: '&#8599;', label: 'Withdraw' },
  prize:    { icon: '&#127942;', label: 'Prize' },
  other:    { icon: '&#8595;', label: 'Transaction' }
};

function renderHistory(entries){
  const area = document.getElementById('historyArea');
  if (!area) return;
  if (!entries || !entries.length){
    area.innerHTML = '<div class="history-card">No transactions yet.</div>';
    return;
  }
  area.innerHTML = entries.map(function(e){
    const cat = HISTORY_CATEGORY_META[e.category] ? e.category : 'other';
    const meta = HISTORY_CATEGORY_META[cat];
    // Tournament fees are debits, so show a debit arrow and the real description.
    const isTournamentFee = e.direction === 'debit' && /tournament entry fee/i.test(String(e.description || ''));
    const displayLabel = isTournamentFee ? 'Tournament entry fee' : meta.label;
    // Use the backend's explicit direction (credit/debit) for the sign/color,
    // not the display category - an 'Adjustment' entry (category 'other')
    // can still be a debit (e.g. a tournament entry fee) and must show '-'.
    const isDebit = e.direction === 'debit';
    const sign = isDebit ? '-' : '+';
    const amountClass = isDebit ? 'withdraw' : cat; // reuse withdraw's red styling for any debit
    const sub = e.method ? (escapeHtmlWallet(e.method) + ' &middot; ') : '';
    return '<div class="history-entry">' +
      '<div class="he-left">' +
        '<div class="he-icon ' + cat + '">' + meta.icon + '</div>' +
        '<div>' +
          '<div class="he-amount ' + amountClass + '">' + sign + '৳' + formatBDT(e.amount) + '</div>' +
          '<div class="he-sub">' + displayLabel + ' &middot; ' + sub + escapeHtmlWallet(formatDhakaTime(e.created_at)) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="he-status ' + escapeHtmlWallet(e.status) + '">' + escapeHtmlWallet(e.status).toUpperCase() + '</div>' +
    '</div>';
  }).join('');
}

async function loadWalletHistory(){
  const token = await getSupabaseAccessToken();
  if (!token) return;

  fetch('https://chteo-api.onrender.com/get-wallet-history.php', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ access_token: token })
  })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res && res.success){
        renderHistory(res.history);
      }
    })
    .catch(function(err){
      console.warn('Wallet history load failed:', err);
    });
}
loadWalletHistory();
document.addEventListener('chteo:profile-synced', loadWalletHistory);

/* ============ Deposit submission (manual bKash/Nagad review) ============ */
function showDepositMsg(text, isError){
  const el = document.getElementById('depositMsg');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? '#ef4444' : '#22c55e';
}

function showDepositModal(isSuccess, title, text){
  document.getElementById('depositModalIcon').textContent = isSuccess ? '\u2705' : '\u26A0\uFE0F';
  document.getElementById('depositModalTitle').textContent = title;
  document.getElementById('depositModalText').textContent = text;
  document.getElementById('depositModalOverlay').classList.add('active');
}

document.getElementById('depositModalClose').addEventListener('click', function(){
  document.getElementById('depositModalOverlay').classList.remove('active');
});

document.getElementById('depositSubmitBtn').addEventListener('click', async function(){
  const btn = document.getElementById('depositSubmitBtn');
  const method = document.getElementById('depositMethod').value;
  const amount = document.getElementById('depositAmount').value;
  const senderNumber = document.getElementById('depositSenderNumber').value.trim();
  const trxId = document.getElementById('depositTrxId').value.trim();

  showDepositMsg('', false);

  const accessToken = await getSupabaseAccessToken();
  if(!accessToken){
    showDepositMsg('Please sign in first.', true);
    return;
  }
  if(!method){
    showDepositMsg('Select a payment method.', true);
    return;
  }
  if(!amount || Number(amount) <= 0){
    showDepositMsg('Enter a valid amount.', true);
    return;
  }
  if(!/^01[0-9]{9}$/.test(senderNumber)){
    showDepositMsg('Enter a valid 11-digit number (01XXXXXXXXX).', true);
    return;
  }
  if(!trxId || trxId.length < 6){
    showDepositMsg('Enter a valid Transaction ID.', true);
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Submitting...';

  fetch('https://chteo-api.onrender.com/submit-deposit-request.php', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      access_token: accessToken,
      method: method,
      amount: amount,
      sender_number: senderNumber,
      trx_id: trxId
    })
  })
    .then(function(r){ return r.json(); })
    .then(function(res){
      btn.disabled = false;
      btn.textContent = 'Deposit';
      if(res && res.status){
        showDepositModal(
          true,
          'Request Submitted',
          res.message || 'Your deposit request was submitted and will be reviewed by an admin shortly. Need it faster or have an issue? Message us on WhatsApp.'
        );
        document.getElementById('depositAmount').value = '';
        document.getElementById('depositSenderNumber').value = '';
        document.getElementById('depositTrxId').value = '';
        document.getElementById('depositMethod').selectedIndex = 0;
      } else {
        showDepositModal(
          false,
          'Submission Failed',
          (res && res.message) || 'Something went wrong submitting your deposit request. Please try again, or contact us on WhatsApp.'
        );
      }
    })
    .catch(function(err){
      btn.disabled = false;
      btn.textContent = 'Deposit';
      showDepositModal(
        false,
        'Connection Error',
        'Could not reach the server: ' + err.message + '. Please try again, or contact us on WhatsApp.'
      );
    });
});

/* ============ Withdraw request ============ */
function showWithdrawMsg(text, isError){
  const el = document.getElementById('withdrawMsg');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? '#ef4444' : '#22c55e';
}

document.getElementById('withdrawSubmitBtn').addEventListener('click', async function(){
  const btn = document.getElementById('withdrawSubmitBtn');
  const method = document.getElementById('paymentMethod').value;
  const amount = Number(document.getElementById('withdrawAmount').value);
  const accountNumber = document.getElementById('numberInput').value.trim();

  showWithdrawMsg('', false);

  const accessToken = await getSupabaseAccessToken();
  if(!accessToken){
    showWithdrawMsg('Please sign in first.', true);
    return;
  }
  if(!method){
    showWithdrawMsg('Select a payment method.', true);
    return;
  }
  if(!amount || amount < 50){
    showWithdrawMsg('Minimum withdraw is 50 BDT.', true);
    return;
  }
  if(!/^01[0-9]{9}$/.test(accountNumber)){
    showWithdrawMsg('Enter a valid 11-digit number (01XXXXXXXXX).', true);
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try{
    const res = await fetch('https://chteo-api.onrender.com/api/submit-withdraw-request.php', {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({
        access_token: accessToken,
        method: method,
        amount: amount,
        account_number: accountNumber
      })
    });
    const data = await res.json();

    if(data && data.success){
      showWithdrawMsg(data.message || 'Withdrawal request submitted successfully.', false);
      document.getElementById('withdrawAmount').value = '';
      document.getElementById('numberInput').value = '';
      document.getElementById('paymentMethod').selectedIndex = 0;
      _walletLastFetchedUid = null;
      loadWalletBalance();
    }else{
      showWithdrawMsg((data && data.message) || 'Withdrawal request failed.', true);
    }
  }catch(err){
    showWithdrawMsg('Could not reach the server. Please try again.', true);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Request Withdraw';
  }
});
</script>
