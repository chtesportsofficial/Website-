<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHT ESP ORG — Support</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<style>
:root{
  --bg:#0a0d13;--bg-alt:#0d1119;--surface:#131826;--surface-2:#171d2d;
  --line:#232b3d;--fire:#ff5a2e;--fire-2:#ff8a3d;--green:#22e08a;
  --cyan:#21e6c1;--text:#eef1f7;--text-dim:#8b93a9;--text-dimmer:#5b6379;
  --danger:#ff3d5a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Bengali",sans-serif}
button{font-family:inherit;cursor:pointer}
.app{
 width:100%;min-height:100vh;margin:auto;background:
 radial-gradient(120% 60% at 15% 0%,rgba(255,90,46,.10),transparent 55%),
 radial-gradient(90% 50% at 100% 10%,rgba(33,230,193,.07),transparent 55%),var(--bg);
 overflow:hidden;position:relative
}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(10,13,19,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--text-dim);flex-shrink:0}
.icon-btn svg{width:19px;height:19px}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:.02em}

.section{padding:26px 16px 4px}
.headline{text-align:center;font-size:22px;font-weight:900;margin-bottom:8px}
.subtext{text-align:center;color:var(--text-dim);font-size:13px;line-height:1.6;margin:0 auto 26px;max-width:320px}

.support-card{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(145deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:16px;
  padding:15px 15px;margin-bottom:14px;
  text-decoration:none;color:inherit;
  transition:border-color .15s ease, transform .1s ease;
}
.support-card:active{transform:scale(.99)}
.support-card:hover{border-color:#334063}

.s-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-icon.wa{background:#22e08a;box-shadow:0 0 16px rgba(34,224,138,.35)}
.s-icon.mail{background:linear-gradient(135deg,var(--fire),var(--fire-2));box-shadow:0 0 16px rgba(255,90,46,.3)}
.s-icon svg{width:24px;height:24px}

.s-info{flex:1;min-width:0}
.s-info .t{font-weight:800;font-size:14.5px;margin-bottom:3px}
.s-info .d{font-size:12.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.s-chev{color:var(--text-dim);flex-shrink:0}
.s-chev svg{width:19px;height:19px}

.app-footer{text-align:center;font-size:10.5px;color:var(--text-dimmer);padding:18px 16px 20px}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="icon-btn" onclick="window.location.href='index.html'" style="cursor:pointer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </div>
    <h1>Support</h1>
  </div>

  <div class="section">
    <div class="headline">Need Help?</div>
    <p class="subtext">If you have any questions or need assistance, our support team is here to help.</p>

    <a class="support-card" href="https://wa.me/8801989242505" target="_blank" rel="noopener">
      <div class="s-icon wa">
        <svg viewBox="0 0 24 24" fill="#052e1c"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.28-1.38a9.87 9.87 0 0 0 4.71 1.2h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.16c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.12.11-1.81-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.15-4.9-4.34-.14-.19-1.17-1.56-1.17-2.97 0-1.41.74-2.1 1-2.39.26-.28.57-.35.76-.35.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.58.81 2 .88 2.14.07.15.12.32.02.52-.1.19-.15.31-.29.48-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.36 1.46.29.15.46.13.63-.08.17-.2.72-.84.92-1.13.19-.28.39-.24.65-.14.27.1 1.7.8 1.99.95.29.14.48.22.55.34.08.13.08.72-.16 1.4z"/></svg>
      </div>
      <div class="s-info">
        <div class="t">WhatsApp Support</div>
        <div class="d">Chat with us on WhatsApp</div>
      </div>
      <div class="s-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
    </a>

    <a class="support-card" href="https://mail.google.com/mail/?view=cm&fs=1&to=cht.eSports.official@gmail.com" target="_blank" rel="noopener">
      <div class="s-icon mail">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </div>
      <div class="s-info">
        <div class="t">Email Support</div>
        <div class="d">cht.eSports.official@gmail.com</div>
      </div>
      <div class="s-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
    </a>
  </div>

  <div class="app-footer">©CHT ESP ORG. All Rights Reserved</div>

</div>

</body>
</html>
