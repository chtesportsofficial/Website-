<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tournament Management — CHT ESP ORG</title>
<style>
body{margin:0;background:#0a0d13;color:#f2f3f7;font-family:Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 15px 120px}
.head{display:flex;gap:12px;align-items:center;margin-bottom:16px}.back{color:#fff;text-decoration:none;font-size:26px}
h1{font-size:20px;margin:0}.sub{font-size:11px;color:#8992a6;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
button{position:relative;z-index:100;pointer-events:auto;touch-action:manipulation;cursor:pointer;border:1px solid #263047;background:#141a29;color:#fff;border-radius:12px;padding:11px;font-weight:800;font-size:11px}
.primary{background:#22c55e;color:#07100a;border-color:#22c55e}
.panel{background:#141a29;border:1px solid #263047;border-radius:17px;padding:13px;margin-bottom:13px}
.ph{display:flex;justify-content:space-between;align-items:center}.ph b{font-size:13px}.count{color:#8c96aa;font-size:10px}
.item{background:#181f30;border:1px solid #29344c;border-radius:14px;padding:10px;margin-top:8px}
.item-head{display:flex;align-items:center;gap:10px;min-width:0}.item-main{flex:1;min-width:0}.name{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#929caf;line-height:1.5;margin-top:4px}
.edit-top{padding:7px 10px;font-size:9px;color:#62e58a;flex-shrink:0}.drag-handle{width:30px;height:32px;padding:0;border:0;background:transparent;color:#8992a6;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;flex-shrink:0}.drag-handle:active{cursor:grabbing}
.t-card{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:stretch}.t-thumb{width:82px;height:62px;border-radius:9px;object-fit:cover;background:#101522;border:1px solid #29344c}.t-content{min-width:0}.t-actions{display:flex;align-items:center;gap:7px;margin-top:9px}.danger{color:#ff7777}.archive-btn{color:#f3c86b}
.badge{font-size:8px;border-radius:99px;padding:4px 7px;background:#222b40;color:#c5cede;vertical-align:middle}.badge.on{color:#62e58a}.badge.off{color:#ff9aa5}
.switch{width:58px;height:30px;padding:0;border-radius:99px;border:1px solid #34405a;background:#273044;position:relative;flex-shrink:0}.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#eef2f7;transition:.18s;box-shadow:0 1px 5px #0008}.switch.on{background:#18cf65;border-color:#18cf65}.switch.on .knob{left:31px}.switch-label{font-size:8px;font-weight:900;position:absolute;left:9px;top:8px;color:#0b2b19}.switch:not(.on) .switch-label{left:30px;color:#c9d0dd}
.section-item{position:relative;transition:.15s}.section-item.dragging{opacity:.45;transform:scale(.99)}.section-item.drop-target{border-color:#22c55e;box-shadow:0 0 0 1px #22c55e33}.section-meta{display:none}.section-controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px}.section-edit{color:#62e58a;padding:6px 9px;font-size:9px}.section-delete{color:#ff7777;padding:6px 9px;font-size:9px}.drag-note{font-size:9px;color:#6f7a8f;margin-top:7px}
.empty,.loading{text-align:center;color:#8992a6;font-size:11px;padding:18px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;align-items:flex-end;justify-content:center}.modal.open{display:flex}.box{width:100%;max-height:92vh;overflow:auto;background:#0b0f17;border:1px solid #263047;border-radius:20px 20px 0 0;padding:16px}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.confirm-modal{align-items:center;padding:18px}.confirm-box{width:min(360px,100%);background:#171d2b;border:1px solid #313d56;border-radius:22px;padding:20px;box-shadow:0 20px 60px #000b}.confirm-icon{width:46px;height:46px;border-radius:14px;background:#3a1f28;color:#ff6f7e;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}.confirm-title{font-size:16px;font-weight:900}.confirm-text{font-size:11px;line-height:1.6;color:#929caf;margin-top:6px}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.confirm-cancel{background:#222b3c}.confirm-delete{background:#ef4b5b;border-color:#ef4b5b;color:white}
label{display:block;color:#8992a6;font-size:10px;font-weight:800;margin:9px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;background:#141a29;border:1px solid #29344c;color:#fff;border-radius:10px;padding:10px;font-size:11px}textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
@media(max-width:520px){.actions{grid-template-columns:1fr}.grid,.modal-actions{grid-template-columns:1fr}.t-card{grid-template-columns:76px 1fr}.t-thumb{width:76px;height:58px}}

/* ===== Custom success/error message ===== */
.app-msg{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.18s ease}
.app-msg.show{opacity:1;visibility:visible}
.app-msg-box{width:min(390px,100%);background:#171c2c;border:1px solid #29324a;border-radius:22px;padding:25px 22px 18px;box-shadow:0 24px 70px rgba(0,0,0,.55);transform:translateY(10px) scale(.98);transition:.18s ease}
.app-msg.show .app-msg-box{transform:none}
.app-msg-icon{width:48px;height:48px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:rgba(34,224,138,.13);border:1px solid rgba(34,224,138,.35);color:#22e08a;font-size:25px;font-weight:900}
.app-msg-title{text-align:center;font-size:18px;font-weight:900;color:#f3f5fb;margin-bottom:8px}
.app-msg-text{text-align:center;color:#aab2c5;font-size:14px;line-height:1.5;white-space:pre-line}
.app-msg-btn{display:block;width:100%;margin-top:20px;border:0;border-radius:13px;padding:12px;background:linear-gradient(135deg,#22e08a,#69f2b2);color:#061b14;font-weight:900;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><a class="back" href="admin-panel.html">‹</a><div><h1>Tournament Management</h1><div class="sub">Create, edit and publish Homepage tournaments</div></div></div>
  <div class="actions"><button type="button" class="primary" id="createTournamentBtn">＋ Create Tournament</button><button type="button" id="addSectionBtn">＋ Add New Section</button><button type="button" id="archivePageBtn">🗄 Archived Tournaments</button></div>

  <section class="panel"><div class="ph"><b>Homepage Sections</b><span class="count" id="scount">0</span></div><div id="sections"><div class="loading">Loading...</div></div></section>
  <section class="panel"><div class="ph"><b>Tournaments</b><span class="count" id="tcount">0</span></div><div id="tournaments"><div class="loading">Loading...</div></div></section>
</main>

<div class="modal" id="tm"><div class="box">
  <div class="mh"><b id="tmTitle">Create Tournament</b><button type="button" id="closeTmBtn">×</button></div>
  <input type="hidden" id="tid">
  <label>Tournament Name *</label><input id="title" placeholder="CHT DAILY SCRIM #01">
  <label>Homepage Section *</label><select id="section"></select>
  <label>Banner</label><input id="banner" type="file" accept="image/png,image/jpeg,image/webp">
  <label>Short Description</label><textarea id="short"></textarea>
  <div class="grid">
    <div><label>Entry Fee</label><input id="entry" type="number" min="0" value="0"></div>
    <div><label>Prize Pool</label><input id="prize" type="number" min="0" value="0"></div>
    <div><label>Total Slots</label><input id="slots" type="number" min="0" value="0"></div>
    <div><label>Date</label><input id="date" type="date"></div>
    <div><label>Start Time</label><input id="start" type="time"></div>
    <div><label>End Time</label><input id="end" type="time"></div>
    <div><label>Game</label><input id="game" placeholder="Free Fire"></div>
    <div><label>Mode</label><input id="mode" placeholder="Squad"></div>
    <div><label>Map</label><input id="map" placeholder="Bermuda"></div>
    <div><label>Status</label><select id="status"><option>draft</option><option>published</option><option>unpublished</option><option>archived</option></select></div>
  </div>
  <label>Prize Distribution</label><textarea id="distribution"></textarea>
  <label>Full Details</label><textarea id="details"></textarea>
  <label>Rules</label><textarea id="rules"></textarea>
  <label>Important Notes</label><textarea id="notes"></textarea>
  <label>Show on Homepage</label><select id="home"><option value="false">No</option><option value="true">Yes</option></select>
  <div class="modal-actions"><button type="button" id="cancelTmBtn">Cancel</button><button type="button" class="primary" id="saveTournamentBtn">Save Tournament</button></div>
</div></div>

<div class="modal" id="sm"><div class="box">
  <div class="mh"><b id="smTitle">Add New Section</b><button type="button" id="closeSmBtn">×</button></div>
  <input type="hidden" id="sid">
  <label>Section Name *</label><input id="sname" placeholder="Today's Scrims Tournaments">
  <div style="font-size:10px;color:#6f7a8f;margin-top:4px">Use the switch on the card to enable or disable this section.</div>
  <div class="modal-actions"><button type="button" id="cancelSmBtn">Cancel</button><button type="button" class="primary" id="saveSectionBtn">Save Section</button></div>
</div></div>

<div class="modal confirm-modal" id="confirmDelete"><div class="confirm-box">
  <div class="confirm-icon">🗑</div><div class="confirm-title" id="confirmTitle">Delete tournament?</div>
  <div class="confirm-text" id="confirmText">This action cannot be undone.</div>
  <div class="confirm-actions"><button type="button" class="confirm-cancel" id="confirmCancel">Cancel</button><button type="button" class="confirm-delete" id="confirmOk">Delete</button></div>
</div></div>

<div class="app-msg" id="appMsg" onclick="if(event.target===this)closeMsg()">
 <div class="app-msg-box">
  <div class="app-msg-icon">✓</div>
  <div class="app-msg-title">Success</div>
  <div class="app-msg-text" id="appMsgText"></div>
  <button class="app-msg-btn" type="button" onclick="closeMsg()">OK</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
let sections=[], tournaments=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function openM(id){$(id).classList.add('open')} function closeM(id){$(id).classList.remove('open')}
function msg(x){
 const m=document.getElementById('appMsg');
 if(!m){alert(x);return;}
 document.getElementById('appMsgText').textContent=x;
 m.classList.add('show');
}
function closeMsg(){document.getElementById('appMsg')?.classList.remove('show')}

async function admin(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href='login.html';return false}
 const {data:p,error}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).single();
 if(error||!p?.is_admin){msg('Admin access required.');location.href='index.html';return false}
 return true;
}

async function load(){
 const a=await sb.from('tournament_sections').select('*').order('display_order');
 const b=await sb.from('tournaments').select('*,tournament_sections(name)').order('created_at',{ascending:false});
 if(a.error) {$('sections').innerHTML='<div class="empty">Could not load sections.</div>';console.error(a.error)} else {sections=a.data||[];renderSections()}
 if(b.error) {$('tournaments').innerHTML='<div class="empty">Could not load tournaments.</div>';console.error(b.error)} else {tournaments=b.data||[];renderTournaments()}
 fillSections();
}

function renderSections(){
 $('scount').textContent=sections.length;
 $('sections').innerHTML=sections.length?sections.map((s,i)=>`<div class="item section-item" draggable="true" data-id="${s.id}">
   <div class="item-head"><div class="item-main"><div class="name">${esc(s.name)} <span class="badge ${s.is_active?'on':'off'}">${s.is_active?'ON':'OFF'}</span></div></div>
   <button class="section-edit" onclick="editSection('${s.id}')">Edit</button><button class="drag-handle" title="Drag to reorder" aria-label="Drag to reorder">⋮⋮</button></div>
   <div class="section-controls"><button class="switch ${s.is_active?'on':''}" onclick="toggleSection('${s.id}',${!s.is_active})"><span class="switch-label">${s.is_active?'ON':'OFF'}</span><span class="knob"></span></button><button class="section-delete" onclick="askDelete('section','${s.id}')">Delete</button></div>
 </div>`).join(''):'<div class="empty">No sections.</div>';
 bindSectionDrag();
}
function renderTournaments(){
 const active=tournaments.filter(t=>t.status!=='archived');
 $('tcount').textContent=active.length;
 $('tournaments').innerHTML=active.length?active.map(t=>`<div class="item t-card">
   ${t.banner_url?`<img class="t-thumb" src="${esc(t.banner_url)}" alt="">`:'<div class="t-thumb"></div>'}
   <div class="t-content"><div class="item-head"><div class="item-main"><div class="name">${esc(t.title)} <span class="badge ${t.status==='published'?'on':'off'}">${t.status==='published'?'ON':'OFF'}</span></div><div class="meta">Entry ৳${t.entry_fee||0} · Prize ৳${t.prize_pool||0} · Slots ${t.total_slots||0}</div></div><button class="edit-top" onclick="editTournament('${t.id}')">Edit</button></div>
   <div class="t-actions"><button class="switch ${t.status==='published'?'on':''}" onclick="toggleTournament('${t.id}','${t.status}')"><span class="switch-label">${t.status==='published'?'ON':'OFF'}</span><span class="knob"></span></button><button class="archive-btn mini" onclick="archive('${t.id}')">Archive</button><button class="danger mini" onclick="askDelete('tournament','${t.id}')">Delete</button></div></div>
 </div>`).join(''):'<div class="empty">No active tournaments. Archived tournaments are in Archived Tournaments.</div>';
}
function fillSections(selected=''){
 const a=sections.filter(x=>x.is_active || x.id===selected);
 $('section').innerHTML=a.length?a.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join(''):'<option value="">No active section</option>';
}
function bindSectionDrag(){
 const els=[...document.querySelectorAll('.section-item')]; let dragged=null;
 els.forEach(el=>{el.addEventListener('dragstart',e=>{dragged=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',async()=>{el.classList.remove('dragging');await saveSectionOrder()});el.addEventListener('dragover',e=>{e.preventDefault();if(dragged&&dragged!==el){el.classList.add('drop-target')}});el.addEventListener('dragleave',()=>el.classList.remove('drop-target'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drop-target');if(!dragged||dragged===el)return;const box=el.getBoundingClientRect();const before=e.clientY<box.top+box.height/2;el.parentNode.insertBefore(dragged,before?el:el.nextSibling)});});
}
async function saveSectionOrder(){
 const ids=[...document.querySelectorAll('.section-item')].map(x=>x.dataset.id);
 const updates=ids.map((id,i)=>sb.from('tournament_sections').update({display_order:i+1}).eq('id',id));
 await Promise.all(updates); await load();
}
function newSection(){ $('sid').value='';$('smTitle').textContent='Add New Section';$('sname').value='';openM('sm') }
async function saveSection(){
 const id=$('sid').value,p={name:$('sname').value.trim(),is_active:true};
 if(!p.name)return msg('Section name required.');
 let q=id?sb.from('tournament_sections').update({name:p.name}).eq('id',id):sb.from('tournament_sections').insert({name:p.name,display_order:sections.length+1,is_active:true});
 const {error}=await q;if(error)return msg(error.message);closeM('sm');await load();
}
function editSection(id){let s=sections.find(x=>x.id===id);if(!s)return;$('sid').value=s.id;$('sname').value=s.name||'';$('smTitle').textContent='Edit Section';openM('sm')}
async function toggleSection(id,v){const {error}=await sb.from('tournament_sections').update({is_active:v}).eq('id',id);if(error)return msg(error.message);await load()}
async function deleteSection(id){askDelete('section',id)}

function newTournament(){
 $('tid').value='';$('tmTitle').textContent='Create Tournament';$('title').value='';$('short').value='';$('entry').value=0;$('prize').value=0;$('slots').value=0;$('date').value='';$('start').value='';$('end').value='';$('game').value='';$('mode').value='';$('map').value='';$('distribution').value='';$('details').value='';$('rules').value='';$('notes').value='';$('status').value='draft';$('home').value='false';$('banner').value='';fillSections();openM('tm');
}
function editTournament(id){
 let t=tournaments.find(x=>x.id===id);if(!t)return;
 $('tid').value=t.id;$('tmTitle').textContent='Edit Tournament';fillSections(t.section_id);$('title').value=t.title||'';$('short').value=t.short_description||'';$('entry').value=t.entry_fee||0;$('prize').value=t.prize_pool||0;$('slots').value=t.total_slots||0;$('date').value=t.tournament_date||'';$('start').value=t.start_time||'';$('end').value=t.end_time||'';$('game').value=t.game||'';$('mode').value=t.mode||'';$('map').value=t.map||'';$('distribution').value=t.prize_distribution||'';$('details').value=t.full_details||'';$('rules').value=t.rules||'';$('notes').value=t.important_notes||'';$('status').value=t.status||'draft';$('home').value=String(!!t.show_on_homepage);$('banner').value='';openM('tm');
}
async function saveTournament(){
 const btn=$('saveTournamentBtn');
 if(btn.dataset.saving==='1') return;
 const id=$('tid').value;
 const old=tournaments.find(x=>x.id===id);
 const file=$('banner').files && $('banner').files[0] ? $('banner').files[0] : null;
 const title=$('title').value.trim();
 const sectionId=$('section').value;
 if(!title)return msg('Tournament name required.');
 if(!sectionId)return msg('No active homepage section available. Please enable/create a section first.');
 btn.dataset.saving='1';
 const originalText=btn.textContent;
 btn.disabled=true; btn.textContent='Saving...';
 try{
  let banner=old?.banner_url||null;
  if(file){
   const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
   if(!['jpg','jpeg','png','webp'].includes(ext)) throw new Error('Only JPG, JPEG, PNG or WEBP banners are allowed.');
   const path=Date.now()+'-'+Math.random().toString(36).slice(2,10)+'.'+ext;
   const upload=await sb.storage.from('tournament-banners').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg',cacheControl:'3600'});
   if(upload.error) throw new Error('Banner upload failed: '+upload.error.message);
   banner=sb.storage.from('tournament-banners').getPublicUrl(path).data.publicUrl;
  }
  const p={
   section_id:sectionId,
   title:title,
   banner_url:banner,
   short_description:$('short').value.trim()||null,
   entry_fee:Number($('entry').value)||0,
   prize_pool:Number($('prize').value)||0,
   total_slots:Number($('slots').value)||0,
   tournament_date:$('date').value||null,
   start_time:$('start').value||null,
   end_time:$('end').value||null,
   game:$('game').value.trim()||null,
   mode:$('mode').value.trim()||null,
   map:$('map').value.trim()||null,
   prize_distribution:$('distribution').value.trim()||null,
   full_details:$('details').value.trim()||null,
   rules:$('rules').value.trim()||null,
   important_notes:$('notes').value.trim()||null,
   status:$('status').value||'draft',
   show_on_homepage:$('home').value==='true'
  };
  let result;
  if(id){
   result=await sb.from('tournaments').update(p).eq('id',id).select().single();
  }else{
   result=await sb.from('tournaments').insert(p).select().single();
  }
  if(result.error){
   const e=result.error;
   throw new Error((e.message||'Database save failed')+(e.details?'\n\nDetails: '+e.details:'')+(e.hint?'\n\nHint: '+e.hint:''));
  }
  closeM('tm');
  // Show success immediately after the database operation. Refresh the list in background.
  msg(id?'Tournament updated successfully.':'Tournament created successfully.');
  load().catch(err=>console.error('Background tournament refresh failed:',err));
 }catch(e){
  console.error('Tournament save error:',e);
  msg(e?.message||'Save failed. Please try again.');
 }finally{
  btn.dataset.saving='0'; btn.disabled=false; btn.textContent=originalText;
 }
}
async function toggleTournament(id,status){
 const enabled=status==='published';
 const {error}=await sb.from('tournaments').update({status:enabled?'unpublished':'published',show_on_homepage:!enabled}).eq('id',id);
 if(error)return msg(error.message);await load();
}
async function archive(id){
 if(!confirm('Archive this tournament?'))return;
 const {error}=await sb.from('tournaments').update({status:'archived',show_on_homepage:false}).eq('id',id);
 if(error)return msg(error.message);await load();
}
let pendingDelete=null;
function askDelete(type,id){
 pendingDelete={type,id};
 $('confirmTitle').textContent=type==='section'?'Delete section?':'Delete tournament?';
 $('confirmText').textContent=type==='section'?'This section will be permanently removed. This cannot be undone.':'This tournament will be permanently deleted. This cannot be undone.';
 $('confirmDelete').classList.add('open');
}
async function confirmDeleteNow(){
 if(!pendingDelete)return;
 const {type,id}=pendingDelete; $('confirmDelete').classList.remove('open');
 const table=type==='section'?'tournament_sections':'tournaments';
 if(type==='section' && tournaments.some(t=>t.section_id===id))return msg('This section has tournaments. Archive or move them first.');
 const {error}=await sb.from(table).delete().eq('id',id);
 if(error)return msg(error.message); pendingDelete=null; await load();
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('createTournamentBtn').addEventListener('click', newTournament);
  document.getElementById('addSectionBtn').addEventListener('click', newSection);
  document.getElementById('archivePageBtn').addEventListener('click', function(){location.href='archive-tournaments.html'});
  document.getElementById('closeTmBtn').addEventListener('click', function(){closeM('tm')});
  document.getElementById('cancelTmBtn').addEventListener('click', function(){closeM('tm')});
  document.getElementById('closeSmBtn').addEventListener('click', function(){closeM('sm')});
  document.getElementById('cancelSmBtn').addEventListener('click', function(){closeM('sm')});
  document.getElementById('saveTournamentBtn').addEventListener('click', saveTournament);
  document.getElementById('saveSectionBtn').addEventListener('click', saveSection);
  document.getElementById('confirmCancel').addEventListener('click', function(){pendingDelete=null;closeM('confirmDelete')});
  document.getElementById('confirmOk').addEventListener('click', confirmDeleteNow);
