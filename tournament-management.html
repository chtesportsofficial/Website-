<main class="wrap">
  <div class="head"><a class="back" href="admin-panel.html">‹</a><div><h1>Tournament Management</h1><div class="sub">Create, edit and publish Homepage tournaments</div></div></div>
  <div class="topbar"><a class="archive-link" href="archive-tournaments.html">Archived Tournaments</a></div>

    <div class="ph homepage-panel-head"><b>Homepage Sections</b><div class="head-controls"><span class="count" id="scount">0</span><button type="button" class="section-chevron" id="homepageCollapse" aria-label="Expand or collapse Homepage Sections"><span>⌄</span></button></div></div>

      <div id="sections"><div class="loading">Loading...</div></div>
      <div class="inline-add"><button type="button" id="addSectionBtn">＋ Add New Section</button></div>

  <section class="panel management-panel tournaments-panel">
    <div class="ph"><b>Tournaments</b><span class="count" id="tcount">0</span></div>

    <button type="button" class="create-bottom" id="createTournamentBtn">＋ Create Tournament</button>
  </section>
</main>

<div class="modal" id="tm"><div class="box">
  <div class="mh"><b id="tmTitle">Create Tournament</b><button type="button" id="closeTmBtn">×</button></div>
  <input type="hidden" id="tid">
  <label>Tournament Name *</label><input id="title" placeholder="CHT DAILY SCRIM #01">
  <label>Homepage Section *</label><select id="section"></select>
  <label>Banner</label><input id="banner" type="file" accept="image/png,image/jpeg,image/webp">

  <div class="grid">
    <div><label>Entry Fee</label><input id="entry" type="number" min="0" value="0"></div>
    <div><label>Slot (default)</label><input id="slots" type="number" min="0" value="0"></div>
  </div>

  <label>Prize Distribution (Top N)</label>
  <select id="rankCount" onchange="renderPrizeBoxes()"></select>
  <div id="prizeBoxes" class="grid"></div>

  <div class="grid">
    <div><label>Format</label><select id="format"><option value="solo">Solo</option><option value="duo">Duo</option><option value="squad">Squad</option></select></div>
    <div><label>Type</label><select id="matchType"><option value="full_map">Full map</option><option value="clash_squad">Clash squad</option></select></div>
    <div><label>Vehicle</label><select id="vehicle"><option value="true">✅ Allowed</option><option value="false">❌ Not allowed</option></select></div>
    <div><label>Gun Skin</label><select id="gunskin"><option value="false">❌ Not allowed</option><option value="true">✅ Allowed</option></select></div>
    <div><label>Status</label><select id="status"><option>draft</option><option>published</option><option>unpublished</option><option>archived</option></select></div>

  <div class="img-note" id="rulesImagesNote"></div>
  <input type="hidden" id="rulesImagesOld" value="[]">

  <label>Point System</label>
  <textarea id="pointText" placeholder="Write the point system here..."></textarea>
  <label>Point System Images (optional, multiple)</label>
  <input id="pointImages" type="file" accept="image/png,image/jpeg,image/webp" multiple>
  <div class="img-note" id="pointImagesNote"></div>
  <input type="hidden" id="pointImagesOld" value="[]">

  <label>Maps</label>
  <select id="mapCount" onchange="renderMapBoxes()"></select>
  <div id="mapBoxes"></div>

  <label>Show on Homepage</label><select id="home"><option value="false">No</option><option value="true">Yes</option></select>
  <div class="modal-actions"><button type="button" id="cancelTmBtn">Cancel</button><button type="button" class="primary" id="saveTournamentBtn">Save Tournament</button></div>
</div></div>

<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
let sections=[], tournaments=[]; let currentAdminId=null; let currentAdminName='Admin';

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function openM(id){$(id).classList.add('open')} function closeM(id){$(id).classList.remove('open')}
function msg(x){alert(x)}
function askConfirm(title,text,action,danger=true){
  $('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirm').classList.add('open');
  $('confirmOk').onclick=async()=>{closeConfirm();await action()};
}
function closeConfirm(){$('confirm').classList.remove('open')}

async function logActivity(action, category, targetType=null, targetId=null, targetName=null, details={}) {
  try {
    const { error } = await sb.from('activity_logs').insert({
      admin_id: currentAdminId, admin_name: currentAdminName,
      action, category, target_type: targetType, target_id: targetId,
      target_name: targetName, details, status:'success',
      user_agent: navigator.userAgent
    });
    if(error){console.error('Activity log failed:', error);msg('Saved, but the log entry failed: '+error.message);}
  } catch(e) { console.error('Activity log failed:', e); msg('Saved, but the log entry failed: '+(e?.message||e)); }
}

async function admin(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href='login.html';return false}
  currentAdminId=session.user.id;
 const {data:p,error}=await sb.from('profiles').select('is_admin,full_name,email').eq('id',session.user.id).single();
 if(error||!p?.is_admin){msg('Admin access required.');location.href='index.html';return false}
 currentAdminName=p?.full_name||p?.email||'Admin';
 return true;
}

async function load(){
 const a=await sb.from('tournament_sections').select('*').order('display_order');
 const b=await sb.from('tournaments').select('*,tournament_sections(name)').order('created_at',{ascending:false});
 if(a.error) {$('sections').innerHTML='<div class="empty">Could not load sections.</div>';console.error(a.error)} else {sections=a.data||[];renderSections()}
 if(b.error) {$('tournaments').innerHTML='<div class="empty">Could not load tournaments.</div>';console.error(b.error)} else {
   tournaments=b.data||[];
   try{const saved=JSON.parse(localStorage.getItem('chteo_tournament_admin_order')||'[]');const rank=new Map(saved.map((id,i)=>[id,i]));tournaments.sort((x,y)=>(rank.get(x.id)??999999)-(rank.get(y.id)??999999));}catch(e){}
   renderTournaments()
 }
 fillSections();
}

function renderSections(){
 $('scount').textContent=sections.length;
 $('sections').innerHTML=sections.length?sections.map((s,i)=>`<div class="section-item" data-id="${s.id}">
   <div class="section-top">
     <div class="section-name-wrap"><span class="section-index">${i+1}</span><div class="section-name">${esc(s.name)}</div></div>
   </div>
   <div class="section-actions">
     <button class="mini green" onclick="editSection('${s.id}')">Edit</button>
     <button class="mini red" onclick="deleteSection('${s.id}')">Delete</button>
     <button class="switch ${s.is_active?'on':''}" onclick="toggleSection('${s.id}',${!s.is_active})"><span class="switch-label">${s.is_active?'ON':'OFF'}</span><span class="knob"></span></button>
     <span class="drag section-drag" title="Drag to reorder" role="button" aria-label="Drag to reorder">⠿</span>
   </div>
 </div>`).join(''):'<div class="empty">No sections.</div>';
 bindSectionDrag();
}
function getTournamentOrder(sectionId){
 try{const all=JSON.parse(localStorage.getItem('chteo_tournament_orders_by_section')||'{}');return Array.isArray(all[sectionId])?all[sectionId]:[];}catch(e){return [];}
}
function setTournamentOrder(sectionId,ids){
 try{const all=JSON.parse(localStorage.getItem('chteo_tournament_orders_by_section')||'{}');all[sectionId]=ids;localStorage.setItem('chteo_tournament_orders_by_section',JSON.stringify(all));}catch(e){}
}
function orderedSectionTournaments(sectionId,items){
 const saved=getTournamentOrder(sectionId);const rank=new Map(saved.map((id,i)=>[id,i]));
 return [...items].sort((a,b)=>{const ar=rank.get(a.id),br=rank.get(b.id);if(ar===undefined&&br===undefined)return new Date(a.created_at||0)-new Date(b.created_at||0);if(ar===undefined)return 1;if(br===undefined)return -1;return ar-br;});
}
function renderTournaments(){
 const active=tournaments.filter(t=>t.status!=='archived');
 $('tcount').textContent=active.length;
 if(!active.length){$('tournaments').innerHTML='<div class="empty">No tournaments created yet.</div>';return;}
 const groups=sections.map(s=>({s,items:orderedSectionTournaments(s.id,active.filter(t=>t.section_id===s.id))})).filter(g=>g.items.length);
 const ungrouped=active.filter(t=>!sections.some(s=>s.id===t.section_id));
 if(ungrouped.length)groups.push({s:{id:'__ungrouped',name:'Unassigned'},items:orderedSectionTournaments('__ungrouped',ungrouped)});
 $('tournaments').innerHTML=groups.map(g=>`<div class="tournament-group" data-section-id="${g.s.id}">
   <div class="tournament-group-head"><div class="tournament-group-name">${esc(g.s.name)}</div><div class="tournament-group-count">${g.items.length} tournament${g.items.length===1?'':'s'}</div></div>
   <div class="tournament-group-list">${g.items.map((t,i)=>`<div class="tournament-item" data-id="${t.id}" data-name="${esc(t.title)}" data-section-id="${g.s.id}">
     <div class="tournament-top"><span class="t-index">${i+1}</span><div class="thumb">${t.banner_url?`<img src="${esc(t.banner_url)}" alt="">`:''}</div><div class="t-main"><div class="t-title-row"><div class="t-title">${esc(t.title)}</div></div><div class="t-meta"><span>Entry ৳${t.entry_fee||0}</span> · <span>Prize ৳${t.prize_pool||0}</span> · <span>Slots ${t.total_slots||0}</span></div></div></div>
     <div class="t-actions"><button class="mini green" onclick="editTournament('${t.id}')">Edit</button><button class="mini archive-btn" onclick="archive('${t.id}')">Archive</button><button class="mini t-delete" onclick="deleteTournament('${t.id}')">Delete</button><button class="switch t-toggle ${t.status==='published'?'on':''}" onclick="toggleTournament('${t.id}',${t.status!=='published'})"><span class="switch-label">${t.status==='published'?'ON':'OFF'}</span><span class="knob"></span></button><span class="drag tournament-drag" title="Drag to reorder">⠿</span></div>
   </div>`).join('')}</div></div>`).join('');
 bindTournamentDrag();
}
function fillSections(selected=''){
 const a=sections.filter(x=>x.is_active);
 $('section').innerHTML=a.length?a.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join(''):'<option value="">No active section</option>';
}
function bindPointerReorder(container,itemSel,handleSel,{getId,getName,onDrop}){
  const items=()=>[...container.querySelectorAll(itemSel)];
  let dragEl=null,startIndex=-1,startId=null,startName='';
  function onMove(e){
    if(!dragEl)return;
    e.preventDefault();
    const y=e.clientY;
    let closest=null,closestDist=Infinity,closestRect=null;
    items().forEach(el=>{
      if(el===dragEl)return;
      const r=el.getBoundingClientRect();
      const cy=r.top+r.height/2;
      const dist=Math.abs(y-cy);
      if(dist<closestDist){closestDist=dist;closest=el;closestRect=r}
    });
    if(closest){
      const before=y<closestRect.top+closestRect.height/2;
      if(before)closest.before(dragEl);else closest.after(dragEl);
    }
  }
  function onUp(){
    if(!dragEl)return;
    dragEl.classList.remove('dragging');
    document.removeEventListener('pointermove',onMove);
    document.removeEventListener('pointerup',onUp);
    document.removeEventListener('pointercancel',onUp);
    const newIndex=items().indexOf(dragEl)+1;
    const el=dragEl;dragEl=null;
    if(startId&&newIndex!==startIndex)onDrop(el,startId,startName,startIndex,newIndex);
  }
  items().forEach(el=>{
    const handle=el.querySelector(handleSel);
    if(!handle)return;
    handle.addEventListener('pointerdown',e=>{
      e.preventDefault();
      dragEl=el;startIndex=items().indexOf(el)+1;startId=getId(el);startName=getName(el);
      el.classList.add('dragging');
      document.addEventListener('pointermove',onMove,{passive:false});
      document.addEventListener('pointerup',onUp);
      document.addEventListener('pointercancel',onUp);
    });
    handle.addEventListener('contextmenu',e=>e.preventDefault());
  });
}
function bindSectionDrag(){
  bindPointerReorder($('sections'),'.section-item','.section-drag',{
    getId:el=>el.dataset.id,
    getName:el=>sections.find(s=>s.id===el.dataset.id)?.name||el.querySelector('.section-name')?.textContent?.trim()||'Homepage Section',
    onDrop:(el,id,name,oldIndex)=>{saveSectionOrder(id,name,oldIndex)}
  });
}
async function saveSectionOrder(draggedId,draggedName,oldIndex){
  const ids=[...$('sections').querySelectorAll('.section-item')].map(x=>x.dataset.id);
  const newIndex=ids.indexOf(draggedId)+1;

  // Nothing moved: don't create a log.
  if(!draggedId||newIndex<1||oldIndex===newIndex)return;

  for(let i=0;i<ids.length;i++){
    const {error}=await sb.from('tournament_sections').update({display_order:i+1}).eq('id',ids[i]);
    if(error){console.error('Section order update failed:',error);msg('Reorder failed to save: '+error.message);return;}
  }

  // IMPORTANT: log the section that was actually dragged, not the section
  // that happened to occupy the destination slot.
  await logActivity(
    'sections_reordered',
    'homepage_section',
    'tournament_section',
    draggedId,
    draggedId,
    {
      name:draggedName,
      oldPosition:oldIndex,
      newPosition:newIndex,
      narration:`moved the homepage section ${draggedName}: #${oldIndex} → #${newIndex}.`,
      highlight_targets:[draggedName]
    }
  );

  await load();
}
function bindTournamentDrag(){
 document.querySelectorAll('.tournament-group-list').forEach(box=>{
  bindPointerReorder(box,'.tournament-item','.tournament-drag',{
    getId:el=>el.dataset.id,
    getName:el=>el.dataset.name||el.querySelector('.t-title')?.textContent?.trim()||'Tournament',
    onDrop:(el,id,name,oldIndex)=>{saveTournamentGroupOrder(box,{oldIndex,oldId:id,oldName:name})}
  });
 });
}
async function saveTournamentGroupOrder(box,move){
 const sectionId=box.closest('.tournament-group')?.dataset.sectionId;
 if(!sectionId)return;
 const ids=[...box.querySelectorAll('.tournament-item')].map(x=>x.dataset.id);
 const newIndex=move?.oldId ? ids.indexOf(move.oldId)+1 : null;
 setTournamentOrder(sectionId,ids);
 if(move?.oldIndex && newIndex && move.oldIndex!==newIndex){
  const details={
   section_id:sectionId,
   order:ids,
   tournament_id:move.oldId,
   tournament_name:move.oldName,
   old_position:move.oldIndex,
   new_position:newIndex,
   narration:`moved ${move.oldName}: #${move.oldIndex} → #${newIndex}.`,
   highlight_targets:[move.oldName]
  };
  await logActivity('tournaments_reordered','tournament','tournament',move.oldId,move.oldName,details);
 }
 renderTournaments();
}

function newSection(){ $('sid').value='';$('smTitle').textContent='Add New Section';$('sname').value='';$('sdesc').value='';$('sorder').value=sections.length+1;$('sactive').value='true';openM('sm') }
async function saveSection(){
 const id=$('sid').value,old=id?sections.find(x=>x.id===id):null,p={name:$('sname').value.trim(),description:$('sdesc').value.trim()||null,display_order:+$('sorder').value||0,is_active:$('sactive').value==='true'};
 if(!p.name)return msg('Section name required.');
 const q=id?sb.from('tournament_sections').update(p).eq('id',id):sb.from('tournament_sections').insert(p);
 const {error}=await q;
  if(error)return msg(error.message);
  if(id){
    if(old&&old.name!==p.name){
      await logActivity('section_updated','homepage_section','tournament_section',id,p.name,{narration:`changed the homepage section's name: ${old.name} → ${p.name}.`,highlight_targets:[old.name]});
    }
    // name unchanged: nothing meaningful happened, skip logging
  }else{
    await logActivity('section_created','homepage_section','tournament_section',null,p.name,{narration:`created the homepage section ${p.name}.`,highlight_targets:[p.name]});
  }
  closeM('sm');await load();
}
function editSection(id){let s=sections.find(x=>x.id===id);if(!s)return;$('sid').value=s.id;$('sname').value=s.name;$('sdesc').value='';$('sorder').value=s.display_order;$('sactive').value=String(s.is_active);$('smTitle').textContent='Edit Section';openM('sm')}
async function toggleSection(id,on){
  const s=sections.find(x=>x.id===id);
  const {error}=await sb.from('tournament_sections').update({is_active:on}).eq('id',id);
  if(error)return msg(error.message);
  await logActivity(on?'section_enabled':'section_disabled','homepage_section','tournament_section',id,s?.name||null,{narration:`turned ${on?'ON':'OFF'} the homepage section ${s?.name||'Section'}.`,highlight_targets:[s?.name||'Section']});
  load();
}
async function deleteSection(id){if(tournaments.some(t=>t.section_id===id&&t.status!=='archived'))return msg('This section has active tournaments. Move or archive them first.');askConfirm('Delete section?','This section will be permanently deleted.',async()=>{const s=sections.find(x=>x.id===id);
  const {error}=await sb.from('tournament_sections').delete().eq('id',id);
  if(error)return msg(error.message);
  await logActivity('section_deleted','homepage_section','tournament_section',id,s?.name||null,{narration:`deleted the homepage section ${s?.name||'Section'}.`,highlight_targets:[s?.name||'Section']});
  load()})}

function fillRankCount(selected){
 $('rankCount').innerHTML=Array.from({length:12},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===selected?'selected':''}>${n}</option>`).join('');
}
function fillMapCount(selected){
 $('mapCount').innerHTML=Array.from({length:7},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===selected?'selected':''}>${n}</option>`).join('');
}
function renderPrizeBoxes(prefill){
 const n=+$('rankCount').value||1;
 const old=Array.isArray(prefill)?prefill:[];
 $('prizeBoxes').innerHTML=Array.from({length:n},(_,i)=>{
  const rank=i+1,amt=old.find(x=>+x.rank===rank)?.amount??0;
  return `<div class="prize-box-edit"><label>Rank ${rank}</label><input type="number" min="0" class="prizeAmt" data-rank="${rank}" value="${amt}"></div>`;
 }).join('');
}
function renderMapBoxes(prefill){
 const n=+$('mapCount').value||1;
 const old=Array.isArray(prefill)?prefill:[];
 $('mapBoxes').innerHTML=Array.from({length:n},(_,i)=>{
  const m=old[i]||{};
  return `<div class="map-box-edit">
    <label>Map ${i+1} Name</label><input class="mapName" data-i="${i}" placeholder="Bermuda" value="${esc(m.name||'')}">
    <label>Map ${i+1} Image</label><input type="file" class="mapImg" data-i="${i}" accept="image/png,image/jpeg,image/webp">
    <input type="hidden" class="mapImgUrl" data-i="${i}" value="${esc(m.image_url||'')}">
    ${m.image_url?`<div class="existing-img">Current: ${esc(m.image_url)}</div>`:''}
  </div>`;
 }).join('');
}
async function uploadMany(files){
 const urls=[];
 for(const file of files){
  let ext=(file.name.split('.').pop()||'jpg').toLowerCase();if(!['jpg','jpeg','png','webp'].includes(ext))ext='jpg';
  let path=crypto.randomUUID()+'.'+ext;
  let u=await sb.storage.from('tournament-banners').upload(path,file,{upsert:false,contentType:file.type});
  if(u.error)throw u.error;
  urls.push(sb.storage.from('tournament-banners').getPublicUrl(path).data.publicUrl);
 }
 return urls;
}
function newTournament(){
 $('tid').value='';$('tmTitle').textContent='Create Tournament';$('title').value='';$('entry').value=0;$('slots').value=0;
 $('format').value='squad';$('matchType').value='full_map';$('vehicle').value='true';$('gunskin').value='false';
 $('rulesText').value='';$('rulesImages').value='';$('rulesImagesOld').value='[]';$('rulesImagesNote').textContent='';
 $('pointText').value='';$('pointImages').value='';$('pointImagesOld').value='[]';$('pointImagesNote').textContent='';
 $('status').value='draft';$('home').value='false';$('banner').value='';
 fillRankCount(4);renderPrizeBoxes([]);
 fillMapCount(3);renderMapBoxes([]);
 fillSections();openM('tm');
}
function editTournament(id){
 let t=tournaments.find(x=>x.id===id);if(!t)return;
 $('tid').value=t.id;$('tmTitle').textContent='Edit Tournament';fillSections(t.section_id);
 $('title').value=t.title||'';$('entry').value=t.entry_fee||0;$('slots').value=t.default_slots||t.total_slots||0;
 $('format').value=t.format||'squad';$('matchType').value=t.match_type||'full_map';
 $('vehicle').value=String(t.vehicle_allowed!==false);$('gunskin').value=String(!!t.gun_skin_allowed);
 $('rulesText').value=t.rules_text||t.rules||'';$('rulesImages').value='';
 const rImgs=Array.isArray(t.rules_images)?t.rules_images:[];$('rulesImagesOld').value=JSON.stringify(rImgs);
 $('rulesImagesNote').textContent=rImgs.length?`${rImgs.length} existing image(s). Choosing new files will replace them.`:'';
 $('pointText').value=t.point_system_text||'';$('pointImages').value='';
 const pImgs=Array.isArray(t.point_system_images)?t.point_system_images:[];$('pointImagesOld').value=JSON.stringify(pImgs);
 $('pointImagesNote').textContent=pImgs.length?`${pImgs.length} existing image(s). Choosing new files will replace them.`:'';
 $('status').value=t.status||'draft';$('home').value=String(!!t.show_on_homepage);$('banner').value='';
 const dist=Array.isArray(t.prize_distribution)?t.prize_distribution:[];
 fillRankCount(dist.length||4);renderPrizeBoxes(dist);
 const maps=Array.isArray(t.maps)?t.maps:[];
 fillMapCount(maps.length||3);renderMapBoxes(maps);
 openM('tm');
}
async function saveTournament(){
 let id=$('tid').value,old=tournaments.find(x=>x.id===id),banner=old?.banner_url||null,file=$('banner').files[0];
 if(!$('title').value.trim())return msg('Tournament name required.');
 if(!$('section').value)return msg('Select a section.');
 try{
  if(file){let ext=(file.name.split('.').pop()||'jpg').toLowerCase();if(!['jpg','jpeg','png','webp'].includes(ext))ext='jpg';let path=crypto.randomUUID()+'.'+ext;let u=await sb.storage.from('tournament-banners').upload(path,file,{upsert:false,contentType:file.type});if(u.error)throw u.error;banner=sb.storage.from('tournament-banners').getPublicUrl(path).data.publicUrl}

  const prizeDistribution=[...document.querySelectorAll('.prizeAmt')].map(el=>({rank:+el.dataset.rank,amount:+el.value||0}));
  const prizePool=prizeDistribution.reduce((s,x)=>s+x.amount,0);

  const rulesNewFiles=[...($('rulesImages').files||[])];
  const rulesImages=rulesNewFiles.length?await uploadMany(rulesNewFiles):JSON.parse($('rulesImagesOld').value||'[]');

  const pointNewFiles=[...($('pointImages').files||[])];
  const pointSystemImages=pointNewFiles.length?await uploadMany(pointNewFiles):JSON.parse($('pointImagesOld').value||'[]');

  const mapBoxEls=[...document.querySelectorAll('#mapBoxes .map-box-edit')];
  const maps=[];
  for(const box of mapBoxEls){
   const nameEl=box.querySelector('.mapName'),fileEl=box.querySelector('.mapImg'),urlEl=box.querySelector('.mapImgUrl');
   let imgUrl=urlEl.value||'';
   if(fileEl.files&&fileEl.files[0]){const up=await uploadMany([fileEl.files[0]]);imgUrl=up[0];}
   maps.push({name:nameEl.value.trim(),image_url:imgUrl});
  }

  let p={
   section_id:$('section').value,title:$('title').value.trim(),banner_url:banner,
   entry_fee:+$('entry').value||0,default_slots:+$('slots').value||0,total_slots:+$('slots').value||0,
   prize_distribution:prizeDistribution,prize_pool:prizePool,
   format:$('format').value,match_type:$('matchType').value,
   vehicle_allowed:$('vehicle').value==='true',gun_skin_allowed:$('gunskin').value==='true',
   rules_text:$('rulesText').value.trim()||null,rules_images:rulesImages,
   point_system_text:$('pointText').value.trim()||null,point_system_images:pointSystemImages,
   maps:maps,
   status:$('status').value,show_on_homepage:$('home').value==='true'
  };
  let q=id?sb.from('tournaments').update(p).eq('id',id).select():sb.from('tournaments').insert(p).select();let r=await q;if(r.error)throw r.error;
  if(id&&(!r.data||r.data.length===0))throw new Error('Update blocked (0 rows affected) — check the UPDATE RLS policy on the tournaments table.');
  const savedRow=(r.data&&Array.isArray(r.data)?r.data[0]:null);
  const newId=id||savedRow?.id||null;
  if(id){
    const oldSectionName=sections.find(s=>s.id===old?.section_id)?.name||'—';
    const newSectionName=sections.find(s=>s.id===p.section_id)?.name||'—';
    const target=old?.title||p.title;
    const nameChanged=(old?.title||'')!==p.title;
    const diffs=[];
    if((+(old?.entry_fee||0))!==p.entry_fee)diffs.push(`entry fee: ৳${old?.entry_fee||0} → ৳${p.entry_fee}`);
    if((+(old?.prize_pool||0))!==p.prize_pool)diffs.push(`prize pool: ৳${old?.prize_pool||0} → ৳${p.prize_pool}`);
    if((+(old?.total_slots||0))!==p.total_slots)diffs.push(`slots: ${old?.total_slots||0} → ${p.total_slots}`);
    if((old?.section_id||'')!==p.section_id)diffs.push(`section: ${oldSectionName} → ${newSectionName}`);
    if(nameChanged&&!diffs.length){
      await logActivity('tournament_updated','tournament','tournament',newId,p.title,{narration:`renamed ${target} → ${p.title}.`,highlight_targets:[target]});
    }else if(nameChanged&&diffs.length){
      await logActivity('tournament_updated','tournament','tournament',newId,p.title,{narration:`changed ${target} → ${p.title}, ${diffs.join(', ')}.`,highlight_targets:[target]});
    }else if(diffs.length){
      await logActivity('tournament_updated','tournament','tournament',newId,p.title,{narration:`changed ${target} — ${diffs.join(', ')}.`,highlight_targets:[target]});
    }
    // no fields actually changed: skip logging, nothing to say
  }else{
    await logActivity('tournament_created','tournament','tournament',newId,p.title,{narration:`created the tournament ${p.title}.`,highlight_targets:[p.title]});
  }
  closeM('tm');await load();
 }catch(e){console.error(e);msg(e.message||'Save failed')}
}
async function toggleTournament(id,on){
  const t=tournaments.find(x=>x.id===id);
  let {error}=await sb.from('tournaments').update({status:on?'published':'unpublished',show_on_homepage:on}).eq('id',id);
  if(error)return msg(error.message);
  await logActivity(on?'tournament_enabled':'tournament_disabled','tournament','tournament',id,t?.title||null,{narration:`turned ${on?'ON':'OFF'} the tournament ${t?.title||'Tournament'}.`,highlight_targets:[t?.title||'Tournament']});
  load();
}
async function deleteTournament(id){askConfirm('Delete tournament?','This will permanently remove this tournament. This action cannot be undone.',async()=>{const t=tournaments.find(x=>x.id===id);
  let {error}=await sb.from('tournaments').delete().eq('id',id);
  if(error)return msg(error.message);
  await logActivity('tournament_deleted','tournament','tournament',id,t?.title||null,{narration:`deleted the tournament ${t?.title||'Tournament'}.`,highlight_targets:[t?.title||'Tournament']});
  load()})}
async function archive(id){askConfirm('Archive tournament?','The tournament will disappear from the active list and move to Archived Tournaments.',async()=>{const t=tournaments.find(x=>x.id===id);
  let {error}=await sb.from('tournaments').update({status:'archived',show_on_homepage:false}).eq('id',id);
  if(error)return msg(error.message);
  await logActivity('tournament_archived','tournament','tournament',id,t?.title||null,{status:'archived',highlight_targets:[t?.title||null],narration:`archived the tournament ${t?.title||'Tournament'}.`});
  load()})}

  document.getElementById('createTournamentBtn').addEventListener('click', newTournament);
  document.getElementById('addSectionBtn').addEventListener('click', newSection);

  document.getElementById('cancelTmBtn').addEventListener('click', function(){closeM('tm')});
  document.getElementById('closeSmBtn').addEventListener('click', function(){closeM('sm')});
  document.getElementById('cancelSmBtn').addEventListener('click', function(){closeM('sm')});
  document.getElementById('saveTournamentBtn').addEventListener('click', saveTournament);
  document.getElementById('saveSectionBtn').addEventListener('click', saveSection);
});

(async()=>{if(await admin())await load()})();
