<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tournament Management — CHT ESP ORG</title>
<link rel="stylesheet" href="theme.css">
<style>
body{margin:0;background:#0a0d13;color:#f2f3f7;font-family:Inter,system-ui,sans-serif}
.wrap{position:relative;z-index:10;max-width:760px;margin:auto;padding:18px 15px 120px;pointer-events:auto}
.head{display:flex;gap:12px;align-items:center;margin-bottom:16px}.back{color:#fff;text-decoration:none;font-size:26px}
h1{font-size:20px;margin:0}.sub{font-size:11px;color:#8992a6;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
button{position:relative;z-index:20;pointer-events:auto;cursor:pointer;border:1px solid #263047;background:#141a29;color:#fff;border-radius:12px;padding:11px;font-weight:800;font-size:11px}
.primary{background:#22c55e;color:#07100a;border-color:#22c55e}
.panel{background:#141a29;border:1px solid #263047;border-radius:17px;padding:13px;margin-bottom:13px}
.ph{display:flex;justify-content:space-between;align-items:center}.ph b{font-size:13px}.count{color:#8c96aa;font-size:10px}
.item{background:#181f30;border:1px solid #29344c;border-radius:13px;padding:11px;margin-top:8px}
.name{font-weight:800;font-size:12px}.meta{font-size:10px;color:#929caf;line-height:1.5;margin-top:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mini{padding:7px 9px;font-size:9px}.green{color:#62e58a}.red{color:#ff7777}
.badge{font-size:8px;border-radius:99px;padding:4px 7px;background:#222b40;color:#c5cede}
.empty,.loading{text-align:center;color:#8992a6;font-size:11px;padding:18px}
.modal{display:none;position:fixed;inset:0;z-index:99999;background:#000b;z-index:99;align-items:flex-end}
.modal.open{display:flex}.box{width:100%;max-height:92vh;overflow:auto;background:#0b0f17;border:1px solid #263047;border-radius:20px 20px 0 0;padding:16px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
label{display:block;color:#8992a6;font-size:10px;font-weight:800;margin:9px 0 5px}
input,select,textarea{width:100%;box-sizing:border-box;background:#141a29;border:1px solid #29344c;color:#fff;border-radius:10px;padding:10px;font-size:11px}
textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
@media(max-width:520px){.actions,.grid,.modal-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><a class="back" href="admin-panel.html">‹</a><div><h1>Tournament Management</h1><div class="sub">Create, edit and publish Homepage tournaments</div></div></div>
  <div class="actions"><button class="primary" onclick="newTournament()">＋ Create Tournament</button><button onclick="newSection()">＋ Add New Section</button></div>

  <section class="panel"><div class="ph"><b>Homepage Sections</b><span class="count" id="scount">0</span></div><div id="sections"><div class="loading">Loading...</div></div></section>
  <section class="panel"><div class="ph"><b>Tournaments</b><span class="count" id="tcount">0</span></div><div id="tournaments"><div class="loading">Loading...</div></div></section>
</main>
<div style="text-align:center;color:#687287;font-size:10px;padding:18px 0 35px">©CHT ESP ORG. All Rights Reserved</div>

<div class="modal" id="tm"><div class="box">
  <div class="mh"><b id="tmTitle">Create Tournament</b><button onclick="closeM('tm')">×</button></div>
  <input type="hidden" id="tid">
  <label>Tournament Name *</label><input id="title" placeholder="CHT DAILY SCRIM #01">
  <label>Homepage Section *</label><select id="section"></select>
  <label>Banner</label><input id="banner" type="file" accept="image/png,image/jpeg,image/webp">
  <label>Short Description</label><textarea id="short"></textarea>
  <div class="grid">
    <div><label>Entry Fee</label><input id="entry" type="number" min="0" value="0"></div>
    <div><label>Prize Pool</label><input id="prize" type="number" min="0" value="0"></div>
    <div><label>Total Slots</label><input id="slots" type="number" min="0" value="0"></div>
    <div><label>Date</label><input id="date" type="date"></div>
    <div><label>Start Time</label><input id="start" type="time"></div>
    <div><label>End Time</label><input id="end" type="time"></div>
    <div><label>Game</label><input id="game" placeholder="Free Fire"></div>
    <div><label>Mode</label><input id="mode" placeholder="Squad"></div>
    <div><label>Map</label><input id="map" placeholder="Bermuda"></div>
    <div><label>Status</label><select id="status"><option>draft</option><option>published</option><option>unpublished</option><option>archived</option></select></div>
  </div>
  <label>Prize Distribution</label><textarea id="distribution"></textarea>
  <label>Full Details</label><textarea id="details"></textarea>
  <label>Rules</label><textarea id="rules"></textarea>
  <label>Important Notes</label><textarea id="notes"></textarea>
  <label>Show on Homepage</label><select id="home"><option value="false">No</option><option value="true">Yes</option></select>
  <div class="modal-actions"><button onclick="closeM('tm')">Cancel</button><button class="primary" onclick="saveTournament()">Save Tournament</button></div>
</div></div>

<div class="modal" id="sm"><div class="box">
  <div class="mh"><b id="smTitle">Add New Section</b><button onclick="closeM('sm')">×</button></div>
  <input type="hidden" id="sid">
  <label>Section Name *</label><input id="sname" placeholder="Today's Scrims Tournaments">
  <label>Description</label><textarea id="sdesc"></textarea>
  <label>Display Order</label><input id="sorder" type="number" min="0" value="1">
  <label>Active</label><select id="sactive"><option value="true">Active</option><option value="false">Inactive</option></select>
  <div class="modal-actions"><button onclick="closeM('sm')">Cancel</button><button class="primary" onclick="saveSection()">Save Section</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.addEventListener('click', function(e){
  const b=e.target.closest('button');
  if(!b) return;
  if(b.textContent.includes('Create Tournament')) window.newTournament && window.newTournament();
  if(b.textContent.includes('Add New Section')) window.newSection && window.newSection();
});
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
let sections=[], tournaments=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
window.openM=function(id){$(id).classList.add('open')} window.closeM=function(id){$(id).classList.remove('open')}
function msg(x){alert(x)}

async function admin(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){location.href='login.html';return false}
 const {data:p,error}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).single();
 if(error||!p?.is_admin){msg('Admin access required.');location.href='index.html';return false}
 return true;
}

async function load(){
 const a=await sb.from('tournament_sections').select('*').order('display_order');
 const b=await sb.from('tournaments').select('*,tournament_sections(name)').order('created_at',{ascending:false});
 if(a.error) {$('sections').innerHTML='<div class="empty">Could not load sections.</div>';console.error(a.error)} else {sections=a.data||[];renderSections()}
 if(b.error) {$('tournaments').innerHTML='<div class="empty">Could not load tournaments.</div>';console.error(b.error)} else {tournaments=b.data||[];renderTournaments()}
 fillSections();
}

function renderSections(){
 $('scount').textContent=sections.length;
 $('sections').innerHTML=sections.length?sections.map(s=>`<div class="item"><div class="name">${esc(s.name)} <span class="badge">${s.is_active?'ACTIVE':'INACTIVE'}</span></div><div class="meta">${esc(s.description||'')} · Order ${s.display_order}</div><div class="row"><button class="mini green" onclick="editSection('${s.id}')">Edit</button><button class="mini" onclick="toggleSection('${s.id}',${!s.is_active})">${s.is_active?'Disable':'Enable'}</button><button class="mini red" onclick="deleteSection('${s.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No sections.</div>';
}
function renderTournaments(){
 $('tcount').textContent=tournaments.length;
 $('tournaments').innerHTML=tournaments.length?tournaments.map(t=>`<div class="item"><div class="name">${esc(t.title)} <span class="badge">${esc(t.status)}</span></div><div class="meta">${esc(t.tournament_sections?.name||'No section')} · Entry ৳${t.entry_fee||0} · Prize ৳${t.prize_pool||0} · Slots ${t.total_slots||0}</div><div class="row"><button class="mini green" onclick="editTournament('${t.id}')">Edit</button><button class="mini" onclick="publish('${t.id}','${t.status}')">${t.status==='published'?'Unpublish':'Publish'}</button><button class="mini" onclick="home('${t.id}',${!t.show_on_homepage})">${t.show_on_homepage?'Hide Homepage':'Show Homepage'}</button><button class="mini red" onclick="archive('${t.id}')">Archive</button></div></div>`).join(''):'<div class="empty">No tournaments created yet.</div>';
}
function fillSections(selected=''){
 const a=sections.filter(x=>x.is_active);
 $('section').innerHTML=a.length?a.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join(''):'<option value="">No active section</option>';
}
window.newSection=function(){ $('sid').value='';$('smTitle').textContent='Add New Section';$('sname').value='';$('sdesc').value='';$('sorder').value=sections.length+1;$('sactive').value='true';openM('sm') }
window.saveSection=async function(){
 const id=$('sid').value,p={name:$('sname').value.trim(),description:$('sdesc').value.trim()||null,display_order:+$('sorder').value||0,is_active:$('sactive').value==='true'};
 if(!p.name)return msg('Section name required.');
 const q=id?sb.from('tournament_sections').update(p).eq('id',id):sb.from('tournament_sections').insert(p);
 const {error}=await q;if(error)return msg(error.message);closeM('sm');await load();
}
window.editSection=function(id){let s=sections.find(x=>x.id===id);if(!s)return;$('sid').value=s.id;$('sname').value=s.name;$('sdesc').value=s.description||'';$('sorder').value=s.display_order;$('sactive').value=String(s.is_active);$('smTitle').textContent='Edit Section';openM('sm')}
window.toggleSection=async function(id,v){const {error}=await sb.from('tournament_sections').update({is_active:v}).eq('id',id);if(error)return msg(error.message);load()}
window.deleteSection=async function(id){if(tournaments.some(t=>t.section_id===id))return msg('This section has tournaments. Move/archive them first.');if(!confirm('Delete section?'))return;const {error}=await sb.from('tournament_sections').delete().eq('id',id);if(error)return msg(error.message);load()}

window.newTournament=function(){
 $('tid').value='';$('tmTitle').textContent='Create Tournament';$('title').value='';$('short').value='';$('entry').value=0;$('prize').value=0;$('slots').value=0;$('date').value='';$('start').value='';$('end').value='';$('game').value='';$('mode').value='';$('map').value='';$('distribution').value='';$('details').value='';$('rules').value='';$('notes').value='';$('status').value='draft';$('home').value='false';$('banner').value='';fillSections();openM('tm');
}
window.editTournament=function(id){
 let t=tournaments.find(x=>x.id===id);if(!t)return;
 $('tid').value=t.id;$('tmTitle').textContent='Edit Tournament';fillSections(t.section_id);$('title').value=t.title||'';$('short').value=t.short_description||'';$('entry').value=t.entry_fee||0;$('prize').value=t.prize_pool||0;$('slots').value=t.total_slots||0;$('date').value=t.tournament_date||'';$('start').value=t.start_time||'';$('end').value=t.end_time||'';$('game').value=t.game||'';$('mode').value=t.mode||'';$('map').value=t.map||'';$('distribution').value=t.prize_distribution||'';$('details').value=t.full_details||'';$('rules').value=t.rules||'';$('notes').value=t.important_notes||'';$('status').value=t.status||'draft';$('home').value=String(!!t.show_on_homepage);$('banner').value='';openM('tm');
}
window.saveTournament=async function(){
 let id=$('tid').value,old=tournaments.find(x=>x.id===id),banner=old?.banner_url||null,file=$('banner').files[0];
 if(!$('title').value.trim())return msg('Tournament name required.');
 if(!$('section').value)return msg('Select a section.');
 try{
  if(file){let ext=(file.name.split('.').pop()||'jpg').toLowerCase();if(!['jpg','jpeg','png','webp'].includes(ext))ext='jpg';let path=crypto.randomUUID()+'.'+ext;let u=await sb.storage.from('tournament-banners').upload(path,file,{upsert:false,contentType:file.type});if(u.error)throw u.error;banner=sb.storage.from('tournament-banners').getPublicUrl(path).data.publicUrl}
  let p={section_id:$('section').value,title:$('title').value.trim(),banner_url:banner,short_description:$('short').value.trim()||null,entry_fee:+$('entry').value||0,prize_pool:+$('prize').value||0,total_slots:+$('slots').value||0,tournament_date:$('date').value||null,start_time:$('start').value||null,end_time:$('end').value||null,game:$('game').value.trim()||null,mode:$('mode').value.trim()||null,map:$('map').value.trim()||null,prize_distribution:$('distribution').value.trim()||null,full_details:$('details').value.trim()||null,rules:$('rules').value.trim()||null,important_notes:$('notes').value.trim()||null,status:$('status').value,show_on_homepage:$('home').value==='true'};
  let q=id?sb.from('tournaments').update(p).eq('id',id):sb.from('tournaments').insert(p);let r=await q;if(r.error)throw r.error;closeM('tm');await load();
 }catch(e){console.error(e);msg(e.message||'Save failed')}
}
window.publish=async function(id,status){let v=status==='published'?'unpublished':'published';let {error}=await sb.from('tournaments').update({status:v,show_on_homepage:v==='published'}).eq('id',id);if(error)return msg(error.message);load()}
window.home=async function(id,v){let {error}=await sb.from('tournaments').update({show_on_homepage:v}).eq('id',id);if(error)return msg(error.message);load()}
window.archive=async function(id){if(!confirm('Archive tournament?'))return;let {error}=await sb.from('tournaments').update({status:'archived',show_on_homepage:false}).eq('id',id);if(error)return msg(error.message);load()}

(async()=>{if(await admin())await load()})();
</script>
</body>
</html>
