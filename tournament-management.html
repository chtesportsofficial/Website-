<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHT ESP ORG — Tournament Management</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b11;color:#f4f6fb;font-family:Arial,sans-serif}
.wrap{width:min(760px,100%);margin:auto;padding:18px 14px 60px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{color:#fff;text-decoration:none;font-size:30px}
h1{font-size:20px;margin:0}.sub{font-size:11px;color:#8e98aa;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
button{appearance:none;-webkit-appearance:none;border:1px solid #2b354a;border-radius:12px;background:#151b28;color:#fff;padding:12px 10px;font-size:12px;font-weight:800;cursor:pointer;touch-action:manipulation}
.primary{background:#22c55e;color:#06100a;border-color:#22c55e}
.panel{background:#121823;border:1px solid #273146;border-radius:16px;padding:13px;margin-bottom:12px}
.panelhead{display:flex;justify-content:space-between;align-items:center}.panelhead b{font-size:13px}.count{font-size:10px;color:#8993a6}
.item{background:#171e2c;border:1px solid #2a354b;border-radius:12px;padding:11px;margin-top:8px}
.name{font-size:12px;font-weight:800}.meta{font-size:10px;color:#8f99aa;line-height:1.5;margin-top:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.mini{padding:7px 9px;font-size:9px}.danger{color:#ff7777}
.empty{text-align:center;color:#8b95a8;font-size:11px;padding:18px}.footer{text-align:center;color:#687287;font-size:10px;padding:20px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;align-items:flex-end}
.modal.show{display:flex}.modalbox{width:100%;max-height:94vh;overflow:auto;background:#0c111a;border:1px solid #29344a;border-radius:20px 20px 0 0;padding:15px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
label{display:block;color:#8d97a9;font-size:10px;font-weight:800;margin:9px 0 5px}
input,select,textarea{width:100%;border:1px solid #2b354a;background:#151b28;color:#fff;border-radius:10px;padding:10px;font-size:11px;outline:none}
textarea{min-height:75px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.toast{position:fixed;left:12px;right:12px;bottom:14px;z-index:2000;background:#171e2c;border:1px solid #33405a;border-radius:12px;padding:11px;text-align:center;font-size:11px;display:none}
.toast.show{display:block}
@media(max-width:520px){.actions,.grid,.modalactions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="header"><a class="back" href="admin-panel.html">‹</a><div><h1>Tournament Management</h1><div class="sub">Create, edit and publish Homepage tournaments</div></div></div>
  <div class="actions">
    <button type="button" class="primary" id="createBtn">＋ Create Tournament</button>
    <button type="button" id="sectionBtn">＋ Add New Section</button>
  </div>
  <section class="panel"><div class="panelhead"><b>Homepage Sections</b><span class="count" id="sectionCount">0</span></div><div id="sections"><div class="empty">Loading...</div></div></section>
  <section class="panel"><div class="panelhead"><b>Tournaments</b><span class="count" id="tournamentCount">0</span></div><div id="tournaments"><div class="empty">Loading...</div></div></section>
</main>
<div class="footer">©CHT ESP ORG. All Rights Reserved</div>

<div class="modal" id="tournamentModal">
<div class="modalbox">
<div class="modalhead"><b id="tmTitle">Create Tournament</b><button type="button" data-close="tournamentModal">×</button></div>
<input type="hidden" id="tid">
<label>Tournament Name *</label><input id="title" placeholder="CHT DAILY SCRIM #01">
<label>Homepage Section *</label><select id="section"></select>
<label>Banner</label><input id="banner" type="file" accept="image/png,image/jpeg,image/webp">
<label>Short Description</label><textarea id="short"></textarea>
<div class="grid">
<div><label>Entry Fee</label><input id="entry" type="number" min="0" value="0"></div>
<div><label>Prize Pool</label><input id="prize" type="number" min="0" value="0"></div>
<div><label>Total Slots</label><input id="slots" type="number" min="0" value="0"></div>
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Start Time</label><input id="start" type="time"></div>
<div><label>End Time</label><input id="end" type="time"></div>
<div><label>Game</label><input id="game" placeholder="Free Fire"></div>
<div><label>Mode</label><input id="mode" placeholder="Squad"></div>
<div><label>Map</label><input id="map" placeholder="Bermuda"></div>
<div><label>Status</label><select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="unpublished">Unpublished</option><option value="archived">Archived</option></select></div>
</div>
<label>Prize Distribution</label><textarea id="distribution"></textarea>
<label>Full Details</label><textarea id="details"></textarea>
<label>Rules</label><textarea id="rules"></textarea>
<label>Important Notes</label><textarea id="notes"></textarea>
<label>Show on Homepage</label><select id="home"><option value="false">No</option><option value="true">Yes</option></select>
<div class="modalactions"><button type="button" data-close="tournamentModal">Cancel</button><button type="button" class="primary" id="saveTournamentBtn">Save Tournament</button></div>
</div></div>

<div class="modal" id="sectionModal">
<div class="modalbox">
<div class="modalhead"><b id="smTitle">Add New Section</b><button type="button" data-close="sectionModal">×</button></div>
<input type="hidden" id="sid">
<label>Section Name *</label><input id="sname" placeholder="Today's Scrims Tournaments">
<label>Description</label><textarea id="sdesc"></textarea>
<label>Display Order</label><input id="sorder" type="number" min="0" value="1">
<label>Active</label><select id="sactive"><option value="true">Active</option><option value="false">Inactive</option></select>
<div class="modalactions"><button type="button" data-close="sectionModal">Cancel</button><button type="button" class="primary" id="saveSectionBtn">Save Section</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const SUPABASE_KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
let db=null, sections=[], tournaments=[], currentUser=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)};
const openModal=id=>$(id).classList.add('show');
const closeModal=id=>$(id).classList.remove('show');

function resetTournament(){
 $('tid').value='';$('tmTitle').textContent='Create Tournament';$('title').value='';$('short').value='';
 ['entry','prize','slots'].forEach(id=>$(id).value=0);
 ['date','start','end','game','mode','map','distribution','details','rules','notes'].forEach(id=>$(id).value='');
 $('status').value='draft';$('home').value='false';$('banner').value='';fillSections();openModal('tournamentModal');
}
function resetSection(){
 $('sid').value='';$('smTitle').textContent='Add New Section';$('sname').value='';$('sdesc').value='';
 $('sorder').value=sections.length+1;$('sactive').value='true';openModal('sectionModal');
}
function fillSections(selected=''){
 const active=sections.filter(s=>s.is_active);
 $('section').innerHTML=active.length?active.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selected?'selected':'')+'>'+esc(s.name)+'</option>').join(''):'<option value="">No active section</option>';
}
function renderSections(){
 $('sectionCount').textContent=sections.length;
 $('sections').innerHTML=sections.length?sections.map(s=>'<div class="item"><div class="name">'+esc(s.name)+' <span class="count">'+(s.is_active?'ACTIVE':'INACTIVE')+'</span></div><div class="meta">'+esc(s.description||'')+' · Order '+esc(s.display_order)+'</div><div class="row"><button type="button" class="mini" data-action="edit-section" data-id="'+esc(s.id)+'">Edit</button><button type="button" class="mini" data-action="toggle-section" data-id="'+esc(s.id)+'" data-value="'+(!s.is_active)+'">'+(s.is_active?'Disable':'Enable')+'</button><button type="button" class="mini danger" data-action="delete-section" data-id="'+esc(s.id)+'">Delete</button></div></div>').join(''):'<div class="empty">No sections.</div>';
}
function renderTournaments(){
 $('tournamentCount').textContent=tournaments.length;
 $('tournaments').innerHTML=tournaments.length?tournaments.map(t=>'<div class="item"><div class="name">'+esc(t.title)+' <span class="count">'+esc(t.status)+'</span></div><div class="meta">'+esc(t.tournament_sections?.name||'No section')+' · Entry ৳'+(t.entry_fee||0)+' · Prize ৳'+(t.prize_pool||0)+' · Slots '+(t.total_slots||0)+'</div><div class="row"><button type="button" class="mini" data-action="edit-tournament" data-id="'+esc(t.id)+'">Edit</button><button type="button" class="mini" data-action="publish" data-id="'+esc(t.id)+'" data-status="'+esc(t.status)+'">'+(t.status==='published'?'Unpublish':'Publish')+'</button><button type="button" class="mini" data-action="home" data-id="'+esc(t.id)+'" data-value="'+(!t.show_on_homepage)+'">'+(t.show_on_homepage?'Hide Homepage':'Show Homepage')+'</button><button type="button" class="mini danger" data-action="archive" data-id="'+esc(t.id)+'">Archive</button></div></div>').join(''):'<div class="empty">No tournaments created yet.</div>';
}
async function load(){
 if(!db)return;
 const a=await db.from('tournament_sections').select('*').order('display_order');
 const b=await db.from('tournaments').select('*,tournament_sections(name)').order('created_at',{ascending:false});
 if(a.error){$('sections').innerHTML='<div class="empty">'+esc(a.error.message)+'</div>'}else{sections=a.data||[];renderSections()}
 if(b.error){$('tournaments').innerHTML='<div class="empty">'+esc(b.error.message)+'</div>'}else{tournaments=b.data||[];renderTournaments()}
 fillSections();
}
async function start(){
 if(!window.supabase){toast('Supabase library did not load.');return}
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const sess=await db.auth.getSession();
 currentUser=sess.data?.session?.user||null;
 if(!currentUser) toast('Not logged in. Please login first.');
 await load();
}
async function saveSection(){
 if(!db)return;
 const id=$('sid').value;
 const p={name:$('sname').value.trim(),description:$('sdesc').value.trim()||null,display_order:+$('sorder').value||0,is_active:$('sactive').value==='true'};
 if(!p.name)return toast('Section name required.');
 const r=id?await db.from('tournament_sections').update(p).eq('id',id):await db.from('tournament_sections').insert(p);
 if(r.error)return toast(r.error.message);
 closeModal('sectionModal');await load();toast('Section saved.');
}
async function saveTournament(){
 if(!db)return;
 const id=$('tid').value, old=tournaments.find(t=>t.id===id);
 if(!$('title').value.trim())return toast('Tournament name required.');
 if(!$('section').value)return toast('Create/select a section first.');
 let banner=old?.banner_url||null, file=$('banner').files[0];
 try{
  if(file){
   const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
   const path=crypto.randomUUID()+'.'+(['jpg','jpeg','png','webp'].includes(ext)?ext:'jpg');
   const up=await db.storage.from('tournament-banners').upload(path,file,{upsert:false,contentType:file.type});
   if(up.error)throw up.error;
   banner=db.storage.from('tournament-banners').getPublicUrl(path).data.publicUrl;
  }
  const p={section_id:$('section').value,title:$('title').value.trim(),banner_url:banner,short_description:$('short').value.trim()||null,entry_fee:+$('entry').value||0,prize_pool:+$('prize').value||0,total_slots:+$('slots').value||0,tournament_date:$('date').value||null,start_time:$('start').value||null,end_time:$('end').value||null,game:$('game').value.trim()||null,mode:$('mode').value.trim()||null,map:$('map').value.trim()||null,prize_distribution:$('distribution').value.trim()||null,full_details:$('details').value.trim()||null,rules:$('rules').value.trim()||null,important_notes:$('notes').value.trim()||null,status:$('status').value,show_on_homepage:$('home').value==='true'};
  const r=id?await db.from('tournaments').update(p).eq('id',id):await db.from('tournaments').insert(p);
  if(r.error)throw r.error;
  closeModal('tournamentModal');await load();toast('Tournament saved.');
 }catch(e){toast(e.message||'Save failed');}
}
function editSection(id){const s=sections.find(x=>x.id===id);if(!s)return;$('sid').value=s.id;$('smTitle').textContent='Edit Section';$('sname').value=s.name;$('sdesc').value=s.description||'';$('sorder').value=s.display_order;$('sactive').value=String(s.is_active);openModal('sectionModal')}
async function editTournament(id){const t=tournaments.find(x=>x.id===id);if(!t)return;$('tid').value=t.id;$('tmTitle').textContent='Edit Tournament';fillSections(t.section_id);$('title').value=t.title||'';$('short').value=t.short_description||'';$('entry').value=t.entry_fee||0;$('prize').value=t.prize_pool||0;$('slots').value=t.total_slots||0;$('date').value=t.tournament_date||'';$('start').value=t.start_time||'';$('end').value=t.end_time||'';$('game').value=t.game||'';$('mode').value=t.mode||'';$('map').value=t.map||'';$('distribution').value=t.prize_distribution||'';$('details').value=t.full_details||'';$('rules').value=t.rules||'';$('notes').value=t.important_notes||'';$('status').value=t.status||'draft';$('home').value=String(!!t.show_on_homepage);$('banner').value='';openModal('tournamentModal')}
async function toggleSection(id,v){const r=await db.from('tournament_sections').update({is_active:v}).eq('id',id);if(r.error)return toast(r.error.message);load()}
async function deleteSection(id){if(!confirm('Delete section?'))return;const r=await db.from('tournament_sections').delete().eq('id',id);if(r.error)return toast(r.error.message);load()}
async function publish(id,status){const v=status==='published'?'unpublished':'published';const r=await db.from('tournaments').update({status:v,show_on_homepage:v==='published'}).eq('id',id);if(r.error)return toast(r.error.message);load()}
async function home(id,v){const r=await db.from('tournaments').update({show_on_homepage:v}).eq('id',id);if(r.error)return toast(r.error.message);load()}
async function archive(id){if(!confirm('Archive tournament?'))return;const r=await db.from('tournaments').update({status:'archived',show_on_homepage:false}).eq('id',id);if(r.error)return toast(r.error.message);load()}

document.addEventListener('DOMContentLoaded',function(){
 $('createBtn').addEventListener('click',resetTournament);
 $('sectionBtn').addEventListener('click',resetSection);
 document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));
 $('saveSectionBtn').addEventListener('click',saveSection);
 $('saveTournamentBtn').addEventListener('click',saveTournament);
 $('sections').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case'edit-section':editSection(id);break;case'toggle-section':toggleSection(id,b.dataset.value==='true');break;case'delete-section':deleteSection(id);break;}});
 $('tournaments').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case'edit-tournament':editTournament(id);break;case'publish':publish(id,b.dataset.status);break;case'home':home(id,b.dataset.value==='true');break;case'archive':archive(id);break;}});
 start();
});
})();
</script>
</body>
</html>
