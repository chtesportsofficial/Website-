<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connection Test</title>
<style>
  body{ font-family:sans-serif; background:#0b0f19; color:#fff; padding:20px; }
  .box{ background:#141a29; border:1px solid #232c42; border-radius:10px; padding:14px; margin-bottom:14px; white-space:pre-wrap; word-break:break-all; font-size:13px; }
  h3{ margin:0 0 8px; font-size:14px; }
  .ok{ color:#22c55e; }
  .fail{ color:#ef4444; }
</style>
</head>
<body>
<h2>API সংযোগ পরীক্ষা</h2>
<div id="result1" class="box">টেস্ট ১ (GET) চলছে...</div>
<div id="result2" class="box">টেস্ট ২ (POST, text/plain) চলছে...</div>

<script>
const API = 'https://cht.gamer.gd/api/admin-deposits-list.php';

function show(id, label, ok, detail){
  document.getElementById(id).innerHTML =
    '<h3>' + label + '</h3><span class="' + (ok ? 'ok' : 'fail') + '">' +
    (ok ? '✔ সফল' : '✘ ব্যর্থ') + '</span>\n\n' + detail;
}

// Test 1: simple GET
fetch(API, { method: 'GET' })
  .then(r => r.text().then(t => show('result1', 'GET রিকোয়েস্ট', true,
    'HTTP status: ' + r.status + '\nResponse body:\n' + t.slice(0, 500))))
  .catch(e => show('result1', 'GET রিকোয়েস্ট', false, 'Error name: ' + e.name + '\nError message: ' + e.message));

// Test 2: POST with text/plain, mimicking admin.html's real call
fetch(API, {
  method: 'POST',
  headers: { 'Content-Type': 'text/plain' },
  body: JSON.stringify({ access_token: 'test', status: 'pending' })
})
  .then(r => r.text().then(t => show('result2', 'POST রিকোয়েস্ট (আসল কল যেভাবে হয়)', true,
    'HTTP status: ' + r.status + '\nResponse body:\n' + t.slice(0, 500))))
  .catch(e => show('result2', 'POST রিকোয়েস্ট (আসল কল যেভাবে হয়)', false, 'Error name: ' + e.name + '\nError message: ' + e.message));
</script>
</body>
</html>
