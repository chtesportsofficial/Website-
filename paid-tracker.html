<style>
:root{--bg:var(--g-bg,#0a0d13);--sf:var(--g-surface,#131826);--sf2:var(--g-surface-2,#171d2d);--line:var(--g-border,#232b3d);--tx:var(--g-text,#eef1f7);--dim:var(--g-muted,#8b93a9);--green:#22e08a;--red:#ff5a6e;--yel:#ffd93d;--blue:#3b82f6;--gold:#e9c96a;--card:var(--sf);--border:var(--line);--text:var(--tx)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.ib svg{width:20px;height:20px}.top h1{font-size:19px;font-weight:750;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty,.gate{padding:80px 24px;text-align:center;color:var(--dim);font-size:14px;line-height:1.7}
.box{margin:0 16px 14px;background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 6px 22px rgba(0,0,0,.35)}

.box>.bn{width:130px;height:130px;margin:0 auto 10px}

.bar{height:8px;border-radius:9px;background:var(--bg);overflow:hidden;display:flex;margin:0}

.bnp .bn{margin-bottom:8px}
.upl{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:12px;border:1px dashed var(--line);background:var(--bg);font-size:14px;font-weight:700;color:var(--dim);cursor:pointer}
.upl input{display:none}
.cap{font-style:normal;opacity:.7}
.btns{display:flex;gap:10px;margin-top:18px}
.bt{flex:1;padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--sf2);font-weight:800;font-size:15px}
.bt.p{background:var(--green);color:#04170d;border:0}.bt.d{color:var(--red)}
</style>

<body>
<div class="gate" id="gate">Checking access…</div>
<div class="app" id="app" style="display:none">
  <div class="top topbar header" id="top"></div>
  <div id="main"></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
/* ---------- owner gate ---------- */
(async function(){
  var gate=document.getElementById('gate'),app=document.getElementById('app');
  function deny(){gate.innerHTML='Access denied.<br><a href="index.html" style="color:#22e08a;font-weight:800;text-decoration:none">Go back</a>'}
  try{
    var c=window.supabaseClient||window.supabase.createClient('https://myfficbwcbgbxbdqjexv.supabase.co','sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5');
    var r=await c.auth.getSession(),s=r&&r.data&&r.data.session; if(!s){deny();return}
    var pr=await c.from('profiles').select('is_owner').eq('id',s.user.id).maybeSingle();
    if(pr.data&&pr.data.is_owner){gate.style.display='none';app.style.display='';init()}else deny();
  }catch(e){deny()}
})();

/* ---------- tournament types / roadmaps ---------- */
const TYPES={
 '24':{slots:24,road:['Groups A·B','Grand Final'],cap:[24,12],info:'Group A + B (২৪ টিম) → Final (১২ টিম)'},
 '36':{slots:36,road:['Groups A·B·C','Semi','Final'],cap:[36,12,12],info:'Group A·B·C (৩৬ টিম) → Semi (১২ টিম) → Final (১২ টিম)'},
 '48':{slots:48,road:['Groups A–D','Semi','Final'],cap:[48,24,12],info:'Group A–D (৪৮ টিম) → Semi (২৪ টিম) → Final (১২ টিম)'},
 'pro':{slots:12,road:['Pro Final'],cap:[12],info:'শুধু Pro Final (১২ slot) — পরে ঠিক হবে'}
};
const ST=['','PAID','DUE','LOSS','DIS'];
const KEY='chteo_paid_tracker_v1';
let D={ts:[]},cur=null,stage=0,dueOnly=false,newType='48';
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tk=n=>'৳'+Math.round(n).toLocaleString('en-IN');
function init(){try{D=JSON.parse(localStorage.getItem(KEY))||{ts:[]}}catch(e){D={ts:[]}} home()}

/* ---------- money ---------- */
function calc(t){
 const c={PAID:0,DUE:0,LOSS:0,DIS:0};t.teams.forEach(x=>{if(c[x.s]!==undefined)c[x.s]++});
 const total=t.teams.length*t.fee, cost=(+t.prize||0)+(+t.gfx||0)+(+t.live||0);
 const coll=c.PAID*t.fee, due=c.DUE*t.fee, loss=(c.LOSS+c.DIS)*t.fee;
 return {c,total,cost,coll,due,loss,cur:coll-cost,est:total-loss-cost};
}

/* ---------- home ---------- */
function home(){
 cur=null;
 $('top').innerHTML='<button class="back-btn" type="button" onclick="history.back()">'+BACK+'</button><h1>PAID TRACKER</h1>';
 let tc=0,td=0,tp=0;D.ts.forEach(t=>{const k=calc(t);tc+=k.coll;td+=k.due;tp+=k.cur});
 let h=`<div class="box"><div class="sum"><div class="sc"><small>Collected</small><b class="g">${tk(tc)}</b></div><div class="sc"><small>Total Due</small><b class="y">${tk(td)}</b></div><div class="sc"><small>Profit</small><b class="${tp<0?'r':'g'}">${tk(tp)}</b></div></div></div>`;
 if(!D.ts.length)h+='<div class="empty">কোনো টুর্নামেন্ট নেই।<br>নিচের <b>+ New Tournament</b> চাপুন।</div>';
 D.ts.forEach((t,i)=>{const k=calc(t),n=t.teams.length||1;
  h+=`<div class="card${t.banner?' hc':''}" data-open="${i}">${t.banner?`<img class="bn" src="${t.banner}">`:''}<div class="rt"><div class="ch"><h3>${esc(t.name)}</h3><span class="badge">${t.type==='pro'?'PRO':t.type+' slot'}</span></div>
  <div class="subb"><div class="bar"><i style="width:${k.c.PAID/n*100}%;background:#14c46a"></i><i style="width:${k.c.DUE/n*100}%;background:var(--yel)"></i><i style="width:${(k.c.LOSS+k.c.DIS)/n*100}%;background:#ff4d4d"></i></div>
  <div class="mini"><div class="sc"><small>Paid</small><b class="g">${k.c.PAID}</b></div><div class="sc"><small>Due</small><b class="y">${k.c.DUE}</b></div><div class="sc"><small>Loss</small><b class="r">${k.c.LOSS+k.c.DIS}</b></div><div class="sc"><small>Profit</small><b class="${k.cur<0?'r':'g'}">${tk(k.cur)}</b></div></div></div></div></div>`});
 $('main').innerHTML=h+'<button class="fab" data-new>+ New Tournament</button>';
}

/* ---------- detail ---------- */
function orderList(t,stage,list){
 const ord=t.ord&&t.ord[stage];if(!ord)return list;
 const pos=new Map(ord.map((v,i)=>[v,i]));
 return list.map((o,n)=>({o,k:pos.has(o.idx)?pos.get(o.idx):ord.length+n})).sort((a,b)=>a.k-b.k).map(z=>z.o);
}
const colKey=()=>'chteo_pt_col_'+(D.ts[cur]?D.ts[cur].id:'');
function getCol(){try{return new Set(JSON.parse(localStorage.getItem(colKey())||'[]'))}catch(e){return new Set()}}
function setCol(S){try{localStorage.setItem(colKey(),JSON.stringify([...S]))}catch(e){}}
function detail(i){
 if(!(history.state&&history.state.d))history.pushState({d:1},'');
 cur=i;const t=D.ts[i],T=TYPES[t.type],k=calc(t);
 $('top').innerHTML=`<button class="back-btn" type="button" data-home>${BACK}</button><h1>${esc(t.name)}</h1><button class="ib" data-edit>⚙︎</button>`;
 let h=`<div class="box">${t.banner?`<img class="bn" src="${t.banner}">`:''}<div class="stats">
 <div class="sc"><small>Total Tk (${t.teams.length}×${t.fee})</small><b>${tk(k.total)}</b></div>
 <div class="sc"><small>Collected (${k.c.PAID} paid)</small><b class="g">${tk(k.coll)}</b></div>
 <div class="sc"><small>Due (${k.c.DUE} team)</small><b class="y">${tk(k.due)}</b></div>
 <div class="sc"><small>Loss (${k.c.LOSS+k.c.DIS} team)</small><b class="r">${tk(k.loss)}</b></div>
 <div class="sc"><small>Prize + Costs</small><b>${tk(k.cost)}</b></div>
 <div class="sc"><small>Current / Est. Profit</small><b class="${k.cur<0?'r':'g'}">${tk(k.cur)}</b><small style="margin-top:2px">Est. ${tk(k.est)}</small></div></div></div>
 <div class="box"><div class="road">${T.road.map((r,j)=>`<button class="st ${j===stage?'on':''}" data-stage="${j}">${r}<em>${t.teams.filter(x=>x.g>=j).length}/${T.cap[j]}</em></button>`).join('')}</div>
 <div class="tools"><button class="tb ${dueOnly?'on':''}" data-due>${dueOnly?'✓ ':''}Due only</button><button class="tb" data-copy>📋 Copy due list</button></div>`;
 const last=T.road.length-1, grouped=stage===0&&t.type!=='pro', col=getCol();
 let all=t.teams.map((x,idx)=>({x,idx})).filter(o=>o.x.g>=stage);
 if(grouped){const byG={};all.forEach(o=>{(byG[Math.floor(o.idx/12)]=byG[Math.floor(o.idx/12)]||[]).push(o)});all=Object.keys(byG).sort((a,b)=>a-b).flatMap(g=>orderList(t,stage,byG[g]))}
 else all=orderList(t,stage,all);
 const posOf=new Map(all.map((o,n)=>[o.idx,n+1]));
 const list=all.filter(o=>!dueOnly||o.x.s==='DUE');
 if(!list.length)h+='<div class="empty" style="padding:40px 24px">এখানে কোনো টিম নেই</div>';
 let lastG=-1;
 list.forEach((o)=>{
  const g=grouped?Math.floor(o.idx/12):0;
  if(grouped&&g!==lastG){lastG=g;const gm=list.filter(z=>Math.floor(z.idx/12)===g),cl=col.has(g),cnt=st=>gm.filter(z=>z.x.s===st).length;
   h+=`<div class="gh${cl?' cl':''}" data-gt="${g}"><span>GROUP ${String.fromCharCode(65+g)}<small>${gm.length} team · ${cnt('PAID')} paid · ${cnt('DUE')} due</small></span><span class="cv">▾</span></div>`}
  if(grouped&&col.has(g))return;
  const x=o.x, adv=x.g>stage;
  h+=`<div class="row ${x.s==='DIS'?'DIS':''}" data-idx="${o.idx}" data-g="${g}"><span class="n" data-hd title="Hold &amp; drag to reorder">${posOf.get(o.idx)}${dueOnly?'':'<i>⋮⋮</i>'}</span><input class="nm" data-nm="${o.idx}" value="${esc(x.n)}" placeholder="Team name" enterkeyhint="next">
  ${stage===last&&last>0?`<input class="pz" type="number" inputmode="numeric" data-pz="${o.idx}" value="${x.pz||''}" placeholder="Prize">`:''}
  <button type="button" class="chip ${x.s}" data-stb="${o.idx}">${x.s||'—'} ▾</button>
  ${stage>0?`<button class="mv" data-dn="${o.idx}" title="Remove from this stage">↓</button>`:''}
  ${stage<last?`<button class="mv${adv?' adv':''}" data-up="${o.idx}" title="${adv?'Advanced — tap to undo':'Advance'}">↑</button>`:''}</div>`;
 });
 $('main').innerHTML=h+'</div>';
}
/* ---------- drag to reorder (hold the number handle) ---------- */
let dr=null;
document.addEventListener('pointerdown',e=>{
 const hd=e.target.closest&&e.target.closest('[data-hd]');if(!hd||dueOnly)return;
 const row=hd.closest('.row');if(!row)return;
 e.preventDefault();closeMenu();
 const r=row.getBoundingClientRect();
 dr={row,grab:e.clientY-r.top,y:e.clientY,g:row.dataset.g,id:e.pointerId};
 row.classList.add('drag');document.body.classList.add('dragging');
 try{hd.setPointerCapture(e.pointerId)}catch(_){}
 dragTick();
});
function dragTick(){
 if(!dr)return;
 const {row}=dr;
 row.style.transform='';
 let rr=row.getBoundingClientRect();
 // swap with neighbours when the pointer crosses their middle
 for(let guard=0;guard<30;guard++){
  const cy=dr.y-dr.grab+rr.height/2;
  const prev=row.previousElementSibling,next=row.nextElementSibling;
  if(prev&&prev.classList.contains('row')&&prev.dataset.g===dr.g&&cy<prev.getBoundingClientRect().top+prev.getBoundingClientRect().height/2){row.parentNode.insertBefore(row,prev)}
  else if(next&&next.classList.contains('row')&&next.dataset.g===dr.g&&cy>next.getBoundingClientRect().top+next.getBoundingClientRect().height/2){row.parentNode.insertBefore(next,row)}
  else break;
 }
 rr=row.getBoundingClientRect();
 row.style.transform=`translateY(${dr.y-dr.grab-rr.top}px)`;
 // auto-scroll near the edges
 const edge=90;let sc=0;if(dr.y<edge+70)sc=-12;else if(dr.y>innerHeight-edge-60)sc=12;
 if(sc){window.scrollBy(0,sc)}
 dr.raf=requestAnimationFrame(dragTick);
}
document.addEventListener('pointermove',e=>{if(dr){dr.y=e.clientY;e.preventDefault()}},{passive:false});
function dragEnd(){
 if(!dr)return;cancelAnimationFrame(dr.raf);
 const row=dr.row;row.classList.remove('drag');row.style.transform='';document.body.classList.remove('dragging');dr=null;
 const t=D.ts[cur];if(!t)return;
 const ids=[...document.querySelectorAll('.row[data-idx]')].map(x=>+x.dataset.idx);
 t.ord=t.ord||{};t.ord[stage]=ids;save();detail(cur);
}
document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd);
/* ---------- back button: detail -> tracker list (not out of the page) ---------- */
function goHome(){if(history.state&&history.state.d)history.back();else home()}
window.addEventListener('popstate',()=>{if(cur!==null){if($('ov').classList.contains('show'))closeSheet();closeMenu();home()}});
/* ---------- sheets ---------- */
let lockY=0,tmpB='';
function fitVV(){const v=window.visualViewport,o=$('ov'),sh=$('sheet');if(!v||!o.classList.contains('show'))return;o.style.top=v.offsetTop+'px';o.style.bottom='auto';o.style.height=v.height+'px';sh.style.maxHeight=(v.height-16)+'px'}
if(window.visualViewport){visualViewport.addEventListener('resize',fitVV);visualViewport.addEventListener('scroll',fitVV)}
document.addEventListener('focusin',e=>{if(e.target.closest&&e.target.closest('#sheet')&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='file'){setTimeout(()=>{fitVV();e.target.scrollIntoView({block:'center',behavior:'smooth'})},320)}});
function openSheet(h){$('sheet').innerHTML=h;$('ov').classList.add('show');lockY=window.scrollY;document.body.style.top=-lockY+'px';document.body.classList.add('lock');fitVV()}
function closeSheet(){$('ov').classList.remove('show');$('ov').style.top=$('ov').style.bottom=$('ov').style.height='';$('sheet').style.maxHeight='';document.body.classList.remove('lock');document.body.style.top='';window.scrollTo(0,lockY)}
function form(t){
 const e=!!t;newType=e?t.type:newType;tmpB=e?(t.banner||''):'';
 return `<h2>${e?'Edit Tournament':'New Tournament'}</h2>
 <div class="lb">Banner (optional)</div><div class="bnp" id="bnp">${tmpB?`<img class="bn" src="${tmpB}">`:''}</div><label class="upl"><input type="file" accept="image/*" id="fB"><span id="bnl">${tmpB?'🖼 Change banner':'🖼 Add banner'}</span></label>${tmpB?'<button class="bt d" style="margin-top:8px;width:100%;flex:none;padding:10px" data-rmb>Remove banner</button>':''}
 <div class="lb">Name</div><input class="in" id="fN" value="${e?esc(t.name):''}" placeholder="e.g. CHT EXTREME CLASH - S4">
 ${e?'':`<div class="lb">Type</div><div class="types">${Object.keys(TYPES).map(k=>`<button class="ty ${k===newType?'on':''}" data-ty="${k}">${k==='pro'?'PRO':k}</button>`).join('')}</div><div class="rp" id="rp"></div>`}
 <div class="two"><div><div class="lb">Entry fee</div><input class="in" id="fF" type="number" inputmode="numeric" value="${e?t.fee:''}"></div><div><div class="lb">Prizepool</div><input class="in" id="fP" type="number" inputmode="numeric" value="${e?t.prize:''}"></div></div>
 <div class="two"><div><div class="lb">GFX cost</div><input class="in" id="fG" type="number" inputmode="numeric" value="${e?t.gfx:''}"></div><div><div class="lb">Live / other cost</div><input class="in" id="fL" type="number" inputmode="numeric" value="${e?t.live:''}"></div></div>
 <div class="btns">${e?'<button class="bt d" data-del>Delete</button>':''}<button class="bt" data-close>Cancel</button><button class="bt p" data-save>${e?'Save':'Create'}</button></div>`;
}
function rpShow(){const el=$('rp');if(el)el.innerHTML=`<b>${TYPES[newType].slots} slot</b> · Roadmap:<br>${TYPES[newType].info}`}

/* ---------- status dropdown (opens right at the cell) ---------- */
function closeMenu(){const m=$('stm');if(m)m.classList.remove('show')}
function openMenu(btn){
 let m=$('stm');if(!m){m=document.createElement('div');m.id='stm';document.body.appendChild(m)}
 if(m.classList.contains('show')&&m.dataset.i===btn.dataset.stb){closeMenu();return}
 m.dataset.i=btn.dataset.stb;const cs=D.ts[cur].teams[+btn.dataset.stb].s;
 m.innerHTML=ST.map(v=>`<button type="button" data-sv="${v}" class="${v}">${v?v:'—  None'}${v===cs?'  ✓':''}</button>`).join('');
 m.classList.add('show');const r=btn.getBoundingClientRect(),h=m.offsetHeight,w=m.offsetWidth;
 let top=r.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);
 m.style.top=top+'px';m.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+'px';
}
window.addEventListener('scroll',closeMenu,{passive:true});
/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const q=s=>e.target.closest(s);let b;
 if(b=q('#stm [data-sv]')){const i=+$('stm').dataset.i;D.ts[cur].teams[i].s=b.dataset.sv;save();closeMenu();return detail(cur)}
 if(b=q('[data-stb]')){return openMenu(b)}
 if(!q('#stm'))closeMenu();
 if(q('#ov')&&e.target.id==='ov')return closeSheet();
 if(b=q('[data-open]'))return detail(+b.dataset.open);
 if(q('[data-home]'))return goHome();
 if(b=q('[data-gt]')){const S=getCol(),g=+b.dataset.gt;S.has(g)?S.delete(g):S.add(g);setCol(S);return detail(cur)}
 if(q('[data-new]')){openSheet(form(null));rpShow();return}
 if(q('[data-edit]')){openSheet(form(D.ts[cur]));return}
 if(q('[data-close]'))return closeSheet();
 if(b=q('[data-ty]')){newType=b.dataset.ty;document.querySelectorAll('.ty').forEach(x=>x.classList.toggle('on',x.dataset.ty===newType));return rpShow()}
 if(q('[data-save]')){
  const name=$('fN').value.trim()||'Untitled',v=id=>+$(id).value||0;
  if(cur===null){const T=TYPES[newType];D.ts.unshift({id:Date.now(),name,type:newType,fee:v('fF'),prize:v('fP'),gfx:v('fG'),live:v('fL'),banner:tmpB,teams:Array.from({length:T.slots},()=>({n:'',s:'',g:0,pz:''}))});save();closeSheet();stage=0;return detail(0)}
  Object.assign(D.ts[cur],{banner:tmpB,name,fee:v('fF'),prize:v('fP'),gfx:v('fG'),live:v('fL')});save();closeSheet();return detail(cur)}
 if(q('[data-rmb]')){tmpB='';$('bnp').innerHTML='';$('bnl').textContent='🖼 Add banner';e.target.remove();return}
 if(q('[data-del]')){if(confirm('এই টুর্নামেন্ট ডিলিট করবেন?')){D.ts.splice(cur,1);save();closeSheet();goHome()}return}
 if(b=q('[data-stage]')){stage=+b.dataset.stage;return detail(cur)}
 if(q('[data-due]')){dueOnly=!dueOnly;return detail(cur)}
 if(q('[data-copy]')){
  const t=D.ts[cur],d=t.teams.filter(x=>x.s==='DUE'&&x.n);
  const txt=`${t.name} — DUE LIST\n`+(d.map((x,i)=>`${i+1}. ${x.n}`).join('\n')||'No due 🎉')+`\nTotal: ${d.length} team × ${t.fee} = ${tk(d.length*t.fee)}`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{b=q('[data-copy]');b.textContent='✓ Copied';setTimeout(()=>detail(cur),1200)}).catch(()=>prompt('Copy:',txt));return}
  if(b=q('[data-up]')){const t=D.ts[cur],x=t.teams[+b.dataset.up],nx=stage+1,cp=TYPES[t.type].cap[nx];if(x.g>stage){x.g=stage;save();return detail(cur)}if(cp&&t.teams.filter(y=>y.g>=nx).length>=cp){alert(TYPES[t.type].road[nx]+' এ '+cp+' টিম পূর্ণ।');return}x.g=Math.max(x.g,nx);save();return detail(cur)}
 if(b=q('[data-dn]')){D.ts[cur].teams[+b.dataset.dn].g=stage-1;save();return detail(cur)}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='fB'&&el.files[0]){const f=el.files[0],im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const w=Math.min(900,im.width),h=im.height*w/im.width,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);tmpB=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(u);$('bnp').innerHTML=`<img class="bn" src="${tmpB}">`;$('bnl').textContent='🖼 Change banner'};im.src=u;return}
 if(el.dataset.nm!==undefined){D.ts[cur].teams[+el.dataset.nm].n=el.value.trim();save()}
 if(el.dataset.pz!==undefined){D.ts[cur].teams[+el.dataset.pz].pz=el.value;save()}
});
document.addEventListener('keydown',e=>{
 const el=e.target;
 if(e.key==='Enter'&&el.classList&&el.classList.contains('nm')){
  e.preventDefault();const all=[...document.querySelectorAll('input.nm')],i=all.indexOf(el);
  el.dispatchEvent(new Event('change',{bubbles:true}));
  const nx=all[i+1];if(nx){nx.focus();nx.select&&nx.select()}else el.blur();
 }
});
</script>
</body>
</html>
