<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Feedback</title>
<link rel="stylesheet" href="theme.css">
<script src="global.js" defer></script>
<style>
  :root{
    --bg:#0b0f19;
    --card:#141a29;
    --card-2:#171f33;
    --border:#232c42;
    --text:#ffffff;
    --muted:#8a93a6;
    --blue:#6366f1;
    --green:#22c55e;
    --red:#ef4444;
    --yellow:#f59e0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:20px 0 60px;
  }
  .phone{
    width:100%;
    max-width:420px;
    padding:0 16px;
    position:relative;
  }

  .header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 4px 22px;
  }
  .back-btn{
    width:56px;height:56px;
    border:none;
    border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);
    background:var(--card-2);
    border:1px solid var(--border);
    cursor:pointer;
    font-size:22px;
    flex-shrink:0;
  }
  .header h1{
    font-size:26px;
    font-weight:800;
    margin:0;
  }
  .header p{
    margin:2px 0 0;
    color:var(--muted);
    font-size:13px;
  }

  .fb-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .fb-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .fb-date{ font-size:12px; color:var(--muted); }
  .fb-badge{
    font-size:11px;
    font-weight:700;
    padding:6px 12px;
    border-radius:20px;
    text-transform:capitalize;
    white-space:nowrap;
    flex-shrink:0;
  }
  .fb-badge-pending{ background:rgba(245,158,11,.14); color:var(--yellow); }
  .fb-badge-reviewed{ background:rgba(99,102,241,.15); color:var(--blue); }
  .fb-badge-resolved{ background:rgba(34,197,94,.14); color:var(--green); }

  .fb-message{
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
    margin:12px 0;
    color:var(--text);
  }

  .fb-shot{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:12px;
    background:#080b12;
    border:1px solid var(--border);
    cursor:zoom-in;
    display:block;
    margin-bottom:8px;
  }

  .fb-reply{
    margin-top:12px;
    padding:12px 13px;
    border-radius:12px;
    background:var(--card-2);
    border:1px solid var(--border);
    border-left:3px solid var(--blue);
  }
  .fb-reply-label{
    font-size:11px;
    font-weight:700;
    color:var(--blue);
    text-transform:uppercase;
    letter-spacing:0.3px;
    margin-bottom:5px;
  }
  .fb-reply-text{
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    color:var(--text);
  }

  .empty, .loading{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:60px 16px;
  }
  .empty a{
    color:var(--blue);
    font-weight:700;
    text-decoration:none;
  }

  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.88);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:60;
    cursor:zoom-out;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:10px; }
</style>
</head>
<body>
<div class="phone">

  <div class="header">
    <button class="back-btn" type="button" onclick="history.back()">&#8249;</button>
    <div>
      <h1>My Feedback</h1>
      <p>Track the status and replies to your submissions</p>
    </div>
  </div>

  <div id="list" class="loading">Loading your feedback...</div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="Feedback screenshot">
</div>

<script>
const list = document.getElementById('list');

function escHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function formatDate(v){
  if(!v) return '';
  const d = new Date(v);
  if(Number.isNaN(d.getTime())) return String(v);
  return d.toLocaleString('en-BD',{dateStyle:'medium',timeStyle:'short'});
}

function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src = '';
}

function render(rows){
  if(!rows.length){
    list.innerHTML = '<div class="empty">You haven\'t submitted any feedback yet.<br><br><a href="feedback.html">Submit feedback &rarr;</a></div>';
    return;
  }

  list.innerHTML = rows.map(f => `
    <div class="fb-card">
      <div class="fb-top">
        <div class="fb-date">${escHtml(formatDate(f.created_at))}</div>
        <span class="fb-badge fb-badge-${escHtml(f.status || 'pending')}">${escHtml(f.status || 'pending')}</span>
      </div>

      <div class="fb-message">${escHtml(f.message)}</div>

      ${f.screenshot_url ? `
        <img class="fb-shot" src="${escHtml(f.screenshot_url)}" alt="Your screenshot"
             onclick="openLightbox('${escHtml(f.screenshot_url)}')">
      ` : ''}

      ${f.admin_reply ? `
        <div class="fb-reply">
          <div class="fb-reply-label">Admin reply</div>
          <div class="fb-reply-text">${escHtml(f.admin_reply)}</div>
        </div>
      ` : ''}
    </div>
  `).join('');
}

// global.js loads with `defer`, so it can finish AFTER this inline script
// runs. Poll briefly for window.CHTEO instead of failing on the first
// check — this is what caused the "Could not connect to the server" error
// even though the connection itself was fine.
function waitForCHTEO(callback, attemptsLeft){
  if(attemptsLeft === undefined) attemptsLeft = 50; // ~5s at 100ms

  if(window.CHTEO && window.CHTEO.getSupabaseClient){
    callback();
    return;
  }
  if(attemptsLeft <= 0){
    list.innerHTML = '<div class="empty">Could not connect to the server. Please try again shortly.</div>';
    return;
  }
  setTimeout(() => waitForCHTEO(callback, attemptsLeft - 1), 100);
}

function loadMyFeedback(){
  waitForCHTEO(() => loadMyFeedbackNow());
}

function loadMyFeedbackNow(){
  window.CHTEO.getSupabaseClient(async function(client){
    try{
      const { data: userRes, error: userErr } = await client.auth.getUser();
      const user = userRes && userRes.user;
      if(userErr || !user){
        list.innerHTML = '<div class="empty">Please log in to see your feedback.</div>';
        return;
      }

      const { data, error } = await client
        .from('feedback')
        .select('id,message,screenshot_url,status,admin_reply,created_at')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      if(error) throw error;

      render(data || []);
    }catch(err){
      list.innerHTML = `<div class="empty">${escHtml(err.message || 'Could not load your feedback.')}</div>`;
    }
  });
}

loadMyFeedback();
</script>

</body>
</html>
