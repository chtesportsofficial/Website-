<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tournament Details — CHT ESP ORG</title>
<style>
  :root{
    --bg:#0b0e1a;
    --card:#141a2b;
    --card-2:#161d30;
    --border:rgba(255,255,255,0.08);
    --text:#ffffff;
    --text-dim:#7d8494;
    --text-mid:#9aa0ae;
    --gold:#f2b705;
    --orange:#f5a623;
    --orange-dark:#c9820f;
    --teal:#2dd4bf;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--text);
  }
  .page{max-width:420px;margin:0 auto;padding:14px 14px 30px;}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back{font-size:20px;color:var(--text-mid);text-decoration:none;line-height:1;}
  .header h1{font-size:15px;font-weight:500;}
  .header .org{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .banner{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#1f2740;}

  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
  .stat-box{background:var(--card);border:0.5px solid var(--border);border-radius:8px;padding:6px 4px;text-align:center;}
  .stat-box .label{font-size:9px;text-transform:uppercase;color:var(--text-dim);}
  .stat-box .value{font-size:12px;font-weight:500;margin-top:2px;}

  .combo-row{display:flex;gap:6px;min-height:112px;margin-bottom:10px;}
  .prize-card{flex:1;background:var(--card);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;}
  .prize-card .title{font-size:9px;font-weight:500;color:#c8cdd6;margin-bottom:2px;}
  .prize-list{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:2px;}
  .prize-list .row{display:flex;align-items:center;justify-content:space-between;}
  .prize-list .rank{font-size:10px;color:var(--text-mid);}
  .prize-list .amount{font-size:11px;font-weight:500;color:var(--gold);}

  .info-col{flex:1;display:flex;flex-direction:column;gap:4px;}
  .info-box{flex:1;background:var(--card);border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;min-height:24px;}
  .info-box .label{font-size:9px;color:var(--text-dim);}
  .info-box .value{font-size:10px;font-weight:500;}
  .info-box .emoji{font-size:11px;}

  .link-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
  .link-box{background:var(--card);border:none;border-radius:8px;padding:7px 8px;display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:10px;font-weight:500;text-align:left;cursor:pointer;font-family:inherit;}
  .link-box .chev{color:#5f6472;font-size:12px;}

  .section-title{font-size:11px;font-weight:500;color:#c8cdd6;margin-bottom:6px;}
  .maps-row{display:grid;grid-template-columns:repeat(auto-fill, 74px);gap:6px;justify-content:flex-start;margin-bottom:14px;}
  .map-box{background:var(--card);border-radius:7px;overflow:hidden;}
  .map-box .img{aspect-ratio:1/1;width:100%;background:#1f2740;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#5f6472;font-size:7px;text-align:center;}
  .map-box .name{padding:4px;text-align:center;font-size:8.5px;font-weight:500;}

  .lobby-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .lobby-card{background:var(--card-2);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:12px;}
  .lobby-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .lobby-avatar{width:38px;height:38px;border-radius:50%;background:#3a4152;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0;}
  .lobby-avatar.full{border-color:#555c6c;}
  .lobby-time{font-size:15px;font-weight:500;}
  .lobby-date{font-size:9px;color:var(--text-dim);margin-top:1px;}
  .lobby-meta{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11px;color:var(--text-mid);}
  .lobby-bar{height:5px;background:#2a3145;border-radius:4px;overflow:hidden;margin-bottom:10px;}
  .lobby-bar-fill{height:100%;background:var(--orange);}
  .lobby-bar-fill.full{background:#5f6472;}
  .join-btn{background:var(--orange);border:none;border-bottom:3px solid var(--orange-dark);border-radius:10px;padding:10px;text-align:center;color:#241705;font-size:13px;font-weight:500;width:100%;cursor:pointer;font-family:inherit;}
  .join-btn.full{background:#2a3145;border-bottom-color:#1c2233;color:var(--text-dim);cursor:not-allowed;}

  .empty{text-align:center;color:var(--text-dim);font-size:11px;padding:20px 8px;}
  .loading{text-align:center;color:var(--text-dim);font-size:12px;padding:40px 10px;}

  .lobby-sub{font-size:10px;color:var(--text-dim);margin:-3px 0 8px;}

  .popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;align-items:flex-end;justify-content:center;}
  .popup-overlay.open{display:flex;}
  .popup-box{width:100%;max-width:420px;max-height:80vh;overflow-y:auto;background:var(--card-2);border-radius:18px 18px 0 0;padding:16px;}
  .popup-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .popup-head b{font-size:14px;}
  .popup-head button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:18px;}
  .popup-body{font-size:12px;line-height:1.7;color:#c8cdd6;white-space:pre-wrap;}
  .popup-body img{width:100%;border-radius:10px;margin-top:10px;}

  .jf-label{font-size:9px;font-weight:700;color:var(--text-dim);text-transform:uppercase;margin:10px 0 4px;}
  .jf-label:first-child{margin-top:0;}
  .jf-input{width:100%;background:var(--card);border:0.5px solid var(--border);color:var(--text);border-radius:9px;padding:10px;font-size:12px;font-family:inherit;}
  .jf-player-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
  .jf-note{font-size:9px;color:var(--text-dim);margin-top:8px;line-height:1.5;}
  .jf-submit{background:var(--orange);border:none;border-bottom:3px solid var(--orange-dark);border-radius:10px;padding:11px;text-align:center;color:#241705;font-size:13px;font-weight:500;width:100%;cursor:pointer;font-family:inherit;margin-top:12px;}
  .jf-submit:disabled{background:#2a3145;border-bottom-color:#1c2233;color:var(--text-dim);cursor:not-allowed;}
  .jf-error{font-size:10px;color:#ff6f7c;margin-top:6px;min-height:12px;}
  .jf-pay-opt{display:flex;align-items:center;gap:8px;background:var(--card);border:0.5px solid var(--border);border-radius:9px;padding:10px;font-size:11px;margin-top:6px;}
  .jf-pay-opt input{width:auto;}
  .jf-pay-opt.disabled{opacity:.5;}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <a href="javascript:history.back()" class="back">‹</a>
    <div>
      <h1 id="hTitle">Loading...</h1>
      <div class="org" id="hOrg">CHT ESP ORG</div>
    </div>
  </div>

  <div id="content"><div class="loading">Loading tournament...</div></div>

</div>

<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box">
    <div class="popup-head"><b id="popupTitle">Details</b><button type="button" onclick="closePopup()">×</button></div>
    <div class="popup-body" id="popupBody"></div>
  </div>
</div>

<div class="popup-overlay" id="joinOverlay">
  <div class="popup-box">
    <div class="popup-head"><b id="joinStepTitle">Payment</b><button type="button" onclick="closeJoinForm()">×</button></div>
    <div class="popup-body">

      <div id="jfStepPayment">
        <div class="jf-note" id="jfFeeNote" style="font-size:13px;color:var(--text);font-weight:700;margin-bottom:10px;"></div>
        <div class="jf-label">Payment method *</div>
        <div id="jfPaymentOptions"></div>
        <div id="jfPaymentExtra"></div>
        <div class="jf-error" id="jfPayError"></div>
        <button type="button" class="jf-submit" id="jfPayNextBtn" onclick="proceedFromPayment()">Continue</button>
      </div>

      <div id="jfStepDetails" style="display:none">
        <div class="jf-label">Team name *</div>
        <input class="jf-input" id="jfTeamName" placeholder="Team Alpha">

        <div class="jf-label">Player name *</div>
        <input class="jf-input" id="jfPlayerName" placeholder="In-game name">

        <div class="jf-label">WhatsApp number *</div>
        <input class="jf-input" id="jfWhatsapp" placeholder="01XXXXXXXXX">

        <div class="jf-note">Your slot stays pending until the admin verifies payment and confirms it (instant if paid from balance).</div>
        <div class="jf-error" id="jfError"></div>
        <button type="button" class="jf-submit" id="jfSubmitBtn" onclick="submitJoin()">Submit</button>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let currentTournament=null, currentJoinLobbyId=null;
let sessionUser=null, userProfile=null, walletBalance=null;

async function initUser(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session)return;
    sessionUser=session.user;
    const {data:p}=await sb.from('profiles').select('whatsapp,user_number').eq('id',sessionUser.id).single();
    userProfile=p||null;
    try{
      const res=await fetch('https://chteo-api.onrender.com/api/get-balance.php?uid='+encodeURIComponent(sessionUser.id));
      const j=await res.json();
      walletBalance=(j&&j.success)?Number(j.balance)||0:null;
    }catch(e){walletBalance=null;}
  }catch(e){/* not logged in — guest flow still works */}
}

(async function(){
  const root=document.getElementById('content');
  const id=new URLSearchParams(location.search).get('id');
  const preview=new URLSearchParams(location.search).get('preview')==='1';
  if(!id){root.innerHTML='<div class="empty">Tournament not found.</div>';return}
  await initUser();

  const {data:t,error}=await sb.from('tournaments').select('*, tournament_sections(name)').eq('id',id).single();
  if(error||!t){root.innerHTML='<div class="empty">Tournament not found.</div>';return}
  if(t.status!=='published' && !preview){
    root.innerHTML='<div class="empty">This tournament is not available right now.</div>';return
  }
  currentTournament=t;

  document.getElementById('hTitle').textContent=t.title||'Tournament';
  document.getElementById('hOrg').textContent=t.tournament_sections?.name||'CHT ESP ORG';

  const prizeDist=Array.isArray(t.prize_distribution)?[...t.prize_distribution].sort((a,b)=>a.rank-b.rank):[];
  const maps=Array.isArray(t.maps)?t.maps:[];
  const rulesImages=Array.isArray(t.rules_images)?t.rules_images:[];
  const pointImages=Array.isArray(t.point_system_images)?t.point_system_images:[];

  window.rulesHtml=esc(t.rules_text||'No rules added yet.')+rulesImages.map(u=>`<img src="${esc(u)}">`).join('');
  window.pointHtml=esc(t.point_system_text||'No point system added yet.')+pointImages.map(u=>`<img src="${esc(u)}">`).join('');

  const ordinal=n=>({1:'1st',2:'2nd',3:'3rd'}[n]||`${n}th`);
  const matchTypeLabel=t.match_type==='clash_squad'?'Clash squad':'Full map';
  const formatLabel=t.format?t.format.charAt(0).toUpperCase()+t.format.slice(1):'—';

  root.innerHTML=`
    <div class="stat-row">
      <div class="stat-box"><div class="label">Entry fee</div><div class="value">৳${Number(t.entry_fee||0)}</div></div>
      <div class="stat-box"><div class="label">Slot</div><div class="value">${Number(t.default_slots||t.total_slots||0)}</div></div>
    </div>

    <div class="combo-row">
      <div class="prize-card">
        <div class="title">Prize distribution</div>
        <div class="prize-list">
          ${prizeDist.length?prizeDist.map(p=>`<div class="row"><span class="rank">${ordinal(p.rank)}</span><span class="amount">৳${Number(p.amount||0)}</span></div>`).join(''):'<div class="row"><span class="rank">—</span></div>'}
        </div>
      </div>
      <div class="info-col">
        <div class="info-box"><span class="label">Format</span><span class="value">${esc(formatLabel)}</span></div>
        <div class="info-box"><span class="label">ESports mode</span><span class="value">${esc(matchTypeLabel)}</span></div>
        <div class="info-box"><span class="label">Vehicle</span><span class="emoji">${t.vehicle_allowed?'✅':'❌'}</span></div>
        <div class="info-box"><span class="label">Gun skin</span><span class="emoji">${t.gun_skin_allowed?'✅':'❌'}</span></div>
      </div>
    </div>

    <div class="link-row">
      <button class="link-box" type="button" onclick="openPopup('Tournament rules', rulesHtml)">Tournament rules<span class="chev">›</span></button>
      <button class="link-box" type="button" onclick="openPopup('Point system', pointHtml)">Point system<span class="chev">›</span></button>
    </div>

    ${maps.length?`<div class="section-title">Maps</div>
    <div class="maps-row">
      ${maps.map(m=>`<div class="map-box"><div class="img" style="background-image:url('${esc(m.image_url||'')}')">${m.image_url?'':'No image'}</div><div class="name">${esc(m.name||'—')}</div></div>`).join('')}
    </div>`:''}

    <div class="section-title">Hourly lobbies</div>
    <div class="lobby-sub">Play the tournament at whichever time suits you.</div>
    <div class="lobby-list" id="lobbyList"><div class="empty">Loading lobbies...</div></div>
  `;

  // load lobbies
  const {data:lobbies,error:lerr}=await sb.from('tournament_lobbies')
    .select('*')
    .eq('tournament_id',id)
    .in('status',['upcoming','live','full'])
    .order('lobby_date',{ascending:true})
    .order('time_label',{ascending:true});

  const lobbyBox=document.getElementById('lobbyList');
  if(lerr){lobbyBox.innerHTML='<div class="empty">Could not load lobbies.</div>';return}
  if(!lobbies||!lobbies.length){lobbyBox.innerHTML='<div class="empty">No lobbies open right now.</div>';return}

  lobbyBox.innerHTML=lobbies.map(l=>{
    const slots=l.total_slots||0,joined=l.joined_count||0;
    const full=l.status==='full'||joined>=slots;
    const pct=slots?Math.min(100,Math.round(joined/slots*100)):0;
    return `<div class="lobby-card">
      <div class="lobby-top">
        <div class="lobby-avatar ${full?'full':''}">${esc((l.time_label||'?')[0])}</div>
        <div><div class="lobby-time">${esc(l.time_label||'')}</div><div class="lobby-date">${esc(l.lobby_date||'')}</div></div>
      </div>
      <div class="lobby-meta"><span>Joined: ${joined}</span><span>Slots: ${slots}</span></div>
      <div class="lobby-bar"><div class="lobby-bar-fill ${full?'full':''}" style="width:${pct}%"></div></div>
      <button class="join-btn ${full?'full':''}" type="button" ${full?'disabled':`onclick="openJoinForm('${l.id}')"`}>${full?'FULL':'JOIN NOW'}</button>
    </div>`;
  }).join('');
})();

function openPopup(title,html){
  document.getElementById('popupTitle').textContent=title;
  document.getElementById('popupBody').innerHTML=html;
  document.getElementById('popupOverlay').classList.add('open');
}
function closePopup(){
  document.getElementById('popupOverlay').classList.remove('open');
}
document.getElementById('popupOverlay').addEventListener('click',function(e){
  if(e.target===this)closePopup();
});

let pendingPaymentMethod=null, pendingPaymentRef=null, pendingConfirmationStatus='pending';

function openJoinForm(lobbyId){
  currentJoinLobbyId=lobbyId;
  pendingPaymentMethod=null; pendingPaymentRef=null; pendingConfirmationStatus='pending';
  document.getElementById('jfTeamName').value='';
  document.getElementById('jfPlayerName').value='';
  document.getElementById('jfWhatsapp').value=userProfile?.whatsapp||'';
  document.getElementById('jfError').textContent='';
  document.getElementById('jfPayError').textContent='';
  document.getElementById('joinStepTitle').textContent='Payment';
  document.getElementById('jfStepPayment').style.display='';
  document.getElementById('jfStepDetails').style.display='none';
  const fee=Number(currentTournament?.entry_fee)||0;
  document.getElementById('jfFeeNote').textContent='Entry fee: ৳'+fee;
  renderPaymentOptions();
  const payBtn=document.getElementById('jfPayNextBtn');
  payBtn.disabled=false; payBtn.textContent='Continue';
  const subBtn=document.getElementById('jfSubmitBtn');
  subBtn.disabled=false; subBtn.textContent='Submit';
  document.getElementById('joinOverlay').classList.add('open');
}
function closeJoinForm(){
  document.getElementById('joinOverlay').classList.remove('open');
}
document.getElementById('joinOverlay').addEventListener('click',function(e){
  if(e.target===this)closeJoinForm();
});

function renderPaymentOptions(){
  const fee=Number(currentTournament?.entry_fee)||0;
  const canPayBalance=sessionUser && walletBalance!=null;
  let html='';
  if(canPayBalance){
    const enough=walletBalance>=fee;
    html+=`<label class="jf-pay-opt ${enough?'':'disabled'}"><input type="radio" name="jfPay" value="balance" ${enough?'checked':'disabled'}> Pay ৳${fee} from wallet balance (Balance: ৳${walletBalance})</label>`;
    html+=`<label class="jf-pay-opt"><input type="radio" name="jfPay" value="manual" ${enough?'':'checked'}> Pay via bKash/Nagad manually</label>`;
  }else{
    html+=`<label class="jf-pay-opt"><input type="radio" name="jfPay" value="manual" checked> Pay via bKash/Nagad manually</label>`;
    html+=sessionUser?`<div class="jf-note">Could not load your wallet balance right now.</div>`:`<div class="jf-note">Log in to pay instantly from your wallet balance.</div>`;
  }
  document.getElementById('jfPaymentOptions').innerHTML=html;
  document.querySelectorAll('input[name="jfPay"]').forEach(el=>el.addEventListener('change',renderPaymentExtra));
  renderPaymentExtra();
}
function renderPaymentExtra(){
  const sel=document.querySelector('input[name="jfPay"]:checked')?.value;
  const box=document.getElementById('jfPaymentExtra');
  if(sel==='manual'){
    box.innerHTML=`<div class="jf-label">Payment / transaction reference *</div><input class="jf-input" id="jfPaymentRef" placeholder="bKash TrxID">`;
  }else{
    box.innerHTML='';
  }
}

async function proceedFromPayment(){
  const errBox=document.getElementById('jfPayError'); errBox.textContent='';
  const payMethod=document.querySelector('input[name="jfPay"]:checked')?.value||'manual';
  const btn=document.getElementById('jfPayNextBtn');

  if(payMethod==='manual'){
    const ref=document.getElementById('jfPaymentRef')?.value.trim()||'';
    if(!ref){errBox.textContent='Payment/transaction reference is required.';return}
    pendingPaymentMethod='manual'; pendingPaymentRef=ref; pendingConfirmationStatus='pending';
    showDetailsStep();
    return;
  }

  // balance — charge now, before moving to team details
  btn.disabled=true; btn.textContent='Processing payment...';
  try{
    const {data:{session}}=await sb.auth.getSession();
    const fee=Number(currentTournament?.entry_fee)||0;
    const res=await fetch('https://chteo-api.onrender.com/api/deduct-balance.php',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
      body:JSON.stringify({amount:fee,reference:'Tournament entry: '+(currentTournament?.title||''),description:'Tournament entry fee'})
    });
    const j=await res.json();
    if(!j.success){
      errBox.textContent='Payment failed: '+(j.message||'could not deduct balance.');
      btn.disabled=false; btn.textContent='Continue';
      return;
    }
    walletBalance=j.balance;
    pendingPaymentMethod='balance'; pendingPaymentRef='Wallet balance ✓'; pendingConfirmationStatus='confirmed';
    btn.disabled=false; btn.textContent='Continue';
    showDetailsStep();
  }catch(e){
    errBox.textContent='Payment failed: could not reach wallet service.';
    btn.disabled=false; btn.textContent='Continue';
  }
}

function showDetailsStep(){
  document.getElementById('joinStepTitle').textContent='Team details';
  document.getElementById('jfStepPayment').style.display='none';
  document.getElementById('jfStepDetails').style.display='';
}

async function submitJoin(){
  const errBox=document.getElementById('jfError'); errBox.textContent='';
  const teamName=document.getElementById('jfTeamName').value.trim();
  const playerName=document.getElementById('jfPlayerName').value.trim();
  const whatsapp=document.getElementById('jfWhatsapp').value.trim();
  if(!teamName){errBox.textContent='Team name is required.';return}
  if(!playerName){errBox.textContent='Player name is required.';return}
  if(!whatsapp){errBox.textContent='WhatsApp number is required.';return}

  const btn=document.getElementById('jfSubmitBtn');
  btn.disabled=true; btn.textContent='Submitting...';

  const {error}=await sb.from('lobby_teams').insert({
    lobby_id:currentJoinLobbyId,
    team_name:teamName,
    players:[{name:playerName}],
    contact_number:whatsapp,
    payment_reference:pendingPaymentRef,
    payment_method:pendingPaymentMethod,
    submitted_by:sessionUser?.id||null,
    confirmation_status:pendingConfirmationStatus
  });

  if(error){
    if(pendingPaymentMethod==='balance'){
      errBox.textContent='Payment succeeded but saving your team failed: '+error.message+'. Please contact support with this — your ৳ was already deducted.';
    }else{
      errBox.textContent='Could not submit: '+error.message;
    }
    btn.disabled=false; btn.textContent='Submit';
    return;
  }
  closeJoinForm();
  alert(confirmationStatus==='confirmed'?'Paid and joined! Your slot is confirmed.':'Request sent! The admin will confirm your slot after verifying payment.');
  location.reload();
}
</script>
</body>
</html>
