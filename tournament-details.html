<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tournament Details — CHT ESP ORG</title>
<style>
  :root{
    --bg:#0b0e1a;
    --card:#141a2b;
    --card-2:#161d30;
    --border:rgba(255,255,255,0.08);
    --text:#ffffff;
    --text-dim:#7d8494;
    --text-mid:#9aa0ae;
    --gold:#f2b705;
    --orange:#f5a623;
    --orange-dark:#c9820f;
    --teal:#2dd4bf;
    --fire-1:#ff5f2e;
    --fire-2:#ffb703;
    --fire-grad:linear-gradient(135deg,var(--fire-1),var(--fire-2));
    --live:#ff3b5c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    color:var(--text);
  }
  .page{max-width:420px;margin:0 auto;padding:14px 14px 30px;}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back{font-size:20px;color:var(--text-mid);text-decoration:none;line-height:1;}
  .header h1{font-size:15px;font-weight:500;}
  .header .org{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .banner{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#1f2740;}

  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
  .stat-box{background:var(--card);border:0.5px solid var(--border);border-radius:8px;padding:6px 4px;text-align:center;}
  .stat-box .label{font-size:9px;text-transform:uppercase;color:var(--text-dim);}
  .stat-box .value{font-size:12px;font-weight:500;margin-top:2px;}

  .combo-row{display:flex;gap:6px;min-height:112px;margin-bottom:10px;}
  .prize-card{flex:1;background:var(--card);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;}
  .prize-card .title{font-size:9px;font-weight:500;color:#c8cdd6;margin-bottom:2px;}
  .prize-list{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:2px;}
  .prize-list .row{display:flex;align-items:center;justify-content:space-between;}
  .prize-list .rank{font-size:10px;color:var(--text-mid);}
  .prize-list .amount{font-size:11px;font-weight:500;color:var(--gold);}

  .info-col{flex:1;display:flex;flex-direction:column;gap:4px;}
  .info-box{flex:1;background:var(--card);border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;min-height:24px;}
  .info-box .label{font-size:9px;color:var(--text-dim);}
  .info-box .value{font-size:10px;font-weight:500;}
  .info-box .emoji{font-size:11px;}

  .link-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
  .link-box{background:var(--card);border:none;border-radius:8px;padding:7px 8px;display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:10px;font-weight:500;text-align:left;cursor:pointer;font-family:inherit;}
  .link-box .chev{color:#5f6472;font-size:12px;}

  .section-title{font-size:11px;font-weight:500;color:#c8cdd6;margin-bottom:6px;}
  .maps-row{display:grid;grid-template-columns:repeat(auto-fill, 74px);gap:6px;justify-content:flex-start;margin-bottom:14px;}
  .map-box{background:var(--card);border-radius:7px;overflow:hidden;}
  .map-box .img{aspect-ratio:1/1;width:100%;background:#1f2740;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#5f6472;font-size:7px;text-align:center;}
  .map-box .name{padding:4px;text-align:center;font-size:8.5px;font-weight:500;}

  .lobby-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .lobby-card{background:var(--card-2);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:12px;}
  .lobby-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .lobby-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .lobby-avatar{width:38px;height:38px;border-radius:50%;background:#3a4152;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0;}
  .lobby-avatar.full{border-color:#555c6c;}
  .lobby-time{font-size:15px;font-weight:500;}
  .lobby-date{font-size:9px;color:var(--text-dim);flex-shrink:0;white-space:nowrap;}
  .lobby-meta{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11px;color:var(--text-mid);}
  .lobby-bar{height:5px;background:#2a3145;border-radius:4px;overflow:hidden;margin-bottom:10px;}
  .lobby-bar-fill{height:100%;background:var(--orange);}
  .lobby-bar-fill.full{background:#5f6472;}
  .join-btn{background:var(--orange);border:none;border-bottom:3px solid var(--orange-dark);border-radius:10px;padding:10px;text-align:center;color:#241705;font-size:13px;font-weight:500;width:100%;cursor:pointer;font-family:inherit;}
  .join-btn.full{background:#2a3145;border-bottom-color:#1c2233;color:var(--text-dim);cursor:not-allowed;}
  .join-btn.selected{background:var(--teal);border-bottom-color:#1f9d8f;color:#04211d;}

  .lobby-card.selected{border-color:var(--fire-2);background:rgba(255,183,3,.05);}

  .select-bar{position:fixed;left:0;right:0;bottom:0;z-index:900;display:none;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(11,14,26,0.97);backdrop-filter:blur(6px);border-top:1px solid var(--border);}
  .select-bar.open{display:flex;}
  .select-bar-inner{width:100%;max-width:420px;display:flex;align-items:center;gap:8px;}
  .select-bar-info{flex:1;min-width:0;}
  .select-bar-info b{display:block;font-size:12.5px;color:var(--text);font-weight:700;}
  .select-bar-info span{display:block;font-size:10px;color:var(--text-dim);margin-top:1px;}
  .select-bar-clear{background:none;border:none;color:var(--text-dim);font-size:10px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:6px 4px;flex-shrink:0;}
  .select-bar-btn{background:var(--fire-grad);border:none;border-radius:11px;padding:11px 16px;color:#241705;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}

  .jf-lobby-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .jf-lobby-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:10.5px;color:var(--text-mid);}
  .jf-lobby-chip b{color:var(--text);font-weight:700;}

  .empty{text-align:center;color:var(--text-dim);font-size:11px;padding:20px 8px;}
  .loading{text-align:center;color:var(--text-dim);font-size:12px;padding:40px 10px;}

  .lobby-sub{font-size:10px;color:var(--text-dim);margin:-3px 0 8px;}

  .popup-overlay{display:none;position:fixed;inset:0;background:rgba(4,4,10,0.72);backdrop-filter:blur(2px);z-index:999;align-items:flex-end;justify-content:center;}
  .popup-overlay.open{display:flex;}
  .popup-box{width:100%;max-width:420px;max-height:82vh;max-height:82dvh;overflow-y:auto;background:var(--card-2);border:1px solid rgba(255,255,255,0.1);border-bottom:none;border-radius:20px 20px 0 0;padding:0;box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:sheetUp .22s ease;}
  @keyframes sheetUp{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  @media (prefers-reduced-motion:reduce){.popup-box{animation:none;}}
  .popup-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;margin-bottom:0;border-bottom:1px solid var(--border);}
  .popup-head::before{content:'';position:absolute;top:0;left:16px;right:16px;height:2px;background:var(--fire-grad);border-radius:2px;}
  .popup-head b{font-size:15px;font-weight:700;}
  .popup-head button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:18px;flex-shrink:0;}
  .popup-body{font-size:12px;line-height:1.75;color:#c8cdd6;white-space:pre-wrap;padding:16px;}
  .popup-body img{width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--border);}
  .success-body{text-align:center;padding:22px 16px 18px;white-space:normal;}
  .success-icon{font-size:42px;line-height:1;margin-bottom:12px;}
  .success-title{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .success-text{font-size:11.5px;color:#c8cdd6;line-height:1.6;}
  .success-goto-btn{display:block;width:100%;margin-top:18px;background:var(--fire-grad);border:none;border-radius:11px;padding:12px;text-align:center;color:#241705;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.02em;}
  .jf-body{font-size:12px;line-height:1.5;color:#c8cdd6;padding:16px;}

  .jf-label{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--text-dim);text-transform:uppercase;margin:12px 0 5px;}
  .jf-label:first-child{margin-top:0;}
  .jf-input{width:100%;background:var(--card);border:1px solid rgba(255,255,255,0.1);color:var(--text);border-radius:10px;padding:11px;font-size:12.5px;font-family:inherit;display:block;}
  .jf-input:focus{outline:none;border-color:var(--fire-2);}
  .jf-player-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
  .jf-note{font-size:9.5px;color:var(--text-dim);margin-top:8px;line-height:1.6;}
  .jf-submit{background:var(--fire-grad);border:none;border-radius:11px;padding:12px;text-align:center;color:#241705;font-size:13.5px;font-weight:700;width:100%;cursor:pointer;font-family:inherit;margin-top:14px;letter-spacing:.02em;}
  .jf-submit:disabled{background:#2a3145;color:var(--text-dim);cursor:not-allowed;}
  .jf-error{font-size:10px;color:#ff6f7c;margin-top:6px;min-height:12px;font-weight:600;}
  .jf-pay-opt{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid rgba(255,255,255,0.1);border-radius:11px;padding:11px;font-size:11.5px;margin-top:7px;cursor:pointer;}
  .jf-pay-opt:has(input:checked){border-color:var(--fire-2);background:rgba(255,183,3,.06);}
  .jf-pay-opt input{width:16px;height:16px;accent-color:var(--fire-2);flex-shrink:0;}
  .jf-pay-opt.disabled{opacity:.5;}
  .jf-pay-opt .pay-icon{font-size:15px;flex-shrink:0;}
  .jf-pay-opt .pay-text{display:flex;flex-direction:column;}
  .jf-pay-opt .pay-text b{font-size:11.5px;font-weight:700;}
  .jf-pay-opt .pay-text span{font-size:9.5px;color:var(--text-dim);margin-top:1px;}

  .jf-same-toggle{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11.5px;color:var(--text-mid);cursor:pointer;}
  .jf-same-toggle input{width:16px;height:16px;accent-color:var(--fire-2);flex-shrink:0;}
  .jf-team-block{background:var(--card);border:1px solid rgba(255,255,255,0.08);border-radius:11px;padding:10px 10px 2px;margin-bottom:10px;}
  .jf-team-block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .jf-team-block-head b{font-size:11.5px;font-weight:700;color:var(--text);}
  .jf-copy-wrap{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;flex-shrink:0;}
  .jf-copy-btn{background:var(--card-2);border:1px solid rgba(255,255,255,0.14);color:var(--text-mid);border-radius:7px;padding:4px 8px;font-size:9.5px;font-family:inherit;white-space:nowrap;cursor:pointer;}
  .jf-copy-btn:active{border-color:var(--fire-2);color:var(--text);}

  .jf-qty-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:9px 10px;margin-bottom:8px;gap:8px;}
  .jf-qty-label{font-size:11px;color:#c8cdd6;min-width:0;}
  .jf-qty-label b{color:var(--text);font-weight:700;}
  .jf-qty-sub{display:block;font-size:9px;color:var(--text-dim);margin-top:1px;}
  .jf-qty-stepper{display:flex;align-items:center;gap:0;flex-shrink:0;background:var(--card-2);border:1px solid rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;}
  .jf-qty-btn{background:none;border:none;color:var(--text);width:28px;height:28px;font-size:15px;font-family:inherit;cursor:pointer;}
  .jf-qty-btn:disabled{color:var(--text-dim);cursor:not-allowed;}
  .jf-qty-val{display:inline-block;min-width:22px;text-align:center;font-size:12.5px;font-weight:700;}
</style>
</head>

<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function getProfile(){
  try { return JSON.parse(localStorage.getItem('user_profile') || '{}'); }
  catch(e){ return {}; }
}
let currentTournament=null, currentJoinLobbyIds=[];

// A lobby's "BUY SLOT" stays open right up to 10 minutes after its own
// scheduled time (e.g. a 3:20 lobby closes at 3:30) — after that the match
// has effectively started, so joining is pointless even if slots aren't
// technically full. Matches the same "H:MM AM/PM" label format used by the
// admin panel's own auto-status logic.
function parseLobbyDateTime(lobbyDate,timeLabel){
  const m=/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((timeLabel||'').trim());
  if(!m)return null;
  let h=(+m[1])%12; if(/pm/i.test(m[3]))h+=12;
  const d=new Date(lobbyDate+'T00:00:00'); d.setHours(h,+m[2],0,0);
  return d;
}
function isJoinWindowClosed(l){
  const dt=parseLobbyDateTime(l.lobby_date,l.time_label);
  if(!dt)return false;
  return new Date()>=new Date(dt.getTime()+10*60000);
}
function lobbyDisplayJoined(l){
  const total=Math.max(0,Number(l.total_slots)||0);
  const actual=Math.max(0,Number(l.joined_count)||0);
  const booked=Math.max(0,Number(l.booked_slots)||0);
  return Math.min(total,actual+booked);
}
function lobbyDisplayLeft(l){
  const total=Math.max(0,Number(l.total_slots)||0);
  return Math.max(0,total-lobbyDisplayJoined(l));
}
function lobbyIsFull(l){
  const slots=l.total_slots||0,joined=lobbyDisplayJoined(l);
  return l.status==='full'||joined>=slots||isJoinWindowClosed(l);
}
let sessionUser=null, userProfile=null, walletBalance=null;
let selectedLobbies=new Set(), lobbyDataById={};
let lobbyTeamCounts={};
let copiedTeamData=null;

async function initUser(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session)return;
    sessionUser=session.user;
    const {data:p}=await sb.from('profiles').select('whatsapp,user_number').eq('id',sessionUser.id).single();
    userProfile=p||null;
    try{
      const res=await fetch('https://chteo-api.onrender.com/api/get-balance.php?uid='+encodeURIComponent(sessionUser.id));
      const j=await res.json();
      walletBalance=(j&&j.success)?Number(j.balance)||0:null;
    }catch(e){walletBalance=null;}
  }catch(e){/* not logged in — guest flow still works */}
}

(async function(){
  const root=document.getElementById('content');
  const id=new URLSearchParams(location.search).get('id');
  const preview=new URLSearchParams(location.search).get('preview')==='1';
  if(!id){root.innerHTML='<div class="empty">Tournament not found.</div>';return}
  await initUser();

  const {data:t,error}=await sb.from('tournaments').select('*, tournament_sections(name)').eq('id',id).single();
  if(error||!t){root.innerHTML='<div class="empty">Tournament not found.</div>';return}
  if(t.status!=='published' && !preview){
    root.innerHTML='<div class="empty">This tournament is not available right now.</div>';return
  }
  currentTournament=t;

  document.getElementById('hTitle').textContent=t.title||'Tournament';

  const prizeDist=Array.isArray(t.prize_distribution)?[...t.prize_distribution].sort((a,b)=>a.rank-b.rank):[];
  const maps=Array.isArray(t.maps)?t.maps:[];
  const rulesImages=Array.isArray(t.rules_images)?t.rules_images:[];
  const pointImages=Array.isArray(t.point_system_images)?t.point_system_images:[];

  window.rulesHtml=esc(t.rules_text||'No rules added yet.')+rulesImages.map(u=>`<img src="${esc(u)}">`).join('');
  window.pointHtml=esc(t.point_system_text||'No point system added yet.')+pointImages.map(u=>`<img src="${esc(u)}">`).join('');

  const ordinal=n=>({1:'1st',2:'2nd',3:'3rd'}[n]||`${n}th`);
  const matchTypeLabel=t.match_type==='clash_squad'?'Clash squad':'Full map';
  const formatLabel=t.format?t.format.charAt(0).toUpperCase()+t.format.slice(1):'—';

  root.innerHTML=`
    <div class="stat-row">
      <div class="stat-box"><div class="label">Entry fee</div><div class="value">৳${Number(t.entry_fee||0)}</div></div>
      <div class="stat-box"><div class="label">Slot</div><div class="value">${Number(t.default_slots||t.total_slots||0)}</div></div>
    </div>

    <div class="combo-row">
      <div class="prize-card">
        <div class="title">Prize distribution</div>
        <div class="prize-list">
          ${prizeDist.length?prizeDist.map(p=>`<div class="row"><span class="rank">${ordinal(p.rank)}</span><span class="amount">৳${Number(p.amount||0)}</span></div>`).join(''):'<div class="row"><span class="rank">—</span></div>'}
        </div>
      </div>
      <div class="info-col">
        <div class="info-box"><span class="label">Format</span><span class="value">${esc(formatLabel)}</span></div>
        <div class="info-box"><span class="label">Mode</span><span class="value">${t.game_mode==='classic'?'Classic':'ESports'}</span></div>
        <div class="info-box"><span class="label">Types</span><span class="value">${esc(matchTypeLabel)}</span></div>
        <div class="info-box"><span class="label">Gun skin</span><span class="emoji">${t.gun_skin_allowed?'✅':'❌'}</span></div>
        <div class="info-box"><span class="label">Vehicle</span><span class="emoji">${t.vehicle_allowed?'✅':'❌'}</span></div>
        <div class="info-box"><span class="label">Emote</span><span class="emoji">${t.emote_allowed?'✅':'❌'}</span></div>
      </div>
    </div>

    <div class="link-row">
      <button class="link-box" type="button" onclick="openPopup('📋 Tournament rules', rulesHtml)">Tournament rules<span class="chev">›</span></button>
      <button class="link-box" type="button" onclick="openPopup('🏆 Point system', pointHtml)">Point system<span class="chev">›</span></button>
    </div>

    ${maps.length?`<div class="section-title">Maps</div>
    <div class="maps-row">
      ${maps.map(m=>`<div class="map-box"><div class="img" style="background-image:url('${esc(m.image_url||'')}')">${m.image_url?'':'No image'}</div><div class="name">${esc(m.name||'—')}</div></div>`).join('')}
    </div>`:''}

    <div class="section-title">Hourly lobbies</div>
    <div class="lobby-sub">Play the tournament at whichever time suits you.</div>
    <div class="lobby-list" id="lobbyList"><div class="empty">Loading lobbies...</div></div>
  `;

  // load lobbies
  const {data:lobbies,error:lerr}=await sb.from('tournament_lobbies')
    .select('*')
    .eq('tournament_id',id)
    .in('status',['upcoming','live','full'])
    .order('lobby_date',{ascending:true});

  const lobbyBox=document.getElementById('lobbyList');
  if(lerr){lobbyBox.innerHTML='<div class="empty">Could not load lobbies.</div>';return}
  if(!lobbies||!lobbies.length){lobbyBox.innerHTML='<div class="empty">No lobbies open right now.</div>';return}

  lobbies.forEach(l=>{lobbyDataById[l.id]=l;});

  // Sort chronologically by actual clock time — "time_label" is text
  // ("10:00 PM" vs "9:00 PM"), so an alphabetical sort would wrongly put
  // 10 PM before 8/9 PM. Being FULL does NOT by itself move a lobby down —
  // a 10 PM lobby that's already full still shows at its normal 10 PM spot
  // (so players know that slot is taken) as long as its time hasn't arrived
  // yet. Only once a lobby's own time has actually passed (its 10-minute
  // join window has closed) does it drop below the still-upcoming ones.
  lobbies.sort((a,b)=>{
    if(a.lobby_date!==b.lobby_date)return a.lobby_date<b.lobby_date?-1:1;
    const pa=isJoinWindowClosed(a),pb=isJoinWindowClosed(b);
    if(pa!==pb)return pa?1:-1;
    const da=parseLobbyDateTime(a.lobby_date,a.time_label),db=parseLobbyDateTime(b.lobby_date,b.time_label);
    if(da&&db)return da-db;
    return (a.time_label||'').localeCompare(b.time_label||'');
  });

  lobbyBox.innerHTML=lobbies.map(l=>{
    const slots=l.total_slots||0;
    const full=lobbyIsFull(l);
    // A lobby whose join window has ended is shown as FULL in every
    // occupancy indicator, matching the existing FULL button behavior.
    const joined=full?slots:lobbyDisplayJoined(l);
    const pct=full?100:(slots?Math.min(100,Math.round(joined/slots*100)):0);
    const left=full?0:lobbyDisplayLeft(l);
    // "8 PM" typed by admin -> "8 PM SLOT (35 BDT)" shown automatically,
    // using the tournament's own entry fee — no need to type the fee
    // into every lobby's time label.
    const timeLabelFull=`${l.time_label||''} SLOT (${Number(t.entry_fee||0)} BDT)`.trim();
    // lobby_date is stored as YYYY-MM-DD -> shown as DD-MM-YYYY
    const dateParts=(l.lobby_date||'').split('-');
    const dateLabel=dateParts.length===3?`${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`:(l.lobby_date||'');
    return `<div class="lobby-card" id="lcard-${l.id}">
      <div class="lobby-top">
        <div class="lobby-left">
          <div class="lobby-avatar ${full?'full':''}">${esc((l.time_label||'?')[0])}</div>
          <div class="lobby-time">${esc(timeLabelFull)}</div>
        </div>
        <div class="lobby-date">${esc(dateLabel)}</div>
      </div>
      <div class="lobby-meta"><span>Joined: ${joined}</span><span>last ${left} slot left</span><span>Slots: ${slots}</span></div>
      <div class="lobby-bar"><div class="lobby-bar-fill ${full?'full':''}" style="width:${pct}%"></div></div>
      <button class="join-btn ${full?'full':''}" id="jbtn-${l.id}" type="button" ${full?'disabled':`onclick="toggleLobbySelect('${l.id}')"`}>${full?'FULL':'BUY SLOT'}</button>
    </div>`;
  }).join('');
})();

function toggleLobbySelect(id){
  if(selectedLobbies.has(id))selectedLobbies.delete(id);
  else selectedLobbies.add(id);
  updateLobbyCardsUI();
  updateSelectBar();
}
function updateLobbyCardsUI(){
  Object.keys(lobbyDataById).forEach(id=>{
    const card=document.getElementById('lcard-'+id);
    const btn=document.getElementById('jbtn-'+id);
    if(!card||!btn||btn.disabled)return;
    const on=selectedLobbies.has(id);
    card.classList.toggle('selected',on);
    btn.classList.toggle('selected',on);
    btn.textContent=on?'✓ SELECTED':'BUY SLOT';
  });
}
function updateSelectBar(){
  const bar=document.getElementById('selectBar');
  const n=selectedLobbies.size;
  if(!n){bar.classList.remove('open');document.body.style.paddingBottom='';return}
  bar.classList.add('open');
  document.body.style.paddingBottom='74px';
  const fee=(Number(currentTournament?.entry_fee)||0)*n;
  document.getElementById('selectBarCount').textContent=`${n}টি লবি সিলেক্ট করা হয়েছে`;
  document.getElementById('selectBarFee').textContent=`মোট এন্ট্রি ফি: ৳${fee}`;
}
function clearSelection(){
  selectedLobbies.clear();
  updateLobbyCardsUI();
  updateSelectBar();
}

let popupOnClose=null;
function openPopup(title,html,onClose){
  document.getElementById('popupTitle').textContent=title;
  document.getElementById('popupBody').innerHTML=html;
  document.getElementById('popupOverlay').classList.add('open');
  popupOnClose=onClose||null;
}
function closePopup(){
  document.getElementById('popupOverlay').classList.remove('open');
  if(popupOnClose){const fn=popupOnClose;popupOnClose=null;fn();}
}
document.getElementById('popupOverlay').addEventListener('click',function(e){
  if(e.target===this)closePopup();
});

function getTeamCount(id){return lobbyTeamCounts[id]||1}
function getMaxTeamCount(id){
  const l=lobbyDataById[id]||{};
  const avail=(Number(l.total_slots)||0)-(Number(l.joined_count)||0);
  return avail>0?Math.min(10,avail):10;
}
function totalEntryCount(){
  return currentJoinLobbyIds.reduce((s,id)=>s+getTeamCount(id),0);
}
function changeTeamCount(id,delta){
  const max=getMaxTeamCount(id);
  let c=getTeamCount(id)+delta;
  c=Math.max(1,Math.min(max,c));
  lobbyTeamCounts[id]=c;
  renderQuantityControls();
  renderTeamBlocks();
  renderPaymentOptions();
}
function renderQuantityControls(){
  const wrap=document.getElementById('jfQuantityWrap');
  wrap.innerHTML=currentJoinLobbyIds.map(id=>{
    const l=lobbyDataById[id]||{};
    const label=`${esc(l.time_label||'')} ${esc(l.lobby_date||'')}`.trim();
    const c=getTeamCount(id);
    const max=getMaxTeamCount(id);
    return `<div class="jf-qty-row">
      <span class="jf-qty-label"><b>${label}</b><span class="jf-qty-sub">এই স্লটে কয়টি টিম দিবেন?</span></span>
      <div class="jf-qty-stepper">
        <button type="button" class="jf-qty-btn" ${c<=1?'disabled':''} onclick="changeTeamCount('${id}',-1)">−</button>
        <span class="jf-qty-val">${c}</span>
        <button type="button" class="jf-qty-btn" ${c>=max?'disabled':''} onclick="changeTeamCount('${id}',1)">+</button>
      </div>
    </div>`;
  }).join('');
}
function openJoinFormMulti(){
  if(!selectedLobbies.size)return;
  currentJoinLobbyIds=[...selectedLobbies];
  lobbyTeamCounts={};
  currentJoinLobbyIds.forEach(id=>{lobbyTeamCounts[id]=1});
  document.getElementById('jfWhatsapp').value=userProfile?.whatsapp||'';
  document.getElementById('jfError').textContent='';
  const multi=currentJoinLobbyIds.length>1;
  document.getElementById('jfSameToggleWrap').style.display=multi?'flex':'none';
  document.getElementById('jfSameTeam').checked=true;
  renderLobbyChips();
  renderQuantityControls();
  renderTeamBlocks();
  renderPaymentOptions();
  document.getElementById('jfSubmitBtn').disabled=false;
  document.getElementById('jfSubmitBtn').textContent='Submit';
  document.getElementById('joinOverlay').classList.add('open');
}
function renderLobbyChips(){
  document.getElementById('jfLobbyChips').innerHTML=currentJoinLobbyIds.map(id=>{
    const l=lobbyDataById[id]||{};
    return `<span class="jf-lobby-chip"><b>${esc(l.time_label||'')}</b> ${esc(l.lobby_date||'')}</span>`;
  }).join('');
}
function renderTeamBlocks(){
  const wrap=document.getElementById('jfTeamBlocks');
  const allSingleCount=currentJoinLobbyIds.every(id=>getTeamCount(id)===1);
  document.getElementById('jfSameToggleWrap').style.display=(currentJoinLobbyIds.length>1 && allSingleCount)?'flex':'none';
  const same=allSingleCount && currentJoinLobbyIds.length>1 && document.getElementById('jfSameTeam').checked;
  if(same){
    wrap.innerHTML=`
      <div class="jf-label">Team name *</div>
      <input class="jf-input" id="jfTeamName" placeholder="Team Alpha">
      <div class="jf-label">Player name *</div>
      <input class="jf-input" id="jfPlayerName" placeholder="In-game name">
    `;
    return;
  }
  wrap.innerHTML=currentJoinLobbyIds.map(id=>{
    const l=lobbyDataById[id]||{};
    const c=getTeamCount(id);
    let blocks='';
    for(let i=1;i<=c;i++){
      const key=id+'__'+i;
      blocks+=`<div class="jf-team-block" data-key="${key}">
        ${c>1?`<div class="jf-team-block-head">
          <b>টিম ${i}</b>
          <div class="jf-copy-wrap">
            <button type="button" class="jf-copy-btn" onclick="copyTeam('${key}')">📋 Copy</button>
            <button type="button" class="jf-copy-btn" onclick="pasteTeam('${key}')">📥 Paste</button>
          </div>
        </div>`:''}
        <div class="jf-label">Team name *</div>
        <input class="jf-input" id="jfTeamName_${key}" placeholder="Team Alpha">
        <div class="jf-label">Player name *</div>
        <input class="jf-input" id="jfPlayerName_${key}" placeholder="In-game name">
      </div>`;
    }
    return blocks;
  }).join('');

}
function copyTeam(key){
  const team=document.getElementById('jfTeamName_'+key)?.value||'';
  const player=document.getElementById('jfPlayerName_'+key)?.value||'';
  copiedTeamData={team,player};
  try{ navigator.clipboard.writeText(team+' | '+player).catch(()=>{}); }catch(e){}
  const btns=document.querySelectorAll('.jf-copy-btn');
  btns.forEach(b=>{
    if(b.textContent.includes('Copy')){
      const old=b.textContent;
      b.textContent='✓ Copied';
      setTimeout(()=>{b.textContent=old;},900);
    }
  });
}
async function pasteTeam(key){
  if(!copiedTeamData){
    // If clipboard contains plain text in "Team | Player" form, allow it;
    // otherwise tell the user to press Copy first.
    try{
      const clip=await navigator.clipboard.readText();
      const parts=clip.split('|');
      if(parts.length>=2)copiedTeamData={team:parts[0].trim(),player:parts.slice(1).join('|').trim()};
    }catch(e){}
  }
  if(!copiedTeamData){
    alert('আগে একটি টিমের Copy বাটনে চাপ দিন।');
    return;
  }
  const teamInput=document.getElementById('jfTeamName_'+key);
  const playerInput=document.getElementById('jfPlayerName_'+key);
  if(teamInput)teamInput.value=copiedTeamData.team;
  if(playerInput)playerInput.value=copiedTeamData.player;
}

function collectTeamData(){
  const allSingleCount=currentJoinLobbyIds.every(id=>getTeamCount(id)===1);
  const same=allSingleCount && currentJoinLobbyIds.length>1 && document.getElementById('jfSameTeam').checked;
  // If the profile has no saved team name yet, don't block the booking —
  // fall back to whatever team name the user types on this form. submitJoin()
  // will auto-save that as the profile's team name after a successful submit,
  // so it's used for ranking from now on without the user visiting Edit Profile.
  let ownerTeamName=(getProfile().teamName||'').trim();
  const entries=[];
  if(same){
    const teamName=document.getElementById('jfTeamName').value.trim();
    const playerName=document.getElementById('jfPlayerName').value.trim();
    if(!teamName)return{error:'Team name is required.'};
    if(!playerName)return{error:'Player name is required.'};
    if(!ownerTeamName)ownerTeamName=teamName;
    currentJoinLobbyIds.forEach(id=>entries.push({lobbyId:id,teamName,playerName,ownerTeamName}));
    return{entries,newOwnerTeamName:ownerTeamName};
  }
  for(const id of currentJoinLobbyIds){
    const c=getTeamCount(id);
    const l=lobbyDataById[id]||{};
    for(let i=1;i<=c;i++){
      const key=id+'__'+i;
      const teamName=(document.getElementById('jfTeamName_'+key)?.value||'').trim();
      const playerName=(document.getElementById('jfPlayerName_'+key)?.value||'').trim();
      const label=`${l.time_label||''} ${l.lobby_date||''}`.trim()+(c>1?` টিম ${i}`:'');
      if(!teamName)return{error:`Team name is required for ${label}.`};
      if(!playerName)return{error:`Player name is required for ${label}.`};
      if(!ownerTeamName)ownerTeamName=teamName;
      entries.push({lobbyId:id,teamName,playerName,ownerTeamName});
    }
  }
  return{entries,newOwnerTeamName:ownerTeamName};
}
function closeJoinForm(){
  document.getElementById('joinOverlay').classList.remove('open');
}
document.getElementById('joinOverlay').addEventListener('click',function(e){
  if(e.target===this)closeJoinForm();
});

function renderPaymentOptions(){
  const fee=(Number(currentTournament?.entry_fee)||0)*(totalEntryCount()||1);
  const canPayBalance=sessionUser && walletBalance!=null;
  const enough=canPayBalance && walletBalance>=fee;
  let html='';
  if(canPayBalance){
    html+=`<label class="jf-pay-opt ${enough?'':'disabled'}"><input type="radio" name="jfPay" value="balance" ${enough?'checked':'disabled'} onchange="renderPaymentExtra()"><span class="pay-icon">💰</span><span class="pay-text"><b>Pay ৳${fee} from balance</b><span>Wallet balance: ৳${walletBalance}</span></span></label>`;
  }
  html+=`<label class="jf-pay-opt disabled" onclick="event.preventDefault();showManualComingSoon();"><input type="radio" name="jfPay" value="manual" disabled><span class="pay-icon">📱</span><span class="pay-text"><b>Pay via bKash/Nagad</b><span>শীঘ্রই আসছে</span></span></label>`;
  if(!canPayBalance){
    html+=`<div class="jf-note">স্লট বুক করতে আগে লগইন করুন এবং ওয়ালেট ব্যালেন্স থেকে পে করুন।</div>`;
  }else if(!enough){
    html+=`<div class="jf-note">ব্যালেন্স যথেষ্ট নয় — স্লট বুক করতে ওয়ালেটে টাকা যোগ করুন।</div>`;
  }
  document.getElementById('jfPaymentOptions').innerHTML=html;
  renderPaymentExtra();
}
function showManualComingSoon(){
  openPopup('📱 bKash/Nagad পেমেন্ট',
    'এখনও অটো পেমেন্ট সিস্টেম যোগ করা হয়নি।<br><br>খুব শীঘ্রই bKash/Nagad পেমেন্ট অপশন চালু করা হবে — কাজ চলছে, একটু ধৈর্য ধরুন 🙏<br><br>ততক্ষণ ওয়ালেট ব্যালেন্স থেকে পেমেন্ট করে স্লট বুক করতে পারবেন।');
}
function renderPaymentExtra(){
  const sel=document.querySelector('input[name="jfPay"]:checked')?.value;
  const box=document.getElementById('jfPaymentExtra');
  if(sel==='balance'){
    const fee=(Number(currentTournament?.entry_fee)||0)*(totalEntryCount()||1);
    box.innerHTML=`<div class="jf-note">৳${fee} will be deducted from your wallet balance immediately on submit${totalEntryCount()>1?` (${totalEntryCount()} entries)`:''}.</div>`;
  }else{
    box.innerHTML='';
  }
}


async function decrementBookedSlotsAfterJoin(lobbyIds){
  for(const lobbyId of lobbyIds){
    const l=lobbyDataById[lobbyId];
    if(!l)continue;
    const booked=Math.max(0,Number(l.booked_slots)||0);
    if(booked<=0)continue;
    // Read the current value immediately before update so multiple admins
    // share the same database-backed value.
    const {data,error}=await sb.from('tournament_lobbies')
      .select('booked_slots')
      .eq('id',lobbyId)
      .maybeSingle();
    if(error||!data)continue;
    const current=Math.max(0,Number(data.booked_slots)||0);
    if(current<=0)continue;
    await sb.from('tournament_lobbies')
      .update({booked_slots:current-1})
      .eq('id',lobbyId);
  }
}

async function submitJoin(){
  const errBox=document.getElementById('jfError'); errBox.textContent='';
  const closedLobby=currentJoinLobbyIds.map(id=>lobbyDataById[id]).find(l=>l&&isJoinWindowClosed(l));
  if(closedLobby){errBox.textContent=`${closedLobby.time_label||'This'} লবিতে জয়েন করার সময় শেষ হয়ে গেছে — ম্যাচ শুরু হয়ে গেছে।`;return}
  const teamData=collectTeamData();
  if(teamData.error){errBox.textContent=teamData.error;return}
  const whatsapp=document.getElementById('jfWhatsapp').value.trim();
  if(!whatsapp){errBox.textContent='WhatsApp number is required.';return}

  const payMethod=document.querySelector('input[name="jfPay"]:checked')?.value;
  if(payMethod!=='balance'){errBox.textContent='ওয়ালেট ব্যালেন্স থেকে পে করেই এখন স্লট বুক করা যাচ্ছে — bKash/Nagad পেমেন্ট এখনো চালু হয়নি।';return}

  const btn=document.getElementById('jfSubmitBtn');
  btn.disabled=true; btn.textContent='Submitting...';

  let confirmationStatus='pending', paymentRef=null;
  const lobbyCount=teamData.entries.length||1;
  {
    try{
      const {data:{session}}=await sb.auth.getSession();
      const fee=(Number(currentTournament?.entry_fee)||0)*lobbyCount;
      const res=await fetch('https://chteo-api.onrender.com/api/deduct-balance.php',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
        body:JSON.stringify({amount:fee,reference:'Tournament entry: '+(currentTournament?.title||'')+(lobbyCount>1?` (${lobbyCount} entries)`:''),description:'Tournament entry fee'})
      });
      const j=await res.json();
      if(!j.success){
        errBox.textContent='Payment failed: '+(j.message||'could not deduct balance.');
        btn.disabled=false; btn.textContent='Submit';
        return;
      }
      walletBalance=j.balance;
      paymentRef='Wallet balance ✓';
      confirmationStatus='confirmed';
    }catch(e){
      errBox.textContent='Payment failed: could not reach wallet service.';
      btn.disabled=false; btn.textContent='Submit';
      return;
    }
  }

  const rows=teamData.entries.map(e=>({
    lobby_id:e.lobbyId,
    team_name:e.teamName,
    owner_team_name:e.ownerTeamName,
    players:[{name:e.playerName}],
    contact_number:whatsapp,
    payment_reference:paymentRef,
    payment_method:payMethod,
    submitted_by:sessionUser?.id||null,
    confirmation_status:confirmationStatus
  }));

  const {error}=await sb.from('lobby_teams').insert(rows);
  if(!error){
    try{ await decrementBookedSlotsAfterJoin(currentJoinLobbyIds); }catch(e){ console.warn('Booked slot release failed:',e); }
  }

  if(error){
    errBox.textContent='Could not submit: '+error.message;
    btn.disabled=false; btn.textContent='Submit';
    return;
  }

  // First-time team name: profile had none, so save the name typed on this
  // form as the user's profile team name — locally right away, and to the
  // profiles table in the background so it carries over to other devices too.
  if(!(getProfile().teamName||'').trim() && teamData.newOwnerTeamName){
    try{
      const prof=getProfile();
      prof.teamName=teamData.newOwnerTeamName;
      localStorage.setItem('user_profile',JSON.stringify(prof));
      document.dispatchEvent(new Event('chteo:profile-synced'));
    }catch(e){/* ignore local save issues */}
    if(sessionUser){
      // Team Name lives in the 'full_name' column on Supabase 'profiles'
      // (see edit_profile.html / global.js) — there is no 'team_name' column.
      sb.from('profiles').update({full_name:teamData.newOwnerTeamName}).eq('id',sessionUser.id)
        .then(({error})=>{ if(error) console.warn('Could not sync team name to profile:',error); })
        .catch(()=>{});
    }
  }

  closeJoinForm();
  selectedLobbies.clear();
  const successHtml=`
    <div class="success-body">
      <div class="success-icon">${confirmationStatus==='confirmed'?'✅':'📝'}</div>
      <div class="success-title">${confirmationStatus==='confirmed'?'Paid and joined!':'Request sent!'}</div>
      <div class="success-text">${confirmationStatus==='confirmed'?`Your ${lobbyCount>1?lobbyCount+' slots are':'slot is'} confirmed.`:`The admin will confirm your ${lobbyCount>1?lobbyCount+' slots':'slot'} after verifying payment.`}</div>
      <button type="button" class="success-goto-btn" onclick="window.location.href='tournaments.html'">Go to my tournaments</button>
    </div>`;
  openPopup(
    confirmationStatus==='confirmed' ? '✅ পেমেন্ট সম্পন্ন' : '📝 রিকোয়েস্ট পাঠানো হয়েছে',
    successHtml,
    ()=>location.reload()
  );
}
