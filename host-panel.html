<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Host Panel — CHT ESP ORG</title>
<style>
:root{--bg:#080b12;--surface:#121827;--surface2:#171f31;--line:#293650;--muted:#8b96aa;--green:#25d366;--green2:#39e77b;--red:#ff5d6c;--gold:#f6c453;--text:#f4f6fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.07),transparent 40%),linear-gradient(160deg,#1b2140 0%,#2a3266 55%,#333c7a 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px 12px 40px}
.head{display:flex;gap:11px;align-items:center;margin-bottom:16px}
.back{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#121827;color:#fff;font-size:22px;cursor:pointer}
h1{font-size:20px;margin:0;font-weight:900}.sub{font-size:10px;color:var(--muted);margin-top:4px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,#141b2b,#111827);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.date-title{font-size:12px;font-weight:900}.date-title small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.refresh{border:1px solid var(--line);background:#111827;color:#eaf0fa;border-radius:10px;padding:9px 12px;font-size:10px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#141b2b;border:1px solid var(--line);border-radius:14px;padding:11px}.stat b{display:block;font-size:18px}.stat span{font-size:8px;color:var(--muted);font-weight:800}
.tournament{background:linear-gradient(180deg,#141b2b,#111827);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:0 12px 30px #0003}
.thead{padding:13px 14px 10px;border-bottom:1px solid #253047}.tname{font-size:14px;font-weight:950}.tmeta{font-size:9px;color:var(--muted);margin-top:4px}
.lobby{padding:12px 13px;border-bottom:1px solid #202b40}.lobby:last-child{border-bottom:0}
.ltop{display:flex;align-items:center;justify-content:space-between;gap:10px}.ltime{font-size:12px;font-weight:950}
.badge{font-size:8px;font-weight:950;padding:5px 8px;border-radius:999px;background:#203329;color:#5ee98b;white-space:nowrap}
.badge.full{background:#2b2410;color:#f6c453}.badge.off{background:#2b1720;color:#ff6575}.badge.pending{background:#2b2410;color:#f6c453}
.info{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.info-box{background:#0e1420;border:1px solid #26324a;border-radius:10px;padding:8px}.info-box span{display:block;color:#7f8ba0;font-size:8px;font-weight:800}.info-box b{display:block;font-size:11px;margin-top:3px;word-break:break-all}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.btn{border:1px solid #293650;background:#111827;color:#eaf0fa;border-radius:10px;padding:10px 6px;font-size:9px;font-weight:900;cursor:pointer}
.btn.green{color:#62eb91}.btn.red{color:#ff6f7c}.btn.gold{color:#f6c453}.btn:disabled{opacity:.45;cursor:not-allowed}
.empty,.loading{text-align:center;color:var(--muted);font-size:11px;padding:30px 12px}
.notice{background:#141b2b;border:1px solid var(--line);border-radius:15px;padding:14px;color:#aeb7c7;font-size:10px;line-height:1.55;margin-bottom:12px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9999;align-items:flex-end;backdrop-filter:blur(4px)}
.modal.open{display:flex}.box{width:100%;max-height:92vh;overflow:auto;background:#0c111b;border:1px solid #293650;border-radius:22px 22px 0 0;padding:0 14px 16px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;position:sticky;top:0;background:#0c111b;z-index:3}.mh b{font-size:14px}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#151d2c;color:#fff;font-size:20px}
.team{background:#171f31;border:1px solid var(--line);border-radius:13px;padding:10px;margin-top:8px}.teamtop{display:flex;justify-content:space-between;gap:8px}.teamname{font-size:11px;font-weight:900}.teammeta{font-size:9px;color:#8e98ab;margin-top:4px}.uid{display:inline-block;background:#1c2a3d;color:#7cc2ff;border-radius:999px;padding:2px 7px;font-weight:900}
.result-row{display:grid;grid-template-columns:28px minmax(0,1fr) 72px 60px 30px;gap:6px;align-items:center;background:#171f31;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px}
.rank{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#101725;border:1px solid #2b3852;font-size:10px;font-weight:900}
.rname{font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rmeta{font-size:8px;color:#8e98ab;margin-top:2px}
.result-row input{width:100%;background:#101725;border:1px solid var(--line);color:#fff;border-radius:7px;padding:7px;font-size:9px}.updown{display:flex;flex-direction:column;gap:2px}.updown button{width:28px;height:14px;background:#101725;border:1px solid var(--line);color:#fff;border-radius:5px;font-size:8px}.updown button:disabled{opacity:.3}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.modal-actions button{border:1px solid var(--line);background:#151d2c;color:#fff;border-radius:11px;padding:11px;font-weight:900}.modal-actions .primary{background:#22c55e;color:#06120a;border-color:#22c55e}
.confirm{display:none;position:fixed;inset:0;z-index:10000;background:#000a;align-items:center;justify-content:center;padding:20px}.confirm.open{display:flex}.confirm-card{width:min(370px,100%);background:#141a29;border:1px solid #2c3851;border-radius:20px;padding:20px}.confirm-title{font-size:15px;font-weight:900}.confirm-text{font-size:10px;color:#929caf;line-height:1.5;margin-top:6px}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.confirm-actions button{border:1px solid var(--line);background:#111827;color:#fff;border-radius:11px;padding:11px;font-weight:900}.confirm-actions .danger{background:#e5485a;border-color:#e5485a}
@media(max-width:560px){.wrap{padding:14px 10px 30px}.stats{gap:6px}.stat{padding:9px}.stat b{font-size:16px}.actions{grid-template-columns:repeat(2,1fr)}.info{grid-template-columns:1fr 1fr}.result-row{grid-template-columns:27px minmax(0,1fr) 62px 54px 28px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <button class="back" onclick="history.back()" aria-label="Back">‹</button>
    <div><h1>Host Panel</h1><div class="sub">Today's active tournament lobbies</div></div>
  </div>
  <div class="datebar"><div class="date-title" id="todayLabel">Today<small>Loading date…</small></div><button class="refresh" onclick="load()">↻ Refresh</button></div>
  <div class="stats"><div class="stat"><b id="tStat">0</b><span>ACTIVE TOURNAMENTS</span></div><div class="stat"><b id="lStat">0</b><span>ACTIVE LOBBIES</span></div><div class="stat"><b id="sStat">0</b><span>TEAMS / SLOTS</span></div></div>
  <div id="notice" class="notice">Loading today's active lobbies…</div>
  <div id="content"><div class="loading">Loading…</div></div>
</main>

<div class="modal" id="teamsModal"><div class="box"><div class="mh"><b id="teamsTitle">Teams</b><button class="close" onclick="closeModal('teamsModal')">×</button></div><div id="teamsList" class="loading">Loading…</div></div></div>

<div class="modal" id="roomModal"><div class="box">
  <div class="mh"><b>Room ID / Password</b><button class="close" onclick="closeModal('roomModal')">×</button></div>
  <label>Room ID</label><input id="roomId" placeholder="Room ID">
  <label>Password</label><input id="roomPass" placeholder="Room Password">
  <div class="modal-actions"><button onclick="closeModal('roomModal')">Cancel</button><button class="primary" onclick="saveRoom()">Save</button></div>
</div></div>

<div class="modal" id="resultsModal"><div class="box">
  <div class="mh"><b id="resultsTitle">Enter Result</b><button class="close" onclick="closeModal('resultsModal')">×</button></div>
  <div id="resultsList" class="loading">Loading…</div>
  <div class="modal-actions"><button id="saveBtn" onclick="saveResultsClick()">Save Results</button><button id="completeBtn" class="primary" onclick="saveResultsAndComplete()">Complete</button></div>
</div></div>

<div class="confirm" id="confirm"><div class="confirm-card"><div class="confirm-title" id="confirmTitle">Are you sure?</div><div class="confirm-text" id="confirmText"></div><div class="confirm-actions"><button onclick="closeConfirm()">Cancel</button><button class="danger" id="confirmOk">Continue</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);

let session=null, profile=null, lobbies=[], tournaments=new Map(), currentLobby=null, currentTournament=null, resultRows=[], resultSubmitting=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}catch(e){return d}}
function fmtShort(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}catch(e){return d}}
function parseLobbyDateTime(date,label){
  const m=/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((label||'').trim()); if(!m)return null;
  let h=(+m[1])%12;if(/pm/i.test(m[3]))h+=12;
  const d=new Date(date+'T00:00:00');d.setHours(h,+m[2],0,0);if(h===0)d.setDate(d.getDate()+1);return d;
}
function liveBadge(l){
  if(l.status!=='live')return null;
  const dt=parseLobbyDateTime(l.lobby_date,l.time_label);if(!dt)return {cls:'',text:'MATCH ON'};
  return ((Date.now()-dt.getTime())/60000)<60?{cls:'',text:'MATCH ON'}:{cls:'pending',text:'PENDING'};
}
function closeModal(id){$(id).classList.remove('open')}
function openModal(id){$(id).classList.add('open')}
function msg(text){alert(text)}
function askConfirm(title,text,action){
  $('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirm').classList.add('open');
  $('confirmOk').onclick=async()=>{closeConfirm();await action()};
}
function closeConfirm(){$('confirm').classList.remove('open')}

async function auth(){
  const r=await sb.auth.getSession();session=r.data.session;
  if(!session){location.href='chteo_auth.html';return false}
  const p=await sb.from('profiles').select('is_admin,is_host,full_name,email').eq('id',session.user.id).single();
  if(p.error||(!p.data?.is_admin&&!p.data?.is_host)){
    alert('Host or Admin access required.');location.href='index.html';return false
  }
  profile=p.data;return true
}
async function logActivity(action,targetId,targetName,details={}){
  try{await sb.from('activity_logs').insert({
    admin_id:session?.user?.id,admin_name:profile?.full_name||profile?.email||'Host',
    action,category:'tournament',target_type:'tournament_lobby',target_id:targetId,target_name:targetName,
    details,status:'success',user_agent:navigator.userAgent
  })}catch(e){console.warn('Activity log failed',e)}
}
async function applyAutoStatus(list){
  const now=new Date(),today=ymd(now),live=[],done=[];
  list.forEach(l=>{
    if(!['upcoming','live','full'].includes(l.status))return;
    const dt=parseLobbyDateTime(l.lobby_date,l.time_label),eff=dt?ymd(dt):l.lobby_date;
    if(eff<today){done.push(l.id);l.status='completed'}
    else if(eff===today&&l.status==='upcoming'&&dt&&dt<=now){live.push(l.id);l.status='live'}
  });
  if(live.length)await sb.from('tournament_lobbies').update({status:'live'}).in('id',live);
  if(done.length)await sb.from('tournament_lobbies').update({status:'completed'}).in('id',done);
}
async function load(){
  $('content').innerHTML='<div class="loading">Loading…</div>';
  const today=ymd(new Date());
  $('todayLabel').innerHTML='Today<small>'+fmtDate(today)+'</small>';
  const tr=await sb.from('tournaments').select('id,title,status,default_slots,total_slots,prize_distribution').neq('status','archived');
  if(tr.error){$('content').innerHTML='<div class="empty">Could not load tournaments: '+esc(tr.error.message)+'</div>';return}
  tournaments=new Map((tr.data||[]).map(t=>[t.id,t]));
  const lr=await sb.from('tournament_lobbies').select('*').eq('lobby_date',today).in('status',['upcoming','live','full']).order('time_label');
  if(lr.error){$('content').innerHTML='<div class="empty">Could not load lobbies: '+esc(lr.error.message)+'</div>';return}
  lobbies=lr.data||[];
  await applyAutoStatus(lobbies);
  // Keep only today's active rows after the client-side status refresh.
  lobbies=lobbies.filter(l=>l.lobby_date===today&&['upcoming','live','full'].includes(l.status));
  render();
}
function render(){
  const groups=new Map();
  lobbies.forEach(l=>{
    const t=tournaments.get(l.tournament_id);if(!t)return;
    if(!groups.has(t.id))groups.set(t.id,{t,l:[]});groups.get(t.id).l.push(l);
  });
  let totalJoined=0,totalSlots=0;
  lobbies.forEach(l=>{totalJoined+=Number(l.joined_count)||0;totalSlots+=Number(l.total_slots)||0});
  $('tStat').textContent=groups.size;$('lStat').textContent=lobbies.length;$('sStat').textContent=totalJoined+'/'+totalSlots;
  $('notice').textContent=groups.size?((profile?.is_admin?'Admin access':'Host access')+' · '+lobbies.length+' active lobby'+(lobbies.length===1?'':'ies')+' today. No Tournament Management access is needed here.'):'No active tournament lobby scheduled for today.';
  if(!groups.size){$('content').innerHTML='<div class="empty">No active lobbies for today.</div>';return}
  $('content').innerHTML=[...groups.values()].map(g=>`
    <section class="tournament">
      <div class="thead"><div class="tname">${esc(g.t.title)}</div><div class="tmeta">${g.l.length} active lobby${g.l.length===1?'':'ies'} · default ${Number(g.t.default_slots||g.t.total_slots)||0} slots</div></div>
      ${g.l.sort((a,b)=>(parseLobbyDateTime(a.lobby_date,a.time_label)||0)-(parseLobbyDateTime(b.lobby_date,b.time_label)||0)).map(renderLobby).join('')}
    </section>`).join('');
}
function renderLobby(l){
  const live=liveBadge(l);
  let badge=l.status==='full'?'<span class="badge full">● FULL</span>':live?`<span class="badge ${live.cls}">● ${live.text}</span>`:'<span class="badge">○ UPCOMING</span>';
  const room=l.room_id||'Not set',pass=l.room_password||'Not set';
  return `<div class="lobby">
    <div class="ltop"><div class="ltime">${fmtShort(l.lobby_date)} — ${esc(l.time_label)}</div>${badge}</div>
    <div class="info">
      <div class="info-box"><span>TEAMS / SLOTS</span><b>${Number(l.joined_count)||0} / ${Number(l.total_slots)||0}</b></div>
      <div class="info-box"><span>ROOM ID</span><b>${esc(room)}</b></div>
      <div class="info-box"><span>PASSWORD</span><b>${esc(pass)}</b></div>
      <div class="info-box"><span>BOOKED</span><b>${Number(l.booked_slots)||0}</b></div>
    </div>
    <div class="actions">
      <button class="btn green" onclick="openTeams('${l.id}')">Teams</button>
      <button class="btn" onclick="openRoom('${l.id}')">Room ID/Pass</button>
      <button class="btn" onclick="openResults('${l.id}')">Enter Result</button>
      ${l.status==='full'
        ?`<button class="btn gold" onclick="changeStatus('${l.id}','upcoming')">Unfull</button>`
        :`<button class="btn gold" onclick="changeStatus('${l.id}','full')">Full</button>`}
      <button class="btn red" onclick="changeStatus('${l.id}','cancelled')">Off</button>
    </div>
  </div>`
}
async function refreshLobby(id){
  const r=await sb.from('tournament_lobbies').select('*').eq('id',id).single();
  if(r.data){const i=lobbies.findIndex(x=>x.id===id);if(i>=0)lobbies[i]=r.data}
  render()
}
async function changeStatus(id,status){
  const l=lobbies.find(x=>x.id===id);if(!l)return;
  const label=status==='cancelled'?'Off':status==='full'?'Full':'On';
  askConfirm(label+' lobby?',`Set ${fmtShort(l.lobby_date)} ${l.time_label} to ${status==='cancelled'?'OFF':status.toUpperCase()}?`,async()=>{
    const r=await sb.from('tournament_lobbies').update({status}).eq('id',id).select();
    if(r.error)return msg(r.error.message);
    if(!r.data?.length)return msg('Update blocked (0 rows) — check tournament_lobbies UPDATE RLS.');
    await logActivity('lobby_status_changed',id,fmtShort(l.lobby_date)+' '+l.time_label,{narration:`set lobby ${fmtShort(l.lobby_date)} ${l.time_label} to ${status}.`});
    if(status==='cancelled')lobbies=lobbies.filter(x=>x.id!==id);else l.status=status;
    render();
  })
}
async function openRoom(id){
  currentLobby=lobbies.find(x=>x.id===id);if(!currentLobby)return;
  $('roomId').value=currentLobby.room_id||'';$('roomPass').value=currentLobby.room_password||'';openModal('roomModal')
}
async function saveRoom(){
  if(!currentLobby)return;
  const roomId=$('roomId').value.trim(),roomPassword=$('roomPass').value.trim();
  const r=await sb.from('tournament_lobbies').update({room_id:roomId,room_password:roomPassword}).eq('id',currentLobby.id).select();
  if(r.error)return msg(r.error.message);if(!r.data?.length)return msg('Update blocked (0 rows) — check tournament_lobbies UPDATE RLS.');
  currentLobby.room_id=roomId;currentLobby.room_password=roomPassword;
  await logActivity('room_credentials_updated',currentLobby.id,fmtShort(currentLobby.lobby_date)+' '+currentLobby.time_label,{narration:'updated the Room ID and password.'});
  closeModal('roomModal');render();
}
async function openTeams(id){
  currentLobby=lobbies.find(x=>x.id===id);if(!currentLobby)return;
  $('teamsTitle').textContent='Teams — '+fmtShort(currentLobby.lobby_date)+' '+currentLobby.time_label;
  $('teamsList').innerHTML='<div class="loading">Loading…</div>';openModal('teamsModal');
  const r=await sb.from('lobby_teams').select('*, profiles(user_number,full_name)').eq('lobby_id',id).order('joined_at');
  if(r.error){$('teamsList').innerHTML='<div class="empty">Could not load teams.</div>';return}
  $('teamsList').innerHTML=r.data?.length?r.data.map(tm=>{
    const uid=tm.profiles?.user_number?`<span class="uid">UID #${tm.profiles.user_number}</span>`:'<span class="uid">Guest</span>';
    const player=Array.isArray(tm.players)&&tm.players[0]?.name?' · '+esc(tm.players[0].name):'';
    return `<div class="team"><div class="teamtop"><div class="teamname">${esc(tm.team_name)}</div><span class="badge ${tm.confirmation_status==='confirmed'?'':'pending'}">${esc(tm.confirmation_status||'unknown')}</span></div><div class="teammeta">${uid}${player}</div><div class="teammeta">${tm.contact_number?'📱 '+esc(tm.contact_number):''}</div></div>`
  }).join(''):'<div class="empty">No teams joined yet.</div>'
}
async function openResults(id){
  currentLobby=lobbies.find(x=>x.id===id);if(!currentLobby)return;
  currentTournament=tournaments.get(currentLobby.tournament_id);
  $('resultsTitle').textContent='Result — '+fmtShort(currentLobby.lobby_date)+' '+currentLobby.time_label;
  $('resultsList').innerHTML='<div class="loading">Loading…</div>';openModal('resultsModal');
  const [a,b]=await Promise.all([
    sb.from('lobby_teams').select('*, profiles(user_number)').eq('lobby_id',id).eq('confirmation_status','confirmed').order('team_name'),
    sb.from('lobby_results').select('*').eq('lobby_id',id)
  ]);
  if(a.error||b.error){$('resultsList').innerHTML='<div class="empty">Could not load result data.</div>';return}
  const map=new Map((b.data||[]).map(x=>[x.team_id,x]));
  resultRows=(a.data||[]).sort((x,y)=>(map.get(x.id)?.rank??9999)-(map.get(y.id)?.rank??9999));
  renderResults(map)
}
function renderResults(map){
  const prizeN=Array.isArray(currentTournament?.prize_distribution)?currentTournament.prize_distribution.length:Infinity;
  $('resultsList').innerHTML=resultRows.length?resultRows.map((tm,i)=>{
    const r=map.get(tm.id)||{};const uid=tm.profiles?.user_number?'UID #'+tm.profiles.user_number:'Guest';
    return `<div class="result-row" data-team="${tm.id}">
      <div class="rank">${i+1}</div><div><div class="rname">${esc(tm.team_name)}</div><div class="rmeta">${esc(uid)}</div></div>
      <input class="prize" type="number" min="0" placeholder="৳" value="${r.prize_won??''}" ${i>=prizeN?'disabled':''}>
      <input class="points" type="number" min="0" placeholder="PTS" value="${r.total_points??''}">
      <div class="updown"><button onclick="moveResult(${i},-1)" ${i===0?'disabled':''}>▲</button><button onclick="moveResult(${i},1)" ${i===resultRows.length-1?'disabled':''}>▼</button></div>
    </div>`
  }).join(''):'<div class="empty">No confirmed teams for this lobby.</div>'
}
function moveResult(i,dir){
  const j=i+dir;if(j<0||j>=resultRows.length)return;
  [resultRows[i],resultRows[j]]=[resultRows[j],resultRows[i]];
  const map=new Map();document.querySelectorAll('.result-row').forEach(row=>{});
  openResultsLocal()
}
async function openResultsLocal(){
  const r=await sb.from('lobby_results').select('*').eq('lobby_id',currentLobby.id);renderResults(new Map((r.data||[]).map(x=>[x.team_id,x])))
}
async function saveResults(){
  const rows=[...document.querySelectorAll('#resultsList .result-row')].map((row,i)=>({
    lobby_id:currentLobby.id,team_id:row.dataset.team,rank:i+1,
    total_points:+row.querySelector('.points').value||0,prize_won:+row.querySelector('.prize').value||0
  }));
  if(!rows.length){msg('No teams to save.');return false}
  const r=await sb.from('lobby_results').upsert(rows,{onConflict:'lobby_id,team_id'}).select();
  if(r.error)return msg(r.error.message),false;
  if(!r.data?.length)return msg('Save blocked (0 rows) — check lobby_results RLS.'),false;
  await logActivity('lobby_results_saved',currentLobby.id,fmtShort(currentLobby.lobby_date)+' '+currentLobby.time_label,{narration:'saved results for the lobby.'});
  return true
}
async function saveResultsClick(){
  if(resultSubmitting)return;resultSubmitting=true;$('saveBtn').disabled=true;$('completeBtn').disabled=true;
  try{if(await saveResults())msg('Results saved.')}finally{resultSubmitting=false;$('saveBtn').disabled=false;$('completeBtn').disabled=false}
}
async function saveResultsAndComplete(){
  if(resultSubmitting)return;resultSubmitting=true;$('completeBtn').disabled=true;$('saveBtn').disabled=true;$('completeBtn').textContent='Processing…';
  try{
    const ok=await saveResults();if(!ok)return;
    // Same completion behavior as Tournament Management: prize crediting is handled
    // by its existing flow/API. This Host Panel intentionally does not create a new
    // payment system.
    const r=await sb.from('tournament_lobbies').update({status:'completed'}).eq('id',currentLobby.id).select();
    if(r.error||!r.data?.length)return msg(r.error?.message||'Could not complete lobby.');
    await logActivity('lobby_completed',currentLobby.id,fmtShort(currentLobby.lobby_date)+' '+currentLobby.time_label,{narration:'completed the lobby from Host Panel.'});
    closeModal('resultsModal');lobbies=lobbies.filter(x=>x.id!==currentLobby.id);render();msg('Lobby completed. Results saved.');
  }finally{$('completeBtn').disabled=false;$('saveBtn').disabled=false;$('completeBtn').textContent='Complete';resultSubmitting=false}
}
document.addEventListener('DOMContentLoaded',async()=>{if(await auth())await load()});
</script>
</body>
