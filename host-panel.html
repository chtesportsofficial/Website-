<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Host Panel — CHT ESP ORG</title>
<style>
:root{--bg:#080b12;--surface:#121827;--surface2:#171f31;--line:#26324a;--muted:#8b96aa;--green:#25d366;--green2:#39e77b;--red:#ff5d6c;--gold:#f6c453;--card:#121827;--border:#26324a;--text:#f4f6fb}
*{box-sizing:border-box}
html{background:#080b12}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 40%),linear-gradient(160deg,#1b2140 0%,#2a3266 55%,#333c7a 100%);color:#f4f6fb;font-family:Inter,system-ui,-apple-system,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:auto;padding:20px 14px 110px}
.head{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.back-btn{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.back-btn svg{width:20px;height:20px}
.head h1{font-size:19px;margin:0;font-weight:750}
.sub{font-size:10px;color:var(--muted);margin-top:4px}

.today-panel{background:linear-gradient(180deg,#141b2b,#111827);border:1px solid #27334c;border-radius:19px;padding:13px 14px;margin-bottom:12px;box-shadow:0 12px 30px #0003}
.today-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.today-title{font-size:13px;font-weight:950}
.today-title small{display:block;color:var(--muted);font-size:9px;font-weight:700;margin-top:4px}
.refresh{border:1px solid #293650;background:#111827;color:#e9edf5;border-radius:11px;padding:9px 12px;font-size:9px;font-weight:900}


.notice{background:#141b2b;border:1px solid #27334c;border-radius:15px;padding:12px 13px;color:#aeb7c7;font-size:9px;line-height:1.5;margin-bottom:12px}

.group{background:linear-gradient(180deg,#141b2b,#111827);border:1px solid #27334c;border-radius:19px;padding:12px;margin-bottom:12px;box-shadow:0 12px 30px #0003}
.group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 8px}
.group-name{font-size:14px;font-weight:950;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-count{font-size:9px;color:#7f8ba0;font-weight:900;white-space:nowrap}
.lobby-item{background:linear-gradient(145deg,#182237,#141d30);border:1px solid #2b3852;border-radius:16px;padding:12px;margin-top:9px;box-shadow:0 8px 22px #0002}
.lobby-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lobby-date{font-size:12px;font-weight:950}
.lobby-meta{font-size:9px;color:#8e98ab;margin-top:5px}
.lobby-status{font-size:8px;font-weight:950;padding:5px 8px;border-radius:999px;background:#203329;color:#5ee98b;white-space:nowrap}
.lobby-status.full{background:#2b2410;color:#f6c453}
.lobby-status.pending{background:#2b2410;color:#f6c453}
.lobby-status.off{background:#2b1720;color:#ff6575}

.room-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.room-box{min-width:0;background:#0e1420;border:1px solid #293650;border-radius:11px;padding:9px 10px}
.room-box span{display:block;color:#7f8ba0;font-size:8px;font-weight:900;text-transform:uppercase}
.room-box b{display:block;font-size:11px;margin-top:4px;word-break:break-all;color:#f0f3f8}

.lobby-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mini{border:1px solid #293650;background:#111827;color:#e8ebf2;border-radius:10px;padding:9px 12px;font-size:9px;font-weight:900;min-height:36px}
.mini.green{color:#62eb91}
.mini.red{color:#ff6f7c}
.mini.gold{color:#f6c453}
.mini:disabled{opacity:.45;cursor:not-allowed}
.modal-actions button:disabled{opacity:.55;cursor:not-allowed}

.empty,.loading{text-align:center;color:var(--muted);font-size:11px;padding:24px 12px}

.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9999;align-items:flex-end;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.box{width:100%;max-height:92vh;max-height:92dvh;overflow:auto;background:#0c111b;border:1px solid #293650;border-radius:22px 22px 0 0;padding:0 17px 17px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:17px 0 13px;position:sticky;top:0;background:#0c111b;z-index:20}
.mh b{font-size:14px}
.close{width:34px;height:34px;border-radius:10px;border:1px solid #293650;background:#151d2c;color:#fff;font-size:20px}
label{display:block;color:#8d98ab;font-size:9px;font-weight:900;margin:9px 0 5px}
input{width:100%;background:#141b2b;border:1px solid #293650;color:#fff;border-radius:11px;padding:10px;font-size:11px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.modal-actions button{border:1px solid #293650;background:#151d2c;color:#fff;border-radius:11px;padding:11px;font-weight:900}
.modal-actions .primary{background:#22c55e;color:#06120a;border-color:#22c55e}

.team-item{background:#171f31;border:1px solid #293650;border-radius:14px;padding:10px;margin-top:8px}
.team-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.teamname{font-size:11px;font-weight:900}
.teammeta{font-size:9px;color:#8e98ab;margin-top:4px}
.uid{display:inline-block;background:#1c2a3d;color:#7cc2ff;border-radius:999px;padding:2px 7px;font-weight:900}
.team-status{font-size:9px;font-weight:900;padding:4px 8px;border-radius:999px;background:#203329;color:#5ee98b}
.team-status.pending{background:#2b2410;color:#f6c453}
.team-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.result-row{display:grid;grid-template-columns:26px 1fr 66px 58px 30px;gap:6px;align-items:center;background:#171f31;border:1px solid #293650;border-radius:12px;padding:8px;margin-top:8px}
.rank{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#101725;border:1px solid #2b3852;font-size:10px;font-weight:900}
.rname{font-size:10px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-size:8px;color:#8e98ab;margin-top:2px}
.result-row input{width:100%;background:#101725;border:1px solid #293650;color:#fff;border-radius:7px;padding:7px;font-size:10px}
.updown{display:flex;flex-direction:column;gap:2px}
.updown button{width:28px;height:15px;background:#101725;border:1px solid #293650;color:#fff;border-radius:6px;font-size:8px}
.updown button:disabled{opacity:.3}

.confirm{display:none;position:fixed;inset:0;z-index:10000;background:#000a;align-items:center;justify-content:center;padding:20px}
.confirm.open{display:flex}
.confirm-card{width:min(360px,100%);background:#141a29;border:1px solid #2c3851;border-radius:20px;padding:20px;box-shadow:0 25px 70px #0008}
.confirm-title{font-size:15px;font-weight:900}
.confirm-text{font-size:10px;color:#929caf;line-height:1.5;margin-top:6px}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.confirm-actions button{border:1px solid #293650;background:#111827;color:#fff;border-radius:11px;padding:11px;font-weight:900}
.confirm-actions .danger{background:#e5485a;border-color:#e5485a}

@media(max-width:560px){
  .wrap{padding:14px 12px 80px}
  .stats{gap:6px}
  .stat{padding:10px 8px;border-radius:14px}
  .stat b{font-size:17px}
  .stat span{font-size:7px}
  .lobby-actions{gap:6px}
  .mini{padding:8px 10px;font-size:8px}
  .room-grid{gap:7px}
  .result-row{grid-template-columns:26px minmax(0,1fr) 62px 54px 28px}
}
@media(max-width:390px){
  .room-grid{grid-template-columns:1fr}
  .lobby-actions .mini{flex:1}
}

.team-item{background:#171f31;border:1px solid #293650;border-radius:14px;padding:10px;margin-top:8px}
.team-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.team-top>b{font-size:12px;font-weight:950}
.team-status{font-size:9px;font-weight:900;padding:3px 8px;border-radius:999px;background:#203329;color:#5ee98b;text-transform:capitalize}
.team-status.pending{background:#2b2410;color:#f6c453}
.team-status.rejected{background:#2b1720;color:#ff6575}
.team-meta{font-size:9px;color:#8e98ab;margin-top:4px}
.team-uid{background:#1c2a3d;color:#7cc2ff;font-weight:900;padding:2px 7px;border-radius:999px;font-size:9px}
.team-uid.guest{background:#232a3d;color:#8e98ab}
.team-pay{padding:2px 7px;border-radius:999px;font-size:9px;font-weight:900;margin-left:4px}
.team-pay.balance{background:#203329;color:#5ee98b}
.team-pay.manual{background:#2b2410;color:#f6c453}
.team-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.add-team-btn{width:100%;padding:11px;margin:2px 0 12px;text-align:center;font-size:10px}
.add-team-form{background:#141b2b;border:1px solid #293650;border-radius:14px;padding:12px;margin-bottom:14px}
.add-team-form label{margin:8px 0 5px}
.add-team-form label:first-child{margin-top:0}

</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <button class="back-btn" type="button" onclick="history.back()" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div><h1>Host Panel</h1></div>
  </div>

  <section class="today-panel">
    <div class="today-head">
      <div class="today-title">Today's Active Lobbies<small id="todayLabel">Loading date…</small></div>
      <button class="refresh" onclick="load()">↻ Refresh</button>
    </div>
  </section>
  <div id="content"><div class="loading">Loading…</div></div>
</main>

<div class="modal" id="teamsModal"><div class="box">
  <div class="mh"><b id="teamsTitle">Teams</b><button type="button" class="close" onclick="closeModal('teamsModal')">×</button></div>
  <button type="button" class="mini add-team-btn" onclick="toggleAddTeamForm()">+ Add Team</button>
  <div id="addTeamForm" class="add-team-form" style="display:none">
    <label>Team Name *</label><input id="atTeamName" placeholder="Team name">
    <label>Player Name</label><input id="atPlayerName" placeholder="Player name">
    <label>WhatsApp Number *</label><input id="atWhatsapp" placeholder="01XXXXXXXXX" inputmode="tel">
    <div class="modal-actions">
      <button type="button" onclick="toggleAddTeamForm(false)">Cancel</button>
      <button type="button" class="primary" id="addTeamSubmitBtn" onclick="submitManualTeam()">Add Team</button>
    </div>
  </div>
  <div id="teamsList"><div class="loading">Loading…</div></div>
</div></div>
<div class="modal" id="roomModal"><div class="box">
  <div class="mh"><b>Room ID / Password</b><button class="close" onclick="closeModal('roomModal')">×</button></div>
  <label>Room ID</label><input id="roomId" placeholder="Room ID">
  <label>Password</label><input id="roomPass" placeholder="Room Password">
  <div class="modal-actions"><button onclick="closeModal('roomModal')">Cancel</button><button class="primary" onclick="saveRoom()">Save</button></div>
</div></div>

<div class="modal" id="resultsModal"><div class="box">
  <div class="mh"><b id="resultsTitle">Enter Result</b><button class="close" onclick="closeModal('resultsModal')">×</button></div>
  <div id="resultsList" class="loading">Loading…</div>
  <div class="modal-actions"><button id="saveBtn" onclick="saveResultsClick()">Save Results</button><button id="completeBtn" class="primary" onclick="saveResultsAndComplete()">Complete</button></div>
</div></div>

<div class="confirm" id="confirm"><div class="confirm-card"><div class="confirm-title" id="confirmTitle">Are you sure?</div><div class="confirm-text" id="confirmText"></div><div class="confirm-actions"><button onclick="closeConfirm()">Cancel</button><button class="danger" id="confirmOk">Continue</button></div></div></div>
<div class="confirm" id="linkAccountModal">
  <div class="confirm-card">
    <div class="confirm-title">Link Team to Account</div>
    <div class="confirm-text" id="linkAccountText"></div>
    <label style="display:block;margin-top:14px;font-size:9px;font-weight:900;color:#929caf;text-transform:uppercase;letter-spacing:.03em">Player's UID</label>
    <input id="linkAccountUid" placeholder="e.g. 24" inputmode="numeric" style="margin-top:6px" autocomplete="off">
    <div class="confirm-actions">
      <button onclick="closeLinkAccountModal()">Cancel</button>
      <button class="danger" id="linkAccountOk" style="background:#22c55e;border-color:#22c55e;color:#06120a">Link</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co';
const KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';
const sb=window.supabase.createClient(SUPABASE_URL,KEY);

let session=null, profile=null, lobbies=[], tournaments=new Map(), currentLobby=null, currentTournament=null, lobbyTeamsCache=[], resultRows=[], resultSubmitting=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}catch(e){return d}}
function fmtShort(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}catch(e){return d}}
function parseLobbyDateTime(date,label){
  const m=/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((label||'').trim()); if(!m)return null;
  let h=(+m[1])%12;if(/pm/i.test(m[3]))h+=12;
  const d=new Date(date+'T00:00:00');d.setHours(h,+m[2],0,0);if(h===0)d.setDate(d.getDate()+1);return d;
}
function liveBadge(l){
  if(l.status!=='live')return null;
  const dt=parseLobbyDateTime(l.lobby_date,l.time_label);if(!dt)return {cls:'',text:'MATCH ON'};
  return ((Date.now()-dt.getTime())/60000)<60?{cls:'',text:'MATCH ON'}:{cls:'pending',text:'PENDING'};
}
let _scrollY=0,_modalOpenCount=0;
function closeModal(id){
  $(id).classList.remove('open');
  _modalOpenCount=Math.max(0,_modalOpenCount-1);
  if(_modalOpenCount===0){
    document.body.style.position='';document.body.style.top='';document.body.style.width='';document.body.style.overflow='';
    window.scrollTo(0,_scrollY);
  }
}
function openModal(id){
  if(_modalOpenCount===0){
    _scrollY=window.scrollY||window.pageYOffset||0;
    document.body.style.position='fixed';document.body.style.top=(-_scrollY)+'px';document.body.style.width='100%';document.body.style.overflow='hidden';
  }
  _modalOpenCount++;
  $(id).classList.add('open');
}
function msg(text){alert(text)}
function askConfirm(title,text,action){
  $('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirm').classList.add('open');
  $('confirmOk').onclick=async()=>{closeConfirm();await action()};
}
function closeConfirm(){$('confirm').classList.remove('open')}

async function auth(){
  const r=await sb.auth.getSession();session=r.data.session;
  if(!session){location.href='chteo_auth.html';return false}
  const p=await sb.from('profiles').select('is_admin,is_host,full_name,email').eq('id',session.user.id).single();
  if(p.error||(!p.data?.is_admin&&!p.data?.is_host)){
    alert('Host or Admin access required.');location.href='index.html';return false
  }
  profile=p.data;return true
}
async function logActivity(action,targetId,targetName,details={}){
  try{await sb.from('activity_logs').insert({
    admin_id:session?.user?.id,admin_name:profile?.full_name||profile?.email||'Host',
    action,category:'tournament',target_type:'tournament_lobby',target_id:targetId,target_name:targetName,
    details,status:'success',user_agent:navigator.userAgent
  })}catch(e){console.warn('Activity log failed',e)}
}
async function applyAutoStatus(list){
  const now=new Date(),today=ymd(now),live=[],done=[];
  list.forEach(l=>{
    if(!['upcoming','live','full'].includes(l.status))return;
    const dt=parseLobbyDateTime(l.lobby_date,l.time_label),eff=dt?ymd(dt):l.lobby_date;
    if(eff<today){done.push(l.id);l.status='completed'}
    else if(eff===today&&l.status==='upcoming'&&dt&&dt<=now){live.push(l.id);l.status='live'}
  });
  if(live.length)await sb.from('tournament_lobbies').update({status:'live'}).in('id',live);
  if(done.length)await sb.from('tournament_lobbies').update({status:'completed'}).in('id',done);
}
async function load(){
  $('content').innerHTML='<div class="loading">Loading…</div>';
  const today=ymd(new Date());
  $('todayLabel').textContent=fmtDate(today);
  const tr=await sb.from('tournaments').select('id,title,status,default_slots,total_slots,prize_distribution').neq('status','archived');
  if(tr.error){$('content').innerHTML='<div class="empty">Could not load tournaments: '+esc(tr.error.message)+'</div>';return}
  tournaments=new Map((tr.data||[]).map(t=>[t.id,t]));
  const lr=await sb.from('tournament_lobbies').select('*').eq('lobby_date',today).in('status',['upcoming','live','full']).order('time_label');
  if(lr.error){$('content').innerHTML='<div class="empty">Could not load lobbies: '+esc(lr.error.message)+'</div>';return}
  lobbies=lr.data||[];
  await applyAutoStatus(lobbies);
  // Keep only today's active rows after the client-side status refresh.
  lobbies=lobbies.filter(l=>l.lobby_date===today&&['upcoming','live','full'].includes(l.status));
  render();
}
function render(){
  const groups=new Map();
  lobbies.forEach(l=>{
    const t=tournaments.get(l.tournament_id);if(!t)return;
    if(!groups.has(t.id))groups.set(t.id,{t,l:[]});
    groups.get(t.id).l.push(l);
  });

  if(!groups.size){
    $('content').innerHTML='<div class="empty">No active lobbies for today.</div>';
    return;
  }

  $('content').innerHTML=[...groups.values()].map(g=>`
    <section class="group">
      <div class="group-head">
        <div class="group-name">${esc(g.t.title)}</div>
        <div class="group-count">${g.l.length} active lobb${g.l.length===1?'y':'ies'}</div>
      </div>
      ${g.l.sort((a,b)=>{
        const da=parseLobbyDateTime(a.lobby_date,a.time_label);
        const db=parseLobbyDateTime(b.lobby_date,b.time_label);
        if(da&&db)return da-db;
        return (a.time_label||'').localeCompare(b.time_label||'');
      }).map(renderLobby).join('')}
    </section>
  `).join('');
}

function renderLobby(l){
  const live=liveBadge(l);
  let badge='';
  if(l.status==='full') badge='<div class="lobby-status full">● FULL</div>';
  else if(live) badge=`<div class="lobby-status ${live.cls||''}">● ${live.text}</div>`;
  else badge='<div class="lobby-status">○ UPCOMING</div>';

  const room=l.room_id||'Not set';
  const pass=l.room_password||'Not set';

  return `<div class="lobby-item">
    <div class="lobby-top">
      <div class="lobby-date">${fmtShort(l.lobby_date)} — ${esc(l.time_label)}</div>
      ${badge}
    </div>
    <div class="lobby-meta">${Number(l.joined_count)||0} / ${Number(l.total_slots)||0} teams joined</div>

    <div class="room-grid">
      <div class="room-box"><span>Room ID</span><b>${esc(room)}</b></div>
      <div class="room-box"><span>Password</span><b>${esc(pass)}</b></div>
    </div>

    <div class="lobby-actions">
      <button class="mini green" onclick="openTeams('${l.id}')">Teams</button>
      <button class="mini" onclick="openRoom('${l.id}')">Room ID/Pass</button>
      <button class="mini" onclick="openResults('${l.id}')">Enter Result</button>
      ${l.status==='full'
        ? `<button class="mini gold" onclick="changeStatus('${l.id}','upcoming')">Unfull</button>`
        : `<button class="mini gold" onclick="changeStatus('${l.id}','full')">Full</button>`}
      <button class="mini red" onclick="changeStatus('${l.id}','cancelled')">Off</button>
    </div>
  </div>`;
}
async function refreshLobby(id){
  const r=await sb.from('tournament_lobbies').select('*').eq('id',id).single();
  if(r.data){const i=lobbies.findIndex(x=>x.id===id);if(i>=0)lobbies[i]=r.data}
  render()
}
async function changeStatus(id,status){
  const l=lobbies.find(x=>x.id===id);if(!l)return;
  const label=status==='cancelled'?'Off':status==='full'?'Full':'On';
  askConfirm(label+' lobby?',`Set ${fmtShort(l.lobby_date)} ${l.time_label} to ${status==='cancelled'?'OFF':status.toUpperCase()}?`,async()=>{
    const r=await sb.from('tournament_lobbies').update({status}).eq('id',id).select();
    if(r.error)return msg(r.error.message);
    if(!r.data?.length)return msg('Update blocked (0 rows) — check tournament_lobbies UPDATE RLS.');
    await logActivity('lobby_status_changed',id,fmtShort(l.lobby_date)+' '+l.time_label,{narration:`set lobby ${fmtShort(l.lobby_date)} ${l.time_label} to ${status}.`});
    if(status==='cancelled')lobbies=lobbies.filter(x=>x.id!==id);else l.status=status;
    render();
  })
}
async function openRoom(id){
  currentLobby=lobbies.find(x=>x.id===id);if(!currentLobby)return;
  $('roomId').value=currentLobby.room_id||'';$('roomPass').value=currentLobby.room_password||'';openModal('roomModal')
}
async function saveRoom(){
  if(!currentLobby)return;
  const roomId=$('roomId').value.trim(),roomPassword=$('roomPass').value.trim();
  const r=await sb.from('tournament_lobbies').update({room_id:roomId,room_password:roomPassword}).eq('id',currentLobby.id).select();
  if(r.error)return msg(r.error.message);if(!r.data?.length)return msg('Update blocked (0 rows) — check tournament_lobbies UPDATE RLS.');
  currentLobby.room_id=roomId;currentLobby.room_password=roomPassword;
  await logActivity('room_credentials_updated',currentLobby.id,fmtShort(currentLobby.lobby_date)+' '+currentLobby.time_label,{narration:'updated the Room ID and password.'});
  closeModal('roomModal');render();
}
async function openTeams(id){
  currentLobby=lobbies.find(x=>x.id===id);if(!currentLobby)return;
  $('teamsTitle').textContent=`Teams — ${fmtShort(currentLobby.lobby_date)} ${currentLobby.time_label}`;
  $('teamsList').innerHTML='<div class="loading">Loading…</div>';
  openModal('teamsModal');
  const r=await sb.from('lobby_teams').select('*, profiles(user_number,whatsapp,email)').eq('lobby_id',id).order('joined_at');
  if(r.error){$('teamsList').innerHTML='<div class="empty">Could not load teams.</div>';console.error(r.error);return}
  lobbyTeamsCache=r.data||[];
  renderTeamsList();
}
function renderTeamsList(){
  $('teamsList').innerHTML=lobbyTeamsCache.length?lobbyTeamsCache.map(tm=>{
    const uidBadge=tm.profiles?.user_number
      ? `<span class="team-uid">UID #${tm.profiles.user_number}</span>`
      : `<span class="team-uid guest">Guest</span>`;
    const playerName=Array.isArray(tm.players)&&tm.players[0]?.name?esc(tm.players[0].name):'';
    const payBadge=tm.payment_method==='balance'
      ? `<span class="team-pay balance">Balance</span>`
      : `<span class="team-pay manual">Manual</span>`;
    const status=tm.confirmation_status||'pending';
    return `<div class="team-item">
      <div class="team-top"><b>${esc(tm.team_name)}</b><span class="team-status ${esc(status)}">${esc(status)}</span></div>
      <div class="team-meta">${playerName?'👤 '+playerName+' · ':''}${uidBadge} ${payBadge}</div>
      <div class="team-meta">${tm.contact_number?'📱 '+esc(tm.contact_number):''}${tm.payment_reference?' · Ref: '+esc(tm.payment_reference):''}</div>
      ${status==='pending'
        ? `<div class="team-actions"><button class="mini green" onclick="setTeamStatus('${tm.id}','confirmed')">Confirm</button><button class="mini red" onclick="setTeamStatus('${tm.id}','rejected')">Reject</button>${!tm.submitted_by?`<button class="mini" onclick="linkTeamAccount('${tm.id}')">Link Account</button>`:''}<button class="mini red" onclick="deleteTeam('${tm.id}')">Delete</button></div>`
        : `<div class="team-actions"><button class="mini" onclick="setTeamStatus('${tm.id}','pending')">Reset</button>${!tm.submitted_by?`<button class="mini" onclick="linkTeamAccount('${tm.id}')">Link Account</button>`:''}<button class="mini red" onclick="deleteTeam('${tm.id}')">Delete</button></div>`}
    </div>`;
  }).join(''):'<div class="empty">No teams joined yet.</div>';
}
function toggleAddTeamForm(show){
  const el=$('addTeamForm');
  const willShow=show===undefined?el.style.display==='none':show;
  el.style.display=willShow?'block':'none';
  if(willShow){
    $('atTeamName').value='';$('atPlayerName').value='';$('atWhatsapp').value='';
    $('atTeamName').focus();
  }
}
async function submitManualTeam(){
  const teamName=$('atTeamName').value.trim();
  const playerName=$('atPlayerName').value.trim();
  const whatsapp=$('atWhatsapp').value.trim();
  if(!teamName)return msg('Team name is required.');
  if(!whatsapp)return msg('WhatsApp number is required.');
  if(!currentLobby)return;

  const btn=$('addTeamSubmitBtn');
  const originalLabel=btn.textContent;
  btn.disabled=true;btn.textContent='Adding…';

  try{
    const earliest=lobbyTeamsCache.length
      ? Math.min(...lobbyTeamsCache.map(t=>new Date(t.joined_at).getTime()))
      : Date.now();

    const payload={
      lobby_id:currentLobby.id,
      team_name:teamName,
      players:playerName?[{name:playerName}]:[],
      contact_number:whatsapp,
      payment_method:'manual',
      payment_reference:`Added by ${profile?.full_name||profile?.email||'Host'}`,
      confirmation_status:'confirmed',
      joined_at:new Date(earliest-1000).toISOString()
    };

    const r=await sb.from('lobby_teams').insert(payload);
    if(r.error)return msg(r.error.message);

    await logActivity('team_added_manually',currentLobby.id,teamName,{
      narration:`manually added team "${teamName}" to the lobby (WhatsApp booking).`,
      highlight_targets:[teamName]
    });

    toggleAddTeamForm(false);
    await openTeams(currentLobby.id);
    await load();
  }finally{
    btn.disabled=false;btn.textContent=originalLabel;
  }
}
async function setTeamStatus(teamId,status){
  const r=await sb.from('lobby_teams').update({confirmation_status:status}).eq('id',teamId).select();
  if(r.error)return msg(r.error.message);
  if(!r.data?.length)return msg('Update blocked (0 rows) — check the UPDATE RLS policy on lobby_teams.');
  await openTeams(currentLobby.id);
  await load();
}
async function deleteTeam(teamId){
  const tm=lobbyTeamsCache.find(t=>t.id===teamId);
  askConfirm('Delete team?','This will permanently remove the team (and any saved result for it) from the lobby.',async()=>{
    await sb.from('lobby_results').delete().eq('team_id',teamId);
    const r=await sb.from('lobby_teams').delete().eq('id',teamId);
    if(r.error)return msg(r.error.message);
    await logActivity('team_deleted',currentLobby.id,tm?.team_name||null,{
      narration:`deleted team "${tm?.team_name||''}" from the lobby.`,
      highlight_targets:[tm?.team_name||null]
    });
    await openTeams(currentLobby.id);
    await load();
  });
}

// Link a manually-added Guest team to an existing account by UID.
// This matches Tournament Management: the Guest badge becomes the real UID,
// and future prizes can be credited to that user's wallet.
function closeLinkAccountModal(){$('linkAccountModal').classList.remove('open')}
async function linkTeamAccount(teamId){
  const tm=lobbyTeamsCache.find(t=>t.id===teamId);
  if(!tm)return msg('Team not found.');

  $('linkAccountText').textContent=`Enter the UID of the account "${tm.team_name}" belongs to.`;
  const input=$('linkAccountUid');
  input.value='';
  const okBtn=$('linkAccountOk');
  const originalLabel=okBtn.textContent;
  $('linkAccountModal').classList.add('open');
  setTimeout(()=>input.focus(),50);

  const submit=async()=>{
    const uid=parseInt(input.value.trim(),10);
    if(!uid){input.focus();return msg('Enter a valid UID number.')}

    okBtn.disabled=true;okBtn.textContent='Checking…';
    let prof;
    try{
      const {data,error:pErr}=await sb
        .from('profiles')
        .select('id,user_number,full_name')
        .eq('user_number',uid)
        .single();
      if(pErr||!data)return msg('No account found with that UID.');
      prof=data;
    }finally{
      okBtn.disabled=false;okBtn.textContent=originalLabel;
    }

    closeLinkAccountModal();

    askConfirm(
      `Link to UID #${prof.user_number}?`,
      `This team will be linked to ${prof.full_name||'this account'} (UID #${prof.user_number}). Any future prize for this lobby will be credited to their wallet instead of manual payout.`,
      async()=>{
        const {data,error}=await sb
          .from('lobby_teams')
          .update({submitted_by:prof.id})
          .eq('id',teamId)
          .select();

        if(error)return msg(error.message);
        if(!data||data.length===0)return msg('Update blocked (0 rows) — check the UPDATE RLS policy on lobby_teams.');

        await logActivity(
          'team_linked_account',
          currentLobby.id,
          tm.team_name,
          {
            narration:`linked team "${tm.team_name}" to UID #${prof.user_number}.`,
            highlight_targets:[tm.team_name]
          }
        );

      await openTeams(currentLobby.id);
    }
  );
  };

  okBtn.onclick=submit;
  input.onkeydown=(e)=>{ if(e.key==='Enter')submit(); };
}

async function openResults(id){
  currentLobby=lobbies.find(x=>x.id===id);if(!currentLobby)return;
  currentTournament=tournaments.get(currentLobby.tournament_id);
  $('resultsTitle').textContent='Result — '+fmtShort(currentLobby.lobby_date)+' '+currentLobby.time_label;
  $('resultsList').innerHTML='<div class="loading">Loading…</div>';openModal('resultsModal');
  const [a,b]=await Promise.all([
    sb.from('lobby_teams').select('*, profiles(user_number)').eq('lobby_id',id).eq('confirmation_status','confirmed').order('team_name'),
    sb.from('lobby_results').select('*').eq('lobby_id',id)
  ]);
  if(a.error||b.error){$('resultsList').innerHTML='<div class="empty">Could not load result data.</div>';return}
  const map=new Map((b.data||[]).map(x=>[x.team_id,x]));
  resultRows=(a.data||[]).sort((x,y)=>(map.get(x.id)?.rank??9999)-(map.get(y.id)?.rank??9999));
  renderResults(map)
}
function renderResults(map){
  const prizeN=Array.isArray(currentTournament?.prize_distribution)?currentTournament.prize_distribution.length:Infinity;
  $('resultsList').innerHTML=resultRows.length?resultRows.map((tm,i)=>{
    const r=map.get(tm.id)||{};const uid=tm.profiles?.user_number?'UID #'+tm.profiles.user_number:'Guest';
    return `<div class="result-row" data-team="${tm.id}">
      <div class="rank">${i+1}</div><div><div class="rname">${esc(tm.team_name)}</div><div class="rmeta">${esc(uid)}</div></div>
      <input class="prize" type="number" min="0" placeholder="৳" value="${r.prize_won??''}" ${i>=prizeN?'disabled':''}>
      <input class="points" type="number" min="0" placeholder="PTS" value="${r.total_points??''}">
      <div class="updown"><button onclick="moveResult(${i},-1)" ${i===0?'disabled':''}>▲</button><button onclick="moveResult(${i},1)" ${i===resultRows.length-1?'disabled':''}>▼</button></div>
    </div>`
  }).join(''):'<div class="empty">No confirmed teams for this lobby.</div>'
}
function moveResult(i,dir){
  const j=i+dir;if(j<0||j>=resultRows.length)return;
  [resultRows[i],resultRows[j]]=[resultRows[j],resultRows[i]];
  const map=new Map();document.querySelectorAll('.result-row').forEach(row=>{});
  openResultsLocal()
}
async function openResultsLocal(){
  const r=await sb.from('lobby_results').select('*').eq('lobby_id',currentLobby.id);renderResults(new Map((r.data||[]).map(x=>[x.team_id,x])))
}
async function saveResults(){
  const rows=[...document.querySelectorAll('#resultsList .result-row')].map((row,i)=>({
    lobby_id:currentLobby.id,team_id:row.dataset.team,rank:i+1,
    total_points:+row.querySelector('.points').value||0,prize_won:+row.querySelector('.prize').value||0
  }));
  if(!rows.length){msg('No teams to save.');return false}
  const r=await sb.from('lobby_results').upsert(rows,{onConflict:'lobby_id,team_id'}).select();
  if(r.error)return msg(r.error.message),false;
  if(!r.data?.length)return msg('Save blocked (0 rows) — check lobby_results RLS.'),false;
  await logActivity('lobby_results_saved',currentLobby.id,fmtShort(currentLobby.lobby_date)+' '+currentLobby.time_label,{narration:'saved results for the lobby.'});
  return true
}
async function saveResultsClick(){
  if(resultSubmitting)return;resultSubmitting=true;$('saveBtn').disabled=true;$('completeBtn').disabled=true;
  try{if(await saveResults())msg('Results saved.')}finally{resultSubmitting=false;$('saveBtn').disabled=false;$('completeBtn').disabled=false}
}
async function saveResultsAndComplete(){
  if(resultSubmitting)return;resultSubmitting=true;$('completeBtn').disabled=true;$('saveBtn').disabled=true;$('completeBtn').textContent='Processing…';
  try{
    const ok=await saveResults();if(!ok)return;
    // Same completion behavior as Tournament Management: prize crediting is handled
    // by its existing flow/API. This Host Panel intentionally does not create a new
    // payment system.
    const r=await sb.from('tournament_lobbies').update({status:'completed'}).eq('id',currentLobby.id).select();
    if(r.error||!r.data?.length)return msg(r.error?.message||'Could not complete lobby.');
    await logActivity('lobby_completed',currentLobby.id,fmtShort(currentLobby.lobby_date)+' '+currentLobby.time_label,{narration:'completed the lobby from Host Panel.'});
    closeModal('resultsModal');lobbies=lobbies.filter(x=>x.id!==currentLobby.id);render();msg('Lobby completed. Results saved.');
  }finally{$('completeBtn').disabled=false;$('saveBtn').disabled=false;$('completeBtn').textContent='Complete';resultSubmitting=false}
}
document.addEventListener('DOMContentLoaded',async()=>{if(await auth())await load()});
</script>
