<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Check</title>
<link rel="stylesheet" href="theme.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:#0b0f19;
    color:#fff;
    min-height:100vh;
    padding:24px;
  }
  h1{font-size:16px;color:#8a93a6;margin-bottom:20px;text-align:center;}
  .result{
    background:#141a29;
    border:2px solid #232c42;
    border-radius:16px;
    padding:20px;
    margin:0 auto 14px;
    max-width:520px;
    text-align:center;
  }
  .result .label{font-size:13px;color:#8a93a6;margin-bottom:8px;}
  .result .value{font-size:28px;font-weight:800;word-break:break-all;}
  .result.pass{border-color:#22c55e;}
  .result.pass .value{color:#22c55e;}
  .result.fail{border-color:#ef4444;}
  .result.fail .value{color:#ef4444;}

  /* This is the actual real .phone/.screen wrapper used on every page,
     so its rendered width tells us exactly what those pages are doing */
  .phone{
    width:100%;
    max-width:420px;
    padding:0 16px;
    margin:0 auto;
    background:rgba(124,92,255,0.08);
    border:1px dashed #7c5cff;
    border-radius:8px;
    height:40px;
  }
</style>
</head>
<body>

  <h1>থিম CSS আসলে কী প্রয়োগ হচ্ছে — লাইভ রিপোর্ট</h1>

  <div class="result" id="r1"><div class="label">Window Width (px)</div><div class="value" id="ww">--</div></div>
  <div class="result" id="r2"><div class="label">.phone উইজেটের প্রকৃত রেন্ডার করা Width (px)</div><div class="value" id="pw">--</div></div>
  <div class="result" id="r3"><div class="label">সিদ্ধান্ত</div><div class="value" id="verdict">--</div></div>

  <div class="phone" id="phoneBox"></div>

<script>
  function run(){
    var ww = window.innerWidth;
    var phoneBox = document.getElementById('phoneBox');
    var pw = Math.round(phoneBox.getBoundingClientRect().width);

    document.getElementById('ww').textContent = ww + 'px';
    document.getElementById('pw').textContent = pw + 'px';

    var verdictEl = document.getElementById('verdict');
    var r2 = document.getElementById('r2');
    var r3 = document.getElementById('r3');

    if(ww >= 701){
      if(pw > 420){
        verdictEl.textContent = '✅ theme.css ঠিকভাবে widen করছে (' + pw + 'px)';
        r2.className = 'result pass';
        r3.className = 'result pass';
      } else {
        verdictEl.textContent = '❌ Window ' + ww + 'px তবু .phone আটকে আছে ' + pw + 'px এ — theme.css এই পেজে লোড হয়নি / পুরনো ভার্সন লোড হচ্ছে';
        r2.className = 'result fail';
        r3.className = 'result fail';
      }
    } else {
      verdictEl.textContent = 'ℹ️ Window ' + ww + 'px — এখনো মোবাইল রেঞ্জে, তাই ছোট থাকাটাই স্বাভাবিক';
      r2.className = 'result';
      r3.className = 'result';
    }
  }
  window.addEventListener('load', run);
  window.addEventListener('resize', run);
</script>

</body>
</html>
