<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #06070c;
    --card: #12131c;
    --card-border: #232635;
    --text-primary: #f5f6fa;
    --text-secondary: #8b8fa3;
    --purple: #7c5cff;
    --green: #2ecc71;
    --green-glow: rgba(46,204,113,0.4);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    font-family:'Inter',sans-serif;
    color:var(--text-primary);
  }

  .screen{
    width:100%;
    max-width:420px;
    min-height:100vh;
    padding:22px 20px 32px;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:8px;
  }

  .back-btn{
    width:38px; height:38px;
    border-radius:12px;
    background:transparent;
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-primary);
    cursor:pointer;
    transition: background .2s ease, transform .15s ease;
    flex-shrink:0;
  }
  .back-btn:hover{ background:#1a1c28; }
  .back-btn:active{ transform:scale(0.94); }

  .topbar h1{
    font-size:19px;
    font-weight:800;
    letter-spacing:0.4px;
  }

  .brand{
    text-align:center;
    margin:20px 0 26px;
  }

  .brand img{
    width:180px;
    height:auto;
    filter:drop-shadow(0 12px 30px rgba(124,92,255,0.25));
  }

  .brand h2{
    margin-top:14px;
    font-size:22px;
    font-weight:800;
    letter-spacing:0.5px;
  }

  .card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:16px 16px;
    margin-bottom:12px;
    text-decoration:none;
    color:inherit;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease, transform .12s ease;
  }
  .card:hover{ background:#171923; border-color:#2e3245; }
  .card:active{ transform:scale(0.985); }

  .card-left{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }

  .icon-circle{
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(124,92,255,0.12);
    border:1px solid rgba(124,92,255,0.35);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    color:var(--purple);
  }

  .card-text{ min-width:0; }
  .card-text .title{
    font-size:15px;
    font-weight:700;
    margin-bottom:3px;
  }
  .card-text .subtitle{
    font-size:12.5px;
    color:var(--text-secondary);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .chevron{
    color:var(--text-secondary);
    flex-shrink:0;
  }

  .card.whatsapp{
    border-color:rgba(46,204,113,0.5);
    box-shadow:0 0 0 1px rgba(46,204,113,0.15), 0 0 24px -8px var(--green-glow);
  }
  .card.whatsapp .icon-circle{
    background:rgba(46,204,113,0.12);
    border-color:rgba(46,204,113,0.45);
    color:var(--green);
  }
  .card.whatsapp .subtitle{
    color:var(--green);
    font-weight:600;
  }
  .card.whatsapp .chevron{ color:var(--green); }

  .connected-section{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:20px 18px 22px;
    margin-top:4px;
  }

  .connected-section h3{
    font-size:15.5px;
    font-weight:700;
    margin-bottom:16px;
  }

  .social-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
  }

  .social-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--text-secondary);
    flex:1;
    cursor:pointer;
  }

  .social-icon{
    width:52px; height:52px;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, filter .2s ease;
  }
  .social-item:hover .social-icon{ transform:translateY(-3px); filter:brightness(1.1); }
  .social-item:active .social-icon{ transform:scale(0.94); }

  .social-icon.fb{ background:#1877f2; }
  .social-icon.yt{ background:#ff0000; }
  .social-icon.tiktok{ background:#000; border:1px solid #2a2d3a; }
  .social-icon.insta{ background:radial-gradient(circle at 30% 110%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }

  .social-icon svg{ width:26px; height:26px; }

  .social-item span{
    font-size:11.5px;
    font-weight:500;
    color:var(--text-secondary);
  }

  .footer{
    text-align:center;
    margin-top:26px;
    font-size:12px;
    color:var(--text-secondary);
  }
</style>
</head>
