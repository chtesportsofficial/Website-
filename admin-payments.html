<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHTEO — Payment Verification</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--p:#4f46e5;--g:#16a34a;--r:#dc2626;--a:#d97706;--nav:#0f172a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}.top{height:68px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{display:flex;gap:11px;align-items:center;font-weight:900}.brand img{width:34px;height:34px;border-radius:9px}.brand small{opacity:.5}.wrap{max-width:1180px;margin:auto;padding:28px 20px 70px}.hero{margin-bottom:20px}.hero h1{margin:0;font-size:28px}.hero p,.page-title p{color:var(--muted);margin:6px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.card,.table-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 25px #0f172a08}.stat{padding:18px}.stat .label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}.stat .num{font-size:28px;font-weight:900;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{padding:20px}.card h2{font-size:17px;margin:0 0 7px}.card p{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 15px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.p{background:var(--p);color:#fff}.g{background:var(--g);color:#fff}.ghost{background:#eef2ff;color:#3730a3}.dark{background:#ffffff18;color:#fff}.page-title{display:flex;gap:12px;align-items:center;margin-bottom:18px}.back{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:18px}.table-card{overflow:hidden}.table-head{padding:18px;display:flex;gap:12px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.search{width:100%;max-width:390px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit}table{width:100%;border-collapse:collapse}th,td{padding:13px 15px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fafafa}.empty{text-align:center;padding:45px;color:var(--muted)}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.modal{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;width:min(620px,100%);border-radius:20px;padding:22px}.box textarea{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#111827;color:#fff;padding:12px 18px;border-radius:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.top{padding:0 14px}.brand small{display:none}.wrap{padding:20px 14px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.table-card{overflow:auto}table{min-width:720px}}</style></head><body><header class="top"><div class="brand"><span>←</span><span>Payment Verification</span><small>DEPOSIT CONTROL</small></div><a class="btn dark" href="admin-panel.html">Dashboard</a></header><main class="wrap"><div class="page-title"><button class="back" onclick="location.href='admin-panel.html'">←</button><div><h1 style="margin:0">Payment Verification</h1><p>Verify deposits before crediting wallet balance.</p></div></div><section class="stats"><div class="stat"><div class="label">Pending</div><div class="num" id="pending">—</div></div><div class="stat"><div class="label">Approved</div><div class="num" id="approved">—</div></div><div class="stat"><div class="label">Rejected</div><div class="num" id="rejected">—</div></div><div class="stat"><div class="label">Needs review</div><div class="num" id="review">—</div></div></section><div class="table-card"><div class="table-head"><b>Payment requests</b><select class="search" style="max-width:180px" id="filter" onchange="render()"><option value="pending">Pending</option><option value="all">All</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div><div id="table"><div class="empty">Loading...</div></div></div></main><div class="modal" id="modal"><div class="box"><h2>Payment review</h2><div id="detail"></div><textarea id="note" placeholder="Reason / verification note"></textarea><p style="text-align:right"><button class="btn" onclick="closeM()">Cancel</button> <button class="btn" style="background:var(--r);color:#fff" onclick="updatePay('rejected')">Reject</button> <button class="btn g" onclick="updatePay('approved')">Approve</button></p></div></div><div class="toast" id="toast"></div><script>const SUPABASE_URL='https://myfficbwcbgbxbdqjexv.supabase.co',SUPABASE_ANON_KEY='sb_publishable__j8qkCkEOMtdymJnYpfceA_sscwkH_5';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function f(v){if(!v)return '—';let d=new Date(v);return Number.isNaN(d.getTime())?e(v):d.toLocaleString('en-BD',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}function toast(x){let t=document.getElementById('toast');if(t){t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}}async function admin(){let{data:{session}}=await sb.auth.getSession();if(!session){location.href='admin-panel.html';return false}let{data:p}=await sb.from('profiles').select('is_admin,is_owner').eq('id',session.user.id).single();if(!p||(!p.is_admin&&!p.is_owner)){location.href='profile.html';return false}return true}async function out(){await sb.auth.signOut();location.href='admin-panel.html'}let P=[],sel=null;function render(){let q=filter.value,a=q==='all'?P:P.filter(x=>(x.status||'pending')===q);table.innerHTML=a.length?'<table><thead><tr><th>Date</th><th>User</th><th>Amount</th><th>Method</th><th>Transaction ID</th><th>Status</th><th></th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+f(x.created_at)+'</td><td>'+e(x.user_id||x.profile_id||'—')+'</td><td><b>'+e(x.amount||'—')+'</b></td><td>'+e(x.method||x.payment_method||'—')+'</td><td>'+e(x.transaction_id||x.txn_id||'—')+'</td><td>'+e(x.status||'pending')+'</td><td><button class="btn ghost" onclick="openM('+JSON.stringify(String(x.id))+')">Review</button></td></tr>').join('')+'</tbody></table>':'<div class="empty">No payment requests.</div>'}function openM(id){sel=P.find(x=>String(x.id)===String(id));if(!sel)return;detail.innerHTML='<p><b>Amount:</b> '+e(sel.amount||'—')+'<br><b>Transaction:</b> '+e(sel.transaction_id||sel.txn_id||'—')+'<br><b>User:</b> '+e(sel.user_id||sel.profile_id||'—')+'</p>';note.value=sel.admin_note||'';modal.classList.add('show')}function closeM(){modal.classList.remove('show');sel=null}async function updatePay(status){if(!sel)return;let r=await sb.from('payment_requests').update({status,admin_note:note.value.trim()}).eq('id',sel.id);if(r.error)return toast(r.error.message);closeM();toast('Payment '+status);load()}async function load(){let r=await sb.from('payment_requests').select('*').order('created_at',{ascending:false});if(r.error)return table.innerHTML='<div class="empty">Create the <b>payment_requests</b> table first.<br><small>'+e(r.error.message)+'</small></div>';P=r.data||[];['pending','approved','rejected'].forEach(s=>document.getElementById(s).textContent=P.filter(x=>(x.status||'pending')===s).length);review.textContent=P.filter(x=>x.needs_review===true).length;render()}(async()=>{if(await admin())load()})()</script></body></html>
